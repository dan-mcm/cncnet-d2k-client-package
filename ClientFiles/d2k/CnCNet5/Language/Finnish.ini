;You can use your own text for the tooltips, the english ones arent really good yet!
ToolTipGameSpeedLabel=Pelin Nopeuden Asetukset, 1=hitain 7=nopein.
ToolTipMapSearchLabel=Etsi kartat, esim osio Aftermath näyttää kaikki aftermath kartat. Osio Couterstrike näyttää kaikki counterstrike kartat. CoOp näyttää kaikki joissa tietokonepelaaja on jo valmiiksi. Standard osio näyttää kaikkia alkuperäiset karta. Custom-osio näyttää itse tehdyt ja eniten pelatut kartat. Jos kirjoitat hakuun 4 player se näyttää kaikki näyttää neljän pelaajan kartat. Jos kirjoitat hakuun "Snow" näet lumikartat. Jos kirjoitat 126x126 näet kaikki mega isot kartat jne..
ToolTipStartingLocationLabel=Aloituspaikka (waypoint).
ToolTipTeamLabel=Sallii ennen peliä asetetut liittoutumiset.
ToolTipSlowUnitBuild=Rakentaa hitaammin (jos haluat välttää aikaset rynnimiset).
ToolTipRandomSpawns=Pakosti arvotut aloituspaikat, "Aloitus-osiolla:" ei ole merkitystä .
ToolTipMCVundeploy=Pystyt aukaisemaan päärakennuksen uudestaan autoksi.
ToolTipFormationExploit=Poistaa "formatioinnin" hyödyntämisen, kun teet "formatioinnin" niin yksiköt liikkuu nyt samaa nopeutta kuin hitain ajoneuvo.
ToolTipAIalliances=Pystyt liittoutumaan AI:n kanssa.
ToolTipAllyReveal=Paljastaa kaikkien liittolaisten toiminnat
ToolTipBuildOffAlly=Pystyt rakentamaan liittolaisistasi eli voit tehdä rakennuksia niiden rakennusten viereen vaikka omia ei olisia lähellä.
ToolTipAftermathFastBuild=Kun tämä on päällä Aftermath pelissä niin yksiköiden ja rakennusten rakentamisnopeus lisääntyy mitä enemmän tehtaita tai päärakennuksia sinulla on, aivan kuten normaalisti Red Alertissa.
ToolTipParabombs=Sallii ilmapommit (sitten kun olet ostanut lentokentän).
ToolTipMagicBuild=Jos tässä ei ole ruksia niin on mahdollista rakentaa rakennus sen jälkeen kun rakennus jonka viereen olet rakentamassa sitä on tuhottu. Se tapahtuu niin että pidät hiirtä siinä paikassa mihin olet laittamassa rakennusta ja sitten et liikuta hiirtä sen jälkeen kun vanha rakennus on tuhottu. Monet pitävät tätä epärehellisenä käytöksenä ja se pistää heitä kovasti vihaksi.
ToolTipRangeExploit=Jos tätä ei ole merkattu niin on mahdollista ampua ukoilla pitkän matkan päähän.
ToolTipForcedAlliances=Ei pysty liittoutumaan pelin sisällä, eli käyttämään A-nappia.
ToolTipTechCenterBugFix=Pelaajat menettää teknologiatason tuomat hyödyt jos kyseinen rakennus tuhotaan. Esim jos Korjausalusta tuhotaan niin menetät miina-autot ja mcv:t.
ToolTipSouthAdvantageFix=Etelänedun korjaus, normaalisti hyökkäys yksiköt/rakennukset ampuvat yhen ruudun pidemmällä sillon kun on etelässä.
ToolTipShortGame=Peli loppuu kun menettää kaikki rakennukset (normaalisti täytyy menettää rakennukset sekä yksiköt)
