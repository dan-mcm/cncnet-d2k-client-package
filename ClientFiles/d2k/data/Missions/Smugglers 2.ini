Name=Smugglers - Mission 2
SideId=5
Briefing=With the 5000 credits of spice we had enough to move to another territory, this time near a base of Ordos. At first I thought we wouldn’t have problems because we are neutral in this war, so we don’t have friends or foes here, plus we are too weak to be considered a threat for the other houses.__But I'm worried. The Ordos are well known for stealing and sabotaging their enemies. I do not think that the will seek to destroy us, but I'm not so sure if they will not see with greedy eyes our silos full of spice and try to steal our work.__Watch your surroundings in case the Ordos try to do something against us. In any case your goal is to reach 8000 credits. Again we don’t have spare harvesters, but this time we did not detect worms nearby. All right, starts to work.__Objective: Collect 8000 credits spice. Harvester, refinery and silos must survive.__Note: Loosing 1 silo will prevent you to reach the 8000 crédits.
