Briefing=In Carthag, the Baron enters the briefing room joined by his 2 sons, Feyd and Rabban. Radnor heared many stories about them, about their brutality and thirst for blood. After all, they are true Harkonnens. Nonetheless, he also heared that they can be very unpredictable, and anyone talking to them should be very careful not to annoy them. Just like with the baron himself.__Piter has specifically advised Radnor before this visit:_Be careful, you don't want to get on their bad side. They might not be Barons yet, but they have a lot of influence. And they are in constant competition with each other, so try not to look like you're taking sides._Don't worry about it_, said Radnor. "I am smart enough to have them both on my side."__The Baron is quick to congratulate Radnor on his last mission:_BARON: Very well done general. The Atreides have been removed from the region. After we pushed them out of main Atsum, they got annihilated by the Ordos on the outskirts of Atsum. _RADNOR: It was an easy task, my lord. The weak Atreides are no match for our armies._BARON: Even so, they still dominate on Arrakis. We must change that, and I am working out a plan for this as we speak. Piter, brief our general about our next target, then join me in my office room. We must discuss the plan against the Atreides. I'll be there.__Baron left the war room. __FEYD: Be quick, mentat. I have a few girls waiting for me._RABBAN: My dear brother, always a lady magnet. You can spend your time banging girls, while I am spending my time becoming a baron._FEYD: Hah! Who says you don't have a sense of humour, brother? This was hilarious._RABBAN: Laugh as much as you want, little brother. But I am the rightful heir, and one day I will become Baron. And you will answer for your insolence._FEYD: Can't wait! Besides, you never know when ... something might happen. A small accident, an ornithopter malfunction... you just never know... And then, guess who's gonna be the baron?_RABBAN: Careful, brother. The same can happen to you!_FEYD: General, I'll see you on the battlefield. I've heared many things about you and I am eager to see if they are true. Just make sure you watch your back with my brother._RABBAN: Screw you Feyd.__Both of them left the room.__DE VRIES: I told you they are the complicated kind._RADNOR: More like the "I wanna kill your ass" kind. I like them. They know what they want and how to get it._DE VRIES: Might be fun for now, but when the things will really explode, you might just get caught in the crossfire. Or, you might be forced to pick a side. And trust me: when that happens, you are doomed._RADNOR: Don't worry about me. I am too smart for that. Anyway, weren't you supposed to brief me about something?_DE VRIES: You remember the Ordos forces which were attacking Atsum at the same time you did?_RADNOR: Yes._DE VRIES: They brought reinforcements. It seems they want to keep Atsum under their control at all costs. Which made the baron want to remove the Ordos from the region. _RADNOR: Do we know why they're focusing on Atsum?_DE VRIES: No, but it does not matter. It is important for them, clearly, and that is why the baron insists that we take this away from them. Be careful, though, they seem to have purchased mercenaries to help them fight. And their forces are quite numerous. Feyd and Rabban will deploy first, as ordered by the baron. You will then join in the battle and ensure both of his sons make it out alive, with the Ordos and their mercenaries dead. _RADNOR: Easy enough._DE VRIES: We have a small Harkonnen mining camp there. You will take control of that and set up a fully offensive base. Good luck, and be careful with those two.__==========_Objective: After the Atreides defeat, the Atsum sector is divided between Harkonnen, in the main zone, and Ordos, at the outskirts close to the desert. The Ordos want to keep this sector, therefore we must make sure they don't. Nothing is better than a weak enemy. Deploy a base and ensure that Feyd's and Rabban's Construction Yards are not destroyed. They are commanding their troops from there. Destroy all enemy structures.
