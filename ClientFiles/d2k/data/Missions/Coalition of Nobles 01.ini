Briefing=All the Houses of the known universe, large or small, have paid great attention to the events that occur in Arrakis: The Emperor issued a challenge to the three great Houses to determine who would take control of the spice and, with it , control all Dune.__A group of four minor Houses decide to form a Coalition in which they will share resources and armies and will try to participate in the competition in the hope of being able to counter the technology of their three adversaries thanks to their numerical advantage.__This coalition is made up of the Houses of Lassoki, Iasi, Qaii and Bromeli. (Read intel for detailed information).__The House of Lassoki has managed to sneak into a Guild's freighter destined to transport armies of Ordos. His two allies Iasi and Qaii wait in hidden compartments in order not to attract attention.__The Lassoki's first step is to fight their way through the ship and eliminate any Ordos infantry; then open the floodgates controlled by the various anti-aircraft turrets with the help of some Saboteurs borrowed from their fellow Bromeli.__On board are three frigates ready to travel. While they are not enough to transport the four members of the coalition, at least three can break through to Arrakis and serve as an advance party.__Objective: Search, locate and secure the three Frigates of the Ordos.__Tip: Stay away from turrets and walls to avoid taking unnecessary damage from the debris. Go slowly and let the enemy come to you.
