Briefing=SUMMERS' SOLSTICE 06: Shipping and Handling__MISSION OBJECTIVES:_1. Keep the smuggler Starport intact until Deviator prototypes arrive._2. Scavenge the Atreides and Harkonnen bases for similar tech._3. Exterminate the Atreides, Harkonnen, and Imperial forces.__TACTICAL OBJECTIVES:_1. Support the mercenaries' defenses with armor and LRA._2. Invest in defense forces until your reinforcements arrive.__BRIEFING:_     The Sardaukar have shown their hand. In a futile effort to thwart your ascent, they have taken your special weapons hostage on the Heighliner and rallied the Atreides and Harkonnen against the Ordos on Arrakis. At the moment, your attention is required planetside. The situation on the Heighliner will be resolved, you suspect without the need for contingency plans.__     Though their commanders are busy, the mercenaries' small encampment in the center of Habbanya Erg will serve your purposes well enough while it lasts. The smugglers on the receiving end will ensure your Freighters arrive in an orderly fashion. Until then, perhaps they can add to the mercenaries' defenses a little. It also seems that although your enemies are focused on the Ordos, they have not made peace with one-another. If the Atreides and Harkonnen forces meet on the battlefield, they may spill each other's blood.__     Examining the terrain and your existing assets, you determine that infantry units would be ideal for early supplementary defense at the mercenary position. Infantry rock is plentiful there. LAVs might have trouble flanking enemy units as they approach the choke points from the west. The cliffs would impede them. The position is fortified. Armor or LRA would be preferable vehicles for the task. Your new Duelist Tanks should be sufficient.__     The pieces are in place. The Emperor's days are numbered. Once dealt with, you can move on to more important matters.
MissionNumber=6

