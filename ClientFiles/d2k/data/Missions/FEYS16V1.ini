Briefing=SUMMERS' SOLSTICE 16: They Who Live__MISSION OBJECTIVES:_1. Protect the Fremen and Sardaukar leaders._2. Defeat all Tleilaxu forces in Grose Valen._3. You must survive.__TACTICAL OBJECTIVES:_1. Build a Starport to receive aid from Sabre Durant._2. Raze enemy Starports to prevent their deliveries._3. Split your forces to safeguard both of your allies._4. Use Stealth Raiders against Storm Lashers.__BRIEFING:_     As your Carryalls near the battle, you manage to spot enemy Freighters landing far in the distance.__     As chaotic as it looks, saving the Fremen and Sardaukar holdouts is the least of your concerns at this juncture. Achen Moriaen's plans are more dreadful than you ever imagined. The cabal of Guild and Tleilaxu she commands are indeed the legionnaires of a new God-Emperor - an abominable experiment, a man-worm with such immense power, it could bend space itself. Worse still, you've found that the creature lives and breathes even now. The only reason you're able to fight is thanks to the creature's incubation being incomplete. It still sleeps, and so you stand a chance, however small it is.__     Durant appears on screen for the planned mission update. You inform him, "I'll land in Grose Valen in only a few minutes. It looks like the Fremen at least are still alive, but you know I can't save them if you don't cut off the Tleilaxu's reinforcements."__     It's a mission you must complete alone. While Moriaen continues to indiscriminately eradicate any stranded survivors on the surface of Arrakis, you know she's taking advantage of what massive stockpiles of units and raw materials were abandoned on her Heighliners following the war. Permitting her success in either endeavor would doom you in the end, and so you and Durant must meet her on both fields simultaneously.__     He replies, "I know. The fleet we scrounged up is almost in range of their guns. Decoys out where they need to be. We'll see what happens."__     You remind him, "You can't fail. If you don't make it, I'm dead too."__     He nods firmly in response. "When have I let you down before?" Ever since the time of Corrino's rule, you and he have depended on each-other. Perhaps he was the only one you could depend on. That holds true even now. Still, he goes on to suggest, "Don't think it'll be easy though. If the Guild and Tleilaxu are experimenting with Spice-related powers, we'll both have challenges on our hands. They only need one commander if she's that good."__     You acknowledge that with a nod. "With all of us on Arrakis and your invasion on the Heighliner, she will have a lot to deal with. We'll have the numerical-"__     The viewscreen flickers momentarily, then disconnects entirely. "...Advantage," you finish aloud to yourself. Assuming Durant makes it to the Heighliner at all. You can only hope he's alright.__     Several Imperial Combat Tanks are rolling over the sand nearby your LZ, so it seems there are some Sardaukar still alive as well. They come to a stop as your first Carryalls set down.
MissionNumber=16

