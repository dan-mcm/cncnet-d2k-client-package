Briefing=ATREIDES_=========_Now the three great houses are immune to the virus that the Machines extended to dominate us. Not only that, but the Harkonnen, after being direct victims of the Artificial Intelligence virus, have finally understood that the threat of the Machines goes far beyond what they had imagined and they have agreed to join us to fight against them.__After reverse engineering the virus, we discovered the location of the main server that contains the programming that the Machines follow. It is our great opportunity. We will attack the territory, we will eliminate all the enemies, we will take control of the server and we will modify the code so that the Artificial Intelligence stops exterminating the three great Houses.__We will share some of our technology with the Harkonnen and the Ordos, as well as they will share theirs with us. It is unlikely that the Harkonnen will try to betray us again, but I have a backup plan in case something like this happens. You only worry about the Machines.__According to the information obtained from the direct code of the Machines, they have a large base south of our position but lack Construction Yards. They will not be able to rebuild any building that you are capable of destroying; use the special weapons that our allies have lent us to destroy buildings easily and thus weaken our enemy.__The Machines will attack from the south, but thanks to revising their codes now we also know that they will use some Carralls to attack from the north zone, behind our base. Protect both flanks and also our allies if they require it. Build the Starport to receive additional reinforcements to help you with the task.__Go ahead, the moment has arrived. The Harkonnen, the Ordos and the Atreides join once again in the most important battle of all. Let's free Dune from the control of the Machines once and for all!__Objective: Destroy the large base of the Machines.__Secondary objective: Build the Starport to receive additional reinforcements.

