Briefing=ATREIDES_=========_The Ordos have just contacted us. They say they have a plan that would allow them to access all the data of the machines. With that information they would be able to know the location of all the bases that operate under the control of some Artificial Intelligence and, hopefully, find a way to reprogram them.__However, the Harkonnen interfered and lost much of their strength after the defeat suffered. Now they ask us for help in carrying out this plan. I have agreed to collaborate, partly because the Ordos were our allies in the fight against the machines and because the plan also benefits us.__According to the Ordos, the data we need is hosted on a server in one of the Machine Outpost. Unfortunately, they do not know with certainty in which of the three Outposts these data are found. We must establish a base next to the Ordos, face directly against the Machines and send some engineer to capture the Outposts until we find the one that is useful to us.__Do not destroy the Outposts or we run the risk of losing that valuable information forever. If the captured Outpost is not the one we are looking for, you are free to get rid of the building or let it be destroyed.__Objective: Search and capture the correct Outpost of the Machines that contains the data. Do not destroy any of the three Outposts at least until they have been captured, then they can be sold or allowed to be destroyed.__Tip: Try to attract enemy attacks against your ally. That will help you to endure better.__Note: The Outpost that contains the data is chosen randomly at the start of the game.

