Briefing=The Baron Harkonnen has done an excellent job acquiescing the way for us to deploy our own base. Now I need you to address my army to ensure the final victory.__All that remains of the Atreides and the Fremen is a base heavily defended with many resources, but we have the Harkonnen as a distraction while we build our own base.__The Baron has filled me in on the Fremen using Atreides Carryall for surprise attacks, and how the Outpost is vital to counter them. Build the Outpost to return the Fremen attacks ineffective.__Starport is our key to bring all available legions of Sardaukar to the battlefield. Build it at the earliest opportunity.__Objective: Destroy the Atreides Base.__Tip: Build the Outpost to reduce the effectiveness of the Fremen. Build the Starport to recieve Sardaukar periodically.

[Text]
1=With the outpost the Fremen can no longer hide to our eyes.
2=Harkonnen: Area cleared, returning to our base.
3=Our allies have been annihilated!
4=The Atreides and Fremen have been annihilated! Dune is ours!

