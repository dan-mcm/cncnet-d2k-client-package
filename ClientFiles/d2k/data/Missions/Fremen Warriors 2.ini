Briefing=The reaction to our attack was not long in coming. The Harkonnen are building a camp and gathering a team of demolition intended to destroy our windtraps. We must avoid at all costs to pour out our precious water. __Take the north-west path and asks for help to Sietch Tabr avoiding detection. Collect as many men as you can, go to the narrow and wait until they attack.__Let through the light infantry and board the artillery tanks taking advantage of the surprise factor. We'll take care of the soldiers. After removing this threat we will initiate a counterattack against the Harkonnen camp.__Objective: Ambush the enemy and destroy the Harkonnen base.__Note: Attacking the enemy or stand next to soldiers (no tanks) will discover your Fremen.

[Text]
1=Fremen: Of course we will help protect wind traps, brothers.
2=We will ambush them through the strait, crossing the spice at southeast.
3=The Harkonnen begin the offensive!
4=Fremen: Offensive rejected, time to counter attack.

