Briefing=ATREIDES_=========_The Harkonnen have informed us that they have met Mercenaries using Machines vehicles, although these were not being driven directly by anyone. After some research we have found those who were delivering those vehicles to the Mercenaries: the House of IX.__We do not know if they simply plan to resell inoperative vehicles, expand their technology or, worst of all, create a new artificial intelligence; We cannot allow that. Unfortunately the Ixians have refused to communicate with us, so we will act by sending a small army with some infantry and soldiers; You will receive reinforcement with vehicles as soon as possible.__Two bases of the Machines are being guarded by Ixians from a fortified base not far away. First defeat the defensive forces and, before they bring more, destroy the entire base until it is reduced to ashes. I advise against a frontal attack on the main base of IX. They are very well defended and have many resources.__Don't underestimate the power of the house of IX. His lack of Combat Tanks is supplemented by his wholesale purchases of the Starport and the use of a type of soldier called Grenadier who can tear our Infantry.__Objective: Destroy the two bases of the Machines.__Tips: Building the Barracks just after the first Refinery will help protection until the first reinforcements arrive. Try to keep your infantry units apart to reduce the damage that Grenadiers and Siege Tanks can do to you.

