[Basic]
Name=Smugglers - Mission 3
SideId=5
Briefing=Good news, the international treaty understand that we, the smugglers, are neutral in this war, so no one can attack us unless in self-defense. That is why the Ordos have received a reprimand from all the major houses for trying to steal our spice.__As part of the Ordos compensation they have given us the same base they have been using to try to attack us. This includes their light and heavy factories. We do not have adequate knowledge or training to drive tanks, but with the heavy factory we can build as many harvesters as we need.__Sir, bad news. The Harkonnen have sent us death threats, believing that we are Ordos. We have tried to send some men to explain that we aren’t Ordos but neutral, but none of our men has returned. I fear that the Harkonnen will attack us with their entire arsenal. We can never defeat them with our inferior technology, but there may be a way to neutralize them.__Objective: Find a way to neutralize the Harkonnen.
Music=RISEHARK.AUD
Author=Cm_Blast

[Text]
1=If the Harkonnen continue this way there will be nothing we can do.
2=Atreides: Quiet, we will give you coverage.
3=Atreides: They are entrenched. Try to destroy the 3 Windtraps to the west first.
4=The Atreides have been annihilated.
5=Atreides: We send some units to help defend.
6=Atreides: They are now helpless, it's time to attack

