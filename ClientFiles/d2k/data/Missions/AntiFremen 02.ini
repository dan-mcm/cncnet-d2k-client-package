Briefing=We have serious problems with the Fremen. We had gathered a demolition group, consisting of infantry and some siege tanks to destroy the Fremen windtraps.__However a mishap occurred: An ambush. Out of nowhere a handful of Fremen appeared and ended up with most of our group assault. At this very moment our last men are still fighting them, but there is no hope.__A new group of infantry is ready for action, but without those siege tanks will be impossible to approach the wintraps. We have a solution.__A small group of siege tanks are hidden in a warehouse at southwestern of your position. You must enter through the passage and advance through the desert, currently controlled by the Fremen. Find the tanks and use them to destroy those Fremen windtraps.__Objective: Find the hidden siege tanks to the Southwest. Destroy the two Fremen wintraps located south.

