Briefing=We're in serious trouble. The Harkonnen have been humiliated by losing one of its bases for our guilt and seeks absolute annihilation of all smugglers operating in Arrakis, regardless of whether they belonged to our people or not.__Although international treaty should protect us from such actions; it seem that the Harkonnen don’t care about rules or reprisals that may happen to them. It is for this reason that we have decided to leave the planet immediately.__Dozens of smugglers from all parts of Dune and are starting to come to the meeting pending the frigate send us the Space Guild. This will take at least 20 minutes to arrive. You must avoid the Harkonnen destroy our starport or run the risk of being extinct at the hands of Harkonnen.__Objective: Protect the starpot until time runs out.
Author=Cm_Blast

