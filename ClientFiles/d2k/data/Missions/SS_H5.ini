SideId=1
Briefing=BARON: After I killed the mentat, I get more things to do... Even briefing you takes time, General! The last operation was a success, however we must do something that is incredibly painful to me... We have to work with the Atreides. House Atreides, allied with House Harkonnen... This makes me puke. However, the circumstances are asking for it. The Atreides and Ordos destroyed the main Imperial Spice mining facilities. My spice has been released from the Emperor's greedy influence. Now it is time for us to kick some butt too. We must destroy the Spacing Guild Starports before they receive heavy Imperial transports. If those transports are to arrive, we will no longer have any chances to stop the Emperor and the Guild. General, you must do whatever it takes to stop them. The Emperor fears our alliance with the Atreides and Ordos. Make him bleed today, or if you fail, we will all die on this planet.__There is a small Smuggler base in the vecinity. Their Starport is fully functional and is not linked to the Guild in any way. The Ordos mentioned something about having some relationship with the Smugglers, however the Ordos will not be a part of the attack. That's why you must earn the Smugglers' help on your own. The Imperial base provides a Jamming Outpost that jams the Smuggler Starport's communication link, rendering the Starport useless as it cannoit receive its deliveries. Consider destroying the Jamming Facility and the Smugglers will probably join our cause.__Objective: Destroy all the Guild Starports before the shipments arrive. If you destroy the Imperial Jamming Outpost (yellow) the smugglers will join us against the enemy. Their Starport will become available as well.

