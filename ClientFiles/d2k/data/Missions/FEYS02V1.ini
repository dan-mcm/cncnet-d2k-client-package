Briefing=SUMMERS' SOLSTICE 02: Desperate Defense__MISSION OBJECTIVES:_1. Harvest 15,000 Solaris for Ketua Sumadi._2. Scuttle the base once your quota is attained.__TACTICAL OBJECTIVES:_1. Scout the region for more defensible locations._2. Build three of each factory to max buildspeed._3. Use the Starport to support your main forces.__BRIEFING:_     Sumadi needs something again. It's a good thing he's so needy; he pays well for each job.__     "The Starport at Hagga Basin has been discovered by the Imperials, Durant. They've established a large base to the north of it, and will attack it soon. We've spotted Combat Tanks and Sardaukar..." So they've come in force.__     You hum thoughtfully. "That's weird. What else would they use the base for?"__     Sumadi suggests, "A staging area for future attacks. The territory is rich with Spice fields."__     "I see."__     "The Imperial Burseg, Kyne Giraud, has been seeking out and destroying my hidden bases. This region is the latest target and I cannot afford to lose the base here yet. Regardless of how many resources the Imperials are dedicating to decisively crush it."__     You're keeping focused on the important details. "I'm not sending my men against an entire Imperial base," you warn him. It would be suicide. Sumadi, however, shakes his head in agreement. He has something else in mind.__     He explains, "Summers is dealing with something elsewhere and I have no other commanders capable of handling this. As much Spice as possible must be harvested before the Imperials destroy my base, and I need you to oversee the operation. Fifteen-thousand Solaris is the target. No less will do." Most interestingly, he goes on to promise, "You may have eighty percent of the cut once this operation is completed successfully, given your level of involvement. I will give you full control of my assets at Hagga Basin so you can achieve this, and I ask only that you abandon the base once the quota is reached. Our men must not be kept in harm's way for too long."__     That promise makes you raise your eyebrows at him. "Eighty percent? Well." You lean forward. "Mining isn't what I do. If it's your crews handling that much, and that's what you're offering, then sure." Desperate times call for desperate measures, and Sumadi is certainly desperate.__     "Very good," he sighs. "I will keep you updated. Ah, it's best you get started immediately. The Imperials are on the attack."
MissionNumber=2

