Briefing=The Lassoki realized a terrifying truth: That outpost was just a distraction. The Tleilaxu had already landed on Seneca days before drawing attention to their small base, knowing that the Lassoki would send their forces in hastily.__The Tleilaxu, taking advantage of the situation, have quietly deployed numerous bases around the Lassoki capital and brought in Devastators. However, these attacker bases are very basic, lacking defensive turrets or a Construction Yard.__For their part, the Lassoki have enough resources to prolong the battle as long as necessary, while the Tleilaxu only have access to a single Mining Rig, which will force them, in the long run, to send their Harvesters to areas within of the Lassoki castle, being able to be destroyed easily and thus considerably reducing the unit production of their attackers.__The Lassoki Palace is located in the very center of the Capital, strongly surrounded by a large base and numerous walls, both natural and artificial, in order to protect the leader of the House Lassoki, lodged within. If the Palace falls, the entire House of Nobles Lassoki will fall as well.__Objective: Destroy the Tleilaxu. Lassoki`s Palace must survive.__Tip: Enemy offensives are numerous, but their resources are limited. You can expect enemy Harvesters trying to steal your resources and disrupting your production rate, but destroying them will reduce the enemy's offensive power.

