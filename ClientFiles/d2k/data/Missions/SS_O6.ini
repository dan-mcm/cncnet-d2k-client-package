Briefing=EXECUTRIX: Our spies have located the Imperial Palace on Arrakis. Intel shows the Emperor is inside, within the walls of the Palace. That is his weakness. We will launch a strong offensive, alongside the Harkonnen, and deestroy the Palace. House Atreides reported they cannot attend the attack. That is weakness. We must take out the Palace and remove the usurper. Emperor Corrino must die. That is the directive. House Ordos will share their saboteurs with Harkonnen, and they will provide us with nuclear capabilities. That is cooperation. __We have negotiated with the Smugglers: they will periodically send it reinforcements to the Starport. Protect the Starport to receive their transports. That is advice.__Objective: Destroy the Imperial Palace and every other enemy structure. That is the directive.

