Briefing=Thanks to your impressive maneuvers we have won the Emperor, showing the universe of which we are capable. That's why the three Great Houses have decided to join forces in an all in against us.__We are at a clear disadvantage both numerically and technology, but we still have a chance to win this war. The smugglers will restore the favor by sending a lot of their vehicles for us to use on the battlefield.__The frigates with smugglers vehicles will take some time to arrive. Protect the Starport to use the reinforcements as soon as they arrive.__This will not be an easy battle commander, but once you've beaten the three Great Houses nobody can longer stop us. Dune belong to us.__Objective: Destroy all enemies.

