Briefing=FEMALE MENTAT: The Mercenaries have been annihilated, and you took their credits for the Cartel. That is a success. Stand-by Executor, the Executrix insisted that you will take part to the following meeting...__Establishing comm link... __EXECUTRIX: It is imperative that we find a solution against this abomination. The Emperor has got extremely powerful allies. That is a threat. Uniting against them to match their strenght, that is the solution._BARON: You cannot honestly be serious. Me, working with you and the Atreides? Have you lost your mind, in case you had any, you weird being? (raging) What are you, are you even human?_EXECUTRIX: Ordos no not recongnize insults. Profit is our only directive, profit is our only purpose. Live to complete the directive, that is life._BARON: BULLSHIT! You weirdos, why would my mighty House ever ally with you?_DUKE: The hate between Houses Atreides and Harkonnen is well known for many generations. It is not going to be easy to go over it now._BARON: Not even to mention I'd have to ally with the Atreides as well!_DUKE: Anyway Ordos, why would we trust you a second time? Last time House Atreides had an alliance with you, you ended up betraying us. And now you dare to come and ask for another alliance treaty?_EXECUTRIX: Ordos do not betray, Ordos follow and complete the directive. House Atreides disturbed our Deviator project, and we took it back. That was the necessity._BARON: I can't stand this creature anymore, and its weird talk. _DUKE: Unfortunately, I must agree that all of us have been left with nothing pretty much. Without the Guild, we can no longer transport troops outside Arrakis, and neither call for reinforcements from our homeworlds. We are stuck, and the remaining forces we have on Arrakis will never be enough to stop the Emperor AND the Guild working together. Not even if our Houses agree to cease fire on each others._BARON: And what do you propose? Are you honestly thinking about an alliance with me ?_DUKE: For our very survival I'd say it is necessary. If we don't, we can all die on the sands of Dune, and the Emperor will gain full control over the spice. I don't have to tell you what's gonna happen with our homeworlds, too. For our Houses, we must defeat the Emperor._EXECUTRIX: We must do whatever it takes to win. Anything else will lead to failure. Failure is not an option. If the Emperor wins the war, our Houses can disappear. That is intolerable. The Ordos Cartel will mobilize all its resources to work in tandem with its allies. _BARON: (raging)I cannot believe I'm forced to work with you two! And I cannot believe you are right. Alright, let's say we get an alliance, so what's the plan? How do we stop the Emperor and his legions PLUS the Guild who seem to have landed on Arrakis with huge forces supported by the Emperor himself?_EXECUTRIX: Logic and efficiency dictate we take a progressive approach on the matter. We have to strategically strike our foes and weaken them slowly. The Emperor is about to receive huge transports via the Guild shipments at the Starports in the Imperial Basin. We must destroy the main Imperial Defence Network. The Defence Network can be disabled by House Ordos, but efficiency dictates tha the main Imperial Tank line cannot be breached by the Cartel. _BARON: My mighty and superior tanks will turn the Sardaukar tanks into scrap metal. House Harkonnen will provide the tank support you need, creature._EXECUTRIX: Very well. The three Starports are located in a remote base, inaccesible by vehicles. A small commando team on foot is necessary to complete the directive._DUKE: House Atreides and their Fremen allies will take care of the Starports. We will breach the main base and destroy them._EXECUTRIX: That is the plan. Failure to this mission will represent our doom. That is reality._BARON: (angry)Alright alright, you got the alliance, you got the plan moving, now please, don't force me to listen to that weirdo anymore.__Closing link...__EXECUTRIX: Executor, you must disable the Defence Network. Use our stealth techniques to achieve this. This is advice. Once you're done, wait for our partners to finish their tasks. That is the directive.__Objective: Use stealth to destroy the Imperial Wind Traps. Once done, wait for our allies to finish their tasks.

[Text]
3=Fremen: Attack, brothers, for Shai-Hulud! This planet is ours, and so is the spice!
2=The Atreides Fremen will be infiltrating the base.
1=The Harkonnen will annihilate the imperial tank lines for the Atreides to infiltrate in.
0=Executor, use stealth to disable the Imperial defences. Destroy the Wind Traps.

