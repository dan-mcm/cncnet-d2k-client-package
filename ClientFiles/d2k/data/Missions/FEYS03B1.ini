Briefing=SUMMERS' SOLSTICE B1: Hunted__MISSION OBJECTIVES:_1. Get Rowe Summers to safety._2. Rowe Summers must survive._3. You must survive.__TACTICAL OBJECTIVES:_1. Stay behind and close to Rowe Summers._2. Flank distracted targets with your Trikes.__BRIEFING:_     The strange warrior arrived with a haunted air about her, though her face was concealed by her helm. Covered in dust and debris, and pleading for help as she climbed frantically from her smoking Raider, the other Fremen brought her to you.__     "Naib, an outsider seeks your aid."__     The smugglers of Arrakis have proven themselves pragmatic isolationists. They purposefully avoid crossing paths with the various Fremen tribes. That doesn't make them friends. Only because you would be her salvation is this one speaking to you now.__     "The safety of my Sietch comes first," you assert forthright. "I am Issam Nehara, Naib."__     "Rowe Summers, smuggler commander," she replies. Her breathing is heavy. Her power armor is perforated all over with bullet holes, disfigured elsewhere by scorch marks. Nevertheless, your guest judiciously goes on to explain herself. She apprises you of the fall of Sietch El-Sayal, the death of Saud Nagi, and how her forces were chased down in the open desert when they withdrew from the battle. How only she survived. Dire news indeed.__     You look to Saniyah, the only other person in sight, who nods at you knowingly. Like the Fremen, the smugglers have also been the target of recent Imperial attacks. Summers being here can only mean the Emperor's forces have also come to Mushtamal Ridge.__     "I barely escaped alive. Please," she begs you. "I need your help."__     You turn again to the fugitive. Nagi needed her help as well. As unwinnable as the battle was, her having fled El-Sayal is pitiful. Yet, knowing what transpired and knowing what now imperils your Sietch could be vital to your own survival. Still looking at Summers, you ask, "What say you, Saniyah?"__     "If Corrino's soldiers are scouring the ridge looking for this woman, the safety of our Sietch is not assured. We cannot risk her being here."__     You will not abandon your Sietch to House Corrino, but should you help Summers, or let her go on her own? You ponder that during the ensuing moment of silence. Going alone, she would certainly be killed. She braved the hostility of the open desert by necessity. She's fleeing a foe more relentless than Arrakis itself. You also understand that the Imperials are on the hunt for Fremen as well. If the Sardaukar are so fervently pursuing this smuggler commander, they might overlook your remote Sietch if they find she's already moved on. Helping her traverse the ridge would be both kinder and the lesser risk.__     Having reached a decision, you air it to the outsider. "We'll carve a path through the insolent Sardaukar together, but do not find us again. We want nothing more to do with you."__     The outsider stands tall, gripping her minigun firmly. "Thank you."
MissionNumber=3

