Briefing=OPTION 2: (Fight alongside Qaii)_==========================_Against all odds the combined forces of the Lassoki and Bromeli were able to hold out against the Atreides and even defeat them. Now the four members of the Coalition are united in Arrakis and ready to start invading territories instead of always defending themselves.__Morale high from their recent victory and strengthened by the Heavy Vehicles the Lassoki have shared with their allies, the group sets out to hunt down the Atreides and attack them while they are still damaged. To his surprise the Harkonnen were already stalking the Atreides.__The strong rivalry between Atreides and Harkonnen is well known throughout the known universe. This is a great opportunity for the Coalition. They can jump into action and take advantage of the fact that they will be too busy fighting each other and thus conquer the territory more easily.__Unfortunately, there is only enough room available to build two bases, so only the Lassoki and the Qaii will join forces for the battle. The Qaii will focus their efforts on preparing an army of maneuverable light vehicles, but they will support it with other types of units to guarantee victory.__Both members can stealthily build a base and an army while the Harkonnen focus their efforts against the Atreides. If the Harkonnen see the Lassoki and Qaii as a threat they will speed up their production to fight back.__At the end of the battle the Harkonnen have to be destroyed while the Atreides, having declared themselves provisionally neutral towards the Coalition, plan to withdraw as soon as the Harkonnen have been eliminated.__Objective: Destroy the two Harkonnen bases.__Tips: Take advantage of the fact that the Harkonnen are focused on the Atreides to build several Refineries at the beginning, but as soon as they notice your presence it will be convenient that you rush to build units with which to defend yourself. If you get into any conflict, you will cause the Harkonnen to focus their efforts on you prematurely.

