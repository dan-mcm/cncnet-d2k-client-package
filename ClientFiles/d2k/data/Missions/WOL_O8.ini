SideId=2
Briefing=With the Outpost secured, other Ordos Executors were able to rally and join Tyle in order to break specific Tleilaxu blockades. However, the Tleilaxu attack does not cease. It is beyond doubt, at this moment, that this is an enemy plot, and not a pure accident.__LORA: I have received some disturbing news. It seems this is indeed a Tleilaxu plot. It is happening for two reasons: one, they found out we spied on them and have knowledge of the artificial spice. Second: the Shaddam ghola. It appears they have never intended to sell it to us._TYLE: Great. So many amazing news._LORA: Don't worry, there is a way we can turn this against them. The Executrix is still working on it. For now, it appears that House Richese has also turned on us. Both Richese and Tleilaxu forces turned their weapons against our Executors on Ix. Most have been slaughtered, while some managed to strike a quick deal with the Atreides and Vernius forces and unite against the Tleilaxu and Richese._TYLE: Wait... Atreides and Vernius forces? What the hell?_LORA: You and the other executors were busy fighting the Tleilaxu here, and did not really get the news, I assume. The Harkonnen invasion of Caladan has turned out to be a complete failure. Combined Atreides-Ginaz forces managed to push back the Harkonnen coalition. On top of that, something happened between the baron, Moritani and House Mutelli, as the Mutelli were reported to fight the Harkonnen and Moritani._TYLE: So we're not the only ones to get betrayed... I guess this is the result of a made-over-night coalition, composed of people with very different aspirations and objectives._LORA (joking): Betrayal? There is no such word in the Ordos vocabulary, act like a true Ordos._TYLE: Screw their stupid logical and profit-oriented words. I am sick of that stupid Ordos terminology._LORA: Actually we believe there was some sort of plot to turn the Mutelli against the Moritani, and the baron chose to side with the Moritani. But we don't have enough information on that. We were focusing more on Ix, Draconis IV and Kaitain._TYLE: Kaitain? What's new there?_LORA: You probably have no idea that princess Irulan has sent her Sardaukar on Caladan to aid Duke Leto and the Ginaz army._TYLE: She did what? Well... if the Sardaukar side with Leto, this looks bad._LORA: She did it for reputation, probably. Remember the Landsraad meeting, she was trying to pose as the peace maker. This whole thing is a political game, that Irulan seems to play very well. She barely needs to lose men in battle to win it._TYLE: You think she's winning it?_LORA: She saved Caladan... Or that's how it's gonna look in the eyes of most of the people. Numerous legions of Sardaukar landed on Caladan. That's probably the main reason why the Harkonnen retreated so quickly._TYLE: So you said "Atreides and Vernius forces"..._LORA: Yes, the Atreides have sent aid to Dominic Vernius on Ix. It's safe to assume the invasion of Ix is turning into an even bigger failure than the one on Caladan. Who knows, maybe Irulan will send more Sardaukar on Ix to act like she saved two planets. We sent orders to retreat all remaining forces from Ix anyway. We won't give her time to save Ix from the Ordos. She can save it from Tleilaxu-Richese if she wants. Oh, and some more news that might be interesting for you, since you were really thinking to join the Harkonnen: they got themselves a great civil war going._TYLE: What?_LORA: Baron's heir, Rabban, has rebelled. He gathered a pretty big army of mercenaries. Rumours say he's getting ready to siege Harko City and kill his own father. I guess this is why they so quickly pulled off from Caladan._TYLE: The imperium looks like it's going to completely blow off soon. This is pure chaos._LORA: It is, indeed. Chaos that the Executrix is planning to take advantage of. But for now, we must ensure Draconis IV is safe. We made sure imperial spies won't find anything about our involvement with the Shaddam ghola, because we're going to use that against the Tleilaxu at the right time._TYLE: Did they find out about the Shaddam ghola at all?_LORA: No, but they are suspecting something from the Tleilaxu. If they don't find out, it's even better for us, as we can use it when WE decide to._TYLE: So what about the Executrix? I haven't received anything from them in a while._LORA: This is what I wanted to talk about in the first place. The Tleilaxu seem to have set up close to the capital. They are laying siege to our capital. The Executrix is there, and will require assistance. The Tleilaxu army is huge, and they are receiving troops from off-planet as well._TYLE: Give me the coordinates, I'll get some other Executors and coordinate an attack on their siege._LORA: No. First, you must ensure their supply lines are broken. There is a base that protects the supply lines toward the siege. The base is heavily defended by a line of turrets and defences. A frontal attack on the Tleilaxu defence line could work, but we'd waste a lot of equipment to achieve that. Instead, I have a plan. You'll get some of your elite squads and infiltrate their Power Plant base. The base is lightly defended, as it is inaccesible, on an island. They will not be expecting an elite infantry attack over the frozen water, though. A small infantry group should be enough to kill any patrols over the ice and reach the base. Once done, destroy their Wind Traps and their defences will be down. I'll send the order for our armored tanks to attack their main base. We should get it done easily, since scouts report the base relies on the defence line, and doesn't have much manpower inside._TYLE: Hey, that's actually a very impressive plan. I'm proud of you._LORA: I'm a mentat, have you forgotten?_TYLE: No. But this is more like military strategy that we're talking about here._LORA: A mentat can do that as well. Without the supply lines, their siege will be weakened. Once the base is gone, you can prepare to move towards the capital. We must break the siege.__==========_Objective: It looks like the Imperium is close to blowing up from instability. Atreides and Harkonnen have their own issues as well, and it seems the Tleilaxu are no longer acting like they don't mean any harm to us. They are openly attacking us, along with Richese forces, on Ix. But our attention goes to Draconis IV, where the Tleilaxu are setting up a siege on the capital, to kill the Executrix. The first phase to lift the siege is cutting off their supply lines. There is an enemy base that protects re-supplying of Tleilaxu forces near the capital. This base must be eradicated. But the big defence line they possess might be an impediment. You must take a small commando squad over the frozen water and reach their Wind Traps to the north. They are isolated from the mainland, so they won't expect an attack. Once the Wind Traps are down, Lora will send the attack order to our tanks. They should make quick work of the Tleilaxu base without their turrets. Make sure you don't lose all your men, you'll need them when moving to the capital for defence.
