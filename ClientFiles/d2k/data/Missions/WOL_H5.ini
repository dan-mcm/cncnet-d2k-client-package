Briefing=Time has come for the Landsraad council to reunite and discuss the future of the Imperium. As requested by princess Irulan Corrino, the CHOAM will be neutral moderators of the discussions. The Spacing Guild is attending the meeting as well, however they are expected not to intervene very much, after the humiliating defeat they have suffered on Arrakis. The meeting is taking place at the imperial palace in Corrinth, Kaitain's capital city. __While the Baron is attending the meeting with all monarchs of the Landsraad, Radnor and baron's sons remained on Arrakis to make sure nothing happens while the Baron is away. The meeting will be broadcasted to the public, as per request from princess Irulan and the CHOAM.__Radnor can already see that most of the Houses have attended the meeting. Besides the obvious most-expected guests, Atreides, Harkonnen and Ordos, Radnor remarks other Houses, like House Ginaz, House Moritani, House Vernius of Ix, House Ecaz, House Richese, House Hagal.__The CHOAM representative starts it all:__CHOAM rep: Welcome, Great Houses of the Landsraad, princess Irulan of the imperial House Corrino, and Spacing Guild members. I am Hasimir Nair, and I represent the neutral side of the CHOAM, the side with no directors from the Landsraad. Her highness, princess Irulan Corrino, entrusted me to keep these discussions civilized, and towards an end goal: finding a solution to the instability of the Imperium at the current moment. As you might know, the war on Arrakis is still continuing. At a smaller scale than it used to be before emperor Shaddam Corrino IV was killed, but there is no peace in the Imperium at the moment. Our intent is to finalize all the conflicts and sign a peace treaty. The three Great Houses that fought on Arrakis are actively skirmishing all over the planet as we speak. A continuation of such battles is affecting not only the stability of the Imperium, but also the spice. And you all know it, the spice must flow! _BARON VLADIMIR HARKONNEN: Excuse me, representative Hasimir. What is it that you propose to ... stabilize the Imperium again? I am a very busy man, i have more than one planet to rule._DUKE LETO ATREIDES: Of course, the renowned Harkonnen manners, interrupting the man speaking just to add nothing of value._BARON: And there is the Atreides insolence, interrupting me just to add nothing of value._HASIMIR: Duke Leto, Baron Vladimir, please. We are here to discuss terms for peace, not to quarrel._BARON: Peace? With the Atreides? Have you lost your mind? This is kanly. Vendetta. It cannot end just like that._HASIMIR: The Imperium requires the war to be terminated. We are all suffering because of what is happening on Arrakis._DUKE: Excuse me, representative Hasimir. But House Atreides is not willing to give up anything to the Harkonnen. We have fought for too long for Arrakis. _IRULAN: Duke Leto, Baron Vladimir. The war is pointless. It was part of a spice competition issued by my father. That competition is no longer in effect. You are fighting for nothing._BARON: You can thank for father for this mess, princess._HASIMIR: Baron Harkonnen! Please, you are talking to a lady, and also, to the princess of House Corrino._BARON: Well then, excuse my... insolence. Princess Irulan, House Harkonnen has invested tremenduous amounts of resources and solaris into this war. Are you honestly expecting me to just withdraw my forces from Dune and let it be governed by some Imperial representative again? Not to mention, House Harkonnen was the governor on Arrakis time ago, before stupid spice games were created by smart emperors._EXECUTRIX: This is the Executrix of House Ordos. Our interests do not coincide with the proposal of the CHOAM. House Ordos must control Arrakis. That is the directive. House Ordos is not willing to share spice production with their enemies. That is wise._DUKE LETO: Princess Irulan, if you have a proposal, by all means, we are all listening._IRULAN: Yes. I do have one. We freeze the war on Arrakis. Each House has control over certain territories. We can trade a few of them between the three Houses, so that everyone has enough spice production under their control._BARON: THAT IS UNACCEPTABLE! House Harkonnen has the means to take it all. And I am not giving the damned Ordos any territory just because they control less than I do._IRULAN: Baron, a lot of people are watching this. I suggest you start thinking about all the people in the Imperium who are suffering the effects of this war.__Radnor is reflecting on Irulan's speech. "So... now I see. This meeting is public, and the reason it was set as public is exactly this: to put pressure on all of us and stop the war. She wants to be the great savior of the known universe, the ruler who put an end to the Great Spice Wars."_Feyd feels the need to comment on this, coming close to Radnor:_FEYD: See that beauty of a princess? She's trying to manipulate the population... and the council._RADNOR: I figured._FEYD: My father is smarter than that. Just wait and you'll see...__COUNT HAGAL: House Hagal is supporting princess Irulan's idea. The war on Arrakis has effected galactic commerce drastically. Also, interstellar travel was delayed and severely crippled because of the issues with the Spacing Guild.__RABBAN: Of course, Hagal supporting the Corrino. They have always been close friends. This whole meeting is nothing more than a stupid political game._FEYD: Clearly, brother. Why are you mentioning it as if it would be a great discovery?_RABBAN: Little brother, you always feel the need to say worthless things and make them sound smart.__Radnor can't be bothered by the two fools arguing. He's more focused on the meeting.__ARCHDUKE ARMAND ECAZ: This can only be fixed by having a new emperor. This is what the Imperium is lacking now. If the three Great Houses do not want to stop now, they might have to if an emperor dictates it._BARON: BAH! Don't make me laugh. An emperor, to dictate me to stop? You seem to forget what we did to the previous emperor._HASIMIR: Baron, please. Her highness is here._IRULAN: It is alright, representative Hasimir. The Baron is very well known for his sharp tongue._BARON: I assure you I meant no offence to you, your highness._HASIMIR: The old ways state that a male emperor must rule the Imperium. However, the ruling dynasty, Corrino, has no close male heirs. The family tree gives us a few male boys, but they are far from the original bloodline. Therefore, the CHOAM proposed that we decide, together, who shall rule the Known Universe. CHOAM believes we should give the throne back to the Corrino family, and have princess Irulan as our empress, being the direct heir of Shaddam IV._EXECUTRIX: House Ordos does not accept the terms. House Ordos demands to take the throne. The Ordos fought on Arrakis and have control over the spice. That is fact. House Ordos deserves the leadership of the Imperium. That is wise._BARON: Your highness, you did a terrible mistake inviting all the weirdos to this meeting._HASIMIR: Baron! I am asking you to stop your insults. You are crossing the line already._EXECUTRIX: House Ordos does not recognize insults. We are taking the logical approach. That is wise._COUNT GINAZ: The old ways are clear. The heir has to be a male. Therefore House Ginaz cannot support this proposal, princess Irulan. We must elect a male emperor._ARCHDUKE ECAZ: House Ecaz agrees. A male emperor must be chosen._HASIMIR: I must interrupt you all. I see this is not getting anywhere. I say that each member of the Landsraad should say it here, publicly, who they support for the throne. You may choose yourself, another Great House, or refrain from choosing someone at all._BARON: I support my own House for this. _DUKE: House Atreides will vote for itself._EXECUTRIX: House Ordos votes House Ordos. That is logical._HASIMIR: Allright. Other members of the Landsraad, please... state your choice. Princess Irulan, Spacing Guild representatives, you may choose too._SPACING GUILD REP: The Spacing Guild does not support anyone._HASIMIR: Noted. Thank you.__FEYD: An election... this might be an issue._RADNOR: Why's that?_RABBAN: Who wouldn't vote for us and risk the wrath of House Harkonnen come upon them?_FEYD: When are you going to start using your brain, brother? This is their change to diminish our power. We control both Giedi Prime and Lankiveil, and soon, Arrakis will be ours as well. They will try to ensure we don't get the throne._RADNOR: The Atreides will probably have most friends there. They know how to kiss ass very well._RABBAN: Don't be so quick about that! Our father has some pretty good alliances as well._FEYD: Besides, I know he has been working on some big plan recently. I am assuming he has predicted this, and prepared for it.__Meanwhile, in the meeting, the other houses not involved in the recent war are finally taking sides, after a long period of silence and calculations:__ARCHDUKE GINAZ: House Ginaz is supporting Duke Leto Atreides for the Golden Lion Throne! Duke Leto would make a perfect emperor due to his abilities._VISCOUNT HUNDRO MORITANI: House Moritani supports House Harkonnen. The Harkonnen are the strongest military force in the Landsraad, and a firm military grip is what the Imperium needs right now to establish stability.__FEYD: See? Moritani is with us!__COUNT HAGAL: House Hagal is supporting princess Irulan Corrino. The throne must return to the Corrino family, and princess Irulan is more than capable of continuing her father's legacy._COUNT RICHESE: House Richese is supporting itself. Our advanced technology is what the Imperium needs now. For years, Richese offered great machines for the known universe._COUNT DOMINIC VERNIUS: Hah! Richese technology cannot compare to Ix. Are you really saying you should rule because of your technology, while you don't even have the most advanced machines?_COUNT RICHESE: Of course I had to be interrupted by Dominic Vernius._HASIMIR: My lords, please. Stick just to the voting._COUNT VERNIUS: Very well then. House Vernius is supporting my old friend, Duke Leto Atreides.__FEYD: DAMN! The Atreides vermin have the ixians on their side. I guess our father's bribes and promises were not enough._RABBAN: It may seem our father did not really have everything planned very well.__BARON FLAMBERT MUTELLI: House Mutteli supports House Harkonnen.__RADNOR: There you go... Mutelli... that's a weird choice.__COUNT WALLACH: House Wallach is supporting Duke Leto, of House Atreides._ARCHDUKE ECAZ: House Ecaz is also supporting Duke Leto Atreides._HASIMIR: CHOAM supports princess Irulan Corrino._EARL FAZEEL: House Fazeel would like House Vernius to the throne, so the Imperium can benefit the most from their machines._IRULAN: House Corrino is supporting itself.__The rest of the major and minor Houses decided not to get involved in this voting. Hasimir concludes:__HASIMIR: It seems there is no clear winner of this vote. So far, it seems most of the votes went with House Atreides and Harkonnen, with some of the parties supporting princess Irulan Corrino. There are also individual parties supporting themselves: House Ordos and House Richese. Also, House Vernius is being supported by another House, but not by itself. Dominic Vernius, do you wish to change your vote?_DOMINIC VERNIUS: No. House Vernius supports Duke Leto Atreides. _HASIMIR: Due to no majority of the votes going for one of the Houses, I propose that this meeting is suspended for now. I hereby ask all the attendees to reconsider in a few weeks another meeting, where we shall vote again. Please consider making a decision until then, as we need a decisive conclusion for this.__The meeting is dismissed. Duke Leto seems happy, as he got the most votes. At the same time, Irulan seems calm, calculated. The Baron is fuming, but he's trying to hide it from the others. He immediately tells Piter to follow him in the Harkonnen rooms, for an emergency consulting session. __As soon as they returned on Arrakis, Radnor and the baron's sons have been summoned.__RADNOR: My lord. _FEYD & RABBAN: Father._BARON(angry): Drop this bullshit. We got stuff to do. As you saw, most of those idiots chose to support Leto. That is bad. But you know... if we can't win by democracy, we'll win by raw power. AS WE ALWAYS HAVE DONE!_RABBAN: How, father? We can't take everyone in a war. _BARON: Dear gods, Rabban, you really are stupid. Perhaps your brother is right about you.__Rabban looks at Feyd with a lot of hatred in his eyes, and says:__RABBAN: But, father..._BARON: Listen, you idiot. There is no need to take on the entire Landsraad. Because those idiots don't really give a crap about this nonsense. You've seen how many of them refused to vote. If it doesn't help them, the crown is not important. Neither is who takes it. It is time to set my & Piter's plan in motion. Of course, after today, we have to adjust it a bit._FEYD: We're all ears, father._BARON: I want to set up a great coalition to take the Atreides by storm. And time is of the essence. _RABBAN: A coalition? With who?_BARON: That is not your concern for now. General Radnor, I want the Ordos in good terms. _RADNOR: You do?_BARON: Yes, you idiot. What part of the word coalition is not clear? With the Ixians siding with the Atreides, we need some more powerful House on our side._RABBAN: But the Ordos want to get the throne themselves._BARON: You're trying to be smart, Rabban, and you're failing miserably. General, here's what you have to do: help the Ordos. They are under heavy attack from the Imperial Sardaukar. I want you to take a considerable amount of troops and rush to the aid of the Ordos commander. Establish a good relation with them._FEYD: Even if we help them, why would they ally with us?_BARON: For two reasons: one, they are almost destroyed, their Arrakis campaign is doomed, they would certainly use our help, and second, we have a common enemy who is more powerful than us... at least diplomatically. Go and do your job, Radnor. Piter will brief you on the details.__==========_Objective: The Baron wants to improve relations with the weak Ordos. You must do just that. Take a considerable army and march through the desert. Reach the Ordos base and destroy the Sardaukar attackers. You must make sure the Ordos Construction Yard does not fall. Once their base is secure, remove the imperial forces from the region to secure the Ordos.
