Briefing=All the great Houses have paid a fortune for our frigates could lead them to Arrakis. We do not care which of them dominates the planet, as long as we pay our dues spice.__Both Harkonnen and Atreides could not disburse the full amount needed for the big trip, but promised to pay us their debt to a percentage of interest that we could not refuse. Now it is the time to reclaim our money, starting with the Harkonnen.__The Harkonnen are sticking flatly to pay us any amount. If they do not pay us will what belongs to us, we will capture their silos and his refinery, we have the approval of the emperor.__We will send soldiers to one of our starports we have in case of emergencies. Wait until all of them arrive before marching against the enemy base. Eliminate all Harkonnen resistance and destroys the barrack and light factory. Once the way is clear we will send a carryall with engineers directly on the Harkonnen base. Use them to capture their silos and refinery.__Objetive: Stop the Harkonnen resistance. Destroy the Harkonnen barracks and light factory. Not destroy the refinery or silos. The Starport must survive.
