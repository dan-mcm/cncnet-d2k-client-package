[Basic]
Name=Coalition of Nobles: New Enemies - Mission Bonus
Author=Cm_Blast
Music=ENTORDOS.AUD
SideId=2
TextUib=TextEngNoblesSeq.uib
Briefing=In this alternate story. Westwood Studios decided to include the House of the Lassoki in their game, back in 1992. Now the Lassoki face the treacherous Emperor and his two dogs, the Atreides and the Ordos in the final battle that will decide who controls Arrakis.__This map will use numerous rules in reference to Dune 2, namely:_*The player uses the same technology as during the main campaign._*If you cancel a build/order, the money will go back to the Refineries/Silos._*Sandworms will only start moving if the proper square is revealed._*Carryalls will only transport units for long distances._*The Starport can store up to 9 units of each._*Prices in the Starport can be more expensive or much less cheaper._*The AI will be passive until it meets the player._*The AI will not mobilize new units to protect their base._*Enemy reinforcements will land in a random area near your base._*Deat Hand Missile has very low accuracy._*The Saboteur cannot turn invisible._*Capturing enemy Palaces will not offer anything._*Fremen will spawn in a random position with 50% health._*Spice is limited, and Spice Blooms will only explode once._*If a unit steps on a Spice Bloom, it will die.__Objective: Destroy all your enemies.__Tips: Watch your surroundings, enemies can land in any position around your base, and Fremen can appear out of nowhere. Do not make upgrades to the buildings until you have enough money and try to deploy the Refineries separately from each other since the Spice will run out.

