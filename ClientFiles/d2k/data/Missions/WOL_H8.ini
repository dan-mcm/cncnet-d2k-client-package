Briefing=The Baron had to return to Giedi Prime, to take care of some homeworld needs. Right in the middle on an invasion on his rival's homeworld. This situation has created some unrest in the Harkonnen camp. Despite the Baron leaving De Vries there to coordinate the war, soldiers and commanders alike do not consider the mentat capable enough to lead this invasion further. Houses Mutelli and Moritani are considering an eventual retreat, and the baron has done great efforts in keeping their troops on Caladan.__The Baron has established a comm-link with his military on Caladan.__BARON: Piter, how is the situation there?_DE VRIES: It is getting worse minute by minute. My men are reporting heavy Atreides retaliation on the southern continent. It seems like it is Gurney Halleck, one of Leto's best men, who's creating all these issues. I heared he has taken back the Spaceport on the southern continent and the Atreides Navy has bombarded our forces on Serena's Necklace... We must..._BARON: HOW... HOW CAN THIS START TO LOOK BLEAK? WE HAD IT ALL PREPARED._FEYD: Not only that, father.. My spies informed me that House Ginaz has accepted to step in for Leto. The Atreides-Ginaz alliance seems so strong, that Ginaz troops are getting ready to land on Caladan at any moment. Besides, our allies are rather worthless, if you ask me. _BARON: Rabban... WHAT HAVE YOU DONE?_RABBAN: Why are you blaming me for this father? I am not the one who..._BARON: YOU WERE SUPPOSED TO DEFEND THE SOUTHERN CONTINENT. Now the Atreides can reinforce at full speed from off-planet. Their army on Arrakis was numerous. And not only that, now that their Naval Yards on Serena's Necklace are operational again, their navy will be too much to handle. _RABBAN: Great job, father. Blaming me for your failed plans._BARON: WHAT DID YOU JUST SAY?_RABBAN: What you've just heared. This whole invasion was your idea. You wanted to destroy the Atreides completely. You wanted it so much, that you thought that we can do it with the help of two worthless Houses: Moritani and Mutelli. In an invasion of a planet where the Atreides know every trick... where they have air and water superiority. Now we're all stuck on the main continent._BARON: HOW DARE YOU QUESTION MY PLANS? It's your terrible execution that brought us here._RABBAN: Would my execution change the fact that House Ginaz is joining on the Atreides' side?_BARON: Your incompetence seems to be backed up by insolence. Very well Rabban, YOU CAN KISS GOODBYE TO THAT FUTURE LEADERSHIP OF THE HARKONNEN FAMILY._RABBAN: WHAT? YOU CAN'T DO THIS... _BARON: GET OUT OF MY FACE, YOU WORTHLESS IMBECILE!__Rabban leaves the room, smashing everything in his path._Radnor is reflecting: "Well, the man didn't say anything false... It was baron's idea... baron's plan, baron's vision... And they all sucked... But the guy needs to learn when to talk and when to shup up."__BARON: Listen to me... YOU ALL. We're not going to fail this. DID YOU UNDERSTAND?_FEYD: Father... please. We need to..._BARON: IF YOU SUGGEST TO RETREAT, YOU'RE DEAD TO ME JUST LIKE RABBAN. DID YOU COPY ME, FEYD?_FEYD: Definitely. I meant that we should take our their Airbases. The shores can be covered by their navy, and we cannot do anything about that without Serena's Necklace. But inside the continent, the real threat is represented by their airstrikes. _DE VRIES: That is actually a very good idea, my lord. There are 2 main Atreides airbases that they use to coordinate ornithopter airstrikes from. If we take them out... _BARON: Then do so... I must return to my tasks here. Feyd, I'm counting on you to let those idiotic allies of ours know that everything is under control._FEYD: No worries, father.__Transmission ended...__DE VRIES: Well, well. Looks like you are the new heir, Feyd. If what the baron said can be taken for real. You know how impulsive he is. You just never know what he does when he cools down._FEYD: Doesn't matter if it's now or later, Piter. You might very well get ready to call me "baron" one day._De Vries smiles._DE VRIES: I like that attitude. A winner's attitude._FEYD: You can go attend your stuff. I'll brief the General about the airbases._DE VRIES: Very well.__De Vries leaves. __FEYD: How quickly can everything explode, isn't it?_RADNOR: You got what you wanted... Or so it seems... He might change his mind later on. _FEYD: Oh I don't think he will. Nonetheless my stupid brother wasn't wrong with everything he said._RADNOR: So you think that as well._FEYD: Of course! I always thought this won't work, even before we stepped foot here... The great start made my father believe this was the hit of the century. But obviously, it went so well just because the Atreides did not expect it. And couldn't retaliate immediately. All the money and promises he made to the Guild, to get all our troops and our allied troops here, while keeping Atreides transports out... All the deals he made with Richese and Ix... It was never enough to conquer Caladan. Even a child could have figured this out._RADNOR: How's going on Ix? Haven't heared anything about that._FEYD: It's going good, actually. Much better than here. But I heared some interesting things... Things called Tleilaxu._RADNOR: What about the Tleilaxu?_FEYD: I heared they joined the Ordos and Richese against House Vernius of Ix.__Radnor becomes angry out of a sudden.__RADNOR: THOSE CURSED TLEILAXU. I WISH I COULD KILL THEM ALL. ONE BY ONE, TO SEE THEM DIE A HORRIBLE DEATH.__Feyd looks surprised.__FEYD: What's up with the Tleilaxu? Why do you hate them so much?_RADNOR: It doesn't matter._FEYD: I am your future baron... I believe you should tell me, if that's what I want._RADNOR: But you're no baron yet, my prince. You wanted me on your side. I am expecting you to value me for more than just a servant._FEYD: Clearly. If you don't want to tell me, then it's fine, whenever you feel..._RADNOR: They killed my entire family._FEYD: What? How?_RADNOR: I was young. I don't even know how my family got in contact with them. All I know is that they used my entire family for their cursed bio-engineering experiments. Giedi Prime and the military allowed me to forget this... But I swore that whenever there will be an opportunity..._FEYD: Don't worry, pretty much everyone hates those abominations. But for now, if they are allied with the Ordos and Richese..._RADNOR: I don't care about the Ordos and Richese. If I'll get an opportunity... _FEYD: Listen, General. About the task at hand. One of the two Atreides air bases is deeper into Atreides territory. It would not be smart to strike that... yet. But we have another one which is much more open. It's a pretty hard to reach zone due to terrain. This makes their thopters even more effective._RADNOR: Just give me the coordinates. I'll go and turn their thopters into scrap metal._FEYD: I'll talk to Moritani. They have forces close to that position. I will ask them to assemble there before you arrive, and do so without detection._RADNOR: Great, now I have to rely on Moritani not getting detected..._FEYD: They will do their job properly. Once you are there, remember: as soon as they spot you, hell will be unleashed on you in terms on air force. They will send thopters at you, and many. I would suggest setting up some anti air defenses, but execution is your call. I just want their entire bases destroyed._RADNOR: You got it.__==========_Objective: Our invasion doesn't look as promising as it used to be. We met the heavy Atreides retaliation which was inevitable to come. Besides, House Ginaz is reported to have sent troops on Caladan to aid the Atreides. With the Baron away on Giedi Prime, your target is to destroy one of their important Air bases, to get some of their air heat off our backs. Work with House Moritani and destroy the enemy bases. Hurry up and build a base before they scout and spot you. Once you're spotted, expect heavy Airstrikes. You might want to set up some anti-air defenses. Rocket Turrets are excellent for that. Missile Tanks as well. Tactical map available, press the button to view it.
