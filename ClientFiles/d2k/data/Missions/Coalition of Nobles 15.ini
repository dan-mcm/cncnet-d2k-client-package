Briefing=The damage done by the Lassoki to the Imperial city has severely reduced the Emperor's available resources. It only has a few operating Factories and a couple of deployed Construction Yards at its disposal.__The Emperor knows that this is not enough to fight the entire Coalition, so he plans to reinforce his army with the special vehicles of the three great Houses. Now Sonic Tanks, Deviators and Devastators are approaching the Imperial base.__The Lassoki have found out about the plan and already have a base and some Light Vehicles ready to stop any convoy trying to reach the end of the canyon. The other three Houses of Iasi, Qaii and Bromeli are also in the territory, but with the short time available they have only been able to assemble a basic army.__Multiple Harvesters are on the way, and as soon as they arrive, all three of them will be able to expand the base, strengthen their army, and assist with the attacks against the Emperor's base with all their might. Until this happens, the Lassoki are the only ones that will be able to attack the Imperial convoys. If any of these vehicles reaches the end of the road the Emperor will be able to mass-manufacture them.__The Iasi and Qaii will recruit their own army to defend against any attack, but the Imperial forces may be too much for them. The Bromeli are the ones who will require the most protection from their Lassoki companions, who are the ones who are closest to them.__Objective: Destroy the Imperial base.__Secondary objective: Destroy the Imperial Convoys to prevent the Emperor from building the three special vehicles. Wait for the time limit to reach zero so that your three companions can begin to expand their base and build a better army.__Tips: Convoy vehicles will generally ignore whatever units are firing at them, but will be less prone to retaliation if attacked from the rear. If the convoy turns with the intention of firing your units, back up a bit so they ignore the order and get back on their way before continuing to fire at them.

