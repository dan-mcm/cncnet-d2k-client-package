Briefing=The recent wars and conflicts within the Landsraad have created a situation which is asking for another meeting between the great leaders of the council. The hostilities are getting dangerous, and are causing high unrest in the Empire. CHOAM, along with the Spacing Guild and princess Irulan of House Corrino, have formed another meeting to discuss the current situation of the Imperium. The Landsraad council has accepted the meeting, more to preserve its image with the population than their pure will for peace. This time, however, the meeting is not taking place on Kaitain: it is a remote transmission with most of the Landsraad Houses.__The Duke is sitting in the war room in Cala City on Caladan, along with Thufir Hawat and Gurney Halleck. Their intervention on Ix was much shorter than anticipated: the Tleilaxu and Richesian betrayal of House Ordos seems to have completely stopped the invasion. All three Houses retreated from Ix, with the remaining forces being slaughtered by House Vernius troops. Therefore, the Atreides army, severely damaged by the war against the Harkonnen and their allies, has returned to Caladan. Some of it is being prepared to be relocated to Arrakis, to reinforce Duncan Idaho.__The Duke has joined the Landsraad meeting, while Hawat and Gurney are standing behind, as the duke's council, ready to analyze the discussions.__HASIMIR (CHOAM representative): Welcome, great leaders of the Landsraad, Spacing Guild and CHOAM. Due to recent events, we see the need of a new meeting. The previous had a certain objective, which does not seem like it was achieved. Even worse, the conflicts within members of the Landsraad have increased considerably. Not only did they spread out of Arrakis, to other planets, but also have involved Houses which were neutral before. _IRULAN: We see this whole issue exploding further. It is a dangerous situation, which must be stopped immediately. Peace must be restored in the Imperium._BARON HARKONNEN: Princess Irulan, last time I was called as being disrespectful just because I called things the way they were. This time, I am going to do the same thing. Let me remind you that this kind of peace talk doesn't stand, your highness. Your Sardaukar were present on Caladan, killing my men. Count Moritani can also confirm this. _IRULAN: What was your business on Caladan in the first place, dear Baron? My Sardaukar..._BARON (raging): What was my business there? IT IS KANLY! Vendetta! And it has been for generations between Houses Harkonnen and Atreides. You're asking me what was my business on Caladan: then I am telling you I was there because there is kanly between Atreides and Harkonnen._IRULAN: Then my Sardaukars' business on Caladan was to stop your stupid kanly, to stop your invasion on another Houses' planet._BARON: YOU HAD NO BUSINESS GETTING INVOLVED IN THAT!_DUKE LETO ATREIDES: May we ask our dear baron to use ... whatever questionable royal honor he has left and watch the way he addresses not only to another monarch of a Great House, but also to a lady?_BARON: Of course you're defending her, Atreides. She basically saved your ass from being destroyed by the might of House Harkonnen._MUTELLI: House Harkonnen is more of a joke rather than a respectable member of the Landsraad. The kind of House who cannot wait to backstab you for someone else._BARON: Ah, of course, the butthurt "great" House Mutelli, invoking attacks on their troops that never happened. I would have thought you were smarted than that in finding a decent excuse for turning against us, dear Baron Mutelli. I guess that the task of fighting against Houses Atreides and Ginaz was too much for you.__Gurney looks at Hawat with a smile on his face, after this harsh exchange between Harkonnen and Mutelli._HAWAT: Yes, my idea, Gurney._GURNEY: I'll give you a spice beer when we return on Arrakis for this, man. It was wonderful. And they have no idea what happened, still!__HASIMIR: Gentlemen, please! Even now, you cannot stop from your quarrel! We are meeting here to make peace._COUNT DOMINIC VERNIUS: Peace? With all due respect,representative Hasimir from the CHOAM, but have a look around your holo faces from each transmission and tell us if you see them willing to make peace. My planet, Ix, was invaded by Houses Ordos and Richese. For absolutely no reason. This was completely uncalled for. Then, we found out the Tleilaxu were also involved. All because none of these 3 factions could stand the fact we offer superior machines to anyone else's._COUNT RICHESE: This should be considered blasphemy._IRULAN: Can we act like monarchs of a great House? This means to stop calling other people out right now. It is clear that this was a political game. A game where houses which were not involved in my father's contest on Arrakis found a way to get involved now and fulfill their specific needs on the backs of other houses, like the Atreides and Harkonnen rivalry. If you have a look, the Houses which joined the Harkonnen on the invasion of Caladan are the houses which supported Baron Vladimir Harkonnen for the golden lion throne. _COUNT MORITANI: And what are you trying to say, princess Irulan? House Moritani has always supported House Harkonnen. They have been a close partner through the years, and we are still with Baron Vladimir Harkonnen. _IRULAN: No doubt you were hoping that if the Atreides fall, then the Harkonnen will have most chances to get the throne. And maybe that way your house would get out of obscurity thanks to the Baron, or rather, the new emperor._COUNT MORITANI: HOW DARE you insult me in the meeting you requested? _IRULAN: It was not an insult, my Count. It was the truth. I am telling everyone who gathered here the real reason why House Moritani attacked the Atreides on Caladan._BARON: When you do tell everyone the reason people did things, try to at least look a little bit impartial and objective, your highness, and not the number one Duke Leto Atreides fan._GUILD AMBASSADOR LAKAR: Monarchs of the Landsraad, the Spacing Guild considers the hostilities a threat to the Imperium. The spice production has been affected for a long time by the conflicts between the three great Houses. _DUKE LETO ATREIDES: Does the Spacing Guild have the insolence to speak after everything they have done?_HASIMIR: Duke Leto, please. They are part of the power pylons in the known universe. They have every right to speak._DUKE LETO: Do they? The Spacing Guild was supposed to be a neutral side in the war on Arrakis. They joined former emperor Shaddam IV and caused us many casualties. Not only that, but the Guild actively helped Houses Harkonnen, Moritani and Mutelli in the invasion on Caladan._COUNT DOMINIC VERNIUS: And Houses Ordos and Richese, in the invasion of Ix._HASIMIR: Gentlemen, please. We are not getting anywhere if we continue like this._IRULAN: I am curious about something. One of the main protagonists of these hostilities has not said a word since the beginning of this meeting. Does the Executrix of House Ordos have absolutely nothing to say?_EXECUTRIX: House Ordos considers the subjects approached in this meeting irelevant. That is inefficient. House Ordos will not explain their reasons for the Ixian invasion. We have a different concern. That is certain._COUNT VERNIUS: You should explain yourselves, Executrix of House Ordos. You are a member of the Landsraad, you are not on your own in the empire. You attacked another members of the same Landrsaad unprovoked. Give us the reason._EXECUTRIX: Useless conversation. That is inefficient. House Ordos has real concerning information to share with the Landsraad. That is a threat._IRULAN: Then by all means, why don't you share this information with the Landsraad, Executrix of House Ordos?_COUNT RICHESE: Does the Executrix believe we are stupid enough to just ignore what happened on Ix because of some distraction disguised as a threat?_IRULAN: Count Richese, please, let the Executrix speak._COUNT RICHESE: It is outrageous. House Richese has given its motives for the Ixian invasion. We are in open competition with the ixians. It is kanly._EXECUTRIX: House Richese is trying to stop us from letting the Landsraad know what they are involved into. That is futile. House Richese has a secret alliance with the Bene Tleilax._COUNT RICHESE: A secret alliance? There is nothing secret about it. It is the same alliance you had with the Tleilaxu._EXECUTRIX: House Richese and the Tleilaxu have turned against the Ordos on planet Ix. That is a fact. _COUNT RICHESE: We turned on you? Ordos troops attacked us before anything else. This is ridiculous!_EXECUTRIX: The reason for their allegiance change is something House Ordos managed to find out. That is important. They are conspiring for creation of an artificial spice melange substance to replace the spice found on Arrakis. That is a threat.__This came like a bomb, to everyone involved in the meeting. _GURNEY: Artificial spice? That is absolutely crazy. Is this possible, Thufir?_HAWAT: How could I know?_GURNEY: Well, you're a mentat._HAWAT: Hence why I can only work with facts and a good set of information. I have no knowledge about this. It is the first time I am hearing it as well._GURNEY: If it's true, this sounds very bad._HAWAT: That is absolutely true.__COUNT RICHESE: Does the great Executrix of House Ordos have any proof to sustain their accusations?_EXECUTRIX: House Ordos can provide images with Tleilaxu ships on Arrakis. Harvesting parts of dead worms. That is a threat. House Ordos also has a small part of the artificial melange formula. That is precious._COUNT RICHESE: Great, images of Tleilaxu ships. But can the Executrix of House Ordos offer proof that House Richese is involved as well?_EXECUTRIX: House Ordos does not have recordings or images of Richesian ships, but their alliance with the Tleilaxu and their change of allegiance with the Ordos are questionable. That is certain._COUNT RICHESE: No, not certain, that is ridiculous. Princess Irulan, I am not going to tolerate any more accusations without proof._IRULAN: Calm down, Count. Nobody is accusing you of anything right now._EXECUTRIX: There is one more concern for House Ordos. Tleilaxu have been developing a Shaddam IV ghola. That is a fact.__Again, this came like a bomb to the gathered people. The CHOAM representative fell on his chair in shock. Irulan could be seen pale on her transmission holo-image. __GURNEY: Those damn Tleilaxu. How crazy are those guys?_HAWAT: Crazy, or smart. With a Shaddam IV ghola undetected, the Tleilaxu could have claimed the throne for themselves. It would appear as if Shaddam simply survived on Arrakis._GURNEY: Who would choose Shaddam as the emperor anyway? After what he did?_HAWAT: Choose? There is no choosing involved. He would technically still be the emperor. Most likely charged by the Landsraad to a fine, but still an emperor. But a puppet emperor to the Tleilaxu.__DUKE LETO: This is outrageous. Your highness, House Atreides will not tolerate this insult for your family. _COUNT GINAZ: May we know, dear Executrix, how did you gather all this information? And how do we know you were not involved as well? You did have an alliance with the Tleilaxu and the Richesians until very recently._EXECUTRIX: House Ordos found it all after their change of allegiance. Ordos spies were dispatched. That is wise. Ordos spies gathered a lot of important data. That is efficient._COUNT HAGAL: This story is very fishy, if you ask me. Your highness, House Hagal will also stand against this abomination and insult for House Corrino._EXECUTRIX: Time is of the essence. Bene Tleilax are operating on Arrakis as we speak. That is a fact. They are creating their artificial spice melange with possibly special Richesian refining machines. That is a threat._COUNT RICHESE: Another accusation without any proof. Then you create meetings to ask for peace, but you allow creatures like this to insult me and my House? House Richese will not tolerate this anymore. House Ordos should be prepared to fight against us. We will move to Arrakis and openly declare war on House Ordos._HASIMIR: GENTLEMEN! PLEASE! _BARON: Oh come on, representative. It is clear this is no time for peace. If what that thing called the leader of the Ordos says is true, then this is very bad. Your... highness... princess Irulan, House Harkonnen will also fight to stop that ghola abomination._DUKE LETO: I am sure the Baron is offering his support just for you, your highness, and that there are absolutely no hidden motives or plans involved._BARON: Your amazing irony makes me smile, dear Duke Leto. It is as good as your army: which is pretty terrible._DUKE LETO: Then it's a good idea that we will all have the might of the Harkonnen armies fighting against the Tleilaxu... the mighty Harkonnen army which was sent back home to Giedi Prime from Caladan to lick their wounds._IRULAN: Duke Leto, please. At this moment, any help is appreciated. Not only did they create a clone of my father, but they are also trying to replace the spice with their own creation. They must be stopped. _COUNT VERNIUS: House Vernius will join their allies, the Atreides, against the Tleilaxu._COUNT RICHESE: House Ordos should be prepared for war. Their insults will not be tolerated anymore. House Richese has no issue with the Tleilaxu. That is all we had to say. __The transmission from Richese was closed.__EXECUTRIX: House Ordos will also get involved in this. That is a fact. We all have a common enemy. Logic dictates we focus on it. That is wise._IRULAN: My Sardaukar will once again march on the sands of Arrakis. This time, they will be killing the Tleilaxu. And anyone siding with the Tleilaxu. No exceptions. For the insult they brought to my family._HASIMIR: I see the purpose of this meeting has failed. Once again._IRULAN: I am sorry, representative Hasimir, but things have changed now!__--- Transmission ended ---__DUKE: I won't lie to you, I am shocked. We were suspecting something from the Tleilaxu, Duncan reported images with their ships on Arrakis, but we couldn't find out what they were doing. All that the Executrix has said makes sense, now._HAWAT: Then it's time to move on Arrakis.__------ Few days later, in Arrakeen, Atreides capital on Arrakis ------__DUNCAN: My lord, I have prepared the troops as you've asked me. And I managed to create a small plan for battle. The Tleilaxu are spread thin in certain regions, gathering spice and dead worm parts. It seems they are using both Richesian and other smuggled technologies, including tanks and special vehicles. They even have smuggled Sonic Tanks, my lord._DUKE: So the gholas are perfectly operating all of these tanks?_DUNCAN: They are. The Fremen detected one of their main harvesting facilities. They have a lot of vehicles guarding the spice fields. We should strike as soon as possible, but our troops are not yet prepared for this. _DUKE: Not prepared? How many tanks do they have there?_DUNCAN: A lot. And they have some Ghola Sardaukar and Fremen there. But I have a plan. The Fremen were outraged by the fact Tleilaxu created gholas of their fallen brothers. They are offering their amazing desert skills for us. They can send a few Thumpers with some Fedaykin escort to summon worms. The worms should be able to clear the enemy vehicles without alerting the Tleilaxu about Fremen or Atreides presence. _DUKE: So, your plan is to..._DUNCAN: Let the worms eat all their stuff. Including the harvesters. Without harvesters, their spice production will cease. Without their tanks, the base will be open to attack. We can easily take it afterwards. But the main objective should be to stop their harvesting. I received worm from Ordos commanders telling me they detected that the Tleilaxu spice production should be our main target. Because they are already having some prototype artificial spice. And we should prevent them from making more. We can also call in Airstrikes from our nearby air base, but a direct assault is not something I would recommend. We don't want to cause Tleilaxu or Richesian retaliation for now. The Fremen worm plan sounds better._DUKE: Then we must count on the Ordos for this one. Let's hope this is not one of their twisted plans. Thufir, I am expecting you to gather all necessary data immediately. I don't want to rely on the Ordos anymore. I want us to know what the Tleilaxu are doing and how to counter them._HAWAT: I will start immediately, my lord._DUKE: Gurney, you'll be the man to coordinate the Fremen._GURNEY: It will be my please, sire.__==========_Objective: It seems the main priority now is to slow down Tleilaxu spice production. We can achieve this by making sure their Harvesters are food for the worms. That way, the Tleilaxu will not get alerted of our direct intervention. Use your Fremen to protect the Thumpers. The Thumpers can be used to attract worms from nearby regions. Move in close to enemy vehicles and deploy the Thumpers. Let the worms do the rest. Your target is to get rid of all the Tleilaxu Harvesters. Ignore the base for now, we can take it later.

