Briefing=SUMMERS' SOLSTICE 13: Shrouded Skies__MISSION OBJECTIVES:_1. Establish a stronger base in Bidriyah Sink._2. Prepare against airstrikes sent by the enemy._3. Secure and protect at least one Atreides HTF._4. Annihilate all enemy forces.__TACTICAL OBJECTIVES:_1. Be aggressive to generate momentum._2. Secure as many air bases as possible._3. Use your limited Sonic Tanks wisely.__BRIEFING:_     Summers and Durant trust each-other. The two are inseparable, but they and the Ordos cannot reconcile with tensions flared and their forces in disarray. They will fight among themselves. You must use this time to further weaken the Ordos, the headless snake that still writhes in its death throes.__     Mobility is a power only you may possess. The Atreides High Tech Factories in Bidriyah Sink must be seized from the Ordos and prevented from falling into the hands of Sabre Durant's mercenaries. Once the Ornithopters are at your disposal, you can use them when your enemies inevitably realize they must unite. By then, it will be too late.__     Orbital artillery is standing by for tactical strikes. Reinforcements are en route. The forward base awaits your command. Your mentat will soon provide more intel on the air bases in the territory.
MissionNumber=13

