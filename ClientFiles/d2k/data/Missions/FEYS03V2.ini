Briefing=SUMMERS' SOLSTICE 03: Razorback__MISSION OBJECTIVES:_1. Defend your base against the Atreides' assault._2. Attack once the Harkonnen are prepared._3. Your allies must not be defeated._4. You must survive.__TACTICAL OBJECTIVES:_1. Accompany your infantry personally when prudent._2. Scatter your infantry to mitigate incoming damage._3. Search for weaknesses in the Atreides' defenses.__BRIEFING:_     Not a step into the Outpost at Bled al-Hazrad, you're greeted by Sumadi, who shakes your hand and looks you worriedly in the eyes. "Welcome, Commander Summers. You've arrived just in time."__     With a short glance over Sumadi's shoulder, you spot an unknown, but decorated man looking impatiently back at you. His blond eyebrow is arched up below the rim of his short hair. As Sumadi turns around, you follow him to the viewscreen and see the Atreides commander more clearly.__     The war between the Great Houses has begun.__     "So," he starts, looking back to Sumadi. "This is your last line of defense? I'm sorry to disappoint you, Sumadi, but you're going to need better to bargain. Whatever trouble your friend and a handful of mercenaries could give me is nothing next to the bounty the Imperium placed on this base of yours." He returns his gaze to you. "Commander Summers, is it?"__     You glare at him. "Speaking, and let me make this clear to whoever you are - I don't take kindly to threats. Back off, or I'll show you how much trouble I can be."__     He smirks at you, smug, then chuckles. "Charming. I am Cyril Vasiliou, High Commander of Atreides forces on Arrakis." His cool, condescending expression drops to a chiseled scowl. "Let's end this here and waste no more of our time. I'll see you soon, in person." The comm link cuts out.__     Sumadi glares at you in turn. "What's the matter with you, Summers?! Didn't you see the Atreides army massing nearby as you flew in? There's no chance he'll bargain with us after your impetuous response!"__     "He didn't seem interested in the first place," you retort, equally frustrated. Sumadi sighs and turns away, rubbing his temples in circles with his fingers.__     Following his pause, he turns back to you and thrusts a balled fist onto the command table. "If we lose this base, you're gone, Summers. Get to work!" You decide not to say anything more as he walks out.__     As a former mercenary, you know better than most the inevitability of confrontation. That doesn't mean you like it any more than Sumadi does. Still, he is right that the Atreides are indeed formidable. You doubt even Durant's assistance will be enough to defeat, let alone defy them.__     As you reach for the viewscreen controls to talk strategy with him, it illuminates the room once more. A stranger called you first. You look up to see a slightly aged, balding man with bushy, black eyebrows staring at you. His gaze is sinister. He eyes you more like a piece of meat than anything more.__     "Who are you?" you ask.__     "Radnor Krillys, Harkonnen commander..." he introduces himself. More bad news, as you anticipated merely from his appearance. "Your base is in the middle of my battlefield. A glorious battle will soon take place! I want to ensure our mutual benefit... and make a trade."__     "What do you want?" You ask with a furrowed brow.__     His eerie smirk splits his face further. "You seem to be in a predicament, smugglers. The Atreides force threatens to destroy your precious Spice mining base. I only wish there were something I could do to remove you from harm's way - without removing you outright. Say, if you dumped the Spice from your coffers into mine, I might be so inclined."__     As much as you'd rather keep your emotions hidden, the ire of another Great House would doom you without question. The notion pales you.__     Sumadi has always been very clear: He would rather lose lives than freedoms. Right now, you don't have a choice but to disobey this command of his. The Atreides haven't given you a choice. You offer, "I'll give you six thousand Solaris and the support of my militia."__     "Is that all?" he asks, frowning all of a sudden. Pushy.__     "Nine thousand," you concede. "Anything more and I'll be crushed by the Atreides before your forces arrive."__     He smiles again, placated for the moment. "Then it's agreed. You are smarter than you appear, smuggler commander. I will arrive soon to take the fight to the Atreides, and you, should you anger me." The comm link closes once again.__     Have you any choice but to genuflect without delay to extortion? It's vital you never allow another El-Sayal Plains, and that Durant's forces never again experience another Hagga Basin. Tragically, it's the certain outcome without taking drastic measures. You send the funds to the Harkonnen before you question it further. There simply isn't time.__     Your finger rests once again over the hotkey for Durant, a plan forming in your mind. Your choice is made. Now, to see it through.
MissionNumber=3

