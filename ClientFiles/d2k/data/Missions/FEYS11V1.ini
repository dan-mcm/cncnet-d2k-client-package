[Text]
0=Summers: "Old Atreides turrets. This would be a good place to establish my base..."
1=Summers: "Commander, the Sietch is abandoned. There's only bones and dust."
2=Moriaen: "Odd. Never mind. Proceed with the mining operation at a suitable location."
3=Summers: "There's a stash of unmanned Atreides vehicles here."
4=Sumadi: "Summers. Why did you do this? You've killed us all."
5=Summers: "Commander? Who else is online with us?"
6=Moriaen: "We are on a direct comms link, Summers. Only we are here."
7=Nehara: "You will repay your debt in water."
8=Summers: "Commander, I'm under attack! Someone... something, is attacking my position!"
9=Moriaen: "Summers, please calm yourself. I am not seeing any hostiles at your location."
10=Summers: "They're here! Refresh your display! Damn it... this might get complicated."
11=Summers: "AaaaaAAAAHH!! I'm sorry! Please stop this! Please!!"
12=Tafweek: "Issam, we must help this outsider. Our Sietch is in danger."
13=Vasiliou: "Leave now and I'll spare your men. Don't make me kill you."
14=Summers: "They're gone. ...What's happening to me?"
15=Summers: "Snap out of it..."
16=The darkness has been repelled.
17=Summers: "All units, rally on me. We have to hold out until we hit our quota!"
18=You have been consumed.
19=Summers: "Hang on, a Fremen Warrior emerged from the Sietch."
20=Fremen Warrior: "Ahdhar ayuha alghurib! Alashbah tajub hadha almakani!"
21=Fremen Warrior: "Mat alakhruna! Ghadar alan, aw mahkum ealayki!!"
22=Summers: "Doesn't seem he speaks my language. He's awfully worked up though..."
23=Summers: "Local units, pull back from the cave. We should build a base first."
24=Summers: "There has to be enough scrap around here to build a Refinery..."
25=Moriaen: "Ah, the Spice is harvested. And... transferred."
26=Moriaen: "You are dismissed, Commander Summers. Rest well."
27=Summers: "We should search the Sietch network for more supplies too."
28=OSO Engineer: "Commander, we can build turrets at the pass chokes."
29=OSO Engineer: "If you have at least 2k, just head to the spot you want 'em."
30=Summers: "Roger that."
31=Summers: "Get turrets up at the northern choke! Local units, hold the line."
32=Summers: "Build turrets at the western choke! I want it locked down!"
33=Summers: "I need turrets at the southern choke! Don't let anything through!"
34=OSO Raider: "Ma'am, we found some Hark' hardware. Might be more."
35=Summers: "Damn it, we've lost the forward position to the north! Fall back!"
36=Summers: "They've breached the western choke! Local units, withdraw!"
37=Summers: "Fall back from the southern pass! We can't hold it any longer!"
38=Summers: "I'm calling for reinforcements. Shore up our static defenses!"
39=Summers: "Stand your ground, men! There's nowhere to run!"
40=OSO Engineer: "We can't build the turrets without a ConYard, Commander."
41=OSO Engineer: "Sorry, Commander. We need 2k Solaris to build the turrets."
42=Summers: "We lost the ConYard! Do we have enough Silos?!"
