Briefing=SUMMERS' SOLSTICE 11: Phantom Penance__MISSION OBJECTIVES:_1. Scout Sietch Qanat. Kill all hostiles._2. Scout a suitable location for a base._3. Establish a mining base._4. Harvest 15,000 Solaris._5. You must survive.__TACTICAL OBJECTIVES:_1. Find and restore abandoned enemy turrets._2. Scavenge the Sietch network for supplies._3. Combine Grenadiers with Concrete Walls._4. Utilize LAVs to protect the open dunes.__BRIEFING:_     In your Outpost at Chin Rock, Moriaen is on-screen, staring at your hung head. The communication is freshly opened, but your bleakness is worrisome. She isn't speaking, only thinking. You look sick. You feel sick.__     You break the silence with four words: "What is it, Commander?"__     She cuts straight to the point. "Your light detachment has arrived in southwest Qanat Pass and awaits your command. The territory is rich with Spice and scrap. You are to establish a mining base there posthaste."__     You sigh deeply, barely conveying your intense frustration through the simple action. "Commander... can it wait? I feel unwell."__     She shakes her head in return. "The Spice must flow. You may nap once you have secured the region." After you raise your head and she notices the exhaustion under your eyes, her expression shifts slightly, softening. She asks in a gentler tone, "Will your sickness interfere with your judgment?"__     Maybe. Your goals have come to fruition, albeit at a terrible cost. A cost made only more nauseatingly evident by the earlier battle. You're overwhelmed, but the mission presents an opportunity to make distance from the bloody mess you've made here. Therefore, you shake your head. "No. I will oversee the operation at Qanat Pass immediately, Commander." Head out there, kill any Fremen, establish a base, and then catch up on some sleep.__     Moriaen acknowledges your reply with a solemn nod, then ends the call.
MissionNumber=11

