Briefing=EXECUTRIX: Your new task is to join House Atreides against the Imperial Spice mining facilities. Intel shows the main imperial cash flow comes from these refineries. Logic dictates that if we destroy them, the Emperor will be severely hindered. That is the mission. Work in tandem with House Atreides. That is advice.__We will carry negotiations with the Smugglers to obtain some of their smuggled transports. They cannot transport forces from Draconis IV to Arrakis, but they can provide us with important smuggled weaponry, for a price. That is efficiency.__Objective: Destroy all Imperial Harvesters, Refineries and Silos. That is the mission.

