Briefing=Incoming transmission...__BARON: Excellent execution, General Radnor. Atreides troops did not expect this. Other Harkonnen commanders are already attacking Atreides territories in an attempt to recapture them. I will be quick, as I need to attend many things. A squad of Missile Tanks with elite drivers was lost in the desert, possibly after an Atreides ornithopter attack on their Carryall. I have their location, Piter will send it to you. Those fools allowed the Atreides to take down their Carryall, so normally they should be let to be worm food. However, that would complicate my plan. That squad was supposed to serve a very specific purpose, and I need them alive. You must ensure their safe extraction by air. You are allowed to send Carryalls and retrieve them. There is no time to replace those idiots. Watch out for worms, the region is in deep desert, there is absolutely no place to avoid the worms. Make sure those idiots keep moving at all times, otherwise they are worm food. _RADNOR: I will do it at once, Baron. But may I ask you... what is their purpose?_BARON: I already told you I don't have time now. You'll find out when it's time. Go do your job__Transmission ended...__RADNOR: Alright, pilots, get ready. We must go and save some stupid idiots.__==========_Objective: Some dorks' Carryall was shot down near Wind Pass by the Atreides. Normally, such idiots would be left to die, but the Baron needs them for some reason. You must ensure the Baron can make good use of them. Go save them. The region is filled with worms and there is no place to take shelter. Ensure the Missile tank pilots keep moving at all times, until our Carryalls arrive for extraction. Killing some of the worms might ease the waiting._
TextUib=WOL_Text.uib

