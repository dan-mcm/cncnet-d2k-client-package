[Text]
0=The Imperials have been defeated.
1=Sabre Durant has been killed.
2=Summers: "My construction crews are on site. Got any new intel for me?"
3=Durant: "I found the Reactors powering the Imperial turrets. Take 'em out."
4=Summers: "I see them, far above my LZ. Hang in there, Sabre. I'm on it!"
5=Durant: "Rowe, don't waste those crates. Use the Mass Deposit pad first."
6=Moriaen: "The Ixian prototypes are arriving! Well-executed, Commanders."
7=Summers: "Sabre, what are these LAVs? Is this a plasma-based weapon?"
8=Durant: "It seems so. The Guild Freighters are packed with these, and more."
9=Summers: "The hell are you doing, Sabre?! Cease your attack immediately!"
10=Durant: "Forgive me, Rowe. You're dying today."
11=Summers: "...I've got to capture Sabre's Command Center, quickly!"
12=Durant: "Uhh... Rowe, do you know something I don't?"
13=Durant: "Thank you, Rowe. I wouldn't have been so merciful..."
14=Summers: "What could THIS be? ...It's some kind of base defense, but..."
15=Summers: "I'm almost at the Reactors, Sabre. Move onto the Imperials soon!"
16=Giraud: "You two are beginning to try my patience!"
17=Summers: "Can't go this direction with the crashed Freighter in the way."
18=Durant: "When you've downed the Reactors, get over here and assist me!"
19=Summers: "I found another batch of units behind the Guild RFG."
20=Summers: "There are a couple of Deviators in this Freighter..."
21=Summers: "This Freighter has one of those new Atreides tanks in it."
22=Summers: "There's another Deviator in this Freighter."
23=Summers: "The units in this Freighter should come in handy."
24=Summers: "I should take their power down before trying to push through."
25=Summers: "The Reactors above my LZ probably power these turrets."
26=Summers: "Damn, there's a Tyrant Tank guarding this base!"
27=Summers: "Hey, it's getting away! It's headed your way, Sabre!"
28=Durant: "I have a visual. Looks like it's dropping near the ConYard."
29=Durant: "Watch out, their power's back on! You take out too many turrets?"
30=Summers: "I took it down! The Tyrant's down!"
31=Durant: "Man, those things are tough to kill."
32=Durant: "...Did you come up the side? Well, I appreciate the visit, but..."
33=Durant: "You really ought to take out those Reactors. This angle is tough."
34=Durant: "You pickin' a fight with me, Rowe? Alright then. Have at me!"
35=Summers: "Call it a hunch. I expected something like this from you."
36=Durant: "Good luck taking me alive. I won't go easy on you."
37=Durant: "Not bad..."
38=Summers: "The Guild must care more that we kick the Imperials off the ship."

