Briefing=SUMMERS' SOLSTICE 06: Breaking the Blockade__MISSION OBJECTIVES:_1. The main Imperial ConYard must fall within the hour._2. All Imperial forces on the Heighliner must be defeated._3. Do not allow Durant's Command Center to be destroyed.__TACTICAL OBJECTIVES:_1. Search the area for idle vehicles and more Mass Deposits._2. Strengthen your frontline with LRA, such as Siege Tanks.__BRIEFING:_     In the CHOAM Freighter, fleeing the carnage, you watch the men stranded on the sands below. The Atreides and Harkonnen will eat them alive if you fail. The scurrying dots are swallowed by the glare of sunlit sand as you fly further up.__     When the transmission screen activates, you turn your attention from the action to Achen Moriaen. "Commander Summers, the Imperial blockade is proving too difficult for Commander Durant to eliminate satisfactorily. I've already sent word to him that you will be arriving soon to assist."__     Corrino has finally shown his hand. He intends to thwart Ordos domination through force. That figures. Their intervention would prevent the smuggling of those Deviator prototypes to Arrakis if not for you. As the Harkonnen recently learned, your head is harder than a ram's.__     "What about you?" you ask as you glance to the side. The Heighliner is coming into view.__     "I will hold the Atreides and Harkonnen forces at bay for no more than an hour at most. You must break the Imperial blockade before then. The Ixian transports cannot depart until the Heighliner is cleared of their occupation."__     "Understood," you assure her. "Summers out." You lean forward and toy with the controls, and then Sabre Durant appears in Moriaen's place.__     He looks up from the command table with bags under his eyes. It's unlike him to look so exhausted, even under enormous pressure, so you frown concernedly at the sight. "Sabre? Are you okay?"__     "What do you want, Rowe?"__     "The situation," you request. "What are we up against?"__     "A massive Imperial force. I managed to secure the secret shipments, but there's no way the Freighters can make it past the Imperial AA. And even fighting on two fronts, they're holding out against me."__     You inform him, "I'm almost there, but the Ordos won't hold out much longer."__     "Then we'd better take care of this quickly," Durant replies. A series of coordinates turns up on your display. "I've been narrowing down the location of Giraud's power base. I can't flank him, but maybe you can. Contact me again when you arrive and I'll give you all the intel I've got. If you can take out the power, I might finally be able to break his main." The sound of explosions draws Durant's gaze away from you. "I have to get back to work, Rowe. Good luck!"__     Among the data he's sent you is the location of a Guild Supply Depot on the far side of the blockade. It's the perfect spot to set up. You will be isolated from the mercenaries, but in the perfect position to sabotage Giraud's occupation.
MissionNumber=6

