11=Objective change: Destroy all enemy structures and protect the Starport.
10=Garron: We must destroy them to securely lift off Arrakis.
9=Garron: Sardaukar, I have received intel that the enemy knows about our plan.
8=Garron: Very well, Atreides commander. We will fight alongside you.
7=Atreides: We must join our forces against our common enemies if we wish to survive here.
6=Atreides: The Harkonnen have turned on us, and made a deal with the Guild.
5=Garron: What? How could they ally?
4=Atreides: We have common interests now. Let me tell you the Harkonnen and Guild have allied.
3=Atreides: Sardaukar, your Emperor is dead. Therefore, House Atreides is not interested in fighting you.
2=What is going on? They... have turned on each other?
1=We're being overrun! We're being OVERRUN!
0=Guild forces: Today you pay, Imperial scum!

