Briefing=Our scouts have seen many harvesters Fremen that go to a base of the Spacing Guild. We know that the Fremen intended to offer large amounts of their precious spice to them so dear Sietchs remain hidden from our eyes.__They go through the following territory as it is the only devoid of worms, can bring their harvesting without running the danger of being devoured. Our base in the vicinity is small but sufficiently equipped for the next mission.__The harvesters won't go unnoticed. Build all vehicles needed to destroy all the harvesters while they try to go to the Northeast Passage, where a lot of Fremen are waiting them; avoid approaching this place at all costs.__Use Trikes to deal with infantry Fremen. Then attack with your Quads to quickly destroy the harvesters. No harvester must cross the territory.__Objective: Destroy the harvesters Fremen before they reach the Northeast Passage.

