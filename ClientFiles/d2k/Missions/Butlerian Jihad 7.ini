Briefing=ORDOS_======_After analyzing the remains of our tanks and, after the meeting with the Atreides, we have concluded that the artificial intelligence we equipped our factories has changed its original programming to join each other and fight against us.__All vehicles are being controlled by some artificial intelligence, completely absent from any crew. For this reason we have decided to give the name of "machines" to all those vehicles controlled by an AI, be it Harkonnen, Atreides or our own.__The Harkonnen are aware of the situation, so right now they are on their way to reactivate an old abandoned Harkonnen base with resources. Unfortunately an army controlled by the machines also goes towards the base to destroy it.__Settle down and build strength to protect the base Harkonnen and contain the enemy attacks until the Harkonnen reach. If you build a high-tech factory we will periodically send you reinforcements.__Don't capture buildings from the Harkonnen base, we need they to trust in us to fight together against the machines.__Objective: Defend the base until the Harkonnen Troops arrive. Don't capture Harkonnen buildings.__Secondary objective: Build the High-Tech Factory to receive additional reinforcements.

