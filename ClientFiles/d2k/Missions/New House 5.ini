Briefing=Alert Commander! Our base is under attack at this very moment. Somehow the Ordos have mocked our outpost and have infiltrated the territory without being detected.__If we act quickly we can still take control of the situation. Leave the base and flees to the north with the survivors engineers. Further you will find a Harkonnen abandoned base but in good condition.__Capture it and use it to eliminate the Ordos. Quick, before it's too late!__Objective: Capture the Harkonnen abandoned base. Then destroy the Odos base.

