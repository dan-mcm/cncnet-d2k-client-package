Briefing=The Ixians have made a distress call from the large ship of the Spacing Guild of Navigators as they are under attack from an unexpected enemy: the Bromeli. These had never done anything because they were a minor noble house, but now the circumstances have changed and they still hold a grudge against them for being the house of Ix better inventors than them.__The Bromeli have stolen all but two of the Ixian experimental vehicles and, as a show of their own strength, they are now sending several saboteurs to take down the last IX Research Centre and thereby destroy the plans for said vehicle.__The Lassoki are aboard the great Guild`s ship and ready to contact the Ixians. They will protect the Ixians from all the Saboteurs the Bromeli send out and then use the new vehicles to recover the other prototypes and eventually destroy the Bromeli`s structures in retaliation.__Objectives: Defend the IX Research Centre from Saboteurs. Then release the rest of the IX Research Centres to receive extra prototypes and finish off the Bromeli base.

