Briefing=SUMMERS' SOLSTICE 16: Adept Automata__MISSION OBJECTIVES:_1. Secure and protect at least one autofactory._2. Destroy the main Guild base on this deck._3. You must survive.__TACTICAL OBJECTIVES:_1. Secure and use a second Mass Deposit ASAP._2. Expand aggressively to snowball your invasion._3. Amass Sonic Tanks and RPG Quads for siege._4. Ignore harmless Spacing Guild infrastructure.__BRIEFING:_     Your Ordos friends have made their move and disabled navigation on the Heighliner. The ship's ADS cannons are online, however, and pummeling your scavenged scrap fleet. Another Freighter explodes ahead of you, the shockwave rocking your command shuttle, the flash blinding the bridge crew.__     You're on your own for this one. Moriaen's massing Combat Tanks on her Heighliner with impunity while hunting down dissidents planetside. Her success at either of these goals can't be allowed, so you and Summers have to fight her in both places at once. The Fremen and Sardaukar holdouts won't make it if you don't, and time is of the essence. That so-called God-Emperor the Dark Alliance is fighting for is quite real. If the abhorrent thing wakes up, you're dead.__     A direct hit snaps you into the moment as your vessel violently quakes. A pair of Guild fighters zooms past, brushing against the erupting flames. You're almost hurled out of your seat. "Status report?!" you demand from the navigation crew.__     "We're hit, Sir. Their broadside mass drivers tore through engines three and four. They're completely inoperable."__     You narrow your eyes at the Heighliner ahead and focus through the squeal of the alarm. A few hangar doors are open. An outpouring of reinforcements for the battle at Grose Valen obscures an important deck. You point and command, "Helmsman, take us through that way. Spearhead units, form up with my ship. Safeguard, get the rest of your 'thopters flying and cover our approach!"__     Several affirmative voices come over the comms as another explosion lights up the Freighter behind you. You watch your crew intently as the ship rattles and groans. They're having trouble controlling it, but you're nearing the hangar.__     It seems you won't get the chance to dock properly either. Not a moment inside the Heighliner, the unmistakable boom of a Storm Lasher's sudden strike almost flips your Freighter upside-down in the air. Another primary engine sputters and fails. Your boys are trying to slow your descent as much as possible.__     With painful force, your makeshift command shuttle crashes on the Base Platform and comes to a stop. Although you're lurched forward, you're held in place by your straps. You bolt upright and bark, "Go! Go, go! Get the Troopers onto the deck and clear out the Guild forces!"__     As the surviving infantry scramble out of the wreck, you hop into your thankfully-intact personal Duelist Tank and roll out without delay.
MissionNumber=16

