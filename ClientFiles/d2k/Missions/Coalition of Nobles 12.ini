Briefing=While the Iasi prepare a Frigate to leave Draconis IV, the elite group Qaii has just arrived in Caladan: the homeworld of the Atreides to rescue the second Leader of the group and are awaiting orders from the Lassoki Leader.__The Atreides take their work much more seriously with the assigned task. They have locked the Qaii Leader in a Modified Outpost turned Fortress that is surrounded by a large Atreides city, strong defensive measures and a high number of heavy vehicles protecting them.__The Qaii only count for this raid with their specialty: Light Vehicles. While they are cheaper and more maneuverable than Heavy Tanks, they cannot be engaged in open combat against them without taking excessive casualties. They also run the risk of killing their Leader during the crossfire.__Leader Lassoki is aware of these problems, but he has the solution. Throughout the territory there are several areas of civilians living under the protection of the Atreides. A direct attack on civilians is sure to get the attention of the Atreides.__The first step comes to explore the territory with fast Qaii vehicles and locate the five civilian settlements. Eliminate the militia that is protecting them and destroy any structure that is inside. As soon as the Atreides are alerted the Qaii will withdraw from the area.__It is possible that the various civilian settlements contain some unmanned vehicles inside. It is more than certain that there are harvesters and other stored vehicles that will be usefull.__The Atreides do not have an army large enough to simultaneously protect the five settlements as well as their own base. So as soon as their entire army is too busy protecting civilians, it will be the ideal time for the Qaii to attack the Atreides city.__Once the defenses of the city have been passed, it will be enough to destroy the Modified Outpost and wait for the extraction Carryall. Destroying the city is not recommended due to the amount of resources the Atreides have and how quickly they can replace lost structures.__The biggest challenge for the Qaii is fighting against the technological superiority Atreides, so they will build an Ixian Research Center in order to gain access to the enhanced Ixian Raider that will complement their army.__This area of ??Caladan is open enough for Qaii Light Vehicles to move freely. Building is not a problem either, although the roads will delimit the possible area in which to build. These roads also interconnect civil settlements, the Atreides city and other places of interest.__In Caladan gold can be collected, a resource that is very easy to handle and easily convertible into ingots that will increase the economy of whoever collects it quickly. However it is a limited resource and should not be wasted (Read intel for detailed information).__Objective: Destroy the Modified Outpost and protect the Leader until the Extraction Carryall arrives.__Secondary objective: Destroy each of the five civilian settlements to divide the Atreides army and to receive a Harvester and some additional light vehicles.__Tips: Carryalls will help Harvesters travel to remote areas. Roads serve as guides to easily explore and find the location of civilians. Have units ready in the vicinity of the prison, as the leader can be eliminated by the enemy infantry that appears when the building is destroyed.__Notes: Only Qaii Light Vehicles are found on this planet. Without the possibility of building other types of factories or owning your own Infantry.

