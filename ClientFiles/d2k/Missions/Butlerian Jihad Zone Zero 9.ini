Briefing=ORDOS_=======_The Harkonnen believe they eliminated me. The Cyborg they destroyed was just a decoy. Neither Atreides nor Harkonnen know anything about our plans. I have had time to adapt to the Artificial Intelligence. Now I can control the Machines efficiently. That is beneficial.__The Harkonnen and the Atreides have fought against Mercenaries and Ixians. We are the architects of the Artificial Intelligence. Now they know it. The Fremen have told them. It is too late for them. The spice overflows our silos. We are ready to fight any enemy. That has been diligent.__You will give orders to our army. I control unmanned vehicles. I will produce heavy combat vehicles incessantly. Synchronize your offensives with mine. My Heavy Factories should not be neutralized. That is necessary.__All Atreides and Harkonnen forces are here. They are everywhere. They transport units between their two bases. Avoid our destruction. I will send you some reinforcements as soon as possible. Destroy the bases to the North and South to stop the enemy reinforcements.__Prove that the Machines are the future.  Overcome our enemies and we will conquer all of Dune. No one can stop us. Annihilate all our enemies. That is the mission.__Objective: Destroy the bases of Atreides and Harkonnen. Heavy Factories under the control of the Mentat must remain operational.__Secondary objective: The destruction of the bases to the North and the South will block the routes of enemy reinforcements.__Tip: The terrain configuration can favor your defenses using defensive turrets, you may need it to block incessant enemy attacks.

