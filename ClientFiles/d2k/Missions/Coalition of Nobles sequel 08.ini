Briefing=Numerous Frigates have been detected traveling to a Smugglers' Starport, near Qaii territory. The Lassoki suspect that the Tleilaxu are attempting to infiltrate Arrakis again, so they have deployed a preliminary base and sent a team to investigate.__The Lassoki discovered that it was not the Tleilaxu, but a new unknown vehicle that they have been given to the Qaii and that they store in the same territory of the Smuggler Starport.__The Lassoki fear the worst and, after all that has happened with their former allies Iasi and Bromeli, they have decided that they are not going to take risks and that they are going to fight openly against the Qaii, even if that means dissolving the Coalition of the Nobles definitively.__The Qaii warehouse doesn't have a Barracks or a Heavy Factory, so expect it to use the new vehicle en masse against the Lassoki. Luckily for them, they won't be able to replace Harvesters they lose quickly, and furthermore, if the Ixian Research Center is destroyed, the Qaii will only be able to build their most basic vehicles.__On the other hand, the Ixians have been pleased by the Lassoki's actions against the Bromeli, so they have given them this new vehicle they call "Flame Tank" so that they can build it in their factories. The Lassoki know that this vehicle can counter the Qaii's new weapon.__Objective: Destroy the Qaii.__Secondary Objective: Destroy the IX Research Center to stop production of the new Qaii vehicle.

