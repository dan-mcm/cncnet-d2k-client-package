Name=Butlerian Jihad - Mission 9
Author=Cm_Blast
SideId=1
Briefing=HARKONNEN_===========_So the Emperor is responsible for all this, huh? His plan was to destroy the three great Houses using our own Artificial Intelligence against us, but he has not foreseen that we would collaborate to fight together.__We have discovered where is hidden that rat, protected by his beloved machines, but that will not save him from our wrath. You have at your disposal all the money from our coffers for this final battle.__Atreides and Ordos have gone ahead and already have a base prepared, while we have only been able to deploy ourselves in a smaller area, without coverage and something far from our allies.__All the Cyborgs we have come across are built in this place. The machines have factories everywhere and, thanks to the presence of the Emperor, they are more coordinated than ever.__It is to be expected that the Emperor will direct his efforts against us because we are the easiest prey, or that is what he believes. With the resources that we have provided you should be able to raise numerous defenses quickly to counteract the initial assaults of the machines.__Destroy all the machines that stand in your way but do not lose sight of the Emperor: he is the main target. Without the Emperor the machines can no longer be controlled and we will have won the war.__Ahead. The future is ours commander; We will talk about the Butlerian Jihad and how the Harkonnen were the architects of the victory!__Objective: Destroy the Emperor.__Secondary objective: Build the Starport to receive additional forces.__Tip: Build turrets as soon as possible will help in the defense.

