Briefing=Tyle managed to reach the Ordos capital and get to the palace. The Executrix is waiting for him, along with Lora.__EXECUTRIX: Executor, your recent performance is above expectation. Your efficiency has been noted. That is good. Now we must prepare for the Tleilaxu siege. They are already launching several attacks on the capital's outskirts. That is a threat. We must set up defences immediately._TYLE: I do not have a lot of men after the previous battles. I would require control of the capital's defences and forces to be able to command them._EXECUTRIX: That is not granted._TYLE: But... your excellency?_EXECUTRIX: We shall command the capital's forces directly. You shall take control of our Arrakis forces. You'll get control of the Arrakis forces already landed here and the ones who are en route and preparing to land. You shall set up a base outside the capital and provide support to the defence. That is the directive.__Transmission closed...__TYLE: What is this? They won't give me command of the capital, but expect me to defend them with as few men as the Arrakis force is composed of?_LORA: I guess they are pretty paranoid, especially after everything that happened lately. They don't want to risk a possible defection on your side._TYLE: Why the hell would I defect after busting my ass to get to the capital and help them?_LORA: They work on probabilities. There is a chance they might be aware of your stupid intentions._TYLE: So you mean they spied on us?_LORA: I cannot tell. They could simply be paranoid. It is not strange for the Executrix to be like that._TYLE: So... I'll take a small number of men and pretend I can defend a capital from a massive assault._LORA: You'll get command of an MCV. Deploy a base and get some troops. You'll get constant reinforcements from Arrakis if you get a Starport. As for manpower, we have quite a considerable amount of troops returned from Arrakis here that you can take command of immediately._TYLE: Tell me about the situation in the field._LORA: The Tleilaxu are launching attacks on the capital outskirts. They are trying to destroy our energy reserves and the spice silos. By the looks of it, there is no way to stop that anymore. We must retreat inside the capital and defend the Palace. The Executrix must not fall._TYLE: You know, they're lucky this is the damn Tleilaxu who are attacking them. Otherwise I'd think twice of this defence._LORA: And who's gonna pay you that crazy amount of money then?_TYLE: Don't think that crazy amount of money is of any use while dead._LORA: With their supply lines ruined, the Tleilaxu are quite weak, actually. They are forced to attack earlier, before their full force is here, due to lack of resupply. Once the initial assault is dealt with and your base is up and running, with your experience and the vast amount of defences the city has, it should not be very hard to destroy all the Tleilaxu besieging forces._TYLE: So you say their position is weak?_LORA: Yes. They have a working Axlotl Tank cloning Sardaukar and Fremen. That should be destroyed asap to reduce the amount of attacking troops. Remember, you have quite some time before the enemy will breach through the dense defences of the capital, so you have plenty of time to set up your base._Remember, keep that Palace intact if you want us to get paid. I'm counting on you.__==========_Objective: The great siege of Draconis IV. The threacherous Tleilaxu have reached the capital, and are laying siege, preparing for an assault. The cut of their resupply lines is forcing them to assault the capital sooner than they would have wanted to. This gives us the advantage of less enemy forces to deal with. The Executrix won't trust you to command the capital forces themselves, so you'll have to get your own forces rolling. Use the MCV to set up a base, and take advantage of the fact that your location is literally unreacheable by the enemy, due to the dense lines of defense of the capital. You have more than enough time to prepare an army. Do so. Remember, you must keep the Palace intact at all costs, the Executrix is inside. That if you want to get paid. The outer lines of defense will be overrun at some point: ignore them, your focus is the Palace. As long as you can fortify around it, you're good to go. If you want to reduce the number of enemies, consider taking out the Axlotl Tank cloning enemy Sardaukar and Fremen as soon as possible. Remember: you must destroy all Tleilaxu structures to relieve the siege on the capital. Arrakis heighliners are on the planet's orbit. Setting up a Starport would allow them to deploy and reinforce you.
