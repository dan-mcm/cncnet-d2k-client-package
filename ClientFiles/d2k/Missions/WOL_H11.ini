Briefing=LOCATION: Harkonnen Palace, in Harko City, Harkonnen Capital_========__Feyd and Radnor managed to reach Harko City in one piece. As they have expected, most of the enemy force is located outside Harko City, sieging the city. The Baron called for an enmergency meeting with Feyd and Radnor.__BARON: Gentlemen, you could see them all outside the city. The siege has been going for days. But so far, they've only used artillery and Death Hands._RADNOR: How did Rabban get his hands on some Death Hands?_BARON: General, Rabban might be a very bad tactician and might be pretty stupid, but he has... relations. Many of them. He is that kind of guy that is so stupid that he just gets a lot of friends because of that. Lots of friends who used his position to gain certain favors. And now, it is time for those friends to help him get my throne, so that they can be the lap dogs of the baron. Some of those were people responsible for our Death Hand production._FEYD: Is there anything else Rabban has that is a problem?_BARON: A good position and many mercenaries and haters who cannot wait to see me dead. So yes, he has._RADNOR: My lord, we were able to get his plans. We have a pretty good picture of his siege tactics. They will assault the city from 5 different angles. It is not a bad plan. But because of this, his troops will be spread thin. _FEYD: This means that, while he will be able to pack a punch, when it comes to defense, he will be weak. If we can repel his initial assault, we will then be able to consolidate our position and easily pick and destroy each and every single base that he deployed._BARON: I will be waiting in the Palace. It is safer here. Whatever you do, don't let them destroy the Palace. Don't let him kill me. You have no idea about the rewards I will give you. Feyd, you will be my heir. And not just that, I'll make you a happy man. General, you'll have all the wealth in the world. Women? Name them and they'll be yours. Want a nice house? Name the region and it will be yours. Whatever you want. Don't like this shithole wasteland of a planet? I'll give you a fief on Lankiveil, the planet my brother administrates in the Harkonnen name. Anything you want. I want to reward your loyalty._RADNOR: I appreciate your generosity, my lord._BARON: Let me know how it goes. I'll wait here.__Baron leaves the room.__RADNOR: This won't be easy, my lord._FEYD: I am aware. It's the terrible position we are into. He surrounded us._RADNOR: Harko City is pretty well defended. It's not impossible, but we must be flexible. We must cover all 5 angles. _FEYD: I will try to handle the south opening. My forces are not very numerous, but we might be able to hold them off for a while. Might need help, though. You will command all the forces in Harko City. You'll get full control over the factories and the entire base. We need someone with your experience now, and I am man enough to step back and let you handle this._RADNOR: Understood.__Incoming transmission...__RABBAN: Ahhh. My little brother and general Radnor. Exactly the two people I was looking for. How's life going?_FEYD: You fool. You have no idea what you've done. _RABBAN: ARE YOU AFRAID, baby brother? You've wanted that throne, there you go, you're this close to get it. Unless... I kill you all. Doesn't that sound amazing? My father did not officially make you the heir anyway, so... if he dies, guess who's gonna be the baron?_FEYD: IF. You always believed you're so cool, Rabban. But IF does not mean he will die._RABBAN: I'll let you play the good son, acting as if you really cared about our father. I will show my true colors and get rid of both him and you. Did you see all the forces I was able to gather? There are so many people who are sick of our father. The failed invasion of Caladan is something all these people are ashamed with. And I am the only one who had the guts to tell our father that he was wrong. I DESERVE TO BE BARON, NOT YOU. Baby brother._FEYD: Knowing when to shut up and when to talk is a skill a baron should also master, brother. _RABBAN: Oh, clearly. But now, I am the one who's talking, and soon, you'll be the one who doesn't. Forever. General Radnor, I am giving you one chance to join me and the rest of the unpleased people into a new era. A glorious golden age for House Harkonnen. Without old men ruling with an iron fist._RADNOR: With a young man ruling with an iron fist then?_RABBAN: A YOUNG SMART MAN RULING WITH AN IRON FIST. That is me, general. You see everything I was able to accomplish. I am sieging Harko City as we speak, with an army I built myself. Everyone called me an imbecile, a weakling. Well, there you go. C'mon, general. You can choose to be on the right side of history.__Right side of history. You fool, if you fail this assault, you're doomed. You haven't even breached Harko City's defenses yet, and you think you've already won. Sieging a city is easy, taking it is another story. You fool_.__RADNOR: I will have to deny your offer, Rabban. _RABBAN: Oh really?_RADNOR: Yes. As you said, I want to be on the right side of history._RABBAN: GREAT. Then I will kill you all, slowly and painfully. General, I'll make you suffer in ways you could not imagine.__Transmission ended...__FEYD: Loyalty. Definitely not a Harkonnen trait, as we can all see._RADNOR: I am loyal to the people who can give me what I want, and to the people who can make my life, as a military person, a better life. It's not the kind of Atreides loyalty, it's the kind of "what I need and who can give that to me" loyalty._FEYD: Good. The Atreides kind of loyalty makes me puke. __==========_Objective: Harko City is under siege. The Baron has retreated in the Palace. You will take control of 98% of Harko City and prepare the defense. Feyd will try to cover the south side with the 2% that is left of our defenses. There are 5 angles from where Rabban is preparing a constant stream of attacks. You must ensure that all 5 angles are secure. Once done, the rebel bases can fall easily, as their defenses are not remarkable. Punish them, general. In the name of House Harkonnen. Destroy all rebel bases. Tactical map available, press the button to view it.
