Briefing=SUMMERS' SOLSTICE 05: Meat Grinder__MISSION OBJECTIVES:_1. Prevent the destruction of the Ix' Research Center._2. Evacuate your forces with the rescued research._3. Failing that, destroy the Harkonnen base._4. You must survive.__TACTICAL OBJECTIVES:_1. Use the Repair Pad to maintain your armored units._2. Ferry Harvesters around Gara Kulon with Carryalls._3. Eradicate or avoid the notoriously territorial locals.__BRIEFING:_     To say your predicament is precarious is to say the very least. You find yourself not one klick south of a massive Harkonnen factory complex, tasked with a mission of utmost importance for the Ordos.__     If played correctly, this will amount to no more than a simple extraction. If you could only contact the Ix elsewhere in Gara Kulon, you would be able to seal the deal. The Ordos' tech will be secured. You'll have your money and, perhaps, a case to make to Sumadi for formally allying with a like-minded Great House.__     Your associates, Sumadi included, are standing by with your escape. They await your call. Though Sumadi had no complaints about your commandeering of his tiny post in this region, it's more than likely he's doubtful of your plan for it.__     The transmission screen bursts into light without warning and Krillys looks back at you. "There is a plot brewing. The Ordos have sent a contact to reach a nearby Ixian base. They're developing prototype weapons for the Ordos. Once you assist us in destroying it, you will be allowed to leave Gara Kulon."__     "How?" you ask, stopping yourself short. How do they know? You manage to maintain an innocuous expression and tone.__     "Scout the desert for Ordos Raiders and mine Spice for us," Krillys replies, eyeing you suspiciously. Then again, that is his default appearance - suspicious. "I'll crush the Ixian base in the meantime."__     "Very well," you lie, and the communication link is promptly closed.__     You brush a hand nervously back over your forehead and through your hair. This is bad. Should the Harkonnen destroy that Ixian base, any number of unfavorable things could happen. They could capture the technology intended for the Ordos. The Ixians could lose their progress, the deal would be off. And the Harkonnen have enough firepower to stomp you into the sand many times over. That's probably why Krillys doesn't care to keep his knowledge of the project a secret. An enormous mistake if your escape goes as planned.__     As a mercenary commander, you have worked with Kailea Aurelianus before, usually in conjunction with Sumadi and his smugglers. She knows your prowess in battle and trusts your skill. She is expecting you, and for some precious moments, the Harkonnen are expecting the Ordos. For those precious moments, you can reach the base and save the research... but you have to intervene soon. You will never get the opportunity again.
MissionNumber=5

