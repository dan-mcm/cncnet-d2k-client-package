Briefing=BARON: Listen, everyone... Something happened. Not sure what, but those retarded Mutelli started attacking us. They blame us for whatever stupid incident that happened on a Guild heighliner carrying more troops to Caladan. They are blaming us and House Moritani for some attack against their troops. There is also some sort of leaked secret intel about whatever the hell of a bad thing the Moritani have done against the Mutelli..._FEYD: Father, I cannot understand. What does this have to do with us?_BARON: Those fools believe we're supporting the Moritani. They gave me an ultimatum: forced me to turn against the Moritani if we are to keep the alliance with House Mutelli. HOW DARE THEY FORCE MY HAND AND BLACKMAIL ME?__Radnor looks away with disgust. "Great campaign, your majesty. We're stuck on Caladan, surrounded by Atreides thopters, bombarded by their Cruisers on the shores, with House Ginaz on our ass and now, besides all these, our coalition has broken down and the Mutelli want our head as well. Amazing campaign."__FEYD: And you... refused?_BARON: OF COURSE I REFUSED. Would you rather have the weak and useless Mutelli on your side, or the Moritani? I'd take the Moritani any day._FEYD: But the problem is that... well... without House Mutelli, and with House Ginaz on the Atreides side..._BARON: You know what, Feyd? You know what, smart ass? Lemme give you even more concerning news, if we're at it. Besides everything you said, let Piter give you one more funny thing to think about._DE VRIES: It seems princess Irulan is... actively getting involved in this war._RADNOR: What does this exactly mean?_BARON: It means she sent her Sardaukar here, on Caladan, to help out HER BELOVED Leto. SCREW HER, SCREW THE CORRINOS, SCREW THE ATREIDES, SCREW EVERYONE!_FEYD: This is bad. Even the Sardaukar... and we lost the Mutelli as well. Did Leto...?_BARON: No. He did not ally with the Mutelli. We're lucky the idiot has too much of a pride to do that. If he was smart and allied the Mutelli..._RADNOR: With all due respect, my lord, even without the Mutelli, the Atreides have become..._BARON: UNSTOPABLE? C'MON, GENERAL, SAY IT!_RADNOR: YES, my lord. Yes. We should be fools to say otherwise. It is so obvious that even a 3 year old kid could figure it out by now._BBARON: It is so obvious that even my stupid son Rabban could. By the way Feyd, where's your brother?_FEYD: I have no idea, father. I haven't seen him in days._BARON: WHAT DO YOU MEAN YOU HAVE NO IDEA? Didn't he help on Caladan?_FEYD: I don't know where he is. He just disappeared. Father, is anything wrong on Giedi Prime?_BARON: It could be. I got ... disturbing news. Some idiots believe there is some sort of rebelion being prepared._RADNOR: Rebelion? Led by who?_BARON: If I knew, General Radnor, we wouldn't be having this discussion. Besides, I'll be honest with both of you: you must return to Giedi Prime. Immediately. The campaign on Caladan is over. But before you go, I want to pay one to those stupid Mutelli. One that they won't ever forget. A Harkonnen must always pay their debts, right?_DE VRIES: I have analyzed the maps. There is a small Mutelli base close to our perimeters. We used to have that region fully covered together with the Mutelli and Moritani, but now, that the Mutelli turned on us, we are split from our Moritani allies. And to make things worse, the Atreides, Ginaz and Irulan's Sardaukar are setting up to take over the region._BARON: Is that Atreides general Halleck there?_DE VRIES: No. We're lucky that he's busy recapturing the rest of the continent. His goal is obviously Horizon. And this region is right in his path. That's why you must hurry, destroy the Mutelli and leave._RADNOR: What do you mean "lucky us" ? Do you believe I am afraid to face that Atreides hero who is supposed to have recaptured most of Caladan by himself? I conquered most of Caladan._BARON: BUT NOT BY YOURSELF. Listen to me, General, this is totally not the time for ego battles. You will destroy the Mutelli and then retreat. Leave the rest of our commanders there. They will be the perfect distraction for the Atreides troops marching towards Horizon. The ultimate Atreides objective is to recapture Horizon, our last stand. You and Feyd will return to Giedi Prime as soon as that Mutelli base is gone. I need you here, I am afraid... something must happen._RADNOR: ... Very well, my lord.__Transmission ended...__FEYD: Well, I guess we should... move? From what you've heared, time is not on our side._RADNOR(angry): "Not the time for ego battles" ? Then what about his will to destroy this Mutelli base just for showing off?_FEYD(laughing): Well, can't really argue with your point. You really want to meet Gurney Halleck in battle, don't you?_RADNOR: I want to see why is everyone praising that guy so much. And I will, one day, certainly meet him._FEYD: Maybe sooner rather than later, if we don't move. As you heared, he's closing in, and even if that would be your dream, to meet him, I don't think that being so outnumbered would be a great way to measure your skills against his._RADNOR: Very well. Let's move. But before... where's your brother?_FEYD: Did you decide to be on my side?_RADNOR: Does the answer to my question depend on my answer to your question?_FEYD: Hmm... perhaps. (laughing)_RADNOR: Listen. I like smart people, and besides, I also like people who don't run from a fight. So yea, if I'll have to pick a side, I'll side with you. Providing that you'll give me what you promised._FEYD: Wealth... women... Tleilaxu... Whatever you want, my friend. You can trust me. Having a general of your skill on my side is worth all those. Regarding my brother... from what my spies, or, excuse me, his "friends", informed me, he's on Giedi Prime._RADNOR: What? How? And what for? We were in the middle of an invasion..._FEYD: It's simple: he has to create a civil war.__==========_Objective: The situation looks bleak. For unknown reasons, House Mutelli has decided to declare open war against the Moritani and we had to pick a side. We picked the Moritani, obviously. However, the arrival of both House Ginaz and House Corrino on Caladan, to help House Atreides, has turned everything upside down. The Baron wants one last show-off before retreating back to Giedi Prime: destroying a Mutelli base. Those idiots must be taught a lesson: you do not turn on the mighty House Harkonnen. Remember, though: the Atreides war hero, General Gurney Halleck, is approaching your position. You are not to destroy the Atreides. Focus on the Mutelli base. Once it's destroyed, you and Feyd must retreat and leave everyone behind to cover you. A heighliner will be awaiting you, for a transport back to Giedi Prime. Be advised: the Atreides, Ginaz and Sardaukars have a small cease fire deal with the Mutelli. However, if you can make them attack each other, this could help your task a lot. This won't be easy: you are surrounded by enemies, and plenty of them. This is your last stand on Caladan: make it worth. Tactical map available, press the button to view it.
