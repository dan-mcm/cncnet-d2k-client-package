3=De Vries: Be advised, general. Irulan's Sardaukar will assist the Atreides.
2=De Vries: General, I might have concerning news. You must destroy the Mutelli and immediately withdraw your forces.
1=Moritani Commander: We'll try to take care of the Ginaz forces. You must handle the rest.
0=Mutelli Commander: Harkonnen scum. Your betrayal shall not be forgotten!

