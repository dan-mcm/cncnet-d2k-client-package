Briefing=HAWAT: My lord, our recent reports are indicating that Tleilaxu forces are heavily retaliating all over Arrakis. It seems recent attacks from Harkonnen and Ordos forces on Tleilaxu artificial spice facilities have made them extremely paranoid. _DUKE: What about House Richese? What is their allegiance?_HAWAT: It seems the things Count Richese said in the Landsraad meeting were not just words. The Richesians have declared an all out war against House Ordos. They are fighting against the Ordos troops all over Arrakis._DUKE: Are the Richesians helping the Tleilaxu, Thufir? That is what I am interested in. I don't care about their conflict with the Ordos._HAWAT: They are.. to some extent. I don't think House Richese wants to get against the Landsraad, but they are fighting with the Ordos... So they are somewhat helping the Tleilaxu, just not directly._DUKE: Of course, then. The clasic plan. They are acting as if it's the kanly with the Ordos, but also aiding the Tleilaxu indirectly._HAWAT: We are sure, however, that the Richesians are providing spice refining machines for the artificial melange._DUKE: They might not want to associate themselves with the Tleilaxu till the end. At the moment, with most of the Landsraad, or at least all powerful Houses from the Landsraad, against the Tleilaxu, I assume House Richese is smart enough to realize their alliance with the Tleilaxu is dangerous for themselves, and that it puts them against the most powerful Houses of the Landsraad._HAWAT: Definitely, my lord. They are not stupid._GURNEY: If they are retaliating, it means they have enough troops to fight even without Richesian aid._HAWAT: They have gholas. Tons of them. And they are smuggling a lot of vehicles._GURNEY: I asked my smuggler allies, they are not selling services to any Tleilaxu master._HAWAT: Probably they are helped by the Guild and by some other smuggler groups you don't know of. Nonetheless, the threat is there. It might not be as difficult as it was to defeat Shaddam and the Guild, but our army is extremely damaged from all the wars. Our numbers have decreased considerably._DUKE: We must strike them while we still can. This artificial melange substance must be destroyed as soon as possible. Otherwise, it will destabilize the entire Imperium. Everyone knows that, even the Harkonnen and the Ordos._GURNEY: I can't fight side by side with the Harkonnen again. _DUKE: There is no need to. At least not for now.__Incoming transmission...__IRULAN: Duke Leto, my Sardaukar are pinned down near Sihaya Ridge. They are under heavy fire from the Tleilaxu. We have a base there, but my bursegs believe it cannot stand for much longer on its own._DUKE: We will send help, your highness. House Atreides is willing to cooperate with House Corrino directly, to resolve this matter._IRULAN: And House Corrino is willing to accept your proposal of direct cooperation, Duke Leto. Be aware, though. There are Ordos forces in the region. My Sardaukar told me they are fighting the Richesians and that they have hired some mercenaries to help them. It would be wise to ignore both House Richese and House Ordos. They are not getting involved in our conflict for now._DUKE: Did you copy that, Gurney?_GURNEY: Crystal clear, sir. I'll ignore the Ordos weirdos as much as I can. But if they get in our way..._IRULAN: The Ordos mercenaries are very close to my Sardaukars' position, general Halleck. If the mercenaries attack my men, I am asking you to aid them._GURNEY: I will, your highness._DUKE: Thufir, establish a comm link with Count Dominic Vernius._HAWAT: As you wish, sire...__Transmission established with Count Dominic Vernius.__DOMINIC: What is it, Duke Leto? Always a pleasure to hear you, my friend._DUKE: My friend, I have heared that you deployed some troops on Arrakis._DOMINIC: Indeed I have. But we are still in the early stages of deployment._DUKE: You insisted I tell you when we are going to attack the Tleilaxu directly, so you can join. Time has come, my friend. You can get your revenge._DOMINIC: Excellent! Just send me the coordinates. I will move a Starport in that region. My troops are still being deployed, but we will move the deployment zone towards where you request us to.__==========_Objective: The Tleilaxu forces are scared. Out of desperation, they are retaliating against Landsraad attacks. Your task is to defeat them near Sihaya Ridge and put an end to their pathetic offensive. Intel reports Ordos and Mercenary forces are fighting against Richese troops. All these factions can be ignored for now. Focus on the Tleilaxu. Also, Count Dominic Vernius has been kind enough to send us help through their Starport. Protect the Ixian Starport at all costs. Combine with Irulan's Sardaukars and crush the Tleilaxu.
TextUib=WOL_Text.uib

