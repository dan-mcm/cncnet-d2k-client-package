Briefing=LORA: Took you some time. I was afraid you won't make it in time, Norman. You know the Executrix do not tolerate being late. Efficiency._TYLE: Yea, I know. I was late because your extraction team was also late. But nonetheless, everything went fine, except the crazy sounds of the Harkonnen betraying the Atreides in the middle of the battle._LORA: It must have been pretty entertaining._TYLE: So many screams... Such a Baron-ish move. I'm surprised Leto didn't see it coming._LORA: Of course he did. It's just that the Baron was faster in implementation._TYLE: I'm assuming you started an analysis on the level of impact this operation had on the Atreides army._LORA: I did start one, it's in progress. However, reports are showing relatively heavy Atreides retaliation beginning to form. They were taken by surprise, but obviously, as soon as the confusion is over, the Atreides have more than enough power for a strong retaliation.__Establishing connection... Draconis IV up-link ready...__EXECUTRIX: Executor, your performance is acceptable. The objectives were fulfilled with minimal resource investment. That is good. Now it is time to proceed with the next step for P-V4. Most of the executors have gathered the required spice. Those who failed have been punished accordingly. That is a fact. We will use the spice to hire mercenaries._TYLE: But most of the mercenary companies on Arrakis were destroyed during the Spice War, by ourselves._EXECUTRIX: Most does not equal to all. There are still a few companies who are eager to fight, for the right sum. Which we do posess. That is power. You must find a mercenary company and employ it. The lower the cost of employment, the more efficient it will be. That is wise. However, the Ordos Cartel will allow you to spend more on a better mercenary company, if critical success in the next missions is ensured. That is a requirement. Once a mercenary company is hired, you must flatten the costs by getting back some of the investment. You will receive a designated sector on Arrakis, which is relatively lightly defended. You will deploy and harvest spice. Your quota will depend on the cost of mercenary forces. That is the directive.__Transmission ended...__TYLE: Great, so we destroyed most of the good mercenary companies in the war, and now they want to hire mercs again._LORA: Never question the Executrix._TYLE: Oh, for real, they really turned you into a machine._LORA: You are lucky there are no soldiers around and you can speak heresy like this. Your words are dangerous, if heared by the wrong person._TYLE: If we cannot trust each other... Then who can we trust?_LORA: You don't have to worry about me, but about others who might be listening. You can never be too safe._TYLE: So how about those mercs?_LORA: Don't worry about the mercs, I have a few contacts. I know a commander, he has some very efficient men. Also, he has contracts with Smugglers and even the Guild for vehicle delivery. They are pretty powerful._TYLE: And pretty costly as well, by the sound of it._LORA: Precisely. But based on my calculations, it is worth it. You'll have to harvest about 35000 solaris worth of spice to cover these expenses, as per Executrix's directive._TYLE: That ain't a small quantity._LORA: You'll manage. Stop complaining. I've sent you terrain data and other intel we have on the region. I'll proceed with the Mercenary employment for you, so all you really need to worry about is getting the job done. I'll pay for heavy assistance from them, including smuggled starport deliveries on their side. That should be more than enough to deal with the enemy. Who is, by the way, represented by the Atreides and the Sardaukar._TYLE: Do you mean... like... together?_LORA: Yes. It seems Leto has agreed to some sort of temporary alliance with Sardaukar forces after the Harkonnen betrayal. They are protecting the remaining Sardaukar forces on Arrakis. Spies also reported that the Supreme Bashar of the Sardaukars has returned on Kaitain and talked to princess Irulan about the situation on Arrakis._TYLE: So Irulan is getting involved?_LORA: Most likely NOT directly. She is a politician more than a war-minded person. I highly doubt her priority is war directly. However, if Leto is helping the Sardaukar, there might be some sort of Atreides-Corrino pact that we are not aware of._TYLE: That doesn't sound very fun for us._LORA: The Executrix is aware of this possibility. They ensured me that a plan is being prepared. Also, we're expecting a Landsraad meeting soon, to try to stop the war and stabilize the empire. Also, probably to decide what should be done with the vacant throne. As you know, for now the Imperium doesn't have support for a female heir. And Shaddam had only daughters._TYLE: So Irulan might want the throne..._LORA: Most likely. I doubt she would rather have it slip away from House Corrino after hundreds of generations. The problem is: most of the Landsraad would actually prefer that. Including us._TYLE: So the Executrix is planning on potentially getting the throne?_LORA: Potentially is the key word here. That does not have very high chances of success, even if a vote will be casted at some point. We are not really the most popular House in the Imperium._TYLE: Yeah, I wonder why..._LORA: The Executor has an alternative plan to get the Ordos back in power. Just go do your thing, and stop worrying._TYLE: We know each other for a long time, Lora, and I am sure you know more than you're telling me. What are you keeping away from me?_LORA: You'll find out when you get back, if you're successful. Take it as a reward, love. Now go!__==========_Objective: P-V4 is the Executrix idea of a restoration of the Ordos power, as it may seem. This requires you to harvest more spice, to ensure our recent mercenary investments don't hit us so hard. That is really all you have to do: get 35000 solaris worth of spice. The recently employed Mercenaries will help you against the combined Atreides and Sardaukar forces. It seems they have some sort of temporary mutual protection treaty on Arrakis, and they will stand in your way. Let the Mercenaries deal with them. You must gather your quota.
