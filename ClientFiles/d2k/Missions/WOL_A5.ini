Briefing=Time has come for the Landsraad council to reunite and discuss the future of the Imperium. As requested by princess Irulan Corrino, the CHOAM will be neutral moderators of the discussions. The Spacing Guild is attending the meeting as well, however they are expected not to intervene very much, after the humiliating defeat they have suffered on Arrakis. The meeting is taking place at the imperial palace in Corrinth, Kaitain's capital city. __Gurney remained on Arrakis to make sure nothing bad happens while the Duke is away, along with Duncan Idaho, while Thufir Hawat joined the Duke on Kaitain. The meeting will be made public to royal House advisors, therefore both Duncan and Gurney will be able to watch it live. While Duncan is away, receiving instruction from Hawat, Gurney is opening the coomm device to watch the meeting.__Gurney can already see that most of the Houses have attended the meeting. Besides the obvious most-expected guests, Atreides, Harkonnen and Ordos, Gurney remarks other Houses, like House Ginaz, House Moritani, House Vernius of Ix, House Ecaz, House Richese, House Hagal.__The CHOAM representative starts it all:__CHOAM rep: Welcome, Great Houses of the Landsraad, princess Irulan of the imperial House Corrino, and Spacing Guild members. I am Hasimir Nair, and I represent the neutral side of the CHOAM, the side with no directors from the Landsraad. Her highness, princess Irulan Corrino, entrusted me to keep these discussions civilized, and towards an end goal: finding a solution to the instability of the Imperium at the current moment. As you might know, the war on Arrakis is still continuing. At a smaller scale than it used to be before emperor Shaddam Corrino IV was killed, but there is no peace in the Imperium at the moment. Our intent is to finalize all the conflicts and sign a peace treaty. The three Great Houses that fought on Arrakis are actively skirmishing all over the planet as we speak. A continuation of such battles is affecting not only the stability of the Imperium, but also the spice. And you all know it, the spice must flow! _BARON VLADIMIR HARKONNEN: Excuse me, representative Hasimir. What is it that you propose to ... stabilize the Imperium again? I am a very busy man, i have more than one planet to rule._DUKE LETO ATREIDES: Of course, the renowned Harkonnen manners, interrupting the man speaking just to add nothing of value._BARON: And there is the Atreides insolence, interrupting me just to add nothing of value._HASIMIR: Duke Leto, Baron Vladimir, please. We are here to discuss terms for peace, not to quarrel._BARON: Peace? With the Atreides? Have you lost your mind? This is kanly. Vendetta. It cannot end just like that._HASIMIR: The Imperium requires the war to be terminated. We are all suffering because of what is happening on Arrakis._DUKE: Excuse me, representative Hasimir. But House Atreides is not willing to give up anything to the Harkonnen. We have fought for too long for Arrakis. _IRULAN: Duke Leto, Baron Vladimir. The war is pointless. It was part of a spice competition issued by my father. That competition is no longer in effect. You are fighting for nothing._BARON: You can thank your father for this mess, princess._HASIMIR: Baron Harkonnen! Please, you are talking to a lady, and also, to the princess of House Corrino._BARON: Well then, excuse my... insolence. Princess Irulan, House Harkonnen has invested tremenduous amounts of resources and solaris into this war. Are you honestly expecting me to just withdraw my forces from Dune and let it be governed by some Imperial representative again? Not to mention, House Harkonnen was the governor on Arrakis time ago, before stupid spice games were created by smart emperors._EXECUTRIX: This is the Executrix of House Ordos. Our interests do not coincide with the proposal of the CHOAM. House Ordos must control Arrakis. That is the directive. House Ordos is not willing to share spice production with their enemies. That is wise._DUKE LETO: Princess Irulan, if you have a proposal, by all means, we are all listening._IRULAN: Yes. I do have one. We freeze the war on Arrakis. Each House has control over certain territories. We can trade a few of them between the three Houses, so that everyone has enough spice production under their control._BARON: THAT IS UNACCEPTABLE! House Harkonnen has the means to take it all. And I am not giving the damned Ordos any territory just because they control less than I do._IRULAN: Baron, a lot of people are watching this. I suggest you start thinking about all the people in the Imperium who are suffering the effects of this war.__Gurney is impressed by the last line of the princess. "Indeed, as the duke said, she is smart. This meeting is public, and the reason it was set as public is exactly this: to put pressure on the warring factions to stop the war. Otherwise, the population of the empire will blame the three Houses for the spice issues. Smart move, daughter of Shaddam IV. Beauty and brains, you got it all."__COUNT HAGAL: House Hagal is supporting princess Irulan's idea. The war on Arrakis has effected galactic commerce drastically. Also, interstellar travel was delayed and severely crippled because of the issues with the Spacing Guild.__Gurney notices how House Hagal is backing up House Corrino. It is a pretty predictible move, as House Hagal has always been a friend of the emperor. Gurney also remembers what the duke once told him about the Great Houses, and their political games. "They will give political answers. Nobody really cares about the stability of the Imperium. They only care about their own interests. I can bet this will happen now too."__ARCHDUKE ARMAND ECAZ: This can only be fixed by having a new emperor. This is what the Imperium is lacking now. If the three Great Houses do not want to stop now, they might have to if an emperor dictates it._BARON: BAH! Don't make me laugh. An emperor, to dictate me to stop? You seem to forget what we did to the previous emperor._HASIMIR: Baron, please. Her highness is here._IRULAN: It is alright, representative Hasimir. The Baron is very well known for his sharp tongue._BARON: I assure you I meant no offence to you, your highness._HASIMIR: The old ways state that a male emperor must rule the Imperium. However, the ruling dynasty, Corrino, has no close male heirs. The family tree gives us a few male boys, but they are far from the original bloodline. Therefore, the CHOAM proposed that we decide, together, who shall rule the Known Universe. CHOAM believes we should give the throne back to the Corrino family, and have princess Irulan as our empress, being the direct heir of Shaddam IV._EXECUTRIX: House Ordos does not accept the terms. House Ordos demands to take the throne. The Ordos fought on Arrakis and have control over the spice. That is fact. House Ordos deserves the leadership of the Imperium. That is wise._BARON: Your highness, you did a terrible mistake inviting all the weirdos to this meeting._HASIMIR: Baron! I am asking you to stop your insults. You are crossing the line already._EXECUTRIX: House Ordos does not recognize insults. We are taking the logical approach. That is wise._COUNT GINAZ: The old ways are clear. The heir has to be a male. Therefore House Ginaz cannot support this proposal, princess Irulan. We must elect a male emperor._ARCHDUKE ECAZ: House Ecaz agrees. A male emperor must be chosen._HASIMIR: I must interrupt you all. I see this is not getting anywhere. I say that each member of the Landsraad should say it here, publicly, who they support for the throne. You may choose yourself, another Great House, or refrain from choosing someone at all._BARON: I support my own House for this. _DUKE: House Atreides will vote for itself._EXECUTRIX: House Ordos votes House Ordos. That is logical._HASIMIR: Allright. Other members of the Landsraad, please... state your choice. Princess Irulan, Spacing Guild representatives, you may choose too._SPACING GUILD REP: The Spacing Guild does not support anyone._HASIMIR: Noted. Thank you.__Gurney is watching with emotion. Duncan just joined the room.__DUNCAN: I watched some of it on my way here. Nothing surprising so far. They don't want Irulan because she's a girl. _GURNEY: Now it's time to see which of the Atreides friends are real friends. Let's see who will vote for the Duke._DUNCAN: I am expecting House Vernius and Ginaz to vote for us for sure. They are close friends to the Duke._GURNEY: House Vernius has the monopoly over machines and technology on Ix. They might want the throne too. At least I would want it in that case._DUNCAN: The Harkonnen have some allies there too. Same does princess Irulan, who many might be looking to for a possible marriage and getting the throne that way._GURNEY: True. Probably the Ordos are the weakest factor here._DUNCAN: Who the hell would side with the Ordos on this? Everyone despises the Ordos in the Landsraad._GURNEY: Let's continue watching.__Meanwhile, in the meeting, the other houses not involved in the recent war are finally taking sides, after a long period of silence and calculations:__ARCHDUKE GINAZ: House Ginaz is supporting Duke Leto Atreides for the Golden Lion Throne! Duke Leto would make a perfect emperor due to his abilities._VISCOUNT HUNDRO MORITANI: House Moritani supports House Harkonnen. The Harkonnen are the strongest military force in the Landsraad, and a firm military grip is what the Imperium needs right now to establish stability._COUNT HAGAL: House Hagal is supporting princess Irulan Corrino. The throne must return to the Corrino family, and princess Irulan is more than capable of continuing her father's legacy._COUNT RICHESE: House Richese is supporting itself. Our advanced technology is what the Imperium needs now. For years, Richese offered great machines for the known universe._COUNT DOMINIC VERNIUS: Hah! Richese technology cannot compare to Ix. Are you really saying you should rule because of your technology, while you don't even have the most advanced machines?_COUNT RICHESE: Of course I had to be interrupted by Dominic Vernius._HASIMIR: My lords, please. Stick just to the voting._COUNT VERNIUS: Very well then. House Vernius is supporting my old friend, Duke Leto Atreides.__Gurney and Duncan are relieved. They feared the amazing Ixian technology and Dominic's ego will weight more than his friendship to the Duke, but it seems Dominic Vernius is loyal to Duke Leto.__BARON FLAMBERT MUTELLI: House Mutteli supports House Harkonnen._COUNT WALLACH: House Wallach is supporting Duke Leto, of House Atreides._ARCHDUKE ECAZ: House Ecaz is also supporting Duke Leto Atreides._HASIMIR: CHOAM supports princess Irulan Corrino._EARL FAZEEL: House Fazeel would like House Vernius to the throne, so the Imperium can benefit the most from their machines._IRULAN: House Corrino is supporting itself.__The rest of the major and minor Houses decided not to get involved in this voting. Hasimir concludes:__HASIMIR: It seems there is no clear winner of this vote. So far, it seems most of the votes went with House Atreides and Harkonnen, with some of the parties supporting princess Irulan Corrino. There are also individual parties supporting themselves: House Ordos and House Richese. Also, House Vernius is being supported by another House, but not by itself. Dominic Vernius, do you wish to change your vote?_DOMINIC VERNIUS: No. House Vernius supports Duke Leto Atreides. _HASIMIR: Due to no majority of the votes going for one of the Houses, I propose that this meeting is suspended for now. I hereby ask all the attendees to reconsider in a few weeks another meeting, where we shall vote again. Please consider making a decision until then, as we need a decisive conclusion for this.__The meeting is dismissed. Duke Leto seems happy, as he got the most votes, while the Baron is furious. At the same time, Irulan seems calm, calculated. Leto observes this, and goes on to talk to her:__LETO: Your highness. I must apologize that I could not support you for the throne. I consider you to be fitting for the role. And these are not just some nice words to hide my lust for power._IRULAN: It is all about politics, Leto. I know how this game is played, my father taught me all the tricks. You should always expect certain twists. No hard feelings, Duke Leto._LETO: Thank you, your highness. You must visit Caladan one of these days. It's been a long time since you last visited us._IRULAN: We will see. I'm looking forward to it, I'm sure Caladan remained as beautiful as it always has been.__Leto kisses her hand and leaves, but not without contemplating at her words: "You should always expect certain twists". Is she planning something? A way to get the throne without getting most of the votes?____Meanwhile, on Arrakis, Duncan tells Gurney:__DUNCAN: I almost forgot, with this meeting. Gurney, Thufir sent me information from Kaitain. Our engineers managed to decode only a small part of the data. Therefore, we don't know exactly what they want the spice for, except for hiring mercenaries because their troops are very thin. It seems the Ordos are collapsing. However, the amounts of spice they are harvesting are too much just for mercenary hiring. It must be something else... Anyway, Thufir told me the Duke's next directive is to disrupt the Ordos spice mining. This should ensure their fall in the immediate future._GURNEY: No problem. I'll break their main spice mining base near the False Wall._DUNCAN: It's heavily defended, and they have mercenaries protecting them. It won't be easy._GURNEY: Don't worry about that._DUNCAN: There is a small Sardaukar base nearby. The Duke wishes that you ... persuade them to fight with us._GURNEY: I see the Duke is aiming towards a solid alliance with the Sardaukar._DUNCAN: Both Fremen and Sardaukar on our side... I can see why the Duke would want that. We'd be unstoppable._GURNEY: Yea, but the Sardaukar are still with Irulan. _DUNCAN: For now, the Duke ordered you to arrange a deal with them. Locate their base before the timer runs over and the Ordos will ally them. I have good intel from Hawat about this You must also protect their base at all costs: the Duke wants this. Don't ask me why, it might be for a political alliance or marriage with princess Irulan, or something else. Only the Duke knows his plans. Once they side with you, the Ordos will obviously want them dead._GURNEY: Will be done, my friend.__==========_Objective: The Duke wants us to be friends with the Sardaukar. Locate their base before the timer runs out and the Ordos ally with them, or before the Guild destroys them. Once done, make sure their base is not destroyed. It is imperative. Be advised: the Sardaukar base is small and easy to destroy. There is a Guild base nearby. The base is of mediocre strength, so it can be ignored for now. However, they are hostile to the Sardaukar, therefore they must be stopped. You can ignore their base as long as the Sardaukar forces are protected. You may want to provoke the Guild to get into hostilities with the Ordos as well, to provide a distraction for you. _Destroy all the Ordos Refineries, Harvesters and Silos. Also, make sure you dispose of their mercenaries too. Destroy all mercenary buildings.
