Briefing=LOCATION: Smuggler Outpost near Arrakeen_===========__With the Fremen dead, Bashar Garron and Burseg Varlaz enter the Smuggler Outpost to take shelter from the sandstorm. The Smugglers are quite friendly, perhaps everything can indeed be bought, with the right price. After all, the Imperial spice reserves on Arrakis, worth more than 100 000 solaris, is more than the smugglers usually earn in 6 months. Of course, this has changed recently, after the Guild stopped transporting troops for the Landsraad and they were forced to hire smuggler heighliners for the job, but still, they won't say no to more and more profit.__The smuggler leader in the Arrakeen sector, a man named Rob Halvard, welcomes them inside the outpost, and prepares some food and spice coffee for the Sardaukar generals and their men. __ZED: Thank you, for the warm welcome. I see there are no hard feeling for the battles where we met as enemies._HALVARD: Hard feelings? Well, first of all, it wasn't my men fighting you and the Guild when the temporary alliance with the Atreides and Harkonnen was established. Then, it's not like our organization was part of this war, ever. We tried to stay away from your conflicts as much as possible, however we were continuously threatened by the Guild's aggressiveness.__Garron has a hard time swallowing his pride. Talking to a bunch of Arrakian smugglers, asking for their help. The Supreme Bashar of the Sardaukar, doing this, it is certainly something that eats him from the inside. But duty is duty: Kaitain is the priority now, the Sardaukar operations on Arrakis are no longer important.__GARRON: As you said: it's all about business. Which is exactly why we're here._HALVARD: You'd like to return to Kaitain, I assume?_GARRON: We would._HALVARD: I figured it out. I mean, it doesn't look very well for the Sardaukar. The three Great Houses got the upper hand. They kind of won.__Varlaz started to look quite tensioned. Of course, Halvard's words were a subtle insult for the Sardaukars, who were supposed to be the unstoppable armies of the Emperor. And they FAILED. Garron observed this and was quick to continue, to prevent a possible raging outbreak from Varlaz. However, Garron's tone changed to a more confident and threatening one:+__GARRON: I believe ... we should stick to business. That's the smuggler way, isn't it?_HALVARD: Certainly. But you have to cope with us: this is the first time we're negociating with the Imperial authorities. We were being hunted down all the time for our... illegal stuff._VARLAZ: Illegal stuff? What illegal stuff? We cannot see anything... fishy here. That is, of course, maybe due to the shipments awaiting us for Kaitain, I assume._HALVARD: Oh, they certainly do. We accept your offer, Sardaukar. But first, you must understand we want to make sure we won't get into... trouble with the Landsraad for aiding you._GARRON: Then make sure of it. We need those shipments yesterday. Time is of the essence right now._HALVARD: I imagine you're afraid princess Irulan might be in danger._ZED: Smart man, definitely. However, we should stick to the important matter. The shipments._HALVARD: Of course, of course. The Sardaukar, always focused on the objective. Our request is pretty simple: aid us against a small Guild base, and let the Atreides, Harkonnen and Ordos believe we are the ones who destroyed it. If we show them we are actively fighting their enemies, they will turn their attention away from us.__Varlaz looks displeased to his leader. That is outrageous. The might of the Sardaukar forces, to be declared as smuggler battle skill? That is an insult!_Garron understands Zed's look. He takes a pause, and then responds slightly unhappy:__GARRON: You have a deal, smuggler leader. But I want those shipments to be ready by the time we move on the Guild._HALVARD: I will order that preparations begin immediately. As for the Guild base, there are two installations near Tuck's sietch. That is where we attack. One is a small forward mining base, lightly defended. The other is a pretty solid fortification, with a functional Starport. However, as you know, Guild heighliners are pretty endangered. Obviously, that's why you came to us and didn't ask the Guild._GARRON: Burseg, we must enter the small mining base and take it over. They will not expect us to turn on them, so they will let us in without trouble. Once we're in, we must kill them and capture their structures._VARLAZ: Understood, sir._GARRON: Also, we need to make sure that our... friends over here won't get overrun by the Guild._HALVARD: My men will have to wait for the Starport to be ready to receive reinforcements. Once that is done, they will have more firepower at their disposal to help you out. We now got a plan! Let's move out!__==========_Objective: Move in the Guild base. They still think that we're their allies, and will not shoot. Once you're in, kill them all and capture their buildings with engineers. We do not have resources to airlift an MCV, so you'll have to go with whatever the Guild base offers you. Ensure the Smuggler Outpost does NOT get destroyed. Raze all Guild structures to secure our deal with the Smugglers. Capturing the Outpost will let us take control of the Guild turrets. Also, do not attempt any hostile action again the Smugglers, like capturing their Starport, as they will obviously not like this. Use this information wisely.
