Briefing=HARKONNEN_============_We are finalizing the preparations for the attack against IX and its machines. We will destroy them all once and for all and prevent them from spreading an Artificial Intelligence that can merge with the human brain.__The Atreides were confident that the Fremen would give us information about the position of the Ixian armies, but apparently they have not yet earned their trust enough. We have turned to our explorers to make our own situation report.__All Ixians are refugees in a large base, heavily defended thanks to the rugged terrain they have built artificially. On the outside there are several ditches and walls protected with some unmanned vehicles. Inside they have multiple Heavy Factories controlled by Artificial Intelligence capable of producing advanced vehicles to compensate for their lack of Combat Tanks.__The greatest danger is the huge amount of Ciborgs that are being mass produced in Barracks. Their number is so high that the Atreides are going to focus their resources on mainly processing anti-infantry units.__Luckily The Barracks are not within the large Ixiana base, probably because they have no place to supply that high number of Ciborgs. Try to destroy the Machine Barracks as soon as possible so that the Atreides can help with the destruction of the main base.__Objective: Destroy the Ixian base and all the buildings of the Machines.__Secondary objective: Destroy the Barracks (or the Imperial Palaces) first so that the Atreides can make more efficient assault vehicles.__Tip: The Siege Tanks and Infantry will be very useful to counteract the large number of Ciborgs that attempt to attack your base. The Atreides are prepared to face that threat, their help will facilitate the mission, but they alone cannot win.

