[Text]
0=Ah, the Harkonnen are deploying to help us out!
1=Soldiers: What is happening? Harkonnen rats have turned against us. We should have never trusted them.
2=HAWAT: Gurney, the Harkonnen seem to have made a deal with the Guild...
3=Gurney: I told you we cannot trust the Harkonnen scum! I only did it for the Duke.
4=HAWAT: The Duke has given us permission to destroy the Harkonnen. Enjoy it, my friend.
5=Gurney: Oh, you bet I will! I've been waiting for this for too long already!
6=Destroy the Guild units putting pressure on the Smugglers, and they might help us.

