Briefing=Gurney Halleck. summoned by the Duke, prepares to enter the main command room, where the Duke and his mentat, Thufir Hawat, are discussing further strategies. He knows that, if the Duke summoned him in the battle room, then there is some stuff to blow up, and there's nothing that makes Gurney happien than blowing things up. Perhaps only killing some Harkonnen rats.__DUKE LETO: Ah, Gurney. Happy to have you back, friend._GURNEY: I am glad to be back, my lord. _DUKE: How is it going in the deserts? Do you have any concerning news?_GURNEY: Not really, my lord. Everything has been pretty quiet lately. The Guild and Sardaukar did not pose much threat in the field. The Imperial Army is in total disarray._DUKE: I heared the Sardaukar Bashar was not at Hagga Basin. Heared it was a decoy._GURNEY: Yes, it was indeed a decoy. The installation in Hagga Basin was probably a distraction. It means they are up to something._HAWAT: There is not much they can do now. The emperor is dead. They are probably fighting for their own survival._DUKE: Well, Thufir, you are my mentat. I'm expecting you to tell me what they are up to._HAWAT: I don't have enough information my lord. Mentats require a certain set of known data to make a conclusive deduction._GURNEY: They're probably running away, to lick their wounds. I would say it's not the Imperial Sardaukar we should be focusing on, but the Guild. They still have a few operational Starports on Arrakis._DUKE: Precisely, Gurney. That is why I summoned you in the first place. We've located a few Guild installations which must be destroyed to make sure they will be forced to leave Arrakis. Today I'm giving one of the strongest installations for you to blow up._GURNEY: Can't ask for any better gift, my lord._HAWAT: Gurney, be careful. I heared there are smugglers in the area. The Guild has them pinned down in their base, forcing them to mine spice for the Guild. I think we should use this intel wisely. What do you say?_GURNEY: Of course. As you know, I have some relations with the smugglers. They might agree to help me out even without a payment of gift. All I need is to help them get rid of the Guild assholes._DUKE: Be careful though, Gurney. This Guild base is much stronger than the average Guild installations currently remaining on Arrakis._GURNEY: No reason to be concerned, my Lord. I'll send them into oblivion.__========__Objective: Destroy all enemy structures. There is a Smuggler base under control of the Guild. The Smugglers don't like that. Help them get rid of the Guild occupation, and they might prove to be quite... friendly. Be advised: the Guild Starport in the region is operational. The Smugglers have transports of their own, but are confiscated by the Guild. Removing the Guild besiegers near the smuggler base will also allow them to land their transports at the Starport.
