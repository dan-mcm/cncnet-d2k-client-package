Briefing=DUKE: Well done, Commander. With the Spice mining facilities destroyed, the Emperor was forced to pull back in numerous sectors to avoid more losses that he cannot replace without the necessary funds. This was a serious kick in his butt. But we're not finished yet. No matter how brutal this will be, we are going to have a joint operation with our detested foes, House Harkonnen. The targets are the main Guild Starports. They are awaiting enormous transports with legions over legions of Sardaukars and Guild vehicles, possibly almost everything the Emperor has at his disposal in terms of military force. If we do not stop those shipments, we will never be able to stand against the swarm of enemy forces that is about to get unleashed. House Ordos cannot help us with this, so we'll have to rely on the Harkonnens and your marvelous skills. Make me proud, Commander, as you always have done! If you fail, House Atreides is dead.__Closing link...__MENTAT: Commander, the task will be extremely difficult as the Guild has 2 heavily defended bases, and they receive aid from an Imperial base. There are smugglers in the region, and they have an operational Starport, one of the few not communicating with the Guild. The Imperial Jamming Radar deployed nearby seems to be preventing the Smugglers from receiving any Starport delivery, and they are desperately trying to destroy it. If we can destroy the Jamming Facility, the Smugglers will receive their transports and might even consider allying with us. They can be a very valuable ally, Commander, as they have access to heighliner dropships and do not work with the Guild. Aid them, protect them, but before you destroy the Jamming Facility, stay away from them and do not provoke them to turn hostile on you!__The Harkonnen have agreed to share their nuclear weapons with us, and in return we will share our ornithopter bombers.__Objective: Destroy all marked Guild Starports before the time runs over and the Guild transports arrive. __Optional objective: Destroy the Imperial Jamming Outpost (yellow) as soon as possible to have the Smugglers and their Starport deliveries on your side. They will be a very valuable ally.

