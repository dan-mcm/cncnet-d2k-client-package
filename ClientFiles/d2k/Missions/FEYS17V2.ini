Briefing=SUMMERS' SOLSTICE 17: Power Play for Keeps__MISSION OBJECTIVES:_1. Seize land in Tsimpo Heights._2. Defeat all Dark Alliance forces._3. You must survive.__TACTICAL OBJECTIVES:_1. Capture the Dark Alliance superweapons at your LZ._2. Build Rocket Turrets along cliffsides to snipe attackers._3. Be aggressive before Moriaen's entire arsenal is readied._4. Scout a good expansion location to fund your aggression.__BRIEFING:_     Your scouting party has confirmed a total of four Storm Lashers and a few Rocket Turrets blocking your way into Tsimpo Heights. They're the least of your worries; an enormous stockpile of special weapons lies beyond. While you await reinforcements, you contact Atani.__     "There are three Death Hand launch facilities and three fleets of Ornithopters," she reiterates. One of each in the base you're about to take.__     With Durant's forces occupying the Heighliner, thus the Dark Alliance orbital artillery out of the way, they're the only superweapons in Moriaen's possession. You cannot allow them to be used in the final battle. Thinking of Durant, you ask, "Has Sabre made it to Wind Pass?"__     Atani is able to confirm, "He's only just establishing his base. I've arranged for reinforcements for both of you. Stay focused on your mission, Commander."__     "I know. Failure isn't an option."__     As your call ends, the first Carryalls fly overhead - straight towards the enemy blockade. Your chance to press the attack will present itself shortly! And you must hurry. You're sure Moriaen would sooner discard her structures than allow you to capture them, once she catches on to what you're doing.
MissionNumber=17

