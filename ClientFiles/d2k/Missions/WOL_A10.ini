Briefing=Gurney's visit in Cala City made everyone feel happy and secure. The war hero everybody heared of, can finally be seen right in Cala City, Atreides Capital. Halleck came to Cala City to meet with the Duke. After a long time that they didn't see each other, time has finally come to reunite the Atreides high command.__HAWAT: Welcome back, Gurney. I saw the reports: that was an amazing firework show you put up there. Most of the Harkonnen and their allies have retreated to the south, near Horizon and nearby towns and villages. They are on the run._DUKE: Indeed Gurney. Their momentum has been totally crushed. By the looks of it, they won't last much longer. Their coalition is also starting to eat itself from inside. There are serious issues between House Mutelli and House Moritani. Something like blaming each other for certain defeats. One thing is clear: their alliance is very volatile at the moment._HAWAT: Which is exactly why me and the Duke came up with a glorious plan._GURNEY: Is it finally time I can find out what this plan is all about?_DUKE: As I said, this will be your reward for a victory at Lake Argent. And the Duke of House Atreides always keeps his word. Thufir, please brief our friend._HAWAT: Right. So, there is a certain...__Incoming transmission, please stand-by...__IRULAN: Duke Leto._DUKE: Princess Irulan. Your highness. _IRULAN: How is it going? I've heared some rumours that you managed to stop the enemy advance, and have even pushed them back._DUKE: Most of these things are my friend's work. Your highness, this is general Gurney Halleck._GURNEY: Your highness, it is an honor to finally talk to you in person._IRULAN: I've heared many things about you, Gurney Halleck. They say your skill in battle can only be matched by your skill with the baliset. Your songs are astonishing._GURNEY: Thank you, princess. It is such an honor to hear this from you._IRULAN: Leto, I have some ... information... that I think you might want to know of._DUKE: I'm all ears._IRULAN: There are certain issues on Giedi Prime. It seems the Baron is no longer viewed as the great leader of the Harkonnen as he used to be. The Harkonnen are carefully pulling out troops from Caladan and redirecting them back to Giedi Prime. _DUKE: Redirecting their troops? In the middle of the invasion? This means there are open hostilities on Giedi Prime._IRULAN: Most likely. There is probably some sort of civil war going on, or about to start, at least. I did not manage to find more. But I am sure you'll be able to use this information wisely. And of course, keep it secret. We've never talked today, Duke Leto. Not today.__Transmission ended...__HAWAT: This is ... surprising. To say the least._GURNEY: Which one? The fact the princess of House Corrino is getting involved in this conflict and tells us important secret info, or that Baron's son believes he's too old for the job?_HAWAT: Well, I'd say both. One would think it is in her best interest to let the Atreides take a beating from the Harkonnen. Our Duke was the most popular monarch for the emperorship._DUKE: I know that, for a mentat, it all seems down to personal needs and plans. But I am telling you both: Irulan is not her father. She is a different person._HAWAT: My lord, do you really trust her that much?_DUKE: I trust her enough to believe what she said about Giedi Prime._GURNEY: I think Thufir was reffering to the reasons why she told us about it._DUKE: Both of you need to have a bit more faith in your Duke._HAWAT: Yes, sire._GURNEY: As you say, my lord.__Incoming transmission...__DUNCAN: My lord. I am bringing news from Arrakis._DUKE: What is it, Duncan? Everything alright?_DUNCAN: I am not sure. The enemy did not attack in force yet. It is silent. Too silent, if you ask me. Which is why i invested quite a lot in scouting and patrols. And one of my men found this... The image shows a Tleilaxu sand vehicle._DUKE: Tleilaxu? On Dune?_DUNCAN: My thoughts exactly, sire. It looks fishy._DUKE: Duncan, please find out more. You must find out what Bene Tleilax could be doing on Arrakis._DUNCAN: Already working on it, my lord. Will keep you updated as soon as I find something.__Transmission ended...__DUKE: Gurney, don't worry about Arrakis for now. It is time to get your reward. Let's hope nobody interrupts you again, Thufir._HAWAT: Alright. As the Duke said, the enemy coalition is extremely fragile at the moment. One small... inconvenience, and it could all blow up. We managed to capture two Harkonnen Devastators after our naval bombardments on the eastern coast. The Devastators are intact, not one scratch. I managed to bribe some Guild dudes. They will allow you to enter with a small strike force on the Guild Heighliner that contains most of House Mutelli's reinforcements towards Caladan. The Heighliner can be boarded on Kaitain, as it will take a stop there. You must order your squad to board it. Once done, they must use the Devastators to attack House Mutelli. Also, just to make sure the Harkonnen won't find any excuse, my people managed to ... fabricate some fake proof of Harkonnen forces discussing a turn on the Mutelli, to take the side of House Moritani in the conflict they have with Mutelli. The data must be inserted in the Mutelli Outpost on the Heighliner. And before you ask me: yes, the bribe for the Guild was huge. No problem._GURNEY: So... we're playing tough, now. I like this plan. _DUKE: We're doing anything it takes to destroy this enemy alliance and get them off of our homeworld._GURNEY: Alright. I'll send my men to Kaitain immediately. They will be ready to board the Heighliner.__==========_Objective: The enemy coalition is extremely volatile. A spark is all that is needed to ignite it. And a spark you'll provide. Using a small strike force, acting as part of House Harkonnen, you must make your way on the Guild Heighliner. The huge ship is full of hostile forces, so take care. The Mutelli will fire on anything that enters their sector. Your target is the Mutelli Outpost located to the southern part of the Mutelli heighliner sector. Move through the corridors and capture that Outpost. It is time to beat the Harkonnen with their own weapons: hidden betrayals and scheming from the dark.
