Briefing=Well done, now Edric is completely ruined and Imperial forces have fled in panic when they see they can’t stop the destructive power of our nuclear missiles.__We were going to leave the planet, but now that we have seen firsthand the success you had in all this battles ... Why not conquer Dune in the name of the Spacing Guild?__If we conquer Arrakis we will use it to create as many modified sandworms as we want; Can you imagine it? But to do that we must first defeat the House that dominates the planet: The Ordos. The Ordos, along with its allies Fremen, have been able to decimate botch Atreides and Harkonnen.__The Emperor has formed an alliance with the Ordos, out of desperation. Now he don’t have so many troops like in your previous battle, but he brought the Sardaukar legions to balance the scales.__Unfortunately we have run out the missiles we bought from the Harkonnen, but we have been given privileges in using the Starport that will compensate the numerical superiority of the enemy. Beware, Use caution, the Fremen have learned to fly ornithopters.__Our future is in your hands; destroy all enemies and conquer the planet in the name of the Spacing Guild. Good luck.__Objective: Destroy the Ordos, Fremen and the Emperor.__Notes for the Commander:_*The prices in the Starport change quickly._*The frigate arrives faster when placing an order._*The number of stocks in the starport increments faster.

