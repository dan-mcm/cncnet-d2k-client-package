Briefing=LOCATION: Tsimpo, Imperial base _==========_Imperial Carryalls can be seen in the skies, moving towards the Tsimpo Imperial landing zone. Sardaukar Supreme Bashar Cando Garron is overseeing the landing of the Carryalls. __After the landing, Burseg Zed Varlaz is moving out, instructing Sardaukar forces on the Tsimpo installation to deposit he captured Harkonnen Devastator carefully. Garron approaches the burseg:__GARRON: Burseg Varlaz, I am happy to see you managed to escape. Please, come inside the Outpost, we must talk...__The two Sardaukar generals move inside the building, and Garron offers Varlaz some spice coffee. After all, he got out of a theoretically impossible mission.__GARRON: I will not lie to you, burseg. We are being overwhelmed. As we speak, the Landsraad is attacking most of our territories here on Arrakis. In fact, Sardaukar scouts are reporting that, as we speak, Landsraad forces are closing in on our installation. Yes, don't look so surprised. That was an artillery shell that you heared in the distance... They are getting close. Our most important objective right now is to return to Kaitain and protect princess Irulan. She is the rightful heir to the throne._ZED: A female heir.. The Landsraad will never accept that._GARRON: That is not important at the moment. If the Atreides, Harkonnen and Ordos decide to invade Kaitain, princess Irulan is in danger. Kaitain is not greatly defended right now, as the Emperor commanded more than 50% of the Sardaukar forces from Kaitan to relocate on Arrakis for the Spice War..._ZED: Do we have enough forces to withstand their onslaught here in Tsimpo?_GARRON: Of course not. However, I managed to make the Baron believe most of our generals are located near Hagga Basin, and that the Tsimpo installation is mostly an Imperial mining facility with little means of defence._ZED: So... they will go in force for Hagga Basin._GARRON: Precisely._ZED: What about our men in Hagga Basin?_GARRON: They have been given precise instructions about what to do. They will hold the ground for as long as possible, until the Imperial Air base can send them an evac. _ZED: For how long they can? The Imperial Air base is close to Carthag, the distance is... it's too far, they won't be able to get an evac in time._GARRON: They will fight bravely, and will buy us some time to find a way out of Arrakis. Burseg Taber commanding in Hagga Basin insisted that we do not move in to their aid. It was his idea._ZED: The Guild is in disarray. Their starports are being decimated as we speak. Getting a guild Heightliner to take us out of Arrakis is not an option now, sir._GARRON: Indeed, the Guild is not an option. But the smugglers, however..._ZED: The smugglers? They were fighting wih the Atreides and Harkonnen the last time. And I doubt we have enough solaris to... "buy" them._GARRON: In fact, we do, burseg. The main imperial mining camp the Landsraad attacked few weeks ago did not hold all the spice we harvested, as they thought. We have a backup mining storage base. Burseg, this is classified information. Nobody knew about it, except for me, the Emperor and his ministers. It must remain so. I will transfer the funds to the smuggler guilds as soon as we... locate them. _ZED: Locate them? I thought we had concrete intel on smuggler encampments on Arrakis._GARRON: We do, however most of those regions are completely unreacheable deu to the Landsraad coalition. We are currently trying to locate a smuggler encampment and seal a deal, but the region must be protected from enemy Houses until we are able to locate them. You must fly in close to the Mount Idaho imperial outpost and protect it from the enemy. If the outpost falls, we might not be able to locate any smugglers in time. In the meantime, I will ensure our spice is ready to be delivered to the smugglers as soon as a contact can be established._ZED: Understood, sir. I hope we reach Kaitain before any harm comes to princess Irulan._GARRON: Be advised, there is a Guild base nearby. So far our alliance with the Guild is standing, even without the Emperor. We firstly need a truce with the Landsraad, before we can dissolve any treaties the emperor made with the Guild. However, think of them as... something disposable. A distraction for the Landsraad forces attacking the Outpost. Don't waste men and resources trying to save them. Oh, and also... you may build our Prototype Autogun Turrets. They have never been finished, but they are great at taking out enemy infantry._ZED: I have heared about these... Joint Corrino-Guild technology... Supposed to be better than the standard Gun Turrets._VARLAZ: Yes, supposed... They were never finished, but I have the building plans. You may deploy them if you wish. The Guild is already using them.__Objective: Defend the Outpost trying to locate the smugglers at all costs. Once the Outpost is secure, build a strike force and destroy the enemy forces to ensure the outpost's safety. It can further be utilized for communications, therefore it is an important asset. The Guild have a small base nearby, think of them as a distraction for the enemy. They are not required to survive for our plans. Tactical map available, press the button to view it.
TextUib=WOL_S_Text.uib

