5=GARRON: Burseg, spice is prepared for the Smugglers. My forces are waiting for you.
4=VARLAZ: We must remove the enemy from the region. Move out Sardaukars! Princess Irulan needs us!
3=Outpost garrison: General, we found a Smuggler base. If we contact them, however, the enemy might find out our plan.
2=Outpost garrison: We might have something. Scouts report possible Smuggler base in close proximity.
1=Guild commander to nearby Imperial units, this is a distress call. We are asking for immediate assistance!
