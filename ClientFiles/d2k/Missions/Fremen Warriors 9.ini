Briefing=The Emperor has been cornered, he fled for refuge to the last Harkonnen's bastion remaining in Arrakis. This is the time to banish the planet once for all our enemies.__First weaken the Harkonnen destroying several main buildings and at the same time cooperate with the Atreides to defence, protecting the Atreides high-tech industry and the outpost. We need it operational to send carryall in stealth attacks.__You will receive further instructions on the battlefield. For Shai Hulud!__Objective: Beat the Harkonnen and the Emperor. Protect the High-tech factory and the outpost.__Note: Turrets and enemy soldiers can discover your hidden Fremen.

