Briefing=DUKE: Splendid job, Gurney. My spies managed to listen on some of the Harkonnen frequencies. There is chaos on the southers side of the continent. Moritani and Mutelli forces are already killing each other, while some Mutelli raids destroyed most of the Harkonnen Ore Refineries. House Harkonnen already moved in to aid the Moritani against House Mutelli. This is what we needed._HAWAT: While you were busy with the Heighliner mission, House Ginaz already prepared for this in advance. They've deployed a base close to Horizon, to the south of the main continent, where there are still enemy forces left. _DUKE: Gurney, you must move in, deploy an MCV and help our allies. You should be able to do this without that much challenge, since both Harkonnen and Moritani are particularly distracted by House Mutelli. _GURNEY: What about the Mutelli?_DUKE: They are focusing on House Moritani. They can be ignored as long as they do not turn hostile on you or on House Ginaz. If they do, you might have to remove them from the region as well. Nonetheless, if you destroy the Harkonnen and Moritani forces, House Mutelli will most likely surrender. We will accept that, for now._HAWAT: Remember, this region has been under enemy control ever since this invasion started. It was the main source of income for them, they have harvested most of the ore available here. Be careful, Gurney. You'll have to be very careful with the credits you get. Try to get monopoly on the ore harvesting._DUKE: In the meantime, I wanted to bring some news to you regarding the situation on Arrakis. It seems Duncan found out that certain Tleilaxu members had some secret meetings with Ordos commanders. This could particularly explain the manpower of House Ordos in recent times._GURNEY: You mean that..._HAWAT: We don't know it for sure, but Duncan is suspecting that the Ordos are purchasing gholas from the Tleilaxu. Their invasion on Ix might be orchestrated by the Tleilaxu. But this is just speculation, for now._DUKE: Focus on Horizon. Gurney, this is the time you've been waiting for. Destroy them all. Free Caladan from these invaders.__==========_Objective: Our plan worked wonders. The enemy alliance is off. Now it is the best moment to free Caladan. With both a disfunctional alliance and issues at home, on Giedi Prime, House Harkonnen is extremely weak. House Mutelli is actively fighting Harkonnen and Moritani. Outraged by the 'Harkonnen treachery', they are now focusing on our enemies. Ignore them for as long as you can, and focus on the Harkonnen. House Ginaz has a base already deployed nearby. You must ensure that the base will not fall. Fight a war of attrition and ensure that you get the monopoly over ore harvesting: there are many factions present in the sector, and not enough ore for them all. Destroy all Harkonnen and Moritani structures and ensure our allies' base is not completely destroyed. If House Mutelli becomes a problem, you can dispose of them as well, but it is not necessary to do so. They will surrender to the Duke once Harkonnen and Moritani are destroyed either way. Tactical map available, press the button to view it.
TextUib=Caladan_Text.uib

