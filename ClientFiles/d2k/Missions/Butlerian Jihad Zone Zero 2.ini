Briefing=ATREIDES_=========_Now that the Machines have lost their A.I. active no longer pose a threat to anyone: Their factories do not produce new units and orders to attack and even defend have been deactivated.__We have not been able to deactivate the automatic system of the weapons that have been equipped, nor the programming of destroying the three Houses, but still no base of the Machines, even the biggest ones, is difficult for us to reduce to ashes.__Right now we are in an easy territory to capture, there are only two bases of the Machines that hardly resist. The Harkonnen are also here and it seems they have the same goal as us.__As both sides have had great losses in the great battle against the Machines, I have contacted the Harkonnen and I have proposed that we make a race instead of fighting each other for the control of the bases to minimize losses for both: who destroys the base of The closest Machines first will keep the territory in its entirety.__Show me that you are faster than the Harkonnen and I will send you reinforcements. Achieve the following objectives before the Harkonnen:_* Destroy the Light and Heavy Factories = 5 Infantry + 4 Soldiers._* Destroy 10 Ciborgs = 4 Trikes + 3 Quads._* Destroy 20 armed vehicles = 3 Combat Tanks + 2 Harvesters.__Objective: Destroy the base of the Machines to the north before the Harkonnen destroy the other base of the Machines.__Secondary objective: Destroy the mentioned objectives before the Harkonnen to receive additional forces.__Tips: The Machines do not produce new units nor can they start offensives (although they do shoot at your units), so you don't need to worry about defense. Capturing the enemy's spice stores is a good method to increase available money.
Music=LANDSAND.AUD

