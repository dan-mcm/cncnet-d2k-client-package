Briefing=HARKONNEN_===========_I have just been informed that Mercenaries have been seen using machines vehicles. It does not appear that Mercenaries have direct control over these vehicles but take advantage of their automatic systems to strengthen their defenses.__We are not sure where they got those vehicles, but we cannot allow them to continue using them. We have already lost too much during the last two wars against the Machines and I am not going to risk a third burst; We will make a preventive attack.__Build a base and destroy those of the Mercenaries. Focus your efforts on the enemy High Tech Factories to block their reinforcements.__Objective: Destroy the bases of the Mercenaries.__Secondary objective: Destroy the High Tech Factories to prevent them from continuing to bring vehicles to the battlefield.

