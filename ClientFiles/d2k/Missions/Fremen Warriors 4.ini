Name=Fremen Warriors - Mission 4
Author=Cm_blast
Music=FREMEN.AUD
SideId=4
Briefing=On the horizon I distinguish the base of the spacing guild waiting for our pickup, but I can also see an Atreides base and a Harkonnen blockade that prevents our way. We can't retreat because we are being chased, so our only solution is to enter in the Atreides base to the north of your starting position.__We do not know whether the Atreides be shown friendly or not, but it's a risk we must take. Whether the Atreides help or not you need to seek an access to the extraction point in the space guild brotherhood.__Objective: Be able to cross the Harkonnen blockade and reach the spacing guild base (the X mark).__Note: it isn't necessary to fill the harvester for beat the level.

[Text]
1=Fremen: We need help, the Harkonnen are chasing us.
2=Atreides: We will offer all the shelter you need.
3=Fremen: Our pursuers come!
4=Atreides: The Harkonnen shoot down all our reinforcements.
5=There are three turrets anti aircraft in inaccessible areas for our vehicles.
6=Destroy them, and we will neutralize the Harkonnen blockade in exchange.
7=Atreides: Harkonnen Carryall entering in the territory! Come back quickly!
8=Atreides: Thanks, we will bring our reinforcements right away.
9=Atreides: We have defeated the Harkonnen blockade, you have free access.

