Briefing=When the Lassoki arrived at the great ship in search of their Bromeli allies, they found that they were blocked by a large defensive system of Atreides Missile Turrets.__The Bromeli only have Saboteurs at their disposal with whom they could break the Atreides' blockade were it not for the large number of Atreides Light Infantry protecting the area.__The plan that the Lassoki devised consists of advancing towards the East where there is a suitable area to establish a base. Also the Atreides have some buildings that can be used. As soon as the area is clear and the Lassoki have captured the Atreides structures, a MCV will be delivered to a nearby Launch Pad.__The second part of the plan focuses on removing the Atreides Light Infantry from the blockade so that the Bromeli can use their Saboteurs to destroy the Turrets with ease until there are none left.__Once the blockade has been neutralized, all available Bromeli units will rush to the Frigates and together escape the Ship before the Atreides destroy them both.__If the Outpost is built the Lassoki will make it easier to explore the terrain, discovering enemy emplacements before they start firing. Also, some Frigates contain abandoned machinery from previous voyages that were unable to disembark, locating them will offer the Lassoki additional vehicles.__It is sure that the Atreides have two large, heavily defended facilities to prevent invasions in the North Zone of the Freigther, but the South Strip is worth exploring for extra resources. Although these are protected by the Atreides, they will not have assigned too many units and can be a crucial target for the Lassoki to be able to expand a bit.__It is important to remember that the interstellar travel rules established by the Emperor and the Space Guild prohibit the use of barbaric tactics such as crushing the Infantry with heavy machinery while inside a Guild Freigther.__Objective: Destroy all Rocket urrets that block your ally.__Secondary objective: Build the Outpost to make the terrain easier to explore. Locate Frigates that contain abandoned vehicles to join your army.__Note: It is forbidden to crush Infantry with heavy machinery, so it is not possible to perform this action.__Tips: Eliminating the enemy Infantry protecting the turrets will allow your ally to easily take down the Turrets by himself. Available resources may not be sufficient in the long term, it is recommended to explore and find a second harvest area.

