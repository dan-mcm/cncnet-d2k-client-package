Briefing=Sending transmission request to Carthag, Harkonnen capital on Arrakis__BARON: General Radnor, how was it?_RADNOR: Did not manage to get the entire squad alive. But soem did survive._BARON: Too bad. That complicates things._RADNOR: Why is that?_BARON: I have reports of Atreides and Sardaukar forces working together against us. That Atreides general, Gurney Halleck, was also seen with smuggler leaders. This means the Atreides are getting allies, and they are no longer relying only on the Fremen._RADNOR: The Sardaukars are decimated. They are fighting for their very survival. The smugglers are weak. They don't have dangerous alliances._DE VRIES: None of those two factions are officially allied with the Atreides. It is more like temporary deals due to a common goal. My Baron, I share general Radnor's thoughts: they should not be a threat._BARON: General, now you'll learn why I needed the Missile Tanks. The Atreides have Atsum. The village itself is worthless, but the strategical position is worth a million solaris. They are pretty close to Carthag, and that must change. They are aware of this, which is why they have strong forces there. There is one thing which will help us get what we want, though: Ordos. They seem to be launching an attack on Atsum's outskirts. Who the hell knows why, but this is the perfect distraction. Your missile tanks are there to blow up all Atreides Carryalls. Their High tech factory was blown up by an Ordos Saboteur, they are unable to get Carryalls. That will effectively kill their economy. That is what we need. Once their economy is down, ensure the rocket turret line close to the spice field is destroyed to allow us an MCV airdrop. _DE VRIES: Be advised though, there are smuggler forces aiding the Atreides. Also, the Atreides are summoning fremen periodically. And the Ordos, while being extremely weak overall, seem to have dispatched a considerable force here._BARON: Ignore the Ordos. Avoid fighting them. They probably have an important reason attacking Atsum's outskirts, but that is not important for now. The Ordos are weak, we can deal with them later. Focus on the Atreides and whatever worthless allies they have. The Atreides are strong on Arrakis and we must change that._RADNOR: Yes, my lord. It will be done.__==========_Objective: Our capital on Arrakis could be threatened by Atreides posession of Atsum. That must change. The Ordos are also attacking the outskirts of the Atsum sector for unknown reasons, but this is the perfect distraction for us. Use the Missile Tanks you rescued from the deep desert to take out Atreides Carryalls responsible for their spice production. Once the Carryalls are down, the Atreides Harvesters will take a long while to get back to base, and such economic slowness is what we need. Once the Carryalls are down, and only then, destroy the Rocket Turrets so that we can airdrop an MCV. Set up a base and destroy the Atreides and smuggler forces in the region. Ignore the Ordos and try to stay out of hostilities with them. Tactical map available, press the button to view it._
