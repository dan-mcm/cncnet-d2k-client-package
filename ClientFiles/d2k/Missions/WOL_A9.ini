Briefing=DUKE: Congratulations on the Air base defence, Gurney. That was a huge blow to the Harkonnen and Moritani forces. As a reward for your amazing actions, you'll be the first to hear this one...__Recording started...__COUNT GINAZ: Leto, my men are ready. My MCV is awaiting your signal. I have a few troops ready for Carryall deployment as soon as you give me the signal._DUKE LETO: Great, my friend. My best general will return very soon from the field. I'll ask him to assist you while you deploy near the lake._COUNT GINAZ: My men are ready. Just let me know. Please, ask your general to let my people take House Moritani heads on. We want the pleasure of destroying those scumbags.__Recording ended... __GURNEY: That is... great news._DUKE: I know you thought nobody will help us, but as I told you, Count Ginaz is a true friend. However it is obvious their military is not as numerous as ours, so you must help them deploy. They will be highly vulnerable until their base has the basic necessities up and running._GURNEY: So they're deploying near Lake Argent? That is controlled entirely by Harkonnen, Moritani and Mutelli forces._DUKE: Exactly. You guessed it, my friend. It is finally time to go on the offensive against the invaders. With help from House Ginaz, we should be able to remove the enemy from Lake Argent. Gurney, you'll be fighting in the heart of the main continent. A victory here would turn this whole invasion upside down._GURNEY: Then upside down it will be. There is no way in a billion years I will let any Harkonnen dog commander defeat me._DUKE: You might be wondering where Hawat is._GURNEY: Nah. Old man always finds somethign to do, he's never bored._DUKE: He is preparing a smart plan to get rid of this enemy coalition as we speak. I know some details about what he's doing, as we came up with the idea together, but let's just say I want to keep it secret for now. It will be your best possible reward for defeating the enemy forces near Lake Argent._GURNEY: That is more like a bonus reward, my lord. The actual reward is killing Harkonnen dogs._DUKE: Couldn't have said it better myself. By the way, I've received a message from Dominic Vernius. He's fighting heroically against the Ordos and Richese, but the situation on Ix is not as good as the one we have here on Caladan. We might have to move in and help them._GURNEY: Help House Vernius? But... my lord, we're being invaded._DUKE: That is after the plan me and Thufir prepared is completed. Once that is done, this invasion should be over, and all three enemies will be thrown into disarray. Go now, Gurney. Destroy them all. Oh, and just one more thing... You've heared Count Ginaz: let them handle the Moritani and Mutelli for the time being, you focus on the Harkonnen._GURNEY: No need to be asked to focus on the Harkonnen, sire!__==========_Objective: The Duke has true friends. House Ginaz kept their word and brought sufficient mulitary forces on Caladan to help us stop this invasion. Your task is to destroy the heart of the enemy coalition on Caladan at this point: Lake Argent. Take control of the Lake Atreides Base which was sieged by the Harkonnen and provide cover for the Ginaz forces until their base is fully deployed. Once done, destroy all three of them: Harkonnen, Moritani and Mutelli. Do not underestimate the Ginaz soldiers: House Ginaz is a very powerful ally. Tactical map available, press the button to view it.

