Briefing=The skies close to Arrakeen start to light up with small dotted beacons. Atreides Air Tower recongized them as being Mercenary Carryalls. Halleck and Idaho are returning.__The two immediately go towards the war room, where Duke Leto Atreides and Thufir Hawat are waiting. __DUKE: Duncan, I'm so happy that you're alright. Gurney has done a great job, apparently._GURNEY: It's my disease, my lord. I just can't stop doing a great job._DUNCAN: Definitely, you old bastard. I can tell you though sire, it was a risky thing. All those worms..._DUKE: Nice uniform, by the way, Duncan. I guess whichever Sardaukar faced you had a hard time losing to you in combat._DUNCAN: Their suit is nice, though._HAWAT: I won't give you my numbers on your survival probabilities in that forsaken region, since they don't matter anymore, but..._GURNEY: Yea Thufir, thanks a lot for that. Let's discuss about the Harkonnen rats._DUKE: The Guild is too weak to be a valuable ally for the Harkonnen. The Baron is not stupid: he knows that. Forming an alliance with the Guild after we're been decimating their forces on Arrakis... Just makes me think he has something else in mind._HAWAT: I would say the same. The Guild is not reliable. The Sardaukar don't matter much, without an Emperor._DUKE: Actually, one of our commanders sent us word that the Sardaukar have fought with the Guild. It seems their alliance is off. Our commander managed to persuade the Sardaukar to work together, as he was also backstabbed by the Harkonnen and the Guild. And they succeeded. _HAWAT: Is this fresh info my lord?_DUKE: Very. Came a few hours ago. Didn't get a chance to let you know, Thufir._HAWAT: If this is the case, then... an alliance with the Sardaukar is no longer without question. _DUKE: I'm afraid it is. Supreme Bashar Garron and their most effective burseg, Varlaz, have been spotted lifting off Arrakis in a smuggler heighliner. They are probably heading to Kaitain._HAWAT: Then their plan is now clear. Hagga Basin was a decoy, to buy them time to strike deals with the smugglers. Also, the Guild base destroyed, presumably, by the Smugglers, was done by the Sardaukar. I knew it was too much just for the Smugglers alone. That's probably how they bought the smugglers. Then, they lifted off to Kaitain, probably suspecting an invasion. Their objective is to protect princess Irulan._GURNEY: Man, this guy never ceases to amaze me. Damn Thufir, you're putting up the pieces together, aren't you?_HAWAT: It was easy._DUNCAN: But if the Bashar left the planet, then..._HAWAT: Other Sardaukar commanders are still here. And might be willing to strike a deal with us. At least temporarily, to defeat the combined Harkonnen and Guild forces._DUKE: Gurney, i'm counting on you for this. I have some Harkonnen forces in Pasty Mesa for you to take out. Recently, a Guild base was also deployed there, probably supported by the Harkonnen. Pasty Mesa used to be neutral territory, so keep in mind Ordos forces are also in the region. However, my scouts reported that the Ordos are focusing on the Guild. You should destroy the Harkonnen and the Guild. The Ordos can be ignored... for now. _HAWAT: Pasty Mesa has a Sardaukar base too. This is secret intel, that I managed to aquire. Most likely the base is not known by the Harkonnen. However, the Sardaukar are fighting the Guild. They might get in contact with the Ordos, and none of the involved parties will hesitate to attack each other. _DUKE: If you get an emmisary to the Sardaukar base, you might negociate a temporary alliance against the Guild. This will, of course, attract Guild's attention on you automatically, and you'll have to deal with them too, besides the Harkonnen_GURNEY: I understand, my lord. I will think carefully and decide the best approach. But one thing I know for sure: the Harkonnen rats will pay for what they did!__========__Objective: Interesting times, when House Atreides considers a partnership with the Sardaukar. Your target is the Harkonnen bases. They must be destroyed. You can decide to get involved in the Guild's affairs and aid the Sardaukar, or ignore them and focus on the Harkonnen. Allying the Sardaukars might prove to be a good decision, however... They are strong soldiers, and will make a difference against the Harkonnen. If you join in their fight against the Guild, they will join in yours, against the Harkonnen. The Guild will have enemies from all directions, so the Sardaukar help might be worth it. Send any unit to their base, as an emmisary, to negociate a temporary alliance, if you wish. In the end, the Harkonnen must be destroyed.
