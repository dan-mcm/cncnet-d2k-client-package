[Basic]
Name=Butlerian Jihad War Machines - Mission 6
Briefing=ORDOS_=======_We have serious problems. The data collected by the Atreides were encrypted, so we have moved them to a more secure base to be able to examine them carefully. While we were deciphering them our base was infected with some type of computer virus.__This virus has caused all our men to lose control of their vehicles and they began to attack all our soldiers until there were no survivors. That is, we have lost complete control of the base and now it is under the control of the Machines. Even the Atreides, who had established a smaller camp with us, have also been affected by the virus.__To make things worse, a watchman base we have in the vicinity is starting to show the same symptoms. We are confident that this virus is the reason that the Artificial Intelligence has spread throughout Arrakis and has infected all bases in such a fast and efficient manner.__Our men tell me that they still have partial control of the vehicles, but sometimes they act on their own. When dismantling our Construction Yard the virus has been temporarily contained, so avoid deploying a new one for now.__We have not yet completely rid ourselves of the virus; you must destroy our old base and the Atreides camp. We hope to be able to analyze the debris in search of sufficient data to combat this threat.__Remember that our base is still partially infected. You will share control with the Artificial Intelligence. I leave you a written report with the behavior that you can expect from our vehicles.__=== DATA REPORT ON I.A. ===_* Any soldier without vehicles will be attacked instantly._* Control of the units can only be done individually._* Vehicles may move to shoot nearby enemies._* Vehicles may retire to repair by own will._* Vehicles may not retreat if they are fighting.__Objective: Destroy the bases of the Machines before the AI ??takes full control. Do not deploy a Construction Yard.__Note: You will share the control of your units with the AI.
Author=Cm_Blast
