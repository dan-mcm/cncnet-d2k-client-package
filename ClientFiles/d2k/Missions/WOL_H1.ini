Briefing=One of the true Harkonnen legends on the battlefield is general Gato Radnor. His amazing strategies helped House Harkonnen fight the emperor and the guild and be successfull. Besides being smart, he also has embraced the Harkonnen ways completely: strength and brutality, no matter what. That is Harkonnen efficiency. The general has been summoned to meet the Baron on his war room.__BARON: Ah, general Radnor. I'm happy you could make it in time._RADNOR: Of course, my baron. Whenever you ask for me._BARON: Enough with the formalities. You know me very well, general. I am a man of action. Talking is for kids. Kids like Duke Leto Atreides. isn't it right, Piter?_PITER DE VRIES: Precisely my dear baron._BARON: General, this is my current mentat, Piter de Vries. Piter, this is general Radnor, one of our best. If you remember, general, I had to... dispose of the previous mentat when he tried to lure you into a trap. He became problematic, and I don't like problems. Let's just say I might have broken a record or two for the amount of days he screamed before he died._RADNOR: That is impressive, my lord. You're giving torture a brand new dimension._BARON: You can be sure about that! But anyway, that's for another time. Now we have things to do. Please, have a sit._RADNOR: I'm all ears my lord. _BARON: This coalition against House Corrino and the Spacing Guild has become useless from the moment Shaddam was killed. Without the emperor, our enemies are no longer a threat. So, who is taking advantage of this alliance that we have, Piter?_DE VRIES: Basically, the Atreides and the Ordos, my baron._BARON: Exactly! See? Told you I got a smart mentat. I guess it's time to fix this. It's time to stop these vermin from feeding of House Harkonnen's military superiority._RADNOR: I like it, baron. I really do. Please, continue._BARON: Oh I knew you'd like it. Which is why I selected you for this job._RADNOR: What job?_BARON: DAMN you are impatient general! Calm dowm... just listen... you'll have plenty of time to blow up some Atreides and cool off. Piter, please explain my brilliant plan to the general._DE VRIES: Our Baron has made a deal with the Guild. _RADNOR: The Guild?_DE VRIES: Yes. They are desperate. For some reason, the Sardaukar have turned on them. They are completely alone here on Arrakis. Whatever forces they have left are being decimated everywhere. This is a perfect moment to use them for our own needs._RADNOR: I believe I see what you mean..._BARON: We will turn on the Atreides. We'll sink their tanks in the sands. And the Guild will help us do this. I've arranged everything. Some of my other capable commanders are spread around vital Atreides border territories. They are acting as they're fighting alongside the Atreides, and are simply waiting a signal to turn their weapons against them. That signal will come from you._RADNOR: From me?_BARON: Yes. You'll deploy and set up a base near an Atreides encampment which is fighting the Guild and the Sardaukars. You'll let the Atreides believe you came to help them. Set up your base in peace, as you'll only have to deal with Sardaukar attacks. _RADNOR: And what about the Guild?_BARON: When you're ready, send a trike or any vehicle to their base. Locate their Construction Yard and let the Guild know you're ready. I have already made the arrangements, they know about our plan and will not attack your emmisarry. Ain't my plan glorious, general Radnor?_RADNOR: Definitely my lord! Will do so immediately.__==========_Objective: The cursed alliance with House Atreides has been going on for far too much. It is time to blow it up. The Baron found the best way to do so: by changing sides. We will take advantage of the Guild's desperation and strike a temporary alliance with them against the Atreides. Your task is to deploy a base close to an Atreides encampment. They will think you are there to aid them against the Guild and the Sardaukar, and you will... at least against the Sardaukar... until you feel ready to turn on them. Once your base is set up, send a unit to the Guild Construction Yard to commence Baron's plan and turn hostile on the Atreides. The Guild will join you. Remember, there are also Sardaukar forces in the region. They must be elimitated as well. Make sure the Guild Construction Yard does not fall. Otherwise, the entire plan is doomed.
