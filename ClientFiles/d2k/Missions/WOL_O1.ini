Briefing=Although a part of the winning coalition, the Ordos took some heavy blows during the Great Spice War. In fact, they took so many blows that the House is very weak and unstable. Neither the Atreides nor the Harkonnen know exactly how weak the Ordos are, but they are aware the Ordos are not a big threat anymore. Despite the dire situation of the Cartel, the best Ordos Executor, Norman Tyle, was called upon by Lora Itami, the best mentat of the Ordos, to meet the Executrix and be briefed about what's next for the Cartel.__EXECUTRIX: Executor, you have arrived in time. That is acceptable. We will brief you on the current status. House Ordos is severely damaged by the war of assassins. That is a statistic. The Cartel is preparing the transition to phase P-V4. That has a meaning: Preservation-Ordos variant 4. Only highly ranked Executors may know about this terminology. That is clasified. You must keep it secret, otherwise you will be executed without question. That is advice._TYLE: I understand. I shall keep it to myself, and myself only, and follow your directive closely._EXECUTRIX: That is wise. Our current situation is calling for a reduction on the military budget. That is an issue for our Arrakis campaign. Currently, our Arrakis assets are secure from any attacks. The chance of a successful enemy attack on our encampments is floating around 4.24%. That is a statistic. However, this percentage is given by the alliance we have with the Atreides and Harkonnen. This alliance has a 73% chance to break in the next four days, because the Sardaukar have no emperor. Mentat Lora Itami, perform the calculation based on the new reports._LORA: Recent reports are showing Sardaukar and Guild forces fighting it out here on Arrakis. It seems their alliance has broken. We do not know the reasons, but this event raises the chance of our coalition's break-up to 96%._EXECUTRIX: That is a threat. We cannot count on the Atreides and Harkonnen anymore. We must recover and hold on. That is imperative. We are weak, and they know it. This means we are no threat to them for now. That is a fact. They will focus their attention on each other, if the alliance breaks in the immediate future. That is certain. We must gather spice and preserve our military costs as much as possible. We must hire mercenaries to fight the battles for us. They are less expensive than using our own war vehicles. That is the directive. Mentat Lora will brief you on your mission.__TRANSMISSION ENDED...__Norman Tyle is a former bounty hunter, who worked closely with Lora Itami back then, Lora being responsible for the preparation and intelligence-analysis part, and Norman, the one executing the mission. After many impressive, but dangerous, missions, such as a bounty on a Sardaukar unit on Salusa Secundus, they decided to find a better way of income. A way which will also give them protection against the Imperial troops hunting them down. Which is why they both decided to join the Ordos Cartel. Relatively hidden, stealthy and insidious: it was the perfect place to be. They received a new look and a new identity, in case they'll ever need to use it: Ordos soldiers are not easy to meet, unless it's on a battlefield. They have both, however, in time, got very good results on their missions. Which has made them a great Executor and a great mentat. One of the best House Ordos possesses. Even so, they did not forget the times they used to work together, and are still relatively close. The Ordos might not know they have often shared information that the other was not supposed to know.__TYLE: Well... guess this sucks. Less budget for war means less budget for us too. _LORA: It is not certain. Our paychecks are the same. I am not seeing a change in that anytime soon._TYLE: You are really a human machine now, aren't ya? They made you an absolute living equation. It is obvious, Lora. It's going down for them. '_LORA: Not so loud! Don't be an idiot. Keep it low, if anybody hears this..._TYLE: What if we move again? I'm sure the Harkonnen would take us, for example. I can see the Harkonnen come back on top, as they used to be. Number one military power, except the emperor. Just that, now, there is no emperor._LORA: The Harkonnen have been damaged by the war just as much as the Ordos. The only difference is that the Baron doesn't care that much about a wealthy Giedi Prime, so he's investing most of the funds into the war on Arrakis. The Executrix... we know how it works, profit, profit and more profit. If they don't make profit, they will chance the strategy so that they do. It's really that simple. You don't have to be a mentat to figure this out._TYLE: So you think they will turn this around?_LORA: They are very smart. I am sure they have something planned already. The Ordos have a ton of secret procedures and emergency plans that they can enable whenever it is needed. Such as now. This P-V4._TYLE: I'll trust my mentat, then. Brief me on my mission._LORA: It's pretty simple, really. There is one small region with a small Sardaukar base. Very lightly defended. In this sector there are also Atreides and Harkonnen forces, focusing on a Guild base. The Guild troops will be overrun soon. Until then, we can be certain that no one will care about us. You'll take a small strike force, attack the Sardaukar base, capture their Construction Yard and set up what is needed for a small mining base. The Executrix wants us to focus on spice mining for now. All Executors are ordered to cease offensive moves which are not meant for spice mining._TYLE: Why don't we let the Atreides and Harkonnen destroy the Sardaukars?_LORA: They have a cease-fire truce with the Sardaukar bashar commanding this small base. That must be because of the alliance break-up of the Sardaukar and Guild. Besides, we need their ConYard. Remember: saving money. Deploying our own would be a loss of resources._TYLE: I understand. It will be executed._LORA: Remember: once you capture the ConYard, you must create our own buildings there. We need Ordos architecture there. We need our special Refineries._TYLE: Sounds like wasting money._LORA: Executrix requirements. Not sure why, but I am suspecting their engineers have some sort of upgraded buildings plans. They insisted all the base is Ordos architecture. I'll set up a team to take you out by air once you're done. If you finish the job faster than they arrive, enjoy the surroundings.__==========_Objective: The Ordos are pretty damaged. The Executrix has decided to go for an emergency state plan. Our target now is spice harvesting. In order to accelerate this, we must capture more sectors with big enough spice fields and with low possibility of enemy attacks. This is why you will take a small strike force and assault an Imperial base to the south-west. The base is lightly defended. You must capture the Construction Yard. Once done, build a Barracks, Refinery and Light Factory. They must be of Ordos architecture: just capturing the Imperial ones will not suffice. Besides, you must also harvest at least 5000 solaris worth of spice. Once all these are done, wait for the escort team (timer) to take you out of the zone.
