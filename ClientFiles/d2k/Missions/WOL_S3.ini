Briefing=LOCATION: Imperial Command base, Tsimpo_================__GARRON: Burseg Varlaz, the intel our man managed to retrieve shows there is a small smuggler encampment relatively close to Arrakeen. That can be our chance to get in touch with them and ask for their services._ZED: Arrakeen? But sir, that is... Atreides territory. That is close to their main base of operations on Arrakis. It's the heart of the Atreides forces! Going through that region is suicide._GARRON: Not neccesarily. Not if we are sneaky, and move quickly. Without alerting the Atreides._ZED: How are we supposed to do that? There is heavy ornithopter activity in the region._GARRON: Does the term "sandstorm" tell you anything?_ZED: Sandstorm? Oh... I see. So we do it before a standstorm, to ensure Atreides aircraft will not get airborne._GARRON: Exactly, burseg. The Atreides ground scouts will also move back to Arrakeen. Nobody wants to be out there in the open before a sandstorm. Especially now, that the Atreides don't suspect any hostile forces in the heart of their territory._ZED: Then we must also be careful not to be caught by the storm._GARRON: Indeed. I will move in and talk to the smugglers, you must be ready to deliver the spice. Now, we don't know yet what they want in return for their frigates, but with the amount of spice we offer them, only a fool would deny.__A Sardaukar soldier enters the room and addresses both Burseg Varlaz and Bashar Garron:__SARDAUKAR: Excuse my interruption. General Garron, our scouts have returned. They have located the Atreides installations in the region, and we have a clear way. There is no need for a contact with the Atreides. However, there are Fremen in the region. Sheltered by the Atreides during the Spice War, they have taken refugee close to Arrakeen. They have a Sietch and a few Atreides buildings that they command to build light vehicles. The Fremen will get in our way._VARLAZ: Then we must fight them. But doing that might make them alert the Atreides about our presence._GARRON: Sardaukar, order the last Imperial Jammer to be deployed immediately. Give me one man to handle the jammer, while I try to reach the smugglers. Any radio comms the smugglers might have must be jammed._SARDAUKAR: At once, general.__Sardaukar soldier leaves. Garron continues:__GARRON: Burseg, you must stand ready with the spice transport. I will send some men to reactivate the small abandoned Imperial base there. It has enough silos for our spice. Protect the silos at all costs. They are vital. Await further instructions from me after i contact the smugglers._ZED: Understood, sir.__========_Objective: Wait for Supreme Bashar Garron to make his way towards the Smuggler base. The Silos contain the spice which will be offered to the Smugglers in return for their services. Protect them. Any instructions Bashar Garron will give you after contact with the smugglers is made, you MUST fulfill them until the timer runs over. It signifies the safety time needed to avoid the deadly sandstorm looming on the horizon. Tactical map available, press the button to view it.
