9=GARRON: Watch out for those Silos, Burseg. We need them!
8=ZED: Hurry up people, snadstorm coming soon, we must take shelter in time!
7=ZED: Sardaukars, take out that Sietch to prevent the Fremen from summoning their brethren.
6=GARRON: Watch out for worms, there are no replacements for your Harvesters!
5=GARRON: Burseg, watch out for sneak Fremen attacks on the Silo!
4=GARRON: Burseg, destroy the Fremen base and Sietch. Use the engies to reactivate our Barracks.
3=Leader: We accept, but you must destroy the Fremen. They cannot find about this deal.
2=Leader: I recognize your rank, Supreme Bashar. You came in person. It is a good deal.
1=GARRON:  We want to propose a deal to you. 100k solaris, for transports to Kaitain.
0=Smugglers: Imperial Sardaukar here?

