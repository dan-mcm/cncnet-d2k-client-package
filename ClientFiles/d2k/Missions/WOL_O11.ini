5=Lora: Redirecting forces returning from Ix to your Starport, Norman.
4=Tyle: Get ready, Tleilaxu scum. I'm coming for your precious artificial spice.
3=Soldier: Sir, enemy scouts discovered our base!
2=Lora: The Tleilaxu forces have been alerted of your presence.
1=Lora: Remember: they don't know you're here... yet. Use this wisely.
0=Captain: Thanks for the rescue, Executor. Everyone, get to work. We're joining the Executor!

