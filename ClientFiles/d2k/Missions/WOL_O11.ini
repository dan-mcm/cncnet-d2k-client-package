Briefing=Tyle and Lora have reunited once again to the base Tyle re-activated during the last mission. They are awaiting orders from the Executrix after sending the location of the enemy research facility.__EXECUTRIX: We managed to locate the partial artificial spice formula. There is a heavily fortified Tleilaxu base in the sector. That is a threat. Launching a frontal assault has a 82.7% chance of critical failure. That is unacceptable. We must deploy a base and set up a powerful offensive. If the enemy will learn of your location, you have 2.78% chance of being successful. That is risk._TYLE: I received the plans and the environmental map. The terrain is snowy plains. That means I cannot take much advantage from terrain either. But there is a small isolated area surrounded by ice and woods. I could use that as a staging area. I could deploy a base there._LORA: That would allow you to stay undetected for a while. According to these plans, Tleilaxu patrols are mainly focused on the plains regions._EXECUTRIX: That is acceptable. There are two Ordos bases in the sector. The Executors commanding those have been captured by the Tleilaxu. They are preparing to clone them and their bases are used as mining camps for the Tleilaxu. That is a threat. The incompetent executors could add up to the Ordos offensive, if their bases can be liberated by the Tleilaxu forces holding the Executors hostages. That is advice. Their incompetence could be overshadowed by the fact they will add numbers to your attack. That is wise._LORA: However, you should avoid their liberation until you have a strong enough force to fight both the enemy occupying their bases and the main Tleilaxu force. If you try to liberate our executors, the Tleilaxu will be alerted of your presence._TYLE: But if I free them faster, I will have their assistance faster._LORA: That is up to you. Choose carefully, based on how the situation on the field is. Also, keep in mind there is a high chance the Tleilaxu scouts will still detect your presence after a while, so you cannot stay hidden for long. Be quick in deploying that base, Executor._TYLE: I will, mentat Itami. I shall bring that artificial spice so that we can gain the monopoly on spice. Or whatever the Tleilaxu were trying to gain._EXECUTRIX: Negative. We shall not use the formula for spice gains. That is the directive._TYLE: Your excellency... Why are we fighting to get it then?_EXECUTRIX: The formula they have here is only a part of the whole. This is not sufficient to develop the artificial spice the Tleilaxu are trying to get. That is a fact. We do not have access to the Richesian artificial spice machines, and there is a chance of 0.31% that House Richese would trade them with us considering we are in open war. That is a fact. We shall use this small part of the formula to act like we are on the Landsraad's side in this matter. That is wise. The artificial spice formula will be brought to the Landsraad by House Ordos, to prove we had nothing to do with it and to cause heat in the Landsraad towards the Tleilaxu. With all the heat this shall generate, we shall then use our second secret weapon: disguise the Shaddam ghola. With the Tleilaxu not being part of the Landsraad, they will not be able to defend themselves from this diplomatically. That is perfect. After the heat that the artificial spice, combined with the Shaddam ghola, will generate, nobody would believe the Tleilaxu if they decide to claim the Shaddam ghola was something we tried to purchase from them. That is the plan._TYLE: That is wise... indeed. A great plan, your excellency. But how do we get to share all these with the Landsraad?_EXECUTRIX: There is a second Landsraad meeting that is under preparation as we speak. That is advantageous. We shall attend this and reveal the Tleilaxu plots to all Landsraad members. That is the directive. We shall wait for the formula, Executor.__Transmission ended...__LORA: Well, that is indeed a great plan._TYLE: I have to admit, it is. I hope the Landsraad won't try to dig deeper about that Shaddam ghola. I am assuming they could track it to us, if they try hard enough. I know Irulan was spying on us and the Tleilaxu._LORA: She didn't find anything, I was told. Oh, one more thing. With the Ixian invasion being a complete failure, whatever is left of our forces are fleeing from the Richesians and the Vernius alike. I will redirect their heighliners to your Starport, if you set it up. Also, these plans show that there is no Axlotl Tank in this sector. They are probably getting ready to set one up and clone our Executors, but for now there is none operational. This means you won't have to deal with their most dangerous gholas. I think you have all the details you need. Go do your thing.__==========_Objective: We have the location of the spice formula. Or, rather, a part of it, but still, it's something valuable. It is stored in an Outpost, inside a heavily fortified base. You must secretly deploy a base, in an isolated area where Tleilaxu scouts will not reach soon. Use the small time of being undeteted to set up your base. There are two captured executors in the sector. Their bases are occupied by enemy forces and turned into mining bases for the Tleilaxu. If you can destroy the occupation, the executors will join you in the offensive. Be advised, though: liberating them will alert the main Tleilaxu base of your presence. But they will eventually discover you anyway, so it's your call. Those executors aren't going anywhere, anyway.  With our forces fleeing Ix like scared children after the massacre they endured courtesy of Tleilaxu, Richese, Atreides and Vernius troops, setting up a Starport will allow Lora to redirect their heighliners towards your location. That's more troops for your cause. Remember, your final target is the Outpost: capture it.
