Briefing=NORTH ENTRANCE_=================_The defense of the Lassoki Capital was a complete success, and now all that remains of the Tleilaxu is the initial base where they landed on the planet and from which they created both the diversion and the offensive against the Capital.__Finishing off the last Tleilaxu stronghold will not be easy, as Sonic Tanks have been brought in as a last resort so as not to be eliminated and they have a large number of Defensive Turrets.__After long deliberations, the Lassoki have decided to access the terrain from the North, a very large terrain where can be built a base as large as needed with little restriction, although It may be needed to build a MCV to deploy a Refinery nearby of one of the Mining Rigs.__The Tleilaxu have discovered the Lassoki's plans and have sabotaged the rest of the Mining Rigs from generating any more Gems while they themselves receive additional resources from two Refineries deployed outside the main base. Destroying these two Refineries would greatly impact the economy of the Tleilaxu.__The Leader of the Lassoki has instructed his army to destroy not only the Tleilaxu base, but each and every unit, including harvesters, so that there is not a single enemy survivor on Seneca.__Objective: Destroy the Tleilaxu base and all Tleilaxu units to drive them out of Seneca for good.__Secondary Objective: Destroy the 2 Tleilaxu Refineries outside the main base to reduce the Tleilaxu economy.

