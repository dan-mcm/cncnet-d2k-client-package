Briefing=SUMMERS' SOLSTICE 04: Strictly Business__MISSION OBJECTIVES:_1. Await communication from Achen Moriaen._2. Meet with the Ordos to discuss their plans._3. Meet the Ordos' conditions. Strike a deal._4. You must survive.__TACTICAL OBJECTIVES:_1. Expand to a new location using your MCV._2. Group Quads with your light Combat Tanks._3. Learn the pros and cons of the various turrets.__BRIEFING:_     Since the Harkonnen settled in at Maqbara Roughs, your profits are down to an all-time low. They're extorting you for more than you're willing to tolerate. So when the viewscreen glares in your eyes, you pray it's not Krillys. It's not. As the light recedes, you see a black-haired, darker than yours, woman looking back.__     "Commander Summers," she greets you.__     "Speaking," you reply.__     Her expression looks dutiful, and her posture, professional. The snake lapel pin suggests some relation to the third Great House said to be playing the Emperor's game. "I am Achen Moriaen," she explains with precise enunciation. "House Ordos seeks your assets and expertise."__     You frown at her. She reactively lightens her expression. "Are you intent on... taking our assets from us?"__     "No," she assures you. "We wish to make a deal. This communication is private - neither your Harkonnen nor your mercenary allies can hear us."__     "Then what do you want?"__     "Ixian technology. Illegal Ixian technology, smuggled en masse to Arrakis."__     You look at her with intrigue. It's not the typical request Sumadi's smugglers deal with, but your crew has seen success in the face of overwhelming odds through unusual tactics. Such as surviving the Atreides' assault by bribing the Harkonnen. You must ask, "And what will I receive in return?"__     "Wealth beyond your imagination," Moriaen replies. "We'll speak on this at length at a later time. For now, we wish to see you on the field. We have built a base near your position. Wait for our communication. Do not come to us yet."__     The screen shuts off on its own as Moriaen ends the call. You don't know what to think of tangling with the third of the Great Houses involved in the war, but this one seems more interested in profits. Like you. You can't be too careful though. You tap the hotkey for Durant and his image comes up on-screen.__     "Rowe."__     "Sabre. My scouts report that an Ordos attack may be imminent. Your forces at Maqbara Roughs prepared for battle?"__     His lips curl up into a smirk. "I thought you wanted the Harkonnen gone."__     "I don't know yet," you admit.__     "They're on alert for any business you might be doing under their noses, you know. They seem to like having you around. Keeping your forces hostage..."__     You acknowledge that with a nod. Durant can be excessively ruthless, disagreeable in that regard, but nothing like Krillys. And his observations are often astute. Invaluable. It's fortunate he has a soft spot for you. "I'm far from fond of the way the Harkonnen show affection. Anyway, if the Ordos do attack, what's the plan?"__     Durant glances off-screen, then looks back at you. "I don't have a strong occupation in the Maqbara Roughs, but I have enough to assist an attack. I'll lend you some LAVs so you can better scout the desert. If the Ordos strike, maybe we should expand to the nearby ridge and strengthen our perimeter."__     "You don't have a spare MCV," you remind him.__     "You expand. You know what I mean."__     "Mmh," you hum at him. "So we'll stage an attack on their base, in that case?"__     He simply nods at you. "Yeah. Help the Harkonnen cause some casualties, and then I'll dedicate my forces to an attack. Before that point, I'm not wasting any men if I can help it. And, Rowe..."__     "Yes?"__     "I think you should pull out of this business with the Great Houses as soon as possible. You might be popular with your men, but Ketua's not convinced you're doing this right. I know you want to keep your men safe, but that's what I'm here for. ...I think we ought to trust he knows what's right."__     You glance away. "Thanks, Sabre," you reply gratefully. "I've been doing the smuggler thing a while now."__    He smiles slightly at you, a gesture caught in your periphery, before closing the link. Again, you're left in the ephemeral, pensive silence preceding a battle almost certain to occur.__    It's difficult to trust that Durant would be enough. The Harkonnen are deterred so little by the mercenary presence, they haven't even bothered to chase his forces from the region, despite the possibility of your rebellion. The favor of another Great House might be the only way out from under Krillys' heel. And this ongoing conflict raging across Arrakis is a far cry from the scattered skirmishes either of you are accustomed to.__    Staring out the Outpost window and idly thumbing the butt of a knife, you sigh. This will get worse before it gets any better.
