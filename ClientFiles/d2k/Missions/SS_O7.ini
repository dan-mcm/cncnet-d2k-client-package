Briefing=Incoming transmission...__DUKE: With the destruction of the Guild Starports the Emperor failed to receive his numerous legions of Sardaukars from Kaitain. The Emperor has been severely weakened. House Atreides has taken over Habbanya Erg and the nearby regions, the Sardaukars were forced to retreat in the Imperial Basin._BARON: Our main attack on the Imperial Palace was a waste of time, as the Emperor was not inside. It was just a distraction._EXECUTRIX: However analysis shows the coalition controls most of the Imperial Basin. The Imperial armies have been weakened, yet not defeated. They are still numerous and dangerous, for they have been aided by the insidious Spacing Guild. That is a threat._BARON: With the remaining forces the Emperor has, it might be possible to breach their capital in the Imperial Basin. My spies have located the Imperial Palace, and have confirmed that the Emperor himself is inside. The rat could be waiting for a transport to take him out of Arrakis, since the Guild Starports seem to be prepared for a dropship._DUKE: The only way to end this conflict is to bring the Emperor to justice. We must capture him and..._BARON: (raging) There's no capture, there's only killing. He must die, by torture, that is his only worthy death._EXECUTRIX: The Emperor must die for the Sardaukars to surrender to the Landsraad coalition. The way he dies is irrelevant for the directive. That is advice._BARON: I'll throw everything House Harkonnen has at its disposal, you would better do the same. The Guild command stronghold on Arrakis is close to the Imperial Palace, and they are getting loads of transports to reinforce their cause._DUKE: You'll have the courage and braveness of House Atreides! The Emperor must fall today!_EXECUTRIX: House Ordos will focus their production and offensive assets to the coalition's cause up to 99% percent. That is the directive. That is the purpose.__Incoming transmission... Stand-by...__EMPEROR CORRINO: Great Houses of the Landsraad, this is your ruler, Emperor Shaddam IV of House Corrino. I am hereby asking you to surrender your weapons to the Golden Lion Throne. If you follow my request, I will show mercy for your Houses and will not seek to eliminate them completely. You, as leaders, have opposed the Ruler of the Known Universe, and will be trialed for this._BARON: (spits on the holo-image of the emperor) This is my request for you, please take it._EMPEROR: Your barbarian gestures will not ease your situation, Baron. You are already forcing my patience._DUKE: Do you honestly think we are stupid? You will take over our Houses either way. If you were so greedy to interfere in a "spice competition" that you created, supposedly as a referee, how could you resist not taking over our homeworlds?_EXECUTRIX: House Ordos does not negociate with the Golden Lion Throne. House Ordos will follow the directive set within the Arrakis Landsraad Coalition consisting of Houses Ordos, Atreides and Harkonnen. That is the final answer._EMPEROR: Very well then, you shall have a warrior's death in the sands of Dune, and you will bring your Houses to ruin and extinction.__Comm-link closed...__BARON: Enough talk... It's time to kick some imperial ass. _DUKE: Long live the fighters!__Objective: Destroy the Imperial Palace; kill the Emperor, once and for all. Destroy all Spacing Guild structures. That is the final directive!

