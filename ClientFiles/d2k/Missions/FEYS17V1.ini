Briefing=SUMMERS' SOLSTICE 17: The Ixian Godslayer__MISSION OBJECTIVES:_1. Protect Aurelianus' research._2. Defeat all Dark Alliance forces._3. You must survive.__TACTICAL OBJECTIVES:_1. Ward against stealth attacks with Shotgunners._2. Mass RPG Quads for a versatile mobile defense._3. Set up Sonic Tanks at choke points to hold them._4. Defend your base with your personal Tyrant Tank.__BRIEFING:_     The Ix claim their Godslayer is the only weapon capable of slaying the abomination. If you had every reason before to save as many potential allies as possible, you have one more now.__     It's good to be back on Arrakis, but things are as bad as ever.__     As your forces approach the outskirts of Wind Pass, Aurelianus greets you on the viewscreen in a tone far too robotic for the gravity of the situation. "Commander Durant, the research is intact. However, enemy forces are closing in. The Sardaukar and I will not hold out for much longer by ourselves."__     "I'll be there soon, Kailea," you assure her. And Atani and the new allies Summers gathered will help, although not Summers herself. She's on a mission to Tsimpo Heights to sabotage a superweapons stockpile. You, on the other hand, have a whole lot of stealth tech to scrap.__     If you and Summers are careful and do what you have to do, you'll meet again at Hajj Plateau.
MissionNumber=17

