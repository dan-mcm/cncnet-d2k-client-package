Briefing=What a great find! At last we have succeeded. We have created a new type of super-sandworm larger, longer and, above all, able to generate spice faster than our harvesters could collect._ _Unfortunately one of our partners, called Edric, is too greedy and now intends to gain full control of the sandworm for its own use. That is something we can not tolerate.__The sandworm is currently on a small plot of sand which he can not escape. You have at your disposal a Construction Yard to create all the buildings that you need. Do not worry, this territory is hidden from the eyes of the Emperor; He never will know what happens here.__Train your own army and destroy the two bases that Edric have built in the area. We are the only ones that can harvest spice, but Edric has in his coffers large amounts of spice that can use to fight for long periods of time. Don’t search for enemy harvester, just sweep away all his buildings.__Objective: Destroy the rival spacing guild member.__Important notes about the super-sandworm:_* He can generate unlimited spice._* He eat 5 times more than normal._* He requires more time to recover his wounds.

[Text]
1=Tip: Attack first the sandworm to harvest without problems.
2=We have prepared you a reinforcement. Build the Starport to receive it.
3=We send some reinforcements for the Starport.
4=Edric has been annihilated.

