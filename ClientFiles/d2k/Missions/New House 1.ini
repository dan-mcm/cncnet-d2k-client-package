Briefing=I am glad that we managed to hire you at the last minute Commander, knowing that we do not have the prestige of the major Houses that are part of Landsraad.__Still we have demonstrated sufficient prosperity and political strength to convince the Emperor that let us participate in the competition for the planet Arrakis.__Our first goal will be a small mining basin of spice, enough to fund technological improvements that will help us in the future. However, we are not completely alone.__Our scouts have detected a small Ordos base near harvesting the spice. Your first mission is to drive out the Ordos and get all spice for our own use.__The Ordos do not have a large army in this territory, but they will not hesitate to attack if they feel threatened. Build your base, recruit an army and kill the Ordos in the area.__Objective: Destroy the Ordos base.

