Briefing=Without the Harvesters the Fremen are cornered. Unfortunately, they found shelter behind a Atreides base and refuse to surrender to us without resistance.__Knowing these Atreides probably accede to pay the Spacing Guild on behalf of the Fremen just to win their approval. To prevent them from doing that we have formed a blockade in front of the entrance to the Base.__The Spacing Guild is neutral in this war. It will not help us but neither help The Atreides or the Fremen. Don't try to destroy them. That would be sheer stupidity.__Thanks to that we have deployed anti-aircraft turrets Atreides can not receive reinforcements while we can. You has permission to expand a base, harvest the spice and build the army you need.__Protecting the turrets is not a priority. If the Atreides forces are too strong just leave and let them to take control of the area. your main objective is to destroy the Atreides and those handful of Fremen who have hidden behind their walls.__Objective: Destroy the Atreides base and all Fremen inside.__Optional Objective: Protect the anti air turrets to continue receiving reinforcements while avoiding the Atreides receive their own.

[Text]
1=An anti-aircraft turret has been destroyed. Atreides will bring some reinforcements.
2=They have destroyed two. Do not let them destroy the third or they will invade the skies!
3=We can't stop the Atreides reinforcements. I hope you can deal with this.
4=The Atreides and the Fremen have been annihilated!
5=Do not forget to strengthen the anti air turrets.
6=I hope you're satisfied. This means the end of the House Harkonnen.

