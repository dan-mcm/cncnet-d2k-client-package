Briefing=DUKE: Commander, your splendid operations close to the Imperial Defence Network have been incredible. The Imperial Basin can now be breached by us and our allies. It is time to push the Emperor, we've been more than enough time on the run. Mentat, brief the Commander on his next mission..._MENTAT: Commander, according to our spies, the main Imperial harvesting facilities are located in sector 4 of the Imperial Basin. If we destroy them, the Emperor will suffer a severe production slowdown due to the lack of funds. Whoever controls the spice, controls the universe..._DUKE: House Ordos will join you in this operation. Pay attention to whatever tricks they might attempt against us, Commander, even though it is very unlikely they will betray us a second time considering the current desperate situation we are all in. Long live the fighters!__Objective: Destroy all Imperial Harvesters, Refineries and Silos. Good luck.

