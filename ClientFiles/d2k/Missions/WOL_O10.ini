Briefing=After a long and costly battle, Tyle, along with the capital forces controlled by the Executrix, managed to destroy the sieging Tleilaxu bases. The capital has been severely damaged, but the Tleilaxu offense has been stopped all around Draconis IV. With most of their forces focused on the capital, the Tleilaxu seem to be on the run now.__EXECUTRIX: Executor, there is no time to rest. With the Tleilaxu on the run, we must take advantage and gather more information about their artificial spice melange. Mentat Lora will brief you on your mission. That is the directive. We have signed your contract and have raised your paycheck due to very satisfactory performance for the capital defence. That is the directive.__Transmission ended...__TYLE: Well... not the talkative type, I see..._LORA: I guess you are happy now. We both got our raises._TYLE: A huge raise, apparently. Yes, I am happy. It's finally the sum we deserve for all the amazing stuff we've been pulling for them._LORA: More amazing stuff is to come. According to our spies, the Tleilaxu have a small part of that artificial spice chemical formula being developed right here, on Draconis IV._TYLE: Why would they do that here?_LORA: I guess they were expecting Ordos forces to collapse and get control over the planet. It would be less tempting for Irulan to spy for anything crazy on Draconis IV compared to their own homeplanet. I have failed to see any other reason besides the fact that they are trying to move the formula to either Arrakis or Tleilax. Which has a much higher chance of being real than the first theory. Still, why it is here in the first place is unknown. Not that it matters that much anyway._TYLE: Just tell me where this formula is being developed, and I'll bring you all the data._LORA: We don't know yet. It has been communicated under secure Tleilaxu channels. But we have a location of an Outpost that was used to communicate with the location where the formula is developed. If we can capture that Outpost, we can track their research base. And assault it._TYLE: Is this approved by the Executrix?_LORA: "That is the directive", actually._TYLE: Alright, sounds good to me. Tell me about the positions. Where can I deploy?_LORA: We cannot afford to set up a full base. The Outpost is located deep in the woods. You must take a small force and push through the trees. There are several small Tleilaxu mining facilities, lightly defended. You'll have to push through them and reach an abandoned Ordos mining base to the south-east. You must capture the Barracks and bring the base and its turret defences back online. Once done, you can capture the rest of the base by training more Engineers. The Outpost is located to the north, inside a Tleilaxu base._TYLE: It will be done._LORA: I have news from Giedi Prime. It seems the civil war is coming to an end. They say that general who helped you on Arrakis, Radnor, managed to repel the besieging rebels in Harko City._TYLE: Yea, amazing... So the baron is still rollin'_LORA: For now... Who knows when his still-loyal son will stab a knife in his back... With the Harkonnen it seems anything is possible._TYLE: Ok, I'll go get that Outpost._LORA: Once you have the location of the research base, we will start thinking of a strategy to assault that base.__==========_Objective: With the capital siege relieved, the Tleilaxu are falling back. Shattered by the defeat, their offensive has ceased all around the planet. Now it is time to strike. There is information that a part of the artificial spice formula is developed in a research facility on Draconis IV. We don't know the location, but we know about an Outpost which has a track of it. That Outpost must be captured. We cannot afford a full scale attack due to the terrain: deep woods. You will take command of a small squad: few tanks, missile tanks, a siege tank and a few men. We will provide you with a few Saboteurs and an Engineer as well. With this squad, you must push through the small, lightly defended Tleilaxu mining bases and go through the woods to reach a small abandoned Ordos base. Use the engineer to capture one of the Barracks and enable the base and its defences. Once done, you can train more engineers to capture the rest of the base. The Outpost is located to the north. Assault the base and capture the Outpost. That is the mission. Use your Saboteurs wisely, you have only 4 available, so perhaps you should think what enemy structures or defences you might want to blow up: not all enemy defences require the use of a Saboteur, some can be destroyed by smart positioning of certain units that you posess. But you're the renowned Executor, you'll figure it out eventually!
