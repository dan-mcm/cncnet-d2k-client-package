Briefing=The Emperor's plans have not gone as expected. With his great city demolished by the Lassoki raid and the alternative plan to import special vehicles from Ix that did not give the satisfactory result he has been defeated and humiliated in ways he did not think were possible.__With his forces greatly weakened, the Emperor did not have many options left, so he opted for the strategy that offered him the most probability: The Blitzkrieg.__He gathered all the army and money he had available and quickly built a very basic base with what little he had left, but enough to generate military units as soon as possible, in order to launch offensives against the four members of the Coalition and conquer as much ground as possible in order to expand their domains by taking advantage of the surprise factor.__None of them expected an enemy attack inside the planet, so they lack an army prepared for an offensive of this caliber. They need to endure the Imperial offensives, and it is enough that one of the four members of the Coalition falls for the entire Coalition to be defeated.__Luckily the Lassoki are in the rear of the Emperor's position, which gives them a reasonable time to build enough forces to repel the first offensives and protect their companions until they can recover from the initial losses.__On the other hand, this battle offers the four allies an opportunity to end the war once and for all, as the Emperor himself has come to lead his troops. If the Imperial Palace is destroyed they will be able to capture him and Arrakis will belong to them with no one to oppose them.__It will not be an easy task. The Emperor has brought along his Sardaukar personal elite, far better equipped for battle, both in weaponry and protection (Read intel for detailed information).__In addition, somehow the great influence of the Emperor has managed to update Law 30-A so that it applies in Dune as well. This means that neither side can use heavy vehicles to crush the infantry. This benefits the Emperor, but the Coalition can also take advantage of this rule.__The Emperor is desperate, and the Coalition wants to finish the conquest of Dune. Only one side can be victorious, and everything is decided in this last battle.__Objective: Destroy the Imperial Palace. None of the four members of the Coalition must be destroyed.__Note: All building and unit upgrades are available from scratch. Infantry cannot be crushed with heavy vehicles.

