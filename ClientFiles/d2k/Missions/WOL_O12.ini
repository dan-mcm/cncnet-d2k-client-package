Briefing=Tyle has been awarded a bonus payment by the Executrix, besides the recent contract payment raise, for what seemed to be classified as "above all expectations performances". With a part of the artificial spice formula in our hands, we can now once again influence the future of the Landsraad and the Imperium. The Executrix has requested a secure connection with Tyle and Lora, for some new orders:__EXECUTRIX: Time is of the essence. That is a fact. Bene Tleilax forces are retreating en-mass from Draconis IV. Most of our other Executors are focusing on killing any fleeing Tleilaxu living being. That is good. Executor, you shall take a much more important role._TYLE: Awaiting orders, your excellency._EXECUTRIX: Princess Irulan Corrino and her CHOAM friends are once again planning a Landsraad council meeting. This is well known between all Landsraad members, as it seems, but the Tleilaxu are also aware of it. That is a threat. Our spies informed us the Tleilaxu might attempt to reveal our plans for the Shaddam ghola to the Landsraad. With proof being our never-signed delayed-on-purpose by the Tleilaxu contract. That is bad._TYLE: Well, if it was never signed, that means we never technically purchased it._LORA: It is still enough to trigger some in-depth investigations of the situation. I'm sure Irulan can't wait for it._TYLE: How will the Tleilaxu present this before the Landsraad? They are not a part of it, nor are they part of the power pylons in the Imperium._EXECUTRIX: They will go to Kaitain and present the situation to the princess herself, before the Landsraad meeting. That is unacceptable. We must get rid of their proof. My spies reported that Bene Tleilax is sending a ghola embassador with a Guild heighliner to Kaitain as we speak. He has all the data that can serve as proof for this matter. He must be killed, along with any proof of our involvment in the Shaddam Ghola matter. That is the directive. We shall use this against the Tleilaxu soon after._TYLE: But if he is getting on board right as we speak, how can we stop him? Going to Kaitain and assassinating him there is a very risky move, in my opinion._EXECUTRIX: That is correct. We shall board the heighliner with our own forces. We have paid a considerable amount of credits as bribe for the Guild, to redirect the course and visit Draconis IV before moving on to Kaitain. Under the pretext that we want to transport some troops towards Arrakis. The heighliner will visit many important planets, such as Caladan and Giedi Prime, so expect other Houses being on board as well. That is advice. We have intel of Richesian forces on board. The heighliner does not visit Richese, so we suspect they are moving towards Arrakis. That is a threat. They are most likely aiding the Tleilaxu forces over there in developing the artificial melange._TYLE: I can board the Heighliner and kill that Tleilaxu embassador, sure, but that would be a violation of the Guild transport guidelines._EXECUTRIX: The Guild was bribed to ignore this conflict. That is good. Avoid other Houses. Do not kill any of their men, or take any hostile action towards them. That is the directive. You must locate the Tleilaxu region on the heighliner. We were told the embassador and all the data serving as proof are located inside a small Outpost. Destroy it to kill the embassador and their data. The Guild will present this as an accident, if anyone will ask questions. That is the mission. Mentat Itami will add more details, as she has received our notes already and had time to investigate while we were talking. That is the directive.__Transmission ended...__LORA: You should know that, according to the Executrix's intel, there is a 92.2% chance the Tleilaxu are being paranoid about this, since the course of the heighliner has been changed to Draconis IV to "pick up an Ordos transport". They believe Tleilaxu forces have hacked some of the heighliner defences, and will fire on sight upon any Ordos units, with or without any Guild bribing to cover for them._TYLE: Then they are truly desperate._LORA: Of course they are. This is their only chance to reveal our plans with the Shaddam ghola and get all the heat on us. Which is exactly what the Executrix has already planned to do as well, but with the Tleilaxu. We must make sure we win this covert speed contest._TYLE: Don't worry, I'll kill any Tleilaxu scum on that heighliner who gets in my way. If the Guild is covering me, and lets me blow shit up the way I please, then there's nothing else I can ask for._LORA: Remember, do not engage other Houses. The Executrix believes House Richese will shoot any Ordos troops on sight as well. So whatever you do, stay away from the Richesians. While the Atreides, Harkonnen and Sardaukar will not open fire upon you unless you kill someone in their camp, the Richesians have a high chance of being hostile._TYLE: Why would they risk being heavily fined by the Guild? They shouldn't know about the Shaddam ghola, from what I am aware of._LORA: I guess the Tleilaxu have some twisted version of the story where we're trying to blow up their artificial spice plans over there. Or whatever. Does it really matter anyway? We're not sure about their hostility, but it's best not to try it._TYLE: Got it.___==========_Objective: With the Tleilaxu armies being defeated and decimated on Draconis IV, the desperate bio-engineering masters are trying to put the blame on our heads by sharing our purchase attempts of the Shaddam ghola. Well, we did indeed plan for this, but this is not the variant we will tell the known universe about. The Tleilaxu ghola embassador has boarded a Guild Heighliner moving towards Kaitain, besides some other planets. He is trying to reach princess Irulan Corrino and present some questionable proof about our initial desires. This will not happen, because of you. You will board the heighliner as well, as the Guild has been heavily bribed to allow this, and also allow a little conflict, or should we say, accident, on the Heighliner. Be advised: Tleilaxu forces are paranoid due to the delay of taking transports from Draconis IV, and are believed to have hacked some of the heighliner turrets close to their position for protection. You can freely kill any Tleilaxu on the heighliner, as the Guild has your back. Avoid other Houses, though, especially the Richesians, who are believed to be hostile, while the other Houses will not attack you unless you kill their men. The Tleilaxu embassador, along with his data serving as proof, are located in an Outpost, in the Tleilaxu region of the Heighliner. You must locate this Tleilaxu sector and offer the embassador a trip to the other life, along with his proof. Blow up that Outpost, Executor. That is the mission.
