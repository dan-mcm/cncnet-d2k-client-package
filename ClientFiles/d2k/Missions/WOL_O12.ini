4=Tyle: This is it. The Tleilaxu camp. Let's blow up that Outpost, people!
3=Tyle: Seem this is the Richesian camp. Stay away, they are hostile and might engage.
2=Tyle: Ah, the mighty Sardaukar! Not today. Move forward, everyone!
1=Tyle: Seems like we spotted the Harkonnen camp. Keep searching, people!
0=Tyle: That's the Atreides zone. Ignore it, move on.
5=Lora: Remember, don't kill any other men other than Tleilaxu, or they will retaliate.
6=Tyle: Stay sharp. Tleilaxu scum are roaming around the Heighliner.

