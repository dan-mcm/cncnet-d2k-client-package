Briefing=SUMMERS' SOLSTICE 18: Summers' Solstice__MISSION OBJECTIVES:_1. Pillage Research Centers, gold ConYards, & SLashers._2. Capture & protect a light-color Dark Alliance ConYard._3. Prevent the awakening of the Emperor Worm._4. Kill Achen Moriaen._5. You must survive.__TACTICAL OBJECTIVES:_1. Protect Sabre Durant._2. Prepare for a devastating early attack._3. Establish forward bases as you claim land._4. Position LRA behind armor or fortifications.__BRIEFING:_     Things are quiet at your forward base below Hajj Plateau.__     Durant is on your display. "Rowe. Power limiters are in place and all systems check out on the prototypes. They're operational."__     Prototype Storm Lashers. The closest you've come to successfully replicating the strange technology, though rarely and not without their potentially explosive faults. Your best bet for getting your foot in the door, for building up your base in peace. They worked well enough on your prior missions, so two are already built.__     "I've finished making my arrangements," you reply. "Atani's filled our Spice coffers. The Ix configured our factories for the best tech, and the Sardaukar and Fremen will send all the help they can." And you'll need it. "...Moriaen definitely knows we're here. The Fedaykin have spotted gholas scouting our base."__     "She's probably prepping defenses," Durant reasons. "We know the Emperor Worm is asleep beneath her main base here. This is her last chance to stop us, and all she has to do is defend herself."__     She'll use everything she has. Will everything you have be enough? You know Moriaen well by know. The mastermind behind the death of the reigning emperor, the instigator that pit you and the Ordos against each-other, all in an effort to stall for time. There isn't much time remaining. A couple of hours, at most, to wreck her Command Center and collapse her base upon the abomination. Disrupt its awakening. Only then will you have the breathing room you need to escort the Ixian Godslayer there and finish the job.__     Sensing your apprehension, Durant assures you, "This will be our toughest battle. Don't let that bother you. I've got your back. Together, we can do this."__     The rock rumbles. Something is coming.__     You exhale, then nod firmly. Together, you can do this. Though the cornered animal will fight most fiercely at her end, she is battered and bruised. You are the final line between salvation and armageddon. You cannot fail.
MissionNumber=18

