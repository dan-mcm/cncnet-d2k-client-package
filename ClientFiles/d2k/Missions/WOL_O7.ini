Briefing=After his decisive intervention to defend the most important Starport in the region, Tyle has yet another difficult task to take care of. The "malfunctioning" Tleilaxu forces are pushing towards the main capital. The coordination of executors present on Draconis IV is vital for this. After the success with the Starport, Tyle spent the next week fighting Tleilaxu forces which were gathering up to attack the surrounding sectors, to ensure the Starport will remain operational.__LORA: That Starport you saved is already helping a lot. We're getting shipments from Arrakis continuously._TYLE: We should rally the local Executors and coordinate. Fighting separated all over Draconis IV is not the greatest idea._LORA: We're trying to do that. Which is why you must move quickly and reinforce a vital Outpost. If that falls, we won't be able to coordinate with other Executors in the region. The base is under heavy attack, and it won't last for much longer._TYLE: Alright, I'll go._LORA: I also have your contract ready. The Executrix ensured everything is ready and that your new payment is already in effect._TYLE: Well that's one great way to motivate me!_LORA: There's also more stuff. The Tleilaxu are still claiming that it's a pure accident, but we have analyzed the situation and we're sure, towards 98.7%, that this is a plot._TYLE: Do we know what kind of plot? What is their target?_LORA: I received news from the Executrix a few hours ago. It seems the Executrix has been suspecting a possible plot for a while already. The delay on the purchase procedure for the Shaddam ghola... The amount of military vehicles and men they sent over to Draconis IV, presumably to "ensure" their cloning procedures will be kept under control..._TYLE: Fishy, indeed. But apparently they have done nothing about it. I mean, we wouldn't be in this situation if they did, right?_LORA: They did, but it wasn't as efficient as they probably believed. They were spying on the Tleilaxu. However, results came in relatively late. But they are big: very big._TYLE: I'm all ears._LORA: The Tleilaxu are trying to develop an artificial melange on Arrakis. To replace the spice._TYLE: What? Holy crap, is this for real? This is a game changer._LORA: Indeed. And it seems the Tleilaxu are also suspecting that we have knowledge of this, hence why the current "malfunction" of their gholas. However, they wouldn't be able to replicate whatever formula they've found for the artificial spice without the necessary tools and technology. And who do you go to ask for technology when in need?_TYLE: Ix. Unless... you have some sort of..._LORA: Old rivalry with them? Exactly, you got it._TYLE: House Richese. I thought they had nothing to do with each other until the Executrix brought them together for the invasion of Ix. _LORA: It seems they were already plotting together. It started quite possibly right after the death of emperor Shaddam IV._TYLE: What does House Richese sell to the Tleilaxu, in terms of technology for that fake spice?_LORA: We are not sure yet. Details are still to be gathered. Our spies are working non-stop. However, we're almost certain the Richesians have no idea about the secret Shaddam ghola._TYLE: Which, lemme guess... Will go to the Tleilaxu, after all. I mean, if you say this is a plot, there is no way they will still sell that thing to us._LORA: Probably._TYLE: So Executrix's plan goes 'poof'. Maybe it's still not too late to sign with the Harkonnen._LORA: I don't think you'd want to do that. Let me bring you fresh news from Caladan: House Ginaz has joined House Atreides in the defense of Caladan. Whatever gains the Harkonnen and their allies managed to gain on the main continent are being heavily contested by the Atreides-Ginaz alliance. I made some calculations, and I believe the Atreides will start to push them back soon. The Harkonnen blitzkrieg operation was stopped, and now Atreides forces are retaliating all over the planet. The mighty Atreides Navy, their Golden Armada, is laying waste to Harkonnen and Moritani fortifications around the coasts. And the main threats for the Harkonnen: the Atreides air bases, were not neutralized completely: one is still operational, and the Harkonnen siege has failed. They are being blasted by both the Navy and the Atreides aircraft._TYLE: You seem to have all these details... were you there or what? How do you know all these details?_LORA: My spies are the finest in the known universe. Of course I have them infiltrated everywhere. Even on Caladan._TYLE: Ok... so the Harkonnen are a no-go. Fine. Maybe join the Atreides... you just said they are winning, and might get the Golden Lion Throne as well._LORA: I'm sure Duke Leto will gladly take someone who betrayed their former leader. Don't confuse Vladimir Harkonnen with Leto Atreides._TYLE: Or we can stay and fight for this Executrix, who seems to lose it all._LORA: We have plans to recover from this._TYLE: May I ask what kind of plans?_LORA: You may. Doesn't mean I'll tell you now. You have more important matters to attend for now. That outpost must be saved asap. I'll just tell you this: we have reports of Imperial investigations regarding Tleilaxu activity. Irulan is sticking her nose, trying to sniff Tleilaxu plots. Don't ask me why is she suspicious about the Tleilaxu, but that's useful for us. Let her sniff around, find out the bad things they are planning to do. They'll never find out about the Shaddam ghola, though. That's our secret card._TYLE: I'm sure she will immediately believe that's her REAL father, won't she..._LORA: Oh, no, she would be outraged. Which is exactly what we want.__==========_Objective: The malfunctioning Tleilaxu units are still wreacking havoc all over Draconis IV. We must ensure they do not destroy the Outpost in the region. That will allow other executors to rally and organize a counter-attack. The Outpost is relatively isolated in a small base close to the forests, but the base is under heavy fire from Tleilaxu forces. You must take control of the small forward base in proximity of the Outpost base and secure it. Your own Outpost is not sufficient: the Outpost controlled by local Ordos resistance is the target. Whatever happens, the Outpost must not fall. Repel the Tleilaxu siege. Once the Outpost is secure, consider destroying all Tleilaxu structures and remove the threat from the sector. The other executors will finish the job once they can group up. Your initial position is lacking resources, so consider expanding to the east so that you can gather more resources. There are three Tleilaxu encampments: one small Axlotl Tank close to the Outpost, which must be destroyed to stop the Tleilaxu cloning of Sardaukar and Fremen, the main base, located to the south-west and a small forward base to the east. Destroy all of them. Remember: the Outpost must remain operational at all times. We managed to redirect Arrakis reinforcements towards your location. They should be ready to deploy once the timer runs over. If you want to make use of them, ensure you build and maintain a Starport in your base.
TextUib=DraconisText.uib

