[Basic]
Name=Butlerian Jihad: The End Of The Butlerian Jihad
Author=Cm_Blast
Music=ROBOTIX.AUD
SideId=1
Briefing=EMPEROR_=========_This has gone too far. My Father, the former Emperor, died trying to use the Machines against the Atreides, Harkonnen and Ordos. Now, after all that has happened in the great conflict against the Machines, the Ordos are doing the same and believe that they can achieve a different result.__I cannot consent to history repeating itself. I know that our army is still very weak after that battle, but now that the Atreides and Harkonnen have failed in their attempts to stop the Ordos and their Machines, I have no choice but to intervene, with the few available forces we have.__The situation is as follows: The Ordos are heavily entrenched and their Spice production is unlimited thanks to the number of Sandworms they are holding captive producing Spice for them. Additionally, they have built numerous Artificial Intelligence controlled bases designed to mass-produce combat units.__We know that they use them to reinforce their own defenses, but that means that the Machine bases themselves have less resources allocated for their own protection, so much so that they will not even repair damaged buildings. They are the perfect target.__The first thing you will do when entering the territory is to move north from your position. You will find an Ordos Modified Outpost that contains very useful strategic data inside. Eliminate the Ordos guards who protect it and capture the buildings using our Engineers. They will extract vital information from the battlefield.__Once you have taken control of the zone I will send you a MCV so you can deploy a base. Meanwhile we will decrypt the data to know the position of the different bases of the Machines. For each base you destroy I will send you a new MCV and more reinforcements so you can expand your domains. You will need it because the spice in the field, without Sandworms in the surroundings, will end up running out sooner or later.__With the destruction of all those bases the Sandworms will be released. With them free the Ordos Harvesters will find themselves at the mercy of the beasts appetite and their economy will be blocked, forcing them to spend their stored reserves. Once their Silos are empty they will not be able to build more vehicles, repair damaged buildings, or rebuild lost structures. That will be the perfect time to deliver the coup de grace.__I remind you that the Modified Outpost will not only reveal valuable information to you during battle, but we need it intact at the end of this conflict. We will use its sensors to ensure that not a single machine escapes alive and wipe them out once and for all.__Get ready Commander. We must make amends for my Father's mistake. Destroy the Machines and their Ordos owners once and for all; and end the Butlerian Jihad for good.__Objective 1: Capture the Ordos Modified Outpost to the North. This Modified Outpost must survive.__Objective 2: Destroy the four outer bases of the Machines to free the Sandworms.__Objective 3: Destroy the Ordos base.__Optional Objectives. Build the Starport to receive Devastators. For each base destroyed a MCV and additional units will be delivered.__Notes: The Modified Outpost does not replace the normal Outpost; You will need to build it as well to access all possible technology. Machine's bases will not repair their buildings if they are damaged. There are no Sandworms around that can attack your Harvesters, but that will limit the amount of spice available in the long run.

