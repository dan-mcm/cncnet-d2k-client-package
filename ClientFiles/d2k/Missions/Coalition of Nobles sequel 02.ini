Briefing=The Tleilaxus with their tricks escaped using a Frigate and have landed on Dune. The Lassoki have located the area where they have landed and have rushed to intercept them.__The Qaii have already had some hostile encounters against them and, because they were not ready for battle, some of their less prepared bases have been overrun and captured by the Tleilaxu already.__Right now the Qaii are being attacked again in this new territory. The Lassoki are about to arrive with their MCV and collaborate with the Qaii to stop the Tleilaxu advance.__None of them know the real reason why they are here, much less without the approval of the Coalition. Perhaps the Spacing Guild of Navigators had something to do with it, but they don't have time to check now.__For now the Lassoki and the Qaii will once again join forces to fight a new threat and remind these enemies of what happens when you go up against the Coalition.__Objective: Destroy the Tleilaxu.

