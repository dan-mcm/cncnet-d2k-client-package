Briefing=SUMMERS' SOLSTICE 08: Mercenary__MISSION OBJECTIVES:_1. Defeat all enemy forces in Bilar Slopes._2. The Ordos must not be defeated._3. You must survive.__TACTICAL OBJECTIVES:_1. Spread Rocket Turrets around your base._2. Mass anti-infantry units against the Fremen._3. Destroy the Imperial expansion to the west._4. Defend Durant as he establishes a base.__BRIEFING:_     Before all that remains of the smugglers of Arrakis, the truth was laid bare. Your ambition, your pursuits, are their future. The aftermath of the Battle of Hole-in-the-Rock weighed heavily on you for hours. Through your silent, sober pondering on the Carryall ride to Bilar Slopes, where Moriaen has need of you next, you discerned only one option left to you.__     Your only hope for stability, let alone peace is to usurp the Emperor himself.__     The Ordos are key. This can work out so long as they ascend to the throne. Houses Atreides and Corrino, who are arming the Fremen en masse near the peak, must be quickly stopped. Even with Durant's help, the Ordos will be severely outmatched. Your forces will tip the scales.__     The smugglers welcomed the Ordos scouts at your command. As for the mercenaries, you haven't spoken with Durant since your duel on the Heighliner. When you call, he's looking back expectantly. His solemn expression suggests he doesn't anticipate forgiveness. And he must have heard about Sumadi.__     "What's the plan of action at Bilar Slopes?" you ask flatly.__     He simply replies, "Moriaen wants me to join in once the enemy's weakened. When you've secured a good location, I'll fly in an MCV and set up a forward base. I'll need cover if you want me in the game for very long."__     The rock island to the west seems perfect for that purpose. Once the Imperials are cleared out, at least. "Fine. Be ready." You end the transmission before leaning back. Your command unit is waiting just outside the Outpost.__     The thought of Fremen and Sardaukar fighting side by side is mind-boggling. The mightiest forces in the Known Universe stand against you. And after all that's happened, it feels as though you're back to square one.__     You cannot turn from this path. You'll walk it to end the war.
MissionNumber=8

