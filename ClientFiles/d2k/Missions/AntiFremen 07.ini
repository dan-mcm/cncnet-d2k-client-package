Briefing=The Padishah Emperor Shaddam has come to Dune to ensure that we succeed in our campaign against the Atreides. He asked me to give him my best Commander so you will serve the Emperor as much as he needs.__------------------__I, the Padishah Emperor Shadam willingly receive the best strategist Harkonnen. I'll see if you are worthy to serve in my team. Now listen, I will put up with the mission.__Thanks to the resources and contacts I have, I could deploy on Arrakis very quickly. My Sardaukar, in a blitzkrieg have captured many Fremen who have held in different barracks.__Your master the Baron Harkonnen has made me aware of the Atreides/Fremen alliance. It is expected that not only the Fremen but also Atreides will attacking together to try to rescue the hostages.__Take command of the base from which we've provided, build what you see fit and strengthens every barracks nearby. Our enemies will aim against the barracks, not the main base.__Objective: All the surrounding barracks must survive (the barracks within the walls doesn't count)__Hint: It isn't necessary to protect the main base against enemy attacks.

