Name=War of the Landsraad - Ordos Mission 6
Author=Feda
Music=ENTORDOS.AUD
Briefing=Tyle is standing over the ruins of the Ixian base, along his Richesians and Tleilaxu gholas. Upon returning to the Ordos base, he receives a transmission from Lora, from Draconis IV.__LORA: Tyle, you are ordered to immediately return to Draconis IV._TYLE: What? I thought I had to lead the Ordos side of the invasion of Ix._LORA: Things have changed. More Tleilaxu facilities are starting to... "malfunction". This is becoming a serious threat. The Tleilaxu claim this is caused by an error in their genetic code, but we are skeptical towards that. It certainly doesn't look just like an accident. It seems it happens in very strategic locations._TYLE: Ok, but what about Ix?__Transmission started...__EXECUTRIX: Executor, you are ordered to retreat to Draconis IV immediately. That is the directive._TYLE: As you order, your highness. What should I do with the forces on Ix?_EXECUTRIX: You will let most of the gholas and Ordos hired soldiers there. We have assigned others Executors to command them. We have to prevent this operation to look like a retreat. That is imperative. We suspect the Tleilaxu malfunctions could be a potential plot. There is a 47% chance it is related to Shaddam's ghola. That is a threat. If the Tleilaxu will not fulfill the obligations set in the contract, we shall fight them. That is the directive. Mentat Lora will brief you on your mission, once you land on Draconis IV.__Transmission ended...__TYLE: Or how about we just leave and maybe move to the Harkonnen or something..._LORA: Are you going to start whining again? You're lucky my transmissions are always fully secured._TYLE: I've heared their invasion of Caladan is going pretty well, they have disabled key points in Atreides naval production and trade and have taken the southern continent of Caladan. Now tell me why wouldn't it be better fighting for the baron?_LORA: I thought you trusted the Executrix and their plan._TYLE: I kinda did. That was before you telling me the Tleilaxu are trying to screw us. Basically, the big mighty plan of the Executrix was based on that freakin' Shaddam ghola. Now it seems we'll never get that. Or at least, this is the vibe you are giving me._LORA: This is what we believe. I, personally, believe the Tleilaxu are trying to take control of Draconis IV AND Ix, at the same freakin' time. Only that, for the first, we openly invited them to, given them facilities and other shit, just to buff our manpower._TYLE: Now you sound like you agree with me too, haha._LORA: Logically, I could agree. Probabilities are going towards your version of "what's better now". But money doesn't._TYLE: What do you mean?_LORA: Here. I'm sending you the new contract. They didn't mention it, but it's there already. You'll sign it on Draconis IV. Just have a look at the raise.__Tyle is shocked.__TYLE: Holy shit. So now, out of a sudden, they have money to offer such a crazy-ass raise? This is interesting..._LORA: Obviously. When danger looms next to you, you realize people can desert and move to the winning side. Which is why you increase their payment. It's the Executrix, they know what they do. And they have the wealth to do it._TYLE: Well, just tell me where to go. I'm setting up for Draconis IV._LORA (laughing): Wow, really? That easy?_TYLE: What can I say, this is a raise you would only dream of... I mean, even if we act like true Ordos in front of the Executrix, behind the scenes we both know we're former bounty hunters..._LORA: The Harkonnen would never pay one of their generals such sums. I guess your mercenary spirit is showing up right now. And to think you were making fun on my mercenary friend, Sabre Durant..._TYLE: Screw that guy. I'm sure he's still trying to get you out to dinner, on the sands of freakin' Arrakis._LORA: Get your underwears on and move to Draconis, I'll brief you when you get here.__==>_After landing on Draconis IV_==> __LORA: Alright, so the situation is escalating continuously. It has gotten worse since we last talked on Ix. The Executrix ordered you to move in and secure the Starport in sector O4V. It is vital for our Arrakis reinforcements. We're bringing more forces from Arrakis, to ensure this does not get out of hand. Be advised, the Tleilaxu malfunctioning gholas are already attacking our bases in the sector. Take your small force and destroy the Axlotl tanks to the north-east. Once those are gone, I'll airlift an MCV. Use it to defend the eastern base and, more importantly, the Starport. It must not fall. You must then destroy the malfunctioning Tleilaxu base to the south-west. Good luck._TYLE (joking): Where's my contract?_LORA: Very funny._TYLE: I heared the Harkonnen, Moritani and Mutelli moved on to the main continent on Caladan. This looks bad for the Atreides. Without that contract, I'm still interested in that._LORA: Go and do your thing, you'll sign the damn thing when you get to the Executrix. Be advised, the malfunctioning Axlotl tanks seem to clone dead Sardaukar and Fremen... Yeah, you'd think this looks like a pure accident, right?_TYLE: Sardaukar AND Fremen? Damn... Ok, this won't be easy.__==========_Objective: It seems the perfect plan of the Executrix is not so perfect after all. The Tleilaxu Axlotl tanks deployed on Draconis IV to create our ghola armies are starting to malfunction. The Executrix believes this could be a Tleilaxu plot to take Draconis IV and Ix for themselves. Speaking of Ix, you're ordered to leave most of the army there, under the command of less experienced Executors, and relocate to Draconis IV. Your objective is the Ordos Starport in sector O4V. It must remain operational to allow reinforcements from Arrakis. The Tleilaxu are already attacking our facilities in the sector, so time is of the essence. Take advantage of local Ordos resistance to fight attacking Tleilaxu forces. Be careful: Tleilaxu forces are cloning dead Sardaukar and Fremen. Use your little attack force very carefully. Move to the north-east and destroy their Axlotl tanks (barracks) there. Once done, an MCV will be airlifted close to the Ordos Starport, along with some more reinforcements from Lora. Build a base and destroy the malfunctioning Tleilaxu base. Ensure the Ordos Starport from the local resistance forces does not fall. Help the resistance if they require.
SideId=2
TextUib=DraconisText.uib

