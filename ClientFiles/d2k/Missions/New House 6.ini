Briefing=So the Ordos used a cloacking device huh? don't worry Commander, we have equipped our outpost with a improved detection system to prevent more attack like that again.__Moreover, thanks to the Harkonnen base capture we get the desing of the missile tank, available in our factories from now.__Speaking of Harkonnen, the next territory is under their control. They are paying a good money to mercenaries to maintain the flow of spice without interference.__Mercenaries receive constant reinforcement through its High Tech Factory, if you can capture that factory we sill confiscate all they shipments. Then you can use them against the Harkonnen!__Objective: Destroy the Harkonnen bases.__Optional objective: Capture the High Tech Factory from the mercenaries to receive additional reinforcements.

