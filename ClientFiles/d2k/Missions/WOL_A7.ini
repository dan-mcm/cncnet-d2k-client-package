Briefing=LOCATION: Cidrit Town, near Atreides Landing_=========__Gurney reports to the Duke:__GURNEY: My lord, the Harkonnen and Moritani troops were defeated. We got Atreides Landing back. Most of the southern continent is being bombarded by heavy Cruiser ships as we speak._DUKE: Excellent, Gurney. You've done a great job. The next step is to reclaim Serena's Necklace islands. Our wingboat and naval production on the islands must be resumed immediately._GURNEY: With all due respect, my lord, I've seen the reports. The enemy is advancing towards Cala City, towards you. Wouldn't it be a better idea to move on the main continent and strike the Harkonnen before they reach Cala City?_HAWAT: Don't you dare doubt my plans, Gurney. I have analyzed all the data. This plan came after considerable thinking and calculations. The Duke agrees with it as well. _DUKE: Gurney, on Caladan, we rule by air and sea. They brought the armies of 3 Houses to invade our homeworld, but until they manage to destroy our navy and our air fleet, they cannot take Cala City._HAWAT: Besides that, I'm already making the arrangements to offer a landing zone on Atreides Landing for House Ginaz. They are sending massive armies to help us._GURNEY: Are they? I was worried that friends in the Landsraad are friends only when everything is going well. This is usually Landsraad typical friendship._HAWAT: No doubt the hatred between House Ginaz and House Moritani helped them to make this decision. This is their own way to carry a war they have been wanting for a long time, but the Landsraad and the emperor was preventing such chaos._DUKE: Gurney, this has evolved into a massive scale war. The entire galaxy is getting involved, one way or another._GURNEY: As you wish my lord. I'll go to Serena's Necklace and get back the islands._HAWAT: Do not waste unnecessary manpower for this. The islands are under heavy siege from our navy. Take a small force and destroy their defence network. With their turrets down, our Cruisers and Ornithopters will assault the islands and destroy the Harkonnen and Mutelli forces who are holding them now. I know what you are thinking, Gurney. We cannot let the navy do it for you. The bombardment ships must get closer for maximum effect, and the enemy anti-missile turrets must be destroyed if we want to maximize our ships' efficiency._GURNEY: Then I'll have to deploy two squads: one on each island. Question is: how do I do it with their defence network active?_HAWAT: You will have Cruiser support. Our ships will bombard the Harkonnen Power Plants, which will disable their coastal turrets so you can deploy. Make sure your Carryalls are ready when the Cruisers give you the signal._GURNEY: Understood, Thufir._DUKE: Remember, Gurney: just capture both the Harkonnen and Mutelli Outposts. Then let your engineer hack their defence network. Once done, you can safely evac. Our Cruisers will finish the job.__==========_Objective: House Atreides rules Caladan by air and sea. While the first is mostly present on the main continent, the latter has its naval production structures castrated by the Harkonnen and Mutelli on the Serena's Necklace islands. Your task is simple: remove this small impediment. The enemy will be distracted by the Atreides Navy and the Ornithopters. Use this opportunity to deploy two small strikeforces: one for each of the two islands. Your job is to locate and capture both Harkonnen and Mutelli Outposts, to castrate their own defence network. Our Cruisers were unable to locate the Outposts to bombard them, so you'll have to do it on your own. Once they are captured, the Atreides Cruisers will finish the rest. While the island controlled by House Mutelli does not have heavy defences, the Harkonnen island is protected by numerous Rocket Turrets. We cannot deploy our forces until they are disabled. Our Naval Cruisers will bombard the Harkonnen Power Plants from a distance to disable the turrets. Wait for the Cruisers to complete their job, then a Carryall will be dispatched and will deploy your commando strike force. Good luck. Tactical map available, press the button to view it.
