Briefing=After the victory in Atsum, Tyle has been ordered to retreat and move between Pasty Mesa and the Minor Erg, where one of the most important spice mining bases is located. Recent increase of smuggler and imperial sardaukar forces are threatening the installation, and Tyle is requested to ensure its security while the Landsraad council is being held.__Time has come for the Landsraad council to reunite and discuss the future of the Imperium. As requested by princess Irulan Corrino, the CHOAM will be neutral moderators of the discussions. The Spacing Guild is attending the meeting as well, however they are expected not to intervene very much, after the humiliating defeat they have suffered on Arrakis. The meeting is taking place at the imperial palace in Corrinth, Kaitain's capital city.__The Executrix is attending the meeting, along with most of the other monarchs of the Landsraad. The meeting was requested to be made public by Irulan Corrino and the CHOAM, which is rather rare.__Lora mentions:__LORA: I see most of the Landsraad is there. Atreides, Harkonnen and Ordos were to be expected, but there are other powerful Houses, like House Ginaz, House Moritani, House Vernius of Ix, House Ecaz, House Richese, House Hagal._TYLE: I guess they actually do care about a meeting requested after such a devastating war. It can change the shape of the Imperium.__The CHOAM representative starts it all:__CHOAM rep: Welcome, Great Houses of the Landsraad, princess Irulan of the imperial House Corrino, and Spacing Guild members. I am Hasimir Nair, and I represent the neutral side of the CHOAM, the side with no directors from the Landsraad. Her highness, princess Irulan Corrino, entrusted me to keep these discussions civilized, and towards an end goal: finding a solution to the instability of the Imperium at the current moment. As you might know, the war on Arrakis is still continuing. At a smaller scale than it used to be before emperor Shaddam Corrino IV was killed, but there is no peace in the Imperium at the moment. Our intent is to finalize all the conflicts and sign a peace treaty. The three Great Houses that fought on Arrakis are actively skirmishing all over the planet as we speak. A continuation of such battles is affecting not only the stability of the Imperium, but also the spice. And you all know it, the spice must flow! _BARON VLADIMIR HARKONNEN: Excuse me, representative Hasimir. What is it that you propose to ... stabilize the Imperium again? I am a very busy man, i have more than one planet to rule._DUKE LETO ATREIDES: Of course, the renowned Harkonnen manners, interrupting the man speaking just to add nothing of value._BARON: And there is the Atreides insolence, interrupting me just to add nothing of value._HASIMIR: Duke Leto, Baron Vladimir, please. We are here to discuss terms for peace, not to quarrel._BARON: Peace? With the Atreides? Have you lost your mind? This is kanly. Vendetta. It cannot end just like that._HASIMIR: The Imperium requires the war to be terminated. We are all suffering because of what is happening on Arrakis._DUKE: Excuse me, representative Hasimir. But House Atreides is not willing to give up anything to the Harkonnen. We have fought for too long for Arrakis. _IRULAN: Duke Leto, Baron Vladimir. The war is pointless. It was part of a spice competition issued by my father. That competition is no longer in effect. You are fighting for nothing._BARON: You can thank for father for this mess, princess._HASIMIR: Baron Harkonnen! Please, you are talking to a lady, and also, to the princess of House Corrino._BARON: Well then, excuse my... insolence. Princess Irulan, House Harkonnen has invested tremenduous amounts of resources and solaris into this war. Are you honestly expecting me to just withdraw my forces from Dune and let it be governed by some Imperial representative again? Not to mention, House Harkonnen was the governor on Arrakis time ago, before stupid spice games were created by smart emperors._EXECUTRIX: This is the Executrix of House Ordos. Our interests do not coincide with the proposal of the CHOAM. House Ordos must control Arrakis. That is the directive. House Ordos is not willing to share spice production with their enemies. That is wise._DUKE LETO: Princess Irulan, if you have a proposal, by all means, we are all listening._IRULAN: Yes. I do have one. We freeze the war on Arrakis. Each House has control over certain territories. We can trade a few of them between the three Houses, so that everyone has enough spice production under their control._BARON: THAT IS UNACCEPTABLE! House Harkonnen has the means to take it all. And I am not giving the damned Ordos any territory just because they control less than I do._IRULAN: Baron, a lot of people are watching this. I suggest you start thinking about all the people in the Imperium who are suffering the effects of this war.___LORA: So... manipulation of the masses if the true reason Irulan requested this to be public. Easy calculation, props to her. This will add more pressure to the Atreides, Harkonnen and the Executrix as well._TYLE: As if the Executrix cares what the masses think. __COUNT HAGAL: House Hagal is supporting princess Irulan's idea. The war on Arrakis has effected galactic commerce drastically. Also, interstellar travel was delayed and severely crippled because of the issues with the Spacing Guild.__TYLE: It seems the old Hagal-Corrino friendship is still standing, even without Shaddam._LORA: Especially since Irulan is a bit better on the diplomatic side of things. Hagal will benefit a lot if Irulan takes the power.__ARCHDUKE ARMAND ECAZ: This can only be fixed by having a new emperor. This is what the Imperium is lacking now. If the three Great Houses do not want to stop now, they might have to if an emperor dictates it._BARON: BAH! Don't make me laugh. An emperor, to dictate me to stop? You seem to forget what we did to the previous emperor._HASIMIR: Baron, please. Her highness is here._IRULAN: It is alright, representative Hasimir. The Baron is very well known for his sharp tongue._BARON: I assure you I meant no offence to you, your highness._HASIMIR: The old ways state that a male emperor must rule the Imperium. However, the ruling dynasty, Corrino, has no close male heirs. The family tree gives us a few male boys, but they are far from the original bloodline. Therefore, the CHOAM proposed that we decide, together, who shall rule the Known Universe. CHOAM believes we should give the throne back to the Corrino family, and have princess Irulan as our empress, being the direct heir of Shaddam IV._EXECUTRIX: House Ordos does not accept the terms. House Ordos demands to take the throne. The Ordos fought on Arrakis and have control over the spice. That is fact. House Ordos deserves the leadership of the Imperium. That is wise._BARON: Your highness, you did a terrible mistake inviting all the weirdos to this meeting._HASIMIR: Baron! I am asking you to stop your insults. You are crossing the line already._EXECUTRIX: House Ordos does not recognize insults. We are taking the logical approach. That is wise._COUNT GINAZ: The old ways are clear. The heir has to be a male. Therefore House Ginaz cannot support this proposal, princess Irulan. We must elect a male emperor._ARCHDUKE ECAZ: House Ecaz agrees. A male emperor must be chosen._HASIMIR: I must interrupt you all. I see this is not getting anywhere. I say that each member of the Landsraad should say it here, publicly, who they support for the throne. You may choose yourself, another Great House, or refrain from choosing someone at all._BARON: I support my own House for this. _DUKE: House Atreides will vote for itself._EXECUTRIX: House Ordos votes House Ordos. That is logical._HASIMIR: Allright. Other members of the Landsraad, please... state your choice. Princess Irulan, Spacing Guild representatives, you may choose too._SPACING GUILD REP: The Spacing Guild does not support anyone._HASIMIR: Noted. Thank you.__TYLE: There is no way we'll win this vote. Who would vote for the Ordos?_LORA: Nobody. The chances anyone will support us is around 3.45%, based on my calculations._TYLE: Yea... wipe that sapho juice from your mouth, it was pretty obvious...__Meanwhile, in the meeting, the other houses not involved in the recent war are finally taking sides, after a long period of silence and calculations:__ARCHDUKE GINAZ: House Ginaz is supporting Duke Leto Atreides for the Golden Lion Throne! Duke Leto would make a perfect emperor due to his abilities._VISCOUNT HUNDRO MORITANI: House Moritani supports House Harkonnen. The Harkonnen are the strongest military force in the Landsraad, and a firm military grip is what the Imperium needs right now to establish stability._COUNT HAGAL: House Hagal is supporting princess Irulan Corrino. The throne must return to the Corrino family, and princess Irulan is more than capable of continuing her father's legacy._COUNT RICHESE: House Richese is supporting itself. Our advanced technology is what the Imperium needs now. For years, Richese offered great machines for the known universe._COUNT DOMINIC VERNIUS: Hah! Richese technology cannot compare to Ix. Are you really saying you should rule because of your technology, while you don't even have the most advanced machines?_COUNT RICHESE: Of course I had to be interrupted by Dominic Vernius._HASIMIR: My lords, please. Stick just to the voting._COUNT VERNIUS: Very well then. House Vernius is supporting my old friend, Duke Leto Atreides._BARON FLAMBERT MUTELLI: House Mutteli supports House Harkonnen._COUNT WALLACH: House Wallach is supporting Duke Leto, of House Atreides._ARCHDUKE ECAZ: House Ecaz is also supporting Duke Leto Atreides._HASIMIR: CHOAM supports princess Irulan Corrino._EARL FAZEEL: House Fazeel would like House Vernius to the throne, so the Imperium can benefit the most from their machines._IRULAN: House Corrino is supporting itself.__The rest of the major and minor Houses decided not to get involved in this voting. Hasimir concludes:__HASIMIR: It seems there is no clear winner of this vote. So far, it seems most of the votes went with House Atreides and Harkonnen, with some of the parties supporting princess Irulan Corrino. There are also individual parties supporting themselves: House Ordos and House Richese. Also, House Vernius is being supported by another House, but not by itself. Dominic Vernius, do you wish to change your vote?_DOMINIC VERNIUS: No. House Vernius supports Duke Leto Atreides. _HASIMIR: Due to no majority of the votes going for one of the Houses, I propose that this meeting is suspended for now. I hereby ask all the attendees to reconsider in a few weeks another meeting, where we shall vote again. Please consider making a decision until then, as we need a decisive conclusion for this.__The meeting is dismissed. Duke Leto seems happy, as he got the most votes. At the same time, Irulan seems calm, calculated. The Baron is fuming, but he's trying to hide it from the others.__<=====>_A few hours later, the Executrix establishes a secure channel with Tyle and Lora.__EXECUTRIX: The results of the meeting are concerning, but to be expected. That is normal. House Ordos has no support within the council. However, House Ordos will not win on the battlefield, or on the diplomatic table. That is certain. It is time to share the next steps. We have signed a treaty with the Tleilaxu. Most of the funds harvested on Arrakis have been invested in the creation of a ghola army that will fight for House Ordos. That is power. Besides, House Ordos has paid considerable sums for a Shaddam IV ghola.__Both Lora and Tyle are shocked.__EXECUTRIX: This is highly classified intel. You must not share it with anyone. That is a threat._LORA: It will stay between us, your highness._EXECUTRIX: We have arranged the neccesary facilities on Draconis IV. Ghola production has reached a point where we can send ghola reinforcements to Arrakis. That is power. The Shaddam IV ghola will be used to pretend the emperor survived, and stayed hidden for a while, with a few of his trusted Sardaukars. That is deception. Once the ghola will be ready, we will use it to claim the throne in the name of the Corrino... but FOR THE ORDOS. That is the directive. Executor, your task remains to ensure steady spice production until further notice. Ghola reinforcements will start to move towards Arrakis soon. That is the directive.__TRANSMISSION CLOSED...__TYLE: Wow... I am completely shocked._LORA: Told you... the Executrix aren't playing by the rules. This crazy plan might actually work._TYLE: Might... even if Shaddam would live, the Atreides and Harkonnen will never accept his reign anymore._LORA: Combine the Ghola army with the Sardaukars... And perhaps Tleilaxu military aid as well... It's not a force you want to mess with._TYLE: Based on what I've seen today... the Atreides and Harkonnen have more allies than we do._LORA: I must move to Jaculan. Strict orders. Make sure this base won't fall.__<====>_After a few days, the attacks on Tyle's position have intensified drastically. Tyle establishes a comm-link with Lora:__TYLE: Lora, I need reinforcements. The Sardaukars have massed a huge force and are laying siege to my base. I won't be able to hold them for much longer. I am simply heavily outnumbered. Where are those gholas?_LORA: I tried to get them quicker. Heighliners from Draconis IV have left late. I'm not sure if you can get them in the next 24 hours._TYLE: But... Lora, this base can't stand 24 hours..._LORA: Listen to me... you must try your best... Should the base fall, take a thopter and get out of there._TYLE: Where's your useless mercenary friend? Thought he had a contract to defend us._LORA: Listen to me! If the base falls, you get out of there. Don't worry about the Executrix or anything else... you run._TYLE: I am a veteran battlefield commander. I won't run like a coward._LORA: YOU WILL GET OUT. Meet me in Jaculan.__==========_Objective: The Landsraad meeting did not go well for us. There is basically nobody supporting the Executrix for the throne, while Leto Atreides has the majority. However, the Executrix has better plans: a ghola of Shaddam IV, to be a puppet of the Ordos, combined with a massive ghola army to fight for the Ordos and supplement our current lack of manpower. However, the ghola reinforcements will not reach your position in time. You must make sure the Construction Yard does not fall... And then, remove the Sardaukar presence from the area. How you do it, however... now it's time to prove you are who you are. Fight till the end, Executor!
