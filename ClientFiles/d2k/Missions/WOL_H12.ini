Briefing=BARON: General, amazing performance. They damaged the city, but it's nothing we cannot replace. Your execution was great. Feyd, congrats down there to the south. You fought well._FEYD: He got away, father._BARON: Of course he did, I never imagined we'd get him here in Harko City. We were on the defense. Nobody had time to catch an idiot. But now..._RADNOR: We know where he is. I already contacted some of his men and they decided to betray him and tell me everything. _BARON: And the information they provided..._RADNOR: 100% accurate. I have checked it myself. Few thopters... I have the grand scheme already. And his men are valuable, they keep informing me._BARON: Of course they are. All those idiots thought they hit the big jackpot few days ago. Rabban also knows how to motivate people, even for a lost cause. I must admit, though, their siege looked... good. I mean, I'd have been hopeful as well in their place. But now... there you go, that's their morale out of the window. General, they will start running like rats, to save their asses. And they will try to kiss mine, for forgiveness. _FEYD: And they shall receive none, am I right?_BARON: OF COURSE. Only a fool gives second chances. Someone who betrayed you once, can do it again when the time comes. I want Rabban. Alive. He's mine. MY SON. With the rest of his lap dogs, you can do whatever you want. In the end, obviously, I want them dead. But Rabban must be brought alive._RADNOR: Will do, my lord._BARON: Now... I have some interesting news. It seems that, after the Atreides finished all our troops on Caladan, they moved to Ix. Leto is so bored that after everything that happened, he wanted another fight. He went to save his shit friend, Dominic Vernius. From our allies, the Ordos and the Richesians. And somebody else._FEYD: Tleilaxu._BARON: Heh, and I thought you didn't know._FEYD: I didn't know the Atreides moved in for the save, but I knew about the Tleilaxu. However, I don't know why._BARON: They always hated the Ixians. And for good reason. Those idiots have the monopoly on technology in this imperium. Richese is nothing but a loud kid compared to Vernius. And, you know... machines, robots or whatever the hell you wanna call them don't work very well with the Tleilaxu fanatical views. Nor with their weird experiments and bio-engineered shit._RADNOR(angry): Why should we care about this?_BARON: What?_FEYD: Ah, father. Our dear general has some... personal issues with the Tleilaxu._BARON: What issues?_FEYD: They... probably mutated his family._BARON: Ah, shit. Well, that's too bad, general. _RADNOR: It is, my lord. I will make them pay one day. I'll take something they want from them as well._BARON: That's the spirit! I like this Harkonnen attitude of yours! Now, between me and you, I've never been a big fan of those weirdos. In fact, I don't think anyone has. But... so far they were on the same side as us.__Radnor gets more angry every second. Feyd observes this, and decides he should interrupt his father:__FEYD: Nonetheless, I think my brother..._BARON: THEY USED TO BE ON OUR SIDE. If the two of you will stop interrupting me, I will let you know a secret. We done?_RADNOR: Yes._FEYD: Yes._BARON: Great. Here's the big bang: the Tleilaxu and House Richese seemed to have turned the weapons against the Ordos. Or the other way around, who the hell knows. Who the hell cares. The idea is that I don't give a crap about those 3 factions. As long as they don't interfere in my stuff. Which, according to Piter over here, might happen._DE VRIES: We received some... classified information regarding some interesting Tleilaxu business. They are rumours coming from Irulan's Sardaukar. The few of them that I could buy with Harkonnen money. It seems the little princess wasn't standing idle all this time. And it seems she wasn't only fighting Leto's wars on Caladan. She was spying on the Tleilaxu._RADNOR: Why?_DE VRIES: I don't know for sure yet, but..._BARON: YOU MUST KNOW FOR SURE, MENTAT. THAT IS YOUR JOB._DE VRIES: My lord, I am trying everything I can. All I know is that it's something related to the Arrakian spice._BARON: You mean, something related to MY spice?_DE VRIES: Precisely. They are trying to alter it in some way. There are recordings with Tleilaxu ships on Arrakis.__Baron breaks a small statue on his desk.__BARON: Alter, eh? Altering my spice...__Radnor is getting happier every second. "This doesn't sound like something the Baron will like. Which means... I might soon get my hands on those vermin."__DE VRIES: I am working day and night to learn more. But Rabban's civil war delayed my search a bit._BARON: Almost forgot about that fool... Go, both of you. Bring me my imbecile son.__Both Radnor and Feyd leave. Before parting ways to prepare for the attack, Feyd approaches the Harkonnen general:__FEYD: We will bury Rabban under the ruins of his own Palace._RADNOR: What? Didn't you hear the baron?_FEYD: Do I look deaf?_RADNOR: No. But..._FEYD: Listen to me, general Radnor. Rabban must be killed. I am not risking anything. The guy is not to be left alive. He has relations, he might get away somehow. Or, make our lives a living hell. A smart person doesn't risk anything._RADNOR: I couldn't care less if he's dead or alive. For me, it's easier to blow up a building than to secure it and capture a guy from inside, then to escort him back to Harko City._FEYD: See? Easier. I like easy ways. I also have some relations and some mercenaries around. Now that the siege is over, I can gather them. I'll bring a pretty good force to help you kill Rabban. Anyway, he hates me so much that most of his focus will more than likely be on me. Death Hands, attacks... You better make sure you send assistance when I need._RADNOR: But what about the Baron?_FEYD: Let me handle that. After all, how can he blame us because the fool Rabban decided to ... blow his palace because of his pride to avoid being caught and tortured? Or, that's what we will tell the baron that happened.__==========_Objective: The failed assault on Harko City has thrown the rebellion into disarray. Most of Rabban's forces have either deserted or changed sides. Rabban managed to run away towards the Obsidian Plains, but he cannot escape. The rest of the rebel army that matters is there. It is time to end the idiot's suffering. Destroy the Palace, and kill Rabban along with it. Feyd and his mercenaries will help you. These two brothers love each other a lot, so probably most of the heat will target Feyd. Use this freedom to send help for Feyd when he needs it. Feyd must survive, therefore his Construction Yard must not fall. Tactical map available, press the button to view it.
