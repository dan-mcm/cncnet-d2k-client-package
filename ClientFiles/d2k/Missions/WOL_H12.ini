2=Feyd: Thanks for your spot, brother. I'll be a great baron in your memory!
1=Rabban: I'll kill you Feyd. Enjoy my Death Hands, loser!
0=Feyd: Now it's our time to taunt you, Rabban! Get ready, elder brother.

