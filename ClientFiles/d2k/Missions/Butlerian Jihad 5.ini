Briefing=HARKONNEN_===========_Harkonnen: Atreides and Harkonnen working together? Who was the inept that scheduled our artificial intelligence to even contemplate an alliance with the Atreides? And on top they lost to the Ordos! This is one of the greatest offenses to our House Harkonnen.__Forget that stupid artificial intelligence. Take with you the most bloodthirsty men from Atreides and destroy all of them with your own hands in the next region. Only then we can regain the honor and prestige that belongs to us.__The Atreides are aware of our plans and have already prepared numerous Carryalls to carry out multiple tactical attacks on our base; some of them are already flying over the territory and are expected to land at any time.__Protect your base against any Atreides attack that launch against us. Once their resources are exhausted and can not bring more armies through the air it will be the right time for you to make a counterattack with which to destroy the Atreides.__Objective: Destroy the Atreides base.__Tip: The Barracks is a quick and cheap method to protect yourself until you can get more efficient defenses.

