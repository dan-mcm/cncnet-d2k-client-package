Name=WoA Sandstorm - Harkonnen Mission 2
Author=Feda
Music=elusive.aud
SideId=1
Briefing=BARON: Ah, Generale, another well done job. We now managed to recover more than 80% of the lost territories and return them to full control of House Harkonnen. The rest of 20% have been lost, and the commanders tasked to retrieve them have been playing with my torture tools for more than 24 hours already. There is an important matter that you must attend, though. As a reward for your marvelous actions, General, I am going to give you some toys to play with as well! Do you remember our nuclear weapons? The Death Hand? My scientists managed to fix the inaccuracy issue it had. Our tests worked well, but nothing plays better than a field-test. I want YOU to go out there and NUKE the hell out of the Sardaukars. My new toy must be tested, and I cannot see a better testing subject than the Imperial army.__Baron out...__MENTAT: Alright you right-hand of Baron, I'm forced to brief you on your mission, otherwise the Baron would cut me into pieces. I guess I'm only his left hand. But anyway... I found a ... perfect location for you to test the nuke. It's in the closest open erg to the Shield Wall. Indeed, Atreides territory, but this erg has been occupied recently by the Imperial forces. The Atreides are trying to recover it. There are also Ordos forces in the region, who are probably trying to conquer the territory for their own needs. Stay away from them! They will not open fire against us unless provoked. We are strictly going after the Sardaukars, and testing our new "toy"... If they however interfere on your game, feel free to deal with them as well. Good luck, right hand...__Objective: Build and MAINTAIN a Harkonnen Palace. Use the improved Death Hand Nuclear Missile against the Imperial forces. Destroy all Imperial bases in the region.__NOTE: The Death Hand accuracy has been improved.

[Vars]
DeathHandAccuracy=1

