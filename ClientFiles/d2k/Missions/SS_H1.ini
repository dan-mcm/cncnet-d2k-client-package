Briefing=BARON: Greetings, General. As you more than likely know, the Harkonnen rebels have caused a lot of damage in our territorial structure, and the coward Emperor took advantage of this. He installed his Sardaukars in our own territories. (raging) That is intolerable! (normal) General, we must recover as many territories as possible before continuing the war. I'll let the mentat brief you. You are my right hand General, you'd better not disappoint me!__Comm-link lost...__MENTAT: Alright General, we both know how bad things look. The Sardaukars are still strong, and we have no immediate chance of winning this war. The Atreides and Ordos are still going, too. We will need to recover some territories that have been fragmented by the rebellion before we can continue any offensive actions against our foes. Other commanders will take care of "lighter-defended" territories, however, you, as the General and "right-hand" of the Baron... I cannot believe he said that... YOU must take the most difficult one. I'll airlift a few guys deep into our former, now enemy territory. You make good use of them and proceed to activate our abandoned bases. There are 3 in the region, reactivate as many as possible to have an easier time against the Imperial forces who will more than likely detect and attack you. Once activated, the bases will operate without your direct order, so you can worry only about recovering the factories. Good luck, General, the right-hand of the Baron.....__Objective: Infiltrate enemy territory and reactivate as many Harkonnen bases as possible (3 in total). To activate a base, you must locate and move near its respective Construction Yard.

