Briefing=ATREIDES_=========_The situation is alarming. After losing a territory in front of the Harkonnen they began to fight among themselves. At first we thought that it was about internal fights between Harkonnen for power, but then we discovered that the same thing happened with the Ordos. This can not be a coincidence.__We are not sure of what is happening but we can not wait for answers. The Ordos have somehow deactivated the artificial intelligence we had programmed to fight for us in our absence. It is necessary to reactivate production.__We are going to send a MCV next to the base so you can build a barracks and with it the necessary engineers so that our factories can work again, even manually.__As soon as both factories have been recaptured the vehicles that have been stored will be available for use. Once everything works correctly, eliminates the Ordos that are in the area.__Objective: Recapture the two vehicle factories. Destroy the base of the Ordos.

