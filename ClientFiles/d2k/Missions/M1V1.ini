Briefing=Greetings commander. We have finally gained permission to set our boots on the ground of the planet. We do so under the guise of assisting the Ordos in clearing the region of the Harkonnen and their imperial allies. We will supply you with a small base to train an attack force, but the bulk of your mercenary force will be trained and delivered from off planet. Once the false mission is complete, we will begin capturing additional territories. __==========_Objective:  Eliminate all hostile units. Our spies indicate the possibility that the Ordos suspect we have alterior motives. Should the Ordos clue in on our plan, they will turn on us.
