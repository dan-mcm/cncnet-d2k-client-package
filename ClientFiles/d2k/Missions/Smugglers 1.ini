Name=Smugglers - Mission 1
SideId=5
Briefing=Sir, we have serious problems. We established a camp in a territory to harvest the spice and away from fighting the other houses, but unfortunately we gave to stop at a sacred territory for the native of Arrakis, the so called Fremen.__The Fremen are formidable warriors against those who can not afford to fight, but we can’t leave with empty hands neither, or our future will be too uncertain. 5000 credits must reap spice so we can leave with some benefits that allow us to stay alive, while resisting the Fremen assaults.__Be very careful, the sandworms of Dune are well known for devour harvesters full of spice. Prevents the sandworms eat them because we have no means or money to replace them, good luck.__Objective: Get 5000 credits of spice. Harvesters, refinery and silos must survive.__Note: You need at least 2 silos to reach the 5000 credits.
Music=FREMEN.AUD
Author=Cm_Blast

[Text]
1=The Fremen can came from any direction, beware.
2=Sandworm detected! Protect the harvesters!

