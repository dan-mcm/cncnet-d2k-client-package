Briefing=SUMMERS' SOLSTICE 10: Screaming in Silence__MISSION OBJECTIVES:_1. Annihilate all smuggler and Ordos forces._2. Protect the OSO Frequency Jammer._3. You must survive.__TACTICAL OBJECTIVES:_1. Keep your enemies fighting each other._2. Use OSO Combat Tanks to soak damage._3. Use Quads and Troopers to deal damage._4. Search for a good expansion location.__BRIEFING:_     The months following the fall of the Emperor have been thankfully uneventful. There's no one left to fight, or at least no one the Ordos can't handle. Your men continue to revel in the spoils of victory. The Spice flows, stalled only by worm attacks and scattered bands of Fremen. Easy work for a light escort.__     This was never the intended solution. Still, it was the only one afforded to you. The massacre in El-Sayal, the bloodbath in Gara Kulon, the insanity at Shield Wall. Each survived using men whose main business was mining. The ubiquitous ravages of past battles remind you ceaselessly of what this victory cost you.__     Three Great Houses lie in ruin. Yet, strangely, the feeling lingers that more is to come.__     Pleased with your excellence, Commander Achen Moriaen dissolved your organization into a special division of Ordos forces. Others are fearful of your command. Though all's well, Moriaen looks grim when she contacts you today.__     "There is a situation at Chin Rock," she explains. Her image on-screen is replaced with a familiar-looking smuggler field commander: Jaxon Burke.__     He is angry and speaking to the smuggler militiamen below his platform. "She's mad. Killed Sumadi, drafted us, and we went along with it. I didn't join the smugglers to sell out like a merc'. The Ordos ain't getting one more Solaris. This Spice is ours! It's ours!"__     When Moriaen cuts back on, you are visibly pale. You dread to ask, but you do: "You want me to put down my own subordinate?"__     "And all Ordos forces in the area," Moriaen adds. You blink.__     "What?"__     "There is unrest among the former smugglers," Moriaen goes on to explain. "Should other bases be inspired to rebel, we will have no choice but to destroy them all. No one may leave this region knowing what has transpired here. Therefore, everyone must die." She leans forward, unshaking. "Commander Summers, can I trust you to complete this mission?"__     You straighten yourself. Some of your own still deny it, but allying with the Ordos was for the best. No longer are your forces caught between dueling titans, swallowed like a Carryall in a sandstorm. No longer are you hunted by the ruling House on Arrakis. You are allies. Partners, at the price of blood and a little wealth. And you cannot risk the worst. Your face tightens, but you nod in response to Moriaen. "Yes, ma'am."__     She nods in return. "Good. I have established a forward base during our conversation. There is a Frequency Jammer on site that must be protected to ensure no transmissions are sent elsewhere. More reinforcements are en-route. That is all; you may take command now."__     Time to dust off your tank. This matter demands your utmost attention.
MissionNumber=10

