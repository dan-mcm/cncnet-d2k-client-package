Briefing=ORDOS_=======_About twenty minutes ago the Harkonnen have sent all his troops to the front to stand against the Atreides. This is our chance to get hold of his now unprotected base. We will provide you some soldiers and engineers so you can capture the Harkonnen base.__When the Harkonnen know our plan they will try to regain their base, or destroy it. If that happens defend it at all costs and resist until our armored vehicles arrive to reinforce it. Once they reach the Harkonnen don't have any chance of take it from us. __Objective: Capture the Harkonnen base and protect it until reinforcements arrive. __Note: Do not wait until the Harvester is attached to the refinery to capture it.

