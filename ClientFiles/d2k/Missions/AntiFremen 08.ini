Briefing=After torturing the captured Fremen we have unveiled the plan they were preparing to defeat us. Their plan is to attack my Palace taking advantage while our forces were sended to the front.__It's too late to order them back, but still has enough time to protect me from those Fremen. My best Sardaukar are in the palace gates and defend the entrance, however I fear that the Fremen can excel them in numbers.__Some Sardaukar are about to arrive from the Starport, use them to strengthen the defense and avoid my palace being destroyed by the Fremen. The palace is north, surrounded by a moat full of worms. Avoid placing vehicles in that area and instead use the Sardaukar which arrive as reinforcement for the Starport.__In addition, we have done they to confess the presence of four Sietchs, used to move his men across the territory. Your mission is to seek and destroy the Sietchs.__Oh, I almost forgot. The last batch of MCV have been infected by a computer virus. Whatever you do not deploy a MCV or risk infecting the whole system and blow it up.__Objective: Protect the Imperial Palace. Search and destroy the four Sietchs Fremen. No deploy an MCV.

