Briefing=The Lassoki raid on the Guild Heighliner was a complete success for the entire Coalition. They acquired three large pieces of technology and also stole valuable explosives from the Harkonnen.__The Harkonnen retaliations have not been long in coming and have just brought their entire army available in an attempt to destroy the entire Coalition with a single blow, taking advantage of the fact that they are all together in the territory.__In other circumstances, an assault with the full power of the Harkonnen army could destroy two or even three of the Coalition Houses, but by fighting all four together and with technology recently purchased from the Ixians it is feasible to repel the Harkonnen offensives and destroy this mighty House forever with this battle.__For this they have shared the technology. The Lassoki will build Deviators, the Iasi will recruit Grenadiers, the Qaii will manufacture upgraded Raiders, and the Bromeli will arm long-range missiles with the explosives obtained from the Harkonnen.__The Lassoki don't have a base built yet, but they do have a Starport through which they will receive an MCV as soon as they reject the first Harkonnen waves. While the Lassoki deploy what is necessary to create an army, their three allies will take the lead and hold off enemy attacks as much as possible.__The resources of the Harkonnen are infinitely greater than those of the Coalition, giving them a great advantage in the short term. If the four collaborating can protect the Lassoki long enough, the battle will end up favoring the Coalition thanks to the numerical superiority that will increase over time.__Objective: Destroy the Harkonnen base.__Tip: Your allies will help protect you, but don't let them do all the work in order to minimize casualties from both your allies and yours, in order to survive long enough for your allies to produce units more quickly.

