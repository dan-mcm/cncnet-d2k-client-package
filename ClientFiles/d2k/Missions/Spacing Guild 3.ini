Briefing=The Atreides have already paid their debt to us, so it's time to go to get the money from the Harkonnen. They still refuse to pay us.__We have appealed to the Emperor to intervene. He says he can not force a house to pay any kind of debt, so it can not act militarily against the Harkonnen just for that.__Still, we have requested their presence, claiming the use of atomic weapons by the Harkonnen and have agreed to stand in the territory to monitor irregularities do not occur.__The aim of his mission is to teach a lesson to the Harkonnen. Locate the two bases they have in this area and to destroy them completely. You should leave intact its refineries and silos.__This time we do not we will capture their refineries; we do not want to run the risk of collapse by some other kind of sabotage. We will force the Harkonnen to work in their own refineries until paying all their debts__The Harkonnen already know our intentions and have strengthened their defenses. For every 10,000 credits you gather a large frigate with heavy vehicles will reach the Starport. Using one frigate save costs with respect to order them individually.__Do not order a VCM, we are forbidden to deploy our own construction Yard in Arrakis.__Objective: Destroy the Harkonnen bases except refineries and silos. Not deploy a VCM__Optional Objective: Earn 10,000 credits to get reinforcements from heavy vehicles (your credits will fall to 0).__Notes for the commander: The prices in the Starport change quickly.

[Text]
1=General Harkonnen: The presence of the emperor will not get rid of our offense.
