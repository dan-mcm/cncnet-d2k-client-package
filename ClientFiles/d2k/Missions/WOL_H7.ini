Briefing=BARON: Gentlemen, our Caladan campaign is working perfectly until now. We were successful on the southern continent, which is now completely under our control. Also, Serena's Necklace islands are also under our control, which means the Atreides Navy will retaliate with more difficulty. It is time to push to the main continent and force a move into Cala City, slowly. Time is of the essence, as the Atreides are beginning to retaliate._VISCOUNT MORITANI: My men informed me that Leto might be trying to bring his Arrakis forces back to Caladan. If he succeeds, the Atreides won't be weak anymore._BARON: It's not their Arrakis forces that we have to worry about. It's their airstrikes and naval bombardments. For now they are mostly unprepared, which is why we have to strike Horizon, their southern important location on the main continent. If we take Horizon, we will have a strong position to push in._BARON MUTELLI: I agree. We'll prepare for an attack on Horizon. _VISCOUNT MORITANI: Very well. They will defend it fiercely, but I believe coordinated attacks from our side should be able to break them. I will have my commander sync with the Mutelli and Harkonnen commanders. Attacking in packs at the same time should wear them down quickly enough._BARON: Indeed. Time is very important. We have to break their base before their navy arrives. I can guarantee: as soon as we land there, they will call in for their Navy. The main continent is much better defended than the southern.__Transmission ended...__BARON: My two sons and you, General Radnor... So far, all three of you have done a great job. We're on the advantage, and the Atreides barely know what hit them. General Radnor, your execution for the Atreides Spaceport was excellent. Same for you on the islands, Feyd._RABBAN: What about me, father? I was there too. I attacked Serena's Necklace with Feyd. _BARON: Don't you know I heared what happened? ARE YOU TAKING ME FOR A FOOL?_RABBAN: What are you talking about? We succeeded._BARON: Not because of you. You screwed up big time, and thankfully I didn't send you alone on that mission, so that Feyd can clean your mess._RABBAN: I don't understand. I did not mess up._BARON: SILENCE! You were close to bring the entire Atreides Navy on our ass. Great job preventing them from detecting your attack, Feyd. Your stupid brother almost cost us the entire campaign._RABBAN: What detection? I've done nothing to..._BARON: SILENCE! Get out of my face. All of you. General Radnor, your briefing is short: deploy a base, together with our Moritani and Mutelli allies. You must strike the Atreides base before their Navy arrives. Piter will give you the ETA for that. Also, ensure none of our allies loses their bases. I want to make sure their morale is high enough, as we need them for this invasion. Now leave. ALL OF YOU!__Radnor and Feyd leave. Rabban remains there with the baron, to try and figure out what happened. Radnor, very curious, asks Feyd:_RADNOR: What happened on Serena's Necklace?_FEYD: We were successful, that's what happened._RADNOR: And Rabban... did he really screw up?_FEYD: Oh, he did! Maybe not as much as it sounds... or rather, not as bad as my bribed men informed my father, but... he did. __Feyd starts laughing, while Radnor looks at the man with some sort of respect.__He really is a true Harkonnen_, thinks Radnor. "These two will eat each other one day. And I will most likely have to pick a side. By the looks of it, the smart side seems to be Feyd. And I like smart people."__==========_Objective: Time has come to push to the main continent. But this won't be easy. The Atreides are still trying to retaliate after our blitzkrieg attacks. We must delay that for as much as possible. Serena's Necklace and the southern continents were the ways to delay them. You must now deploy a base on the main continent, to the south, and attack Horizon. The Atreides base there is pretty big, and they will defend it until the very end. The problem, however, is that they will call in for their Navy immediately. Since it's on the main continent, our previous efforts cannot prevent their ships from moving in completely. You must destroy the Atreides base before the time runs over. Also, ensure none of your allies lose their bases. The baron wants those fools at full morale, to be more efficient. NOTE: The Moritani and Mutelli agreed on launching synchronized attacks on the Atreides base, to increase efficiency. As time is of the essence, we ask you to join them whenever possible, to strenghten your attacks. Strength in numbers, you know! Tactical map available, press the button to view it.
