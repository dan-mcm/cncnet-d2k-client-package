Briefing=Mentat: Well done Commander, we're getting slowly back on track! It is easy to see that while we were severely damaged by the war, same happened to our enemies, the Harkonnen and Ordos. However, the Emperor is still strong. We must call in reinforcements from Caladan, our homeplanet, if we are to succeed in this war. We have enough solaris to bribe the guild for it, but we don't have the infrastructure: Starports. We need operational Guild starports for this. Fortunately, we've located 3 Sardaukar Starports that have a direct communication link with the Guild. Commander, you must capture them. This is a decisive mission: failure will mean our annihilation!__Objective: Capture the 3 Imperial Starports. Do not fail, Commander.

