Briefing=HARKONNEN_============_Our explorers inform us that Ordos and Ixians have been meeting. We do not know the reason for their reunion but the Ixians may now intend to sell vehicles from the Machines to the Ordos.__I just received a signal from the scout I sent. From the top of a mountain you can see and hear the encounter between Ordos and Ix. We will act, if necessary, against the one who tries to use Machines.__Get ready, I have already sent some Carryalls to land in case you have to intervene.__Objective: Observe the meeting between Ordos and Ix and wait for orders.

