Briefing=SUMMERS' SOLSTICE 15: Arsenal Immune__MISSION OBJECTIVES:_1. Navigate around the plateau and clear the LZ._2. Establish a base in southeast Sihaya Ridge._3. Clear the territory of Spacing Guild forces._4. The Storm Lasher at the LZ must survive._5. Durant, his forces, and you must survive.__TACTICAL OBJECTIVES:_1. Learn the Storm Lasher's strengths and weaknesses._2. Prepare yourself quickly for tough initial enemy attacks._3. Expand when possible to secure additional Spice fields._4. Use enemy Storm Lasher blasts to wreck their fortifications.__BRIEFING:_     You clench your teeth listening to Roma Atani spell out the shocking extent of Moriaen's treachery. You realize now that she sent you to Chin Rock and Qanat Pass to torture you. Probably instigated the rebellion in the first place. Perhaps even the Battle of Maqbara Roughs was a test. All for what?__     Certain things, at least, are now made clear. "The ghola of Corrino was intended to secure the allegiance of Sardaukar remnants, but the Tleilaxu are in violation of their contract. They never delivered the ghola."__     Durant coughs softly. "Oops."__     "The traitor, too, is a ghola," Atani confesses. News to you. "Achen Moriaen was a promising Atreides commander slain by overwhelming Harkonnen forces early on in the war for Arrakis. I suspect she sought your allegiance ultimately to undermine the supremacy of House Ordos." And wound you up to fight them.__     "Why?" you demand. "Why do all of this?!"__     Atani shakes her head. "Her true motives elude us. The Tleilaxu, you understand, are experts at counter-espionage. We know for certain that she is the high commander of the union of their forces and the Guild's."__     Durant finally chimes in. "The Guild is involved in this? They aren't even allowed an army according to the Great Convention."__     "And working with the Tleilaxu, at that," you add, just as much in disbelief. "How does that figure? The Tleilaxu are universally despised. ...At least that explains our inability to use Starports. More importantly, what do we do now?"__     Atani turns to the side. "That is what I wished to speak with you about, Commanders Summers and Durant," she says, loading a tactical map of Sihaya Ridge. "This Guild spaceport is lightly defended with few turrets according to the most recent intelligence. That is, aside from an unknown structure suspected to be a new kind of base defense. ...While we are trapped on Arrakis, unable to summon reinforcements from Draconis IV, the traitor is amassing more units on the Heighliner itself. This is one of several locations where her forces are arriving planetside."__     "I see," you affirm, continuing to listen carefully.__     Atani appears more distressed as she turns back towards you. She explains, "The Ordos' final stronghold on Arrakis has fallen to what we now know as the Dark Alliance. You are the only ones capable of carrying out an offensive. It is critical we take this spaceport and contest the Heighliner." She gestures to herself. "I pledge to provide you with the services of our remaining undercover agents on the Heighliner, who can direct deliveries to your Starport, and I offer my own services as a mentat."__     With any luck, you could uncover the traitor's plans through the raid on this base. Being familiar with the territory, you figure you could probably sneak up the plateau on the south end and surprise the Guild base. You look at Durant once again. "Sabre. Are you up for this?"__     After a moment of consideration, he nods. "Yeah. I'm in."
