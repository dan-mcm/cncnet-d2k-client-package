Briefing=The Coalition has contacted the House of Ix to purchase new technology, necessary if they want to keep up with the victories they lead and defeat the great Houses when they begin to use their full potential in battle.__An agreement has been reached with the Ixians, and several Lassoki frigates are heading for the large ship they are on. However, they have not been able to carry the required amount of spice because that would raise suspicions both within Dune and outside of it.__The Lassoki are aware and instead are going to board a large ship carrying very high value surplus resources. They will search for possible Abandoned Refineries, capture them, and use them to collect everything they can from each of the precincts to finally meet up with the Ixians and make payment.__The Harkonnen are nearby, it is to be expected that they will attempt an attack as soon as the Lassoki begin their collection tasks. Luckily, by taking over an Outpost, they will be able to spy on enemy communications and detect enemy messages and thus know in advance how many of them will attack.__In addition, if they take over the abandoned Factories they will have access to prefabricated equipment that the Lassoki can use to defend themselves, although they must be prudent with their expenses and only use the necessary credits for protection, since it is more important to pay the maximum possible to the Ixians.__The plan does not end there, as the Coalition has learned that the Harkonnen have just recently purchased a highly explosive material from the Ixians that they are transporting to Dune. The Ixians have no more stocks available to sell.__Once the Lassoki have bought everything they can from the Ixians, they will use their recent acquisition to raid the Harkonnen warehouses and steal that technology in order to prevent enemies from using it in future encounters and letting the Coalition have it under their control.__It is important to remember that the prohibition on crushing infantry using heavy vehicles on Heighliners is still in effect.__Objective 1: Capture all the buildings in the abandoned base.__Objective 2: Harvest all available resources and sell the Refinery to move to a new area (repeat this step six times).__Objective 3: Buy from Ix as much equipment as possible (automatic payment according to quantity obtained) and then take by force the stored explosives of the Harkonnen, eliminating all units.__Tips: Enemies will not attack until you capture each Refinery. Plan well in advance which units you will build with the information obtained to maximize efficiency and reach the end with the most money possible.__Note: There are a total of 15,750 harvestable credits across the map (not counting profits earned from selling buildings that are no longer needed).___IX prices_------------------_=== Less than 5,000 Credits ===_* 8 Grenadiers_* 4 Enhanced Raiders_* 3 Deviators__=== Over 5,000 Credits ===_(Previous Package included)_* 8 Troopers_* 5 Quads_* 2 Missile Tanks__=== More than 7,500 Credits ===_(Previous Package included)_* 4 Light Infantry_* 3 Trikes _* 6 Combat Tanks (A)_* 2 Siege Tanks__=== More than 10,000 Credits ===_(Previous Package included)_* 2 Quad_* 2 Missile Tanks_* 2 Deviators_* 5 Grenadiers_* 4 Enhanced Raiders__(Read intel for additional information on new technology)

