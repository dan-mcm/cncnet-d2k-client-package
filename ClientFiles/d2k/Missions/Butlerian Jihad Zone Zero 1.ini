Name=Butlerian Jihad: Zone Zero - Mission 1
SideId=1
Author=Cm_Blast
Briefing=ORDOS_=======_It has been a few weeks since we took control of the servers that contained the Artificial Intelligence programming. Machines, lacking instructions, are an easy goal for anyone who wants to expand their territory, that's why we have all tried to conquer as many territories as possible.__Meanwhile, and secretly, we made a copy of the basic instructions of the AI ??and used it as a template to create a new and improved AI that you will test on the battlefield against weak Mercenaries.__Vehicles with our new A.I. are already on the battlefield. They need the Outpost to receive the attack signal. The Outpost signal does not go too far, so they will only be able to destroy the nearest Mercenary base.__The land on which you can build your base is very limited, so when you have removed the first of its bases I will offer you a VCM so you can expand. From there you must capture the Outpost of the Mercenaries. We will use it to amplify the signal from our own Outpost to order our vehicles to attack the second base of the Mercenaries.__It is not certain that Mercenaries are aware of our intentions, but they do know that we are planning something and are aware that we have established ourselves with very few resources. They will attack us as quickly as possible to prevent our forces from growing.__Objective 1: Build the Outpost to activate the vehicles to the first base of the Mercenaries.__Objective 2: Capture the Mercenary Outpost to reactivate vehicles to second base.__Tips: Even if building an Outpost is primary, you still need to start building a Refinery before completing the second objective. Don't try to destroy the Mercenaries on your own, use the vehicles with the I.A.
Music=ENTORDOS.AUD

