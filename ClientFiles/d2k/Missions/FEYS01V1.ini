Briefing=SUMMERS' SOLSTICE 01: Quality Control__MISSION OBJECTIVES:_1. Pass Sumadi's evaluation._2. Fully secure the territory._3. Accrue 2,500 Solaris.__TACTICAL OBJECTIVES:_1. View the intel entries for pertinent unit data._2. View the tactical map for terrain information.__BRIEFING:_     Ketua Sumadi has been awaiting this moment as eagerly and anxiously as you have. You and the smuggler leader have worked together before under different circumstances. Although you've had plenty of time to orient yourself with some of the other smuggler field commanders, their leader, you know, keeps himself very busy. Only now has he finally had the time and inclination to evaluate you personally for your induction. No lesser's consideration would suffice; you understand Sumadi to be ruthlessly pragmatic and meticulous.__     With the blessings of your mercenary friends, and Sumadi's approval, the time has come at last to formally join the smugglers. You have a chance to profit in the shadows of Arrakis, distant from the glare of gunfire and rockets.__     An attendant standing to your left draws your attention from the Carryall window, beyond which sand billows endlessly, with a sealed letter meant for you. You accept it quickly and skim the back.__     EYES ONLY: ROWE SUMMERS.__     That's you. This archaic method of communication must be some attempt to keep it absolutely secret. Once the attendant walks away, you slice Sumadi's iconic sand mouse seal with one of your knives, unfold the letter, and read:__**************************************************__     Commander Summers,__     The emperor has issued a challenge to each of the Great Houses: Whoever can produce the most Spice will control its source. It's said there will be no rules to how they can achieve the goal.__     This means Arrakis is soon to be submerged in blood and chaos. Our blood, if we don't afford some security. We need Spice.__     I expect great things from you. Your exploits beside Sabre Durant have been invaluable to me and my men. You'll find our operations are quieter, but, understand that as the Sardaukar have been hunting us, confrontation is inevitable. I look forward to observing what tactics you exercise against the Imperials. That said, if you fail this simple evaluation, I will be forced to replace you. Our goal is profit above all else.__     This evaluation will determine your Spice mining productivity. You will be asked to construct a standard base in the allotted time, then tasked with harvesting twenty-five hundred Solaris worth of Spice.__     I'll contact you after you arrive.__     - Ketua Sumadi__**************************************************__     You frown as you finish reading. Could it be that there is no escape from conflict on this God-forsaken ball of sand? You'll have to think about that later; your Carryall is landing at Harg Plateau. It's time to get started.
