0=Sumadi: "I will evaluate your efficiency, Summers. Make your first choice."
1=Sumadi: "You have plentiful power! Place a Refinery, Barracks, or Outpost."
2=Sumadi: "Very good, Summers. You can afford an Outpost or a Barracks."
3=Sumadi: "Excellent, your economy will grow. Construct an Outpost next."
4=Sumadi: "It's time you built a Barracks, Summers. You need defenses."
5=Sumadi: "The need may arise, but defense is not a priority at this time."
6=Sumadi: "You have excess power, Summers. Place a Refinery or Outpost."
7=Sumadi: "Good, you can now defend yourself. Construct an Outpost."
8=Sumadi: "Radar is not useful without units. Build a Refinery or Barracks."
9=Sumadi: "Don't neglect your economy, Summers. You need a Refinery."
10=Sumadi: "You are defenseless, Summers. You must build a Barracks."
11=Sumadi: "You have more power. Construct a Refinery or Outpost next."
12=Sumadi: "Don't neglect your economy. Defenders are pointless without profit."
13=Sumadi: "Good, you can defend yourself. Build an Outpost, Summers."
14=Sumadi: "I'm detecting Imperial forces incoming... Summers, repel their incursion!"
15=Sumadi: "Scouting is important for discovering Spice and unclaimed rock."
16=Giraud: "Has Sumadi finally grown a pair, or is the brash greenhorn in over her head?"
17=The Imperials have been defeated.
18=Sumadi: "You're hardly productive, Summers. I'm sorry, but you're gone."
19=Sumadi: "Excellent, Summers. Finish harvesting 2,500 Solaris and we'll wrap this up."
20=Sumadi: "Summers, Raiders barely hurt sandworms. Try using Troopers."
21=Sumadi: "Summers, please stay focused. One Harvester will do for now."
22=Sumadi: "You've built a standard base. Good job, Summers."
23=Sumadi: "Silos can store up to 1,500 Solaris. They require very little power."
24=Sumadi: "This has gone on long enough. I'm sending tanks. Summers, finish the enemy!"
25=Sumadi: "Be careful, Summers! The Imperials are mighty foes. Take these Riflemen."
26=Sumadi: "Summers, you must not lose so many men. Use these Troopers wisely..."
27=Sumadi: "Taking out the Barracks has stopped them from training infantry."
28=Sumadi: "They cannot produce common LAVs without a Light Factory."
29=Sumadi: "Without Refineries, they are starved of funds."
30=Sumadi: "Did you lose all your Harvesters? ...I'll send another."
31=Sumadi: "They'll just fly in new Harvesters! Destroy their Refineries!"
32=Sumadi: "I've sent an additional Harvester to fund the fight against them."
33=Sumadi: "The Imperials have upgraded their Barracks. You should do the same."
34=Sumadi: "Wait. Place your Wind Trap on concrete, Summers."
35=Sumadi: "Your Heavy Factory may only produce Harvesters for now."
36=Sumadi: "Summers, use Troopers to put that sandworm to sleep!"
37=Smuggler Trooper: "That Harvester wreck is salvageable, Commander."

