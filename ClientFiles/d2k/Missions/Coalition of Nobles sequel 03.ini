Briefing=The Tleilaxus advance was successfully stopped. Now the Lassoki are going to fight back. The Qaii are still weakened by the offensives and are not ready, but luckily the Iasi have heeded the call and will join the battle.__The Tleilaxu captured the Qaii base in the next territory which, added to the refineries they stole, their economy has skyrocketed. It will be a very difficult task to destroy the Tleilaxus by attacking head-on even if both members of the Coalition attack simultaneously.__The information given by the Qaii exposes them that the base they captured has a weak point that can be used to bypass the Tleilaxu's main defenses and focus all their fire on the refineries. If they are destroyed, the Tleilaxu will not be able to continue building.__Objective: Destroy the Tleilaxu base.__Secondary Objective: Find the base's weak point and destroy the Tleilaxu refineries, allowing the rest of the base to be destroyed more easily.

