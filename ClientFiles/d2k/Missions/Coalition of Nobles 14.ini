Briefing=Finally all the members of the Coalition have been freed from their captivity and are finishing preparations for the trip back to Dune. This is certainly very good news for the group, but it is still too early to celebrate any victories.__During all this time the Emperor has built a gigantic city. He has built structures everywhere and has lined up a great number of VCMs. It is clear that he plans a full-scale invasion and use those VCMs to deploy new bases in each conquered territory.__The Lassoki find themselves alone on the planet and cannot wait for their allies to arrive to act. If they don't dismantle the great city soon the Imperial forces will be completely unstoppable. For that reason the Lassoki have been exploring as much ground as possible around the facility trying not to be detected.__The annealing work has paid off. They caught a glimpse of a desert storm moving directly toward the Imperial city. A small group of Lassoki is now in the vicinity with the goal of investigating if, with any luck, the storm has created any entrance that they can use to sneak into the city and destroy it completely.__The data collected has told the Lassoki that there are certain key structures that can be captured to attract reinforcements to land deep within the city. The objective is to search and locate the only Imperial Starport that is anywhere in the area.__As soon as the Starport is owned by the Lossaki they will send as many Engineers they can use and will capture all the Imperial buildings that they allow them to obtain. The Lassoki hope that by attacking from within they can take down most of the city.__The Lassoki are aware of their resource shortage, so their efforts will focus primarily on destroying all Barracks, Light Factories, Heavy Factories, and VCMs that are inside. After completing this task they will retire, as the Emperor will have lost most of his power.__The Lassoki are aware that even the captured buildings will not be enough and they will need extra help. For this reason, they will make special smuggling orders direct from IX, which will allow them to order Grenadiers, Enhanced Raiders, and Deviators, instead of other units that will not be useful in this battle.__The Emperor is rumored to have Sandworms trapped somewhere producing large amounts of spice for them. So much that it seems that it never runs out. The Lassoki can take advantage of the situation and capture Refineries and Silos to steal the harvested spice and use it to complete the mission.__Objective 1: Find a way to enter the big city. Once inside, capture the Key buildings to receive extra reinforcements. Finally capture the Imperial Starport.__Objective 2: Destroy all Imperial Barracks, Light Factories, Heavy Factories and VCMs.__Optional objective: Capture Refineries and Silos to get extra credits.__Notes: The Starport offers new military options. Imperial VCMs cannot be deployed.

