Briefing=Just a few days after the defense of the Ordos base, Radnor, Rabban and Feyd are all summoned by the Baron. After a long while, they might finally learn what their monarch was up to all this time.__BARON: Good. You came. Certainly took you long enough._RABBAN: We would have been quicker, father, if it wasn't for Feyd. He was... a bit too busy with his women._FEYD: It is understandable. Since you are incapable of being attractive at all, I have to carry your burden on women as well. Double the quantity, double the effort._BARON: Enjoy them all, Feyd. Sometimes, that can be the best thing to happen in life. And while you're at it, you can throw some junk to your pathetic brother as well._RABBAN: But, father!_BARON: ENOUGH! Screw your women, this is war! Sublime war! It is time to complete my arrangements... Piter, open up the communication channels. Our friends are waiting. Let's hope the Executrix are also ready.__Transmission established... Linking with Viscount Moritani and Baron Mutelli. Request sent to Sigma Draconis IV, to the Ordos Executrix. Request sent to Richese, for Count Richese.__BARON MUTELLI: My dear baron. Good to hear from you again. The plan is in motion. Most of my forces are ready to move it on your mark._VISCOUNT MORITANI: Same for me, Vladimir. We're boarded on the Heighliner._BARON: I appreciate you being here. Just to let my two sons and my most experienced general know what is happening... We're preparing a bit hit for the Atreides. All the people you see here want a piece of the Atreides, in one way or another. They have agreed to help with... the invasion of Caladan, the Atreides homeworld._RADNOR: What? An invasion of Caladan?_RABBAN: But, father... That is insane. Caladan is their homeworld, it is heavily defended._BARON: You'll have to excuse them, gentlemen. They have just learned about it, and are confused. Rabban, as my rightful heir I am expecting you to be more than a scared girl._RABBAN: I am not scared, father. I am just saying..._FEYD: Let our father speak, brother. You've already said enough crap for today._BARON: I don't give a crap what the three of you believe. Everything is in motion. I have created the BIGGEST COALITION the Landsraad has ever seen._DE VRIES: Speaking of the biggest coalition... Our friends accepted the call._BARON: Link them up.__Ordos and Richese join the transmission.__BARON: Count Richese, and the Executrix of House Ordos. I am calling you to give you a one-time offer. One that could benefit everyone involved in this call._COUNT RICHESE: What is this, Baron Harkonnen? I see we have the Ordos, the Moritani and the Mutelli in here._BARON: We do. All of us despise the Atreides in some way. Or, if not despise, do not want Leto to get the throne. We all know it will happen. If we let this be a democratic vote between the Houses of the Landsraad, Leto will win. He has strong supporters, and he will manage to rally the undecided Houses by his side and get the majority._COUNT RICHESE: Why should we care about the CHOAM proposal? It's not like they can force an emperor just because the Houses voted Leto._BARON: We will be viewed as renegades, rebels... If we refuse to accept what 90% of the Landsraad will, it is going to be bad for us._EXECUTRIX: Baron is right. Sheer numbers can decide an emperor no matter what we want. That is logical. We are assuming you have some sort of plan to prevent this, Baron. That is the reason of this call. That is obvious._BARON: I do. We've been fighting for a long time, and we don't have to enjoy this. But Houses Ordos and Harkonnen need to agree for a cease fire and focus on their common enemy. _EXECUTRIX: House Ordos wants the throne. House Ordos will not accept a Harkonnen emperor. We are enemies as well. That is logical._BARON: If that second voting session happens, it will not matter anymore. Our objective is to prevent it from happening._COUNT RICHESE: And what is your idea, Baron?_BARON: To strike the Atreides where it hurts them the most... and where they aren't prepared. Caladan._COUNT RICHESE: Caladan? That will be a hard thing to break. Their air and naval power... that planet is mostly water. Their Navy is roaming everywhere._BARON: Not now. Most of their military effort is focused on Arrakis. I have carefully moved my own military focus from Arrakis to a Caladan campaign, slowly, in time.__Radnor (thinking): So that's why the Atreides managed to get dominance on Arrakis so easily. Now it makes sense. The idiot sent me on stupid and pointless missions, while the true purpose was to invade Caladan.__EXECUTRIX: If all 5 of us invade Caladan, this will attract all other Landsraad members. We will gain a lot of heat. That is a threat._BARON: This is the catch. We're not going to invade Caladan together. This is your chance to fix your own issues, Executrix. Same goes to Count Richese. I know about the issues you had recently with the Ixians. Dominic Vernius declared himself an ally of Duke Leto Atreides. He would send help on Caladan without hesitation. Leto has other allies as well, who will no doubt interfere, especially if two big Houses like Atreides and Vernius are on their side._VISCOUNT MORITANI: We are expecting House Ginaz to aid the Atreides anyway. That is my own issue. Houses Moritani and Ginaz have a vendetta for a long time. The thing is: we're all winning something from this coalition. You get to deal with the Ixians, while we deal with the Atreides and Ginaz._COUNT RICHESE: That is a very compeling deal. An opportunity to destroy House Vernius... Sweet. _BARON: With no offense, but for it to be effective, you'll need the help of House Ordos. Together, you can lay waste on Ix. Then, you can claim the technological leadership easily._BARON MUTELLI: It really depends on the Executrix. _EXECUTRIX: House Ordos will join your coalition. House Ordos will direct its military towards Ix, together with House Richese. The Ordos will not interfere against the Atreides. That is the directive._BARON: Excellent. With your attack on Ix, Dominic Vernius will be unable to send help on Caladan. My forces, along with Moritani and Mutelli, will destroy the Atreides._COUNT RICHESE: We'll be starting preparations immediately.__Transmission ended...__BARON: Well? I don't see much enthusiasm on your faces..._RABBAN: Your plan looks good, dad. But... the Atreides have allies. They might interfere._BARON: Their only dangerous ally is Dominic Vernius. I just made sure he won't. You're totally stupid, Rabban. Your incompetence makes me sick. I am really tired of it. You'd better be careful about your performance on Caladan. If it's not good enough, I will start thinking if Feyd should be the rightful heir!_RABBAN: WHAT? You cannot do this!_BARON: AM I NOT THE BARON? CAN'T I DO WHAT I PLEASE? Get out of my face. Remember, you'd better not screw up.__Rabban leaves furious. __BARON: General Radnor, your task is simple, yet vital. You'll lead the charge on Caladan. Our first objective is to attack the Atreides Spaceport on the southern continent. That will prevent their space transport capabilities to only Cala City, their capital. Feyd, you and your stupid brother will attack Serena's Necklace. Those islands are vital for the Atreides Navy. Taking them under control will mean their navy will retaliate harder. Remmeber, we have the element of surprise on our side. They have no idea our troops are closing in on their planet as we speak. Until they can retaliate properly, they will be very defensive. Use this wisely.__Baron leaves.__FEYD: General, before leaving... I'd want to let you know that you are welcome to... join my inner circle._RADNOR: Your inner circle?_FEYD: As you heared, my imbecile brother seems to be too much for my dad as well. He's close to losing that heir status... And we both know he will. He is way too incompetent. There might just be a new heir..._RADNOR: I see. Well, I am loyal to the Baron. And that is your father, my lord._FEYD: Absolutely true, general. But one day, he won't be anymore. You know me, I know you. We're both smart men, and very capable. We can do amazing things together. Just think about it. All I ask is that you support me over my brother, if it will ever come down to that._RADNOR: Forgive me, my lord, but... are you foreseeing a ... civil war?_FEYD: I don't know. All I know is that my brother wants the throne, and he will screw up on Caladan. Then, he will do whatever it takes to be the Baron, and not let me take it. You might not believe me now, general, but wait and you'll see. I know my brother perfectly._RADNOR: I will think about it. For now, we have an invasion to prepare for._FEYD: Excellent, general. Remember, me and you... great things... together.__==========_Objective: Crazy or not, the Baron wants to invade Caladan. But we won't do it alone. The Ordos and Richese distraction on Ix will ensure the big and scary ally of Leto Atreides will not interfere. Your task is to land on the southern continent, destroy the small Atreides forward base there and deploy a base, together with House Moritani forces. Destroy the Atreides base to the north to secure the Atreides Spaceport for us. They will retaliate, and they will bring troops from Arrakis. With one of their two major Spaceports under our control, their retaliation will be slow. Tactical map available, press the button to view it.
