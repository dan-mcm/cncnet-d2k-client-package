Briefing=The infighting on Arrakis between all the Coalition members gave the Tleilaxu the perfect distraction to land on Seneca: the Lassoki homeworld undetected.__The leader of the Lassoki has scrambled to dispatch units to deal with the Tleilaxu base they have found. Preliminary reports indicate that the enemy base is small, so it has been concluded that it is simply an outpost.__The first step is to find the Mining Rig indicated on the tactical map to get a MCV ready to land nearby. Due to the hastiness of the situation the Lassoki will have access to limited technology, but more than enough to eliminate this Tleilaxu outpost before they spread across the planet.__Objective: Find the Mining Rig at the end of the road to get a MCV. Then destroy the Tleilaxu.__Tips: Resources are constant but limited. Two Harvesters concentrated in the same gem field will deplete resources faster than they can be regenerated.

