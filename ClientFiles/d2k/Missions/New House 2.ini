Briefing=You have done an excellent job. Now we can use the money to develop technological improvements that allow us the construction of Troopers and Quads.__However, I fear that the Harkonnen are taking the lead, since they are investigating a tank they have called "The Devastator" with an armor and a so powerful weapons that can sweep an entire base with a few units.__If we want to have any chance of succeeding in Arrakis, we must prevent the Harkonnen to mass manufactured that tank. For now they only have a non functional prototype.__We know exactly where is the prototype. Build a new base, make appropriate upgrade and destroy that Devastator. Destroying the Harkonnen buildings you consider suitable, but your main objective is to destroy the Devastator.__Objective: Destroy the non funtional prototype of the Devastator.

