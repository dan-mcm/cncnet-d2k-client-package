Briefing=SUMMERS' SOLSTICE 09: Shield Wall Showdown__MISSION OBJECTIVES:_1. Blitz the weak Imperial expansion and capture all you can._2. Raze the base on the northern end of your starting island._3. The Ordos must not be defeated once they arrive._4. Defeat all enemy forces._5. You must survive.__TACTICAL OBJECTIVES:_1. Scout for easy targets using Stealth Raiders._2. Put your resources towards early aggression._3. Capture more Imperial structures to tech up._4. Build turrets in enemy bases to hold ground.__BRIEFING:_     At your command post near Alazor Steppe, Durant and Moriaen appear on your conference screen to discuss the coming battle.__     Moriaen speaks first. "The Imperial Burseg has become desperate and recalled all forces to our present region. Spies report that both the top Atreides and Harkonnen commanders are attending an emergency meeting at the Imperial base here as well. They have entered a cease-fire with each-other at last."__     Durant dryly adds, "Their numbers are huge. All three armies are receiving aid from Shield Wall."__     You consider the situation a moment. "Do we have any spies in Shield Wall?"__     "Enemy numbers at Shield Wall are, at the moment, comparatively less than Alazor Steppe," Moriaen replies. Naturally. They expect to fight you here.__     The idea occurs to you to circumvent Alazor Steppe, but enemy patrols cover all of Tuono Basin and Bled al-Hazrad. You would have the element of surprise if you made it there at all. "What do you say about an attack on Shield Wall?" you ask, looking to Durant first.__     He eyes you skeptically. "Are you crazy? The region is covered in Imperial armor, and the Emperor himself resides just beyond it."__     "And if we kill him, the war is finished," you explain. "We win."__     "An attack on Shield Wall would be ill-advised," Moriaen agrees, frowning at you. "Our forces would be intercepted and destroyed en-route."__     You glance down at your maps and examine recent intelligence on the enemy presence in Shield Wall. When you spot a weakness, you look back up at the conference screen. "On the south end is an Imperial supply base. Munitions everywhere. I can go with a group of Stealth Raiders, take some ground, and then clear some more space for both of you."__     Durant sighs. Moriaen, on the other hand, seems to consider it.__     Eventually, she agrees: "You are permitted to attempt this. You will have only monetary support and nothing more until you clear out enough Imperial forces. We must arrange for the battle at Alazor Steppe in case this does not work."__     "Understood," you reply, and then disconnect from the conference. Your Solaris coffers are promptly filled to 30k. There's nothing more to do but think through your game plan during the drive to the north.__     A head-on fight against the full power of your foes is out of the question. Your ordeals have steeled your heart for the bold action required to win. Your strike from nowhere will confuse and disorient the Great Houses. They'll have no choice but to divide their forces. Conquering them will take more than courage, however.__     Your LAVs roll to a stop, each helping to transport the essential combat, logistical and special forces infantry components of your surprise attack. You order a handful of them past the enemy defenses, making to join them yourself.
MissionNumber=9

