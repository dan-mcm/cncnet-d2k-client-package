Briefing=The Lassoki destroyed the vast majority of the new Qaii vehicles, although some had already been transported out of the territory. This implies that the Qaii still have access to that technology but in lower numbers.__The reprisals of the Qaii have not been long in coming. In a territory that is difficult to access and partially hidden because it is completely surrounded by mountains, they are grouping a large number of forces with the sole purpose of going to war with the Lassoki.__The Lassoki have discovered them and have already sent a group to fight before they rearm more. They know that the Qaii have large numbers and defenses to protect them, but if they outflank them, they can defeat them even with a smaller army.__Objective: Destroy the Qaii.

