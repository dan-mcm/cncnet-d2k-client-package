Briefing=Now is the day to pay our quota of spice to the spacing guild so our Sietchs remain hidden in the eyes of all Houses. As always, you will bring a harvester full of spice in his wagon to make the payment.__Crossing the next field will be complicated with all those Harkonnen patrols everywhere. Avoid them as far as possible. Bringing that Harvester will draw a lot of attention, you can expect action from the Harkonnen.__Reach the end of the passage, marked with 2 carry all crashed in the sand.__Objective: Complete the route without loosing the harvester.__Note: it isn't necessary to fill the harvester for beat the level.

