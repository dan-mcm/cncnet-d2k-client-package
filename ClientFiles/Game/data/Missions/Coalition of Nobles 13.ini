Briefing=Soldiers Iasi and Qaii have rescued their respective leaders, so now it's the turn of the Bromeli bombs. Leader Lassoki is more used to leading an army than bombarding enemies, but it is the only thing available to free the missing leader.__Giedi Prime is the location of Leader Bromeli. Trapped in an Outpost/Prison inside a Harkonnen base full of Vehicle Factories, multiple Barracks and endless defensive Turrets. Even with an army it would be a daunting task.__The Bromeli's specialty is the use of explosives of all kinds, and the only way to gather combat machines is through Starport shopping. In addition, Giedi Prime's tough terrain has damaged the Refinery's storage systems, generating significant cracks; Until they can solve the escape problems, the Refinery can only collect 1,000 credits maximum.__The Harkonnen have been fighting for the past hours against a group they have called "Rebels". This unknown army only has in mind to exterminate all the Harkonnen that they find in their way, so at least the Bromeli soldiers will only have to worry about defending themselves against the Harkonnen.__After multiple espionages, the Lassoki Leader has found the weak point of the Harkonnen's iron defense. These are three Outposts that control the Walls and Turrets system. Bromeli Saboteurs, with their ability to turn invisible, can sneak through the area and destroy those Outposts.__While this task is being carried out, it will be very important to do orders in the Starport and make use of the only Turret that the Bromeli soldiers have been able to find and activate. Buildings must be kept intact for a chance to rescue the Bromeli Leader.__As soon as all three Outpost have been destroyed and the Refinery crack repaired, they can raise enough money to order a VCM, deploy a base, and build the rest of the bombing units to tear apart the Harkonnen base.__The Rebels will be of help to the Bromeli, but in the end it is very important that the area is as clear as possible and that the Bromeli vehicles themselves destroy the Prison. The Leader could be killed in the crossfire and that would be the Coalition's doom.__It is possible to fight the Rebels if the situation turns dangerous, but still these Rebels will have much more interest in destroying the Harkonnen than the Bromeli. Similarly the Harkonnen consider their defenses to be strong enough on their own, so they will ignore the Rebels and focus their offensives on the Bromeli. If their defenses are breached they will have no choice but to fight them more openly.__Giedi Prime is a very harsh planet where there are hardly any rocky areas in which to expand with additional bases. The land, seriously damaged by indiscriminate production and high pollution, will make vehicles move more slowly through much of the territory.__The only available resource is industrial waste that can hardly be reused to construct new units or buildings. It will take to harvest more just to be able to recycle enough to buy something on the Starport (Read intel for detailed info).__Objective: Destroy all three Outpost to disable the strong Harkonnen defenses. Then clear the area to destroy the Modified Outpost where the Leader is trapped and protect him until he can be safely extracted.__Tips: As long as the Harkonnen Turrets are active the Rebels and Harkonnen units will ignore each other. When the Turrets do not work it is possible to make them face each other. Let the Rebels assist in the attacks, but fight them if they put the operation in jeopardy. Even if you fight them, they will continue to focus their efforts on fighting the Harkonnen. Have units close to the building to be able to eliminate the enemy infantry that will be generated by the destroyed building, but be very careful with your own Siege Tanks, which could kill the leader with friendly fire.__Notes: The Starport is the only way for the Bromeli to generate an army.

