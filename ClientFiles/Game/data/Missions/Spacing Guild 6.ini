Briefing=With this modified sandworm we will never depend on the Great Houses or Arrakis to provide us with the spice we need. Now it only remains for us to draw the worm from the planet and bring it to ours.__Sadly an unfortunate mishap has occurred: The frigate carrying our special sandworm to an another starport had mechanical problems and crashed on the sand into the territory of Mercenaries._The worm remains in its container box, but the mercenaries who have come to investigate what happened discovered the contents of the box. If they report we have a enclosed worm the Emperor will be alerted.__Kill the mercenaries explorers and use some of the engineers aboard the frigate to capture one of their bases and use it to create an army to destroy the others. We have denied any frigate directed them to give you a chance to survive, but you can use the starport to place orders.__When the Emperor asks for our actions will argue self-defense, so go all in to eliminate the mercenaries. Still not deploy a VCM; no explanation will save us from that action.__Objective: Capture one of the Mercenary base and destroy the others. Not deploy an MCV.__Notes for the Commander: The territory has been explored before. You have an absolute vision of the whole map (Save and load at any moment to have accurate information in the minimap).

[Text]
1=Quick! Capture some of their bases!
2=Mercenary Leader: This treachery will not go unpunished.
3=Tip: Capture the refinery while having an attached harvester.
4=Mercenaries have been annihilated.

