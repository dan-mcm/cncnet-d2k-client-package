Briefing=EPILOGUE_=========_What began as an ambitious plan ended up becoming real. The Four Lesser Houses of Lassoki, Iasi, Qaii and Bromeli had succeeded: they have conquered all of Dune.__The Emperor has not been long in coming and has ordered to quickly contact the members of the Coalition. In the statement sent to the four he has expressed his dissatisfaction with the illegal participation of the Coalition in an event designed to resolve the dispute between Atreides, Ordos and Harkonnen.__However, he is aware that currently whoever controls Dune controls the spice, and whoever controls the spice controls the universe. The Landsraad is relieved that the conflict is finally over, and the Guild of Navigators don't care who controls the planet as long as the spice continues to flow.__For that reason the Emperor has decided to surrender and grant the Houses of the Coalition control of Dune officially. All that is required is for the four leaders to appear in front of the Emperor in the neutral Heighliner of the Guild of Navigators.__The Qaii, the Iasi and the Bromeli have already arrived and are waiting for both the Lassoki and the Emperor himself, who will not be long in coming. Leader Lassoki has already disembarked with his personal guard and is preparing to rejoin the rest of his group.__It is expected to negotiate Dune control agreements such as absolute permits to harvest all the spice they can collect and sell it at the standard prices established by the C.H.O.A.M..__Also, each member of the Coalition plans to divide control of Dune into four strips that will allow each House to have its own terrain in which to do with it whatever they deem appropriate, but always with the concept of "Coalition" as a single entity that will respond face attacks in conjunction if any of them are threatened.__As soon as the meeting is over, each of the four will return to their respective Frigates on their way to Dune, prepared to live a life of the long-awaited glory that four Houses as minor as the Lassoki, Iasi, Qaii and Bromeli could never have dreamed of getting on their own.__Strength in numbers.__Objective: Travel to the East, meet the rest of the Coalition and the Emperor and observe the details of the meeting. At the end, return to the Frigate.

