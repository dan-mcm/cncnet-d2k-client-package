Briefing=LOCATION: Arrakeen, Atreides Central Command on Arrakis_=========__GURNEY: Duncan, what the actual hell is happening ? Got rid of the Ordos, as Hawat ordered. I am not sure if that was such a prority compared to what is happening on Caladan. We should be there already._DUNCAN: I managed to talk to the Duke. He suspects there is a big coalition against House Atreides, initiated by House Harkonnen. _GURNEY: A coalition? So it's not only the Harkonnen invading Caladan?_DUNCAN: No. House Mortitani troops were also spotted aiding the Harkonnen invaders. They have stormed the shores on the main continent. Atreides naval fleet is retaliating as we speak, but the enemy forces are very numerous. The southern part of the continent has been already lost._GURNEY: This is ridiculous. What are we waiting for? We must set course for Caladan immediately._DUNCAN: Let me finish, friend. You need to calm down. The Duke is confident in our defenses. However, I fear it might not be as good as he thinks. House Mutelli has been recently spotted on the eastern coast of the main continent, deploying together with House Moritani. It seems all Harkonnen supporters from the Landsraad council meeting are joining them in this invasion.__Transmission incoming...__DUKE: Gurney, happy to see you safe and sound._GURNEY: My lord... I must gather the troops from Arrakis and move in to Caladan._DUKE: Hold on, friend. Do not sign up for Guild transportation. It seems the partnership they formed on Arrakis with the Harkonnen was a smart move from the Baron. He ensured the Guild will transport Harkonnen, Moritani and Mutelli forces on Caladan, while our own transports would simply vanish. The Guild cannot be trusted. _HAWAT: And the other issue is that House Vernius of Ix is invaded as well, just as we speak. Several Guild heighliners carrying House Richese and possibly House Ordos freighters were spotted over Ix's orbit a few hours ago. They were not landed at that time, but it is obvious House Richese is not just going for a walk near their sworn enemies' planet's orbit. Ixian heighliners are quite unreachable at the moment. _GURNEY: The Guild! Those scumbags, how can they still be getting involved into Landsraad conflicts after everything that happened on Arrakis? My lord, my smuggler friends will help us. They will move our troops to Caladan. They have aquired several Ixian Heighliners with all the wealth they got recently, after Guild's betrayal. It is more than enough to move our Arrakis military to Caladan._DUKE: Do not move it all, Gurney._GURNEY: But... My lord! Three enemy Houses invading our homeworld... We must bring it all for defence!_DUKE: Caladan is OUR homeworld. We know all the tricks, we control the air and seas. Our fleet is retaliating as we speak. Those Moritani and Mutelli on the eastern coast will have a hard time in two hours, when our fleets reach them. Our Air bases are operational and striking hard. Although the enemy is numerous, we have all the chances to make it. Also, I am negociating as we speak with Count Ginaz. I want to ask for his assistance. We are able to provide necessary transport for House Ginaz troops if they accept, right Gurney?_GURNEY: Definitely. My smugglers friends are amazing. You will see, my lord._DUKE: Good. I must go. I want you to move to Caladan. Hawat will send you the requirements in terms of how much military you are to bring back home. Duncan, you must remain on Arrakis. All you have to do for now is to ensure the Harkonnen or the Ordos will not take any of our territories there. Most likely their focus is on the invasions as well, but we must ensure the invasions are not only a diversion to take Arrakis from us._DUNCAN: Understood, my Duke._DUKE: Gurney, I want you to deploy on the Southern continent, close to Cidrit Town. The most important thing is to take back the Atreides Landing Spaceport there. You must deploy a small task force and take over the base at Cidrit Town. It was devastated by Harkonnen and Moritani forces, but not destroyed. Capture it all and use it against the enemy to take back our Spaceport. Once done, you will be able to land the big guns you are bringing from Arrakis and take over the rest of the continent. Our Air bases close to Cidrit Town will be enough to allow us to move our Arrakis troops from the Southern Continent to the main continent. We should be able to move them unchallanged, since we still have decisive air and naval superiority over the oceans. Speaking of naval power, our ships should be enough to cover you while you deploy on the continent. _GURNEY: It will be done, my lord.__==========_Objective: Caladan is being invaded by multiple enemies. Although the situation is critical, the Duke has a plan and some friends. Your first task is to take over the abandoned ruined base near Cidrit Town, on the southern continent. The might of the Atreides Navy will cover you while doing so. Once done, build up a strike force and take back our Spaceport. Destroy all Harkonnen and Moritani forces. You might want to scout around and reach Cidrit Town's outskirts. There might be Atreides soldiers taking shelter there, and they will gladly join you against the Harkonnen. Tactical map available, press the button to view it.
