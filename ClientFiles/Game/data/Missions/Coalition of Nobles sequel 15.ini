Briefing=The Iasi and the Qaii have realized that fighting each other only benefits the Lassoki, so they have formed an alliance combining the bulk of both armies; an alliance that they will not break until they defeat the Lassoki.__The Lassoki were already prepared and have put up a strong defense to stop the offensives of these two dangerous groups.__Unfortunately, all the spice that the Lassoki can harvest is found in highly dangerous areas, while the Iasi and Qaii have their Harvesters in safe, inaccessible areas behind their bases.__The Lassoki have found a solution to the problem: a base of Smugglers has been hit by a Coriolis Storm in which they have lost almost everything. Their base is seriously damaged and their Harvesters have been destroyed or buried in the sand.__Although now only a few scraps remain, this base has the advantage of being at the rear of the Iasi and Qaii. The Lassoki have offered the Smugglers 3 harvesters full of spice in exchange for receiving control of the base and the area explored by the Smugglers.__Lassoki Harvesters can fly with Carryalls to do the payment. Once the base is under control, they will be able to build structures or vehicles with which to attack all the enemy Harvesters from the rear and, since neither the Iasi nor the Qaii expect this maneuver, they will not know that their economy is being severely affected.__The Lassoki hope that without Spice in their stores, the destruction of the two bases will be much easier.__Objective: Destroy the Iasi and the Qaii.__Secondary Objective: Fly over with 3 Harvesters full of spice towards the Smugglers' base to buy their base and discover part of the map.__Tip: To send the Harvesters into the air, have them try to harvest the spice surrounding the Smugglers' base. If you buy the Smugglers' base and it is destroyed, it is still possible to build new buildings in the gaps. Enemies will ignore you if you attack their harvesters.

