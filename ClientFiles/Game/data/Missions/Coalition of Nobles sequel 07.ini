Briefing=The Bromeli violated the Coalition treaty by attacking the Ixians, as they were the architects of their victory at Dune thanks to the advanced technology they purchased from them, and therefore they have a non-aggression pact from the coalition.__However, the Bromeli believe that they never agreed to such a deal, as their powerful Death Hand Missile was stolen from the Harkonnens and therefore owes the Ixians nothing.__The Lassoki, in retaliation, will destroy one of the Bromeli's main bases. They hope that with this action the Ixians will be willing to sell the experimental vehicles they rescued from the Bromeli.__It is well known that, even now, the Bromeli still lack a regular army, being able to get only a limited number of units through the Starport but still no one should underestimates them because they know of their immense bombardment power.__Objective: Destroy the Bromeli.

