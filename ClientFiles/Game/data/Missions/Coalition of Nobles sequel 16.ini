Briefing=The Iasi and the Qaii have been decimated. All that remains are a small group of survivors who have taken refuge in the last available territory, still controlled by the Bromeli. They have offered them some resources because the Bromeli knows that they will soon face the Lassoki and without help they will not be able to win.__The Bromeli Turret that the Lassoki destroyed during their raid with the Deviators seemed to be just a test sample, as numerous such turrets have been detected throughout the land. The Lassoki will proceed with the utmost care.__The Bromeli somehow have trapped Sandworms producing unlimited amounts of spice for them. The Emperor already used this technology during the coalition invasion, though it appears that the Bromeli do not dominate it completely.__The Lassoki are ready for the invasion; they have gathered all the money they can get to use it in an all or nothing in this staggered battle, destroying each of the Bromeli settlements one by one and expanding with additional Refineries to improve their economy.__Once the battle is over, only the Lassoki will be left standing and they will have complete control of all of Dune.__Objective: Destroy all enemies._

