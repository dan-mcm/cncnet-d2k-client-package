Briefing=Following the Harkonnen surprise attack, Gurney Halleck is now discussing with the Smugglers. He has done several favors to the Smugglers in the past, and they seem to remember it, as they are interested to discuss with Gurney.__HALVARD (Smuggler leader): General Halleck, you are a man who always kept his word, and always worked in the favor of our smuggler organization. I want to officially thank you for this._GURNEY: Thank you. As I said already, House Atreides can usually... miss... certain things that you guys are doing around here. After all, we're dealing with other issues. At least, that was what we told the Emperor in the past. But hell yea, there's no emperor now so guess what: I can tell you right in the face: we don't give a shit about your illegal activities. We're a cool bunch, do whatever you want. _HALVARD: We appreciate this, Gurney Halleck. We wish to offer you some services because of your... friendly reminder. Our transports are available to Atreides forces, if you need to transport troops to or from Caladan. As a wise man once said... screw the Guild!_GURNEY: Indeed, screw those rats! Now I have heared different rumours about your ships... Something like being of Ixian design, people fearing they are thinking machines._HALVARD: We both know they're not. The Ixians aren't playing with fire here, it's definitely not a thinking machine._GURNEY: Currently, I don't give a crap about that either. All I want is a spice coffee, a baliset and a free evening to do my thing... Ah, the baliset!__An Atreides soldier enters and addresses Gurney:__SOLDIER: General Halleck, the Duke wants to see you immediately. Transmissions are already established in the briefing room._GURNEY: Alright then, I guess no balisets and spice coffees today. What a surprise. I'm coming right now.__Gurney enters the briefing room:__GURNEY: My lord!_DUKE: Gurney, great job there. Even with the Harkonnen putting up cheap moves against you._GURNEY: I won't let the Harkonnen rats beat me! I knew they will turn on us at some point. A rat doesn't change in a million years._DUKE: They have turned on us on every region on Arrakis. It seems they have planned this for a while. For some reason, they made a deal with the Guild. Not necessarily an alliance, as they don't help each other, but they don't fight anymore. That is not good, we have to be careful._GURNEY: Harkonnen scum, my lord. That's it._DUKE: The Landsraad coalition has fallen. The Ordos are doing their own thing as well. We're on our own. Gurney, I'll give you some bad news._GURNEY: What is it, sire?_DUKE: Duncan Idaho was also caught by surprise by the Harkonnen. His troops were defeated and routed. He managed to escape in the desert. Last contact came from a Sietch. Few Fremen survivors gave him shelter in the Sietch. _GURNEY: You don't have to tell me more, my lord. I'm on my way. Just send me the coordinates for that Sietch._DUKE: Careful, Gurney. The area is open sand and is crawling with Sandworms. It is extremely dangerous. You must make sure that you take shelter on small rock patches. Also, make sure you only take a small squad of vehicles, preferably vehicles resistant to the bad weather which was reported in the zone._GURNEY: I will get some of the Harkonnen Devastators we captured from them. They are heavy armored and have enough firepower to blast the worms._DUKE: One more thing: Thufir Hawat told me the bad weather might affect your communications. In that case, the Atreides Air base cannot receive your call for evac. We must find a way to get you out of there. Also, you just received the coordinates._GURNEY: Don't worry, my lord. I know the region. I know how to get out of there. Small range comms will work, and I have a friend of the smugglers' there. He might have all we need._DUKE: A friend of the smugglers?_GURNEY: Don't worry. I have it covered, trust me._DUKE: Never doubted you in my life, Gurney. Good luck. Bring Duncan back!__========__Objective: The area is crawling with worms. Anything outside of the small base perimeter is considered high risk. Make sure your small squad takes shelter on small rock patches. Your objective is to locate the Fremen Sietch and resque Duncan Idaho. There is a beacon on the map near the last contact point Idaho made with House Atreides. Be careful while in-game, and watch the dialog messages carefully. They will contain additional briefing that you need to know. After all, you need a way out of there, and you don't know what that is for the moment.

