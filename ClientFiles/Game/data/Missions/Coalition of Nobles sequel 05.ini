Briefing=Almost all of the Tleilaxu have been driven from Dune, only a scattered few remain that the Bromeli ornithopters are searching for and bombarding. Meanwhile, the Lassoki discovered that the Tleilaxu paid the Spacing Guild for interplanetary travel, but hid that their destination was Arrakis.__The objective of the Tleilaxu was to land near the Iasi and offer them Gholas of the Sardaukar, since the Iasi always showed admiration for the Imperial elite. However, the Lassoki discovered them and had to flee in a rush; landing in Qaii territory.__The Coalition, including the Iasi, quickly rallied and fought before they could be contacted but, when they had a chance to talk without outside interference, struck a deal: The Iasi would grant them some buildings and resources in exchange for Sardaukar gholas.__Now the Iasi have at their beck an entire army of Sardaukar, albeit Gholas, who swell their ranks. Gholas are considered forbidden technology, so much so that the four Nobles, even before they became part of a Coalition, repudiated their concept.__But now are different times, and the Iasi are willing to use those monstrous beings in battle, so the Lassoki are going to destroy them even if they have to fight openly against the house of the Iasi to achieve that goal.__Objective: Destroy the Iasi.__Secondary Objective: Use Deviators against Smuggler Harvesters to steal the spice they contain and permanently get free Harvesters.__Note: You will not need to use Deviators once the harvesters have converted to your side.

