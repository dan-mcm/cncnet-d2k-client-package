Briefing=The smugglers are outraged by the attacks received by the Atreides on our last mission, so they are planning a large scale attack against an important base for the Atreides. We have offered to help in the offensive.__Our allies have already prepared a ground combat unit and some carryalls ready to attack the enemy base, but the strong defense of the Atreides can easily repel any ofensive.__We know that an outpost to the north, outside the main base, controls the defensive turrets that surround the base Atreides located to the east. Destroy the outpost to disable the defenses. Once the building is gone the smugglers will have a free hand to the offensive.__Objective: Destroy the outpost in the north to disable the defenses, then destroys the main Atreides base located to the east.

