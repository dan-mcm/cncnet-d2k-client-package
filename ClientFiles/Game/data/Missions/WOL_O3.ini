Briefing=Tyle and Lora are in transit towards Atsum, on Executrix's classified orders. The region has been devastated by war, and is currently under Atreides control. The Executrix gets in contact with the two while they are getting close to the deployment zone.__EXECUTRIX: Mentat, what is the status? Information is key. That is a fact._LORA: I sent our few available Ornithopters to scout the sector. It seems the Atreides have a medium-sized base. They are probably not expecting any offensive moves in this sector. However, scouts reported Smuggler forces near Atsum. They are obviously protected by the Atreides._TYLE: That is no surprise. We know that the Duke's most trusted general, Gurney Halleck, has close ties to the Arakeen smuggler guild. _EXECUTRIX: That is unexpected. There is a high probability the Atreides defence will be aided by the nearby Smugglers._LORA: That is almost a 100% percent chance, my lords. We must allocate additional funds for this operation._EXECUTRIX: That is unacceptable. We must preserve our resources. We are not diverting anything back to the war effort. That is necessity. Previously collected spice is already in transit to Draconis IV. You must take the region with the current available funds. That is the directive.__Transmission ended...__TYLE: What the hell is this all about?_Lora looks pretty skeptical at her partner._LORA: You are ordered to take Atsum._TYLE: Like... really? Just like that, take Atsum... From the Atreides AND the Arakeen Smugglers._LORA: Just like that._TYLE: And with our current available funds, which are probably enough for a spice coffee instead of a full-scale offensive._LORA: Kind of._TYLE: So how about "we must avoid all offensive operations for the time being"? I recall that was the directive before._LORA: It has. The reason why they insist on taking Atsum is the high amount of spice available in the sector. They want to speed up spice production by 75%._TYLE: 75%? Just having more spice doesn't mean you can harvest it faster._LORA: I am ordered to relocate a considerable amount of Harvesters and Carryalls for Atsum, once it is taken. Straight from Draconis IV shipments._TYLE: Why this sudden change of directives?_LORA: Because of the plan they have. I promised you'll get this intel as a prize for the last mission... So there you go. They are negociating with the Tleilaxu._TYLE: Negociate? With the Tleilaxu? What is it about?_LORA: Gholas. A lot of Gholas. They are already in the making, and have been for a while. _TYLE: I see now. So this is how they plan to fix the whole war._LORA: If we can pay in time for all of them, we will have a massive army of Gholas. That will immediately put us back to power in this war._TYLE: Alright, not bad... But if they want Atsum so badly, it means we cannot pay for them right now._LORA: Pretty much. I also know they have also ordered some special Ghola. One that costs a lot. Not sure why, I haven't found out yet._TYLE: Well it certainly took you some time to tell me all these, Lora._LORA: This is highly classified information. I am trying to be very prudent._TYLE: Even so, attacking Atsum is pretty much suicidal, with the amount of funds available._LORA: I've made my calculations. It should be enough if we reallocate any defensive costs to the offensive. To be able to adjust the budget like that, we'll need mercenaries to protect the base.__Lora moves to the communication interface and establishes a connection.__LORA: Sabre! I am happy to see you again.__Who the hell is this?_, thinks Tyle.__DURANT: Lora! Always a pleasure, you know that. I apologize for not being able to directly talk to you last time you asked for our services, but I was split in so many directions._LORA: I'll give you a chance to redeem yourself for this sin, Sabre. Executor Tyle, this is Sabre Durant, leader of the Mercenary company who aided you in the previous mission. Sabre, this is Executor Tyle, Ordos' finest military mastermind._DURANT: I have heared stories about you, Executor. Boys have tons of war stories, and you are the main guy in a lot of them._TYLE: "Thank you. I have also heared stories about you", lies Tyle._Lora looks at Tyle and tries not to laugh._LORA: Enough with the formalities. Sabre, I need help. We're going to attack Atsum._DURANT: Well, that's a ballsy move right there, gotta admit. As you know, my men are always ready... for the right price._LORA: Actually... we're low on funds. We can pay a quarter of what we paid last time. We need troops to defend while building up the offensive. We'll attack Atsum ourselves._Durant stops. He lookes confused to the mentat, then replies:_DURANT: Well... then you shall get troops for quarter the price._LORA: Sabre, I was hoping you could... help me out this time. I really need this favor. If we fail here, I'm not sure what's gonna happen with us._DURANT: Lora, I understand that. But you also have to understand that I am paying my men's wages from the cash I get in missions. That is the life of a mercenary. I cannot shit money. They will not fight unless paid. And I cannot pay them more than I earn._LORA: I also understand that. _Sabre tries to say something, but stops. After a brief pause, he goes on:_DURANT: Alright. What I can provide is a few detachments of pretty experienced men and good vehicles. For you, I will send some more reinforcements after a while. On the house, so to speak. But you better succeed, as this is a one-time favor I'll make, and, at some point, I'll expect it returned. This is my very own pocket I'm paying from._LORA: Always knew I could count on you, Sabre! I'll send you the details soon._DURANT: Take care Lora, we'll keep in touch!__Transmission ended...__Tyle turns to Lora._TYLE: Sabre Durant, eh? Never knew you were into mercenary leaders._Lora smiles._LORA: What? Are you gealous?_TYLE: Gealous? This is ridiculous! This is war. I couldn't care less about such things now._Lora starts laughing._LORA: Well, even better then, because soon you'll have to work with this man._TYLE: Oh, how blessed are we that he is doing this JUST FOR YOU. He was very clear on the specifics right there._LORA: I love your irony. Being grumpy fits you well._TYLE: Screw this. Just give me the details. I'll freaking storm that shithole base and their pathetic smugglers. I'll show your dear Durant how a real commander gets the job done with a small pocket._Lora smirks, obviously pleased by what she managed to achieve.__==========_Objective: Lora's relations and influence once again seem crucial. She managed to find some help for the almost impossible task of taking Atsum from the Atreides with our current available budget. Of course, this can only succeed if executed properly. You will take control of a small outpost, which was deployed secretly on Executrix's orders. The base was recently discovered, though, so be on your guard. Our mercenaries will ensure that the main entrance to the base is protected. Thanks to Lora's influence, we will benefit from multiple reinforcements, should their forces take casualties. Be advised, though: Sabre Durant will only provide us with a limited number of reinforcements. Try to work in tandem with his mercenaries for defense, but only allocate as few funds as possible for this. Your main objective is the destruction of the Atreides and Smuggler bases to the north-west. In order to do that, you must focus on getting an offensive force as soon as possible, before all mercenary reinforcements are overrun. Do not count on the mercenaries for the entire mission, use them early to set up your forces. Due to the preservation of military budget, higher tech units such as the Deviator are not available at this time. Tactical map available, press the button to view it.
