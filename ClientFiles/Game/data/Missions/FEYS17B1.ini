Briefing=SUMMERS' SOLSTICE B3: Against the Storm__MISSION OBJECTIVES:_1. Fend off all twenty-one waves of enemies._2. Durant's ConYard must remain intact.__TACTICAL OBJECTIVES:_1. Build a Barracks at each new spot._2. Beware enemy Carryall hotdrops._3. Pay attention to Summers' hints!__BRIEFING:_     Summers is on the other end with a devilish smirk.__     "Great news, Galletti. Sabre discovered a wealth of knowledge on SLasher tech up on the Heighliner. Lots of poorly encrypted data. Probably enough to build a working prototype, and at least enough to manufacture Shock Raiders."__     You laugh. Perhaps Moriaen thought it safe on the Heighliner. She would not be the first to underestimate these two.__     Summers continues, "There's a problem though." Of course there is.__     You remind her, "There are more battles to fight on Arrakis." There remains more vengeance to take on the Tleilaxu and their sinister cabal.__     "We need that data, first and foremost. I would do this myself, but as you said, there are more battles ahead. I have to prepare my forces on Arrakis for the next move against Moriaen, and Durant nor I can sit on the data until it's done transferring. We expect a lot of resistance."__     Who but a Sardaukar commander would be suited for such a perilous mission? You agree to it. "Very well, Summers. I'll conduct this operation."__     "You might want to wait until I'm done talking before you agree to this," the rival commander warns you. As if there is any doubt! She reiterates, "We expect a lot of resistance, and the majority of Durant's forces are unavailable to assist even with Moriaen diverting many of her own. That includes military assets and technology. We also have only one Harvester to spare for now."__     You frown. "Am I to defend the route with mere Riflemen and five-hundred Solaris?" Surely an impossible task, even for one like yourself.__     "I wouldn't make you do that," Summers assures you. "I've managed to unlock the Mass Deposits and I've got an Engineer working on the RFG along the route. Maybe we can get that online. Anyway, I'll keep in touch with Sabre and get you more tech as soon as I can. You'll have to make do in the meantime."
MissionNumber=17

