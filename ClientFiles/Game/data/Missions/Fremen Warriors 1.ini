Briefing=We are tired of those Harkonnen. They have been established in Arrakis as if they own the planet and don't care about anyone but themselves. In their eagerness for mine the spice they killed several families of civilians Fremen who lived in the area.__But this will not continue. We will travel to the north in search of our Fremen brothers in the Sietch Abbir. They know the exact location where the Harkonnen get all their income. We will destroy every one of their harvesters to teach them a lesson they will not forget!__Objective: Destroy the Harkonnen harvesters.__Hint: If at any time you lose sight of your soldiers hit the 'N' key to find them.

