Briefing=With the recent Harkonnen defeat, Gurney feels amazing. His greatest enjoyment is to see the Harkonnen suffer. Perhaps this is not without reason, for all the time Gurney spent as a slave for the Harkonnen. Duke Leto was the one who saw the potential in Gurney, and took his under his wing. Ever since, Gurney has been one of the most loyal servants to the Duke. __Gurney is heading for the war room. The Duke summoned with for a bunch of concerning reports.__DUKE: Welcome, Gurney. Please, have a seat._GURNEY: What is it, sire? I received your message, you mentioned that the reports are... uhh, rather concering._DUKE: Yes. Thufir, please elaborate for our friend._HAWAT: Recent Ornithopter scouting reports delivered a lot of information about Ordos mining activities. It seems they have increased their spice mining activities by at least 40%, and have reallocated a lot of the resources towards mining, rather than military. Any attempt at getting a closer look on their mining installations was met with heavy retaliation. It seems they need spice... and a lot of it. For what? We don't know._DUKE: This is where you intervene. We must know what the Ordos are up to._GURNEY: I will ask some of my mercenary friends. I might be able to find out if they want to hire mercenaries again._HAWAT: Most of the mercenary organizations on Dune were destroyed... by the Ordos. I can't really say there are high chances any remaining mercenary forces will want to work with the Ordos again._GURNEY: You underestimate them, my friend. The Ordos are very cunning, they'll find a way around it. Also, I have friends withing the smugglers and the mercenaries, those guys will do anything, for the right price. Even work for the faction that took out their colleagues.__An Atreides soldier enters the room. He asks to speak to the Duke.__SOLDIER: My lord, we received a transmission from Kaitain. Princess Irulan sent a message to all Great Houses of the Landsraad. Check channel 4, it is a recorded transmission._DUKE: Thank you. Thurif, let's hear that message.__Hawat opens up the main comm device and sets it up. Irulan's message starts playing:__IRULAN: Greetings, great leaders of the Landsraad. This is princess Irulan Corrino, daughter of emperor Shaddam IV. My intent is to put an end to the war my father started and restore order within the empire. At the same time, the problem of the Golden Lion Throne must be resolved. I have discussed with representatives of all the power pylons in the known universe: the CHOAM and the Spacing Guild have accepted a great meeting within the Landsraad council in which to discuss the issues at hand. In order to have an impartial referee for this discussion, CHOAM representatives will moderate the meeting and ensure everything stays in order. I, princess Irulan Corrino, hereby invite you, Duke Leto Atreides I of Caladan, to join this meeting, representing House Atreides.__TRANSMISSION ENDED...__GURNEY: Wow, that is... expected. I guess. My God, she's beautiful, though. _HAWAT: Not only that, my old sneaky friend Gurney, but she's also extremely smart. She wants to stop the war her father started, to let everyone see she's working towards a united empire. Of course, under her rule. That is more than likely her target._GURNEY: I would definitely accept being ruled by that beauty.__The Duke enjoyed Gurney's joke, however, he is more focused on the transmission itself.__DUKE: Thufir, link me up with Kaitain._HAWAT: Like... right now?_DUKE: Yes. Right now._HAWAT: But... you need a set up audience to see the princess. _DUKE: Just do as I said, Thufir. I don't need any preparations to talk to Irulan.__Hawat sends the transmission request to Kaitain. It seems the smuggled Ixian transmitters that Gurney managed to aquire from the smugglers are working perfectly. After a while, the transmission is accepted. The video transmission is clear, and princess Irulan looks very well dressed and prepared. It seems Duke Leto has really become very influent in the Landsraad, as the princess' attention to clothing, her very well arranged hair and the quickness of the reply are obvious. She begins:__IRULAN: Duke Leto! What a surprise. I wasn't expecting you to contact me directly, with all the trouble you have on Arrakis with the Harkonnen. I am pleasantly surprised._DUKE: Your highness. A splendid look, as always. Your beauty has not vanished over time, but grew even more._IRULAN: Oh, thank you for the kind words.__Gurney is enjoying the discussion in the background. All the small flirty talk, combined with the traditional respect formulas between royal families... they are something Gurney has always enjoyed watching. He feels pround for the Duke, and for the influence he has, as even the princess would reply quickly to his call.__DUKE: I wanted to thank you in person for the invitation. I will be there to represent House Atreides._IRULAN: Spendid news, duke Leto. I would also want to thank you for what happened on Arrakis. I received the reports. You had a few operations where you aided my Sardaukar._DUKE: No worries, princess. We see no point in fighting the imperial Sardaukars anymore. We were on the defensive before, we were never the aggressors against the Sardaukar. As you know, it's not us who started it all. My sincere condolences for your father, Irulan. The heat of the war caused the imperial palace to collapse._IRULAN: As I said, I wish to put an end to the conflict my father started. _DUKE: I will be there, your highness._IRULAN: That is good. I will send you the details. Good luck on Arrakis, Leto._DUKE: Thank you, princess.__TRANSMISSION ENDED...__GURNEY: My lord, if I ... may ask you..._DUKE: What is it, Gurney?_GURNEY: You seem rather... friendly with her highness. It's almost like you know each other for a while._DUKE: We do. Irulan is an amazing girl. She is very smart and very beautiful. She inherited her father's intelligence, that's for sure, but she is not like him. I trust every word she said. _HAWAT: And obviously, she is the heir. A political window for a ... marriage between Duke Leto and princess Irulan must always be considered._DUKE: Sorry Gurney. I know you find her very attractive. Blame the way royal families work, not me.__Gurney laughs.__GURNEY: No worries, my lord. I'll let her to you._DUKE: Anyway, Gurney, you have a task at hand. You must infiltrate their outpost and steal their communication data. _HAWAT: The safest way is to have your engineers upload it immediately to the Atreides servers. We cannot risk losing it on the way. _GURNEY: It will be done. I have an idea how to get rid of the Ordos vehicles blockading all paths. Let's say our Fremen worm riders can't wait to get a task.__==========__Objective: Infiltrate Ordos territory and capture their Outpost. Our Fremen will assist us with this mission, as they are master infiltrators. We do not have the exact location of the Outpost, so you must locate it. Out intel shows it is in the very far south-west of the Ordos main base. A frontal push through the main entrance might not be the best idea, as it is heavily defended. Try looking for a backdoor through the cliffs. Our Fremen Fedaykin will ride worms and get rid of the Ordos armor for you. Once the worms eat Ordos tanks, make your way, find the backdoor, infiltrate their base, locate the Outpost and capture it.
