Briefing=During the months of peace, the Coalition formed  by the Lassoki, Iasi, Qaii and Bromeli divided the planet Dune into four parts, one for each member of the Coalition. Since then, each one of them has done with their portion what they have seen fit, whether it be harvesting and selling the spice or any business that the rest of the members would not interfere with.__However, the four together still form a Coalition; They have made it very clear for those who try to come to Arrakis to think twice, that if you attack one of them, the other three will respond.__Since then there has never been any more armed conflict...until one day, during the Lassoki's journey to Dune on a Spacing Guild Heighliner, they learned that there were Tleilaxus on board.__The Tleilaxu do not have permission to land on Dune, so the Lassoki are going to send a small reconnaissance group to investigate the reason for their presence on the ship and, if they discover something shady, they will send their reinforcement troops to eradicate them and so set an example.__The Spacing Guild contains some defensive systems in the form of Turrets that will fire at anyone who is not part of the assigned group. This was designed to prevent battles on the great ship between sides and, being automated, only the Guild could stop them.__The Lassoki don't have the time to contact the Guild to disable them, so their small recon team will need to deal with those turrets before they run into the Tleilaxu.__Objective: Find the Tleilaxu and eliminate them if they are a threat.__Note: Infantry units can be crushed if the situation calls for it.

