0=Aurelianus: "Commander Durant, our forces are holding out here."
1=Durant: "Hang in there, Kailea. Reinforcements are en route now."
2=Durant: "My Shield Wall reserves are landing. Take them southwest ASAP."
3=Durant: "I've got you more supplies for armor and utility units too."
4=Durant: "Another delivery's touching down now."
5=Durant: "My men won't back down, Kailea. Order them onward!"
6=The Tleilaxu have been defeated.
7=Aurelianus: "Have you been able to contact Rowe Summers, Durant?"
8=Durant: "Not at all. I'll settle for bringing the news back to her after this."
9=Durant: "I've found some old Atreides tech. You can also create gholas now."
