Briefing=SUMMERS' SOLSTICE B2: The Ghola Gambit__MISSION OBJECTIVES:_1. Await the mercenary Engineers._2. Restore Sabre Durant's base._3. Capture an Axlotl Tank._4. Train various gholas._5. Defeat the Tleilaxu.__TACTICAL OBJECTIVES:_1. Play it safe until you get more supplies._2. Capture mid-field for better map control._3. Be on the lookout for derelict structures._4. Advance your tech whenever possible.__BRIEFING:_     When contact is finally established and Sabre Durant looks back at you over the line, he greets you with an inquisitive frown. He must hear the gunfire in the background on your end. He asks, "What's the matter, Kailea?"__     "There is a problem at Shield Wall. The Tleilaxu have attacked my research base here and slaughtered your standing troops. My last Engineers had to restore the Outpost in my base in order for me to contact you."__     His frown deepens. "Tleilaxu?" You nod.__     "At the ruins of the Golden Lion Throne. Yes. It is a curious situation." Curious, and infuriating. For Durant over the loss of his men, and for you over those blasphemous Tleilaxu meddling in your affairs.__     Durant glances to the side. He appears to be frustrated over something. He eventually fumes aloud, "I can't get word out to Rowe. This is... this isn't right. Something's wrong."__     You go on, "The Tleilaxu may yet finish us off without your aid. Our final defensive position is under attack as we speak." So there's no time to waste.__     He sighs and looks back at you. "Never mind then, we'll do this without her. My southern Shield Wall reserves are on their way up to you, they'll be there in a minute. Have them reactivate my old base. Some more help's on the way from Alazor Steppe, but that'll take a bit longer. Can you hold out 'til they arrive?"__     "Our survival in that window is probable with what aid will soon arrive."__     "You can take the cannons at my expansion too," he offers. "I need a favor though. There have to be Axlotl Tanks in the Tleilaxu base. Could you capture one and decrypt any data you find inside for me?"__     Data retrieval is a simple process, especially for the Ix. You could create a few Gholas and see precisely what the Tleilaxu are up to, assuming you manage to successfully capture an Axlotl Tank. Given the ease of this request, you agree to it. Besides... their activities likely concern you as well, in one way or another.
