11=Aurelianus: "Data transfer now complete. This revelation is most alarming..."
12=Durant: "All the Axlotl Tanks are down! We can't learn anything now."
13=Durant: "Those gholas are just as strong as the originals. Very strong."
14=Durant: "Keep holding out! Aid from Alazor Steppe will arrive very soon."
15=Durant: "The first delivery is there. It's about time you went on the attack."
16=Durant: "Done already? Hey, don't forget, we still need more data."
17=Durant: "You'll need to upgrade your HTF twice and build a Palace next."
18=Durant: "Saboteurs just arrived. Consider runnin' 'em into enemy units."
19=Durant: "Stop! You gotta capture one of those Axlotl Tanks, remember?"
20=Durant: "We don't have enough data! Gotta cap' another Axlotl Tank."
21=Durant: "You have to keep training different kinds of gholas, Kailea."
22=Durant: "Rowe's old proxies are still out there. You should take them."
23=Durant: "Make good use of my old expansion there, Kailea."

