Briefing=The following territory is very important to us. Dominate it to ensure a steady flow of spice, giving us a great advantage against the Atreides.__All our carryalls are focused on the transport of our army, ready to land and control the land. Unfortunately the Atreides have the same plan.__Reinforcements arrive thanks to the high-tech factory. The only way to ensure that they do not bring reinforcements is destroying that Atreides building. On the other hand we also depend on that same building to bring our own army, protect it or we will have nothing to do.__You can expect action from the Atreides allies: The Fremen. They are masters of hiding, avoiding all vehicles and destroy our buildings while you are busy on the front. The Outpost will alert you if it detects something coming.__Objective: Destroy the Atreides high-tech factory, then annihilate all remaining Atreides and Fremen forces. The Harkonnen high-tech factory must survive.__Hint: The light infantry and troopers can uncover hidden Fremen.

[Text]
1=The Atreides have been launched.
2=There's the high-tech factory! Destroy it!
3=Warning, Fremen hidden in the vicinity!
4=Atreides can not bring reinforcements.Beat the rest of the Atreides!
5=The Atreides and Fremen have been annihilated!
6=You lost the high-tech factory! No more reinforcements for you.

