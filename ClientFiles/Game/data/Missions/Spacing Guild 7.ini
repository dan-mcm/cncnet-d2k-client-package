Briefing=The modified sandworm has already embarked on a frigate ready to go. It is only matter of time before the frigate leaves the planet like us._ _One moment... I just got an disturbing report. It says the Fremen have knowledge from our experiments with their beloved sandworms, something they consider a desecration.__We can not allow a handful of Fremen spread rumors over there. If any of the houses or the Emperor himself discovered us too early we will have serious problems.__Travel to the territory inhabited by the Fremen who know the truth, look for a good area to deploy your base and then locate and destroy the Fremen Sietch. Has at your disposal all the money we have accumulated thanks to our super worm.__Don’t worry about deploying a VCM. The territory has remained hidden for years in exchange for the spice the Fremen pay us monthly. Even the Emperor doesn’t know the location of this Sietch.__Be careful, we have indications that the Fremen have had diplomatic visits with some of the other Houses. We do not know if they have already established some kind of alliance or if someone is going to intervene against us; in any case your main purpose is the Sietch.__I must go, the Sardaukar have arrived to take me to the Emperor to explain our conflict against the Mercenaries. I will keep you informed of developments.__Objective: Deploy a base. Locate and destroy the Sietch.__Notes for the commander: The spice here is much purer. Each gram is valued at 2.5 times the regular spice.

[Text]
1=Fremen: Stay out of our territory or we will expel you.
