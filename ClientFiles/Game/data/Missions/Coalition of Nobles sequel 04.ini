Briefing=The last two battles against the Tleilaxu have forced the Lassoki to slow down their advance a bit, in order to replenish their strength. The Iasi would be in charge of continuing to advance and destroying the last of the Tleilaxu bases.__However, the days passed and the Iasi did not send any communication to the Lassoki of their victory, so they were worried about what would have happened. For this reason, and now that they have recovered part of their forces, they will advance to the territory where the battle would take place and they will contact the Iasi.__As a preventive measure, they contacted the Bromeli, who are already sending an MCV for what could happen. The Lassoki have gone ahead and have just landed at the Iasi base to get a detailed report.__As the Lassoki vehicles surveyed the situation, they could see the Iasi base in good shape, albeit without a Construction Yard or any military units in the vicinity. With a Tleilaxu base not far from them, the Lassoki fear the worst.__Objective: Find out what is happening with the Iasi and destroy the Tleilaxu base.

