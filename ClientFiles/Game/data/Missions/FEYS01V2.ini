Briefing=SUMMERS' SOLSTICE 01: Petty Thievery__MISSION OBJECTIVES:_1. Destroy Imperial Spice Silos._2. Pillage 10,000 Solaris in Spice._3. Do not lose all of your vehicles.__TACTICAL OBJECTIVES:_1. Repair your damaged vehicles at the Repair Pad._2. Attack Imperial Harvesters to lure some defenders.__BRIEFING:_     "So it's looking good then?" you ask. The smuggler leader nods.__     "Her evaluation is going well. She is a natural commander. And her transfer comes at such a fortunate time. I hope you won't miss her, Durant."__     You laugh. "Have more faith in me, Ketua. You probably need her more than I do." You know Rowe Summers would look after and command the smuggler militia carefully. You know she would.__     Sumadi continues on. "That's good. I have need of you too." As he turns from the viewscreen, a tactical map of Pasty Mesa appears in his place. A small smuggler base sits atop a plateau near an Imperial mining operation. A squadron of LAVs is amassed there. He speaks over the moving image: "I've established a small base near this Imperial encampment. They are unaware of my presence at the moment, but that will change soon."__     "Yeah?" You lean back in your seat.__     "I expect you've heard of the Emperor's challenge," he adds.__     "Of course." You recall aloud, "Any of the Great Houses are welcome to come to Arrakis. They'll be fighting to 'produce the most Spice,' and whoever wins gets the throne. Tch. Or so he says..."__     "The Imperial forces must be trying to clear out my bases to make room for the impending battle. I've already suffered several losses to them, quite suddenly. I must slow their aggression, and rebuild." He re-appears on-screen. "We will do both at once by pillaging their mining operations. You must stage attacks on the two Imperial Refineries in this region, one to the north and the other to the east. They are defended only by a small Sardaukar garrison. Destroy the nearby Silos, take the Spice within. I estimate it to be about ten-thousand Solaris. When this is done, I'll abandon this base and we will make off with the spoils."__     Even a small Sardaukar garrison is extremely dangerous. You'd need to hit them fast and hard to make it out with the Spice. Nevertheless...__     You shrug. "Easy enough." As you accept this task, some of the forces atop the high plateau overlooking Pasty Mesa appear on your command interface. Sumadi has transferred control.
