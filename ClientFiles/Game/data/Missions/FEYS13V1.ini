Briefing=SUMMERS' SOLSTICE 13: Lightning Round__MISSION OBJECTIVES:_1. Establish contact with Sabre Durant._2. Defeat all enemies in Almiraz Graben._3. Durant and his forces must survive._4. You must survive.__TACTICAL OBJECTIVES:_1. Always support your infantry force with LAVs._2. Raze enemy Outposts to cut off their drops._3. Position your armor and RPG Quads wisely.__BRIEFING:_     Treachery! Your forces have been sabotaged! Factories and ConYards wiped clean of most of your technology. Commander Moriaen nowhere to be found. You must find Durant. You'll need to band together before things get any worse.__     The liberated OSO units were able to clear a few things up for you, though mysteries still remain. You know now that the enemy sought to hide the battle at Shield Wall by attacking the nearest base that could get word out. By taking hostages and entrapping you in the ordeal they at least managed to delay you. Durant has moved on to distant Almiraz Graben in the interim.__     Nearing the region, you call. You're relieved he's alive! He appears surprised.__     "Rowe? What are you doing here?"__     "Looking for you," you explain. You parrot him, "What are you doing here?"__     "Just fighting the Ordos right now." So casually stated.__     "Why?"__     He eyes you momentarily, then inputs some commands on his interface. He explains, "I found some plans at Shield Wall. You're gonna want to see this."__     Durant's image is replaced by detailed plans involving a ghola of Emperor Corrino. A puppet emperor commissioned by House Ordos from the Tleilaxu, intended to consolidate their power on Arrakis.__     Durant appears again on-screen. He continues, "The Tleilaxu that attacked Kailea and my men at Shield Wall were trying to hide this. The Ordos are in on it. They hit me here, but backed off suddenly not a moment ago."__     This makes your choice in the matter very obvious. And it explains why you were promptly cut off from your full arsenal as soon as the battle at False Wall ended. You order your forces forward into the rough and rocky territory. You tell Durant, "Then the Ordos are going to pay for this. I'm on the edge of Almiraz Graben, and I've brought some armor. It's yours if you want it."__     "Much appreciated," he affirms. "No one has much armor out here. Your Combat Tanks might give us an edge, at least until the Ordos get their reinforcements from Bidriyah Sink."__     "I only brought a few."__     Durant's end is choked by static before he can reply, and then it blacks out. You try to re-connect, but it's no use. Something must have hit his Outpost. Not that it matters... you are close enough to hear the sounds of battle to the north.
