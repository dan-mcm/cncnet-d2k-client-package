Briefing=SUMMERS' SOLSTICE 03: Double Bind__MISSION OBJECTIVES:_1. Repel the Harkonnen scout units after they arrive._2. Alternatively, accept their aid against the Atreides._3. Your base must survive the battle between them._4. Depart the territory once it's cleared of hostiles.__TACTICAL OBJECTIVES:_1. Hunt Harvesters to starve enemy defense funds._2. Use Grenadiers to break enemy Concrete Walls._3. Don't allow your incidental ally to be defeated.__BRIEFING:_     Your new neighbors have hardly begun to fight, but they've proven noisy nonetheless. They brought enough Harvesters to devour all the Spice here.__     As expected, Sumadi contacts you before the Atreides and Harkonnen ramp things up. You're present to receive his orders at the moment he calls. "Sir?"__     "Burke, there's a situation," he starts. "Summers regrettably promised military aid to the Harkonnen at Bled al-Hazrad in order to complete her mission. I've received reports that they're there in Tuono Basin as well..."__     "And the Atreides," you confirm.__     He continues with an indignant tone. "Standard operating procedure. Scuttle the base and evacuate all units as soon as it's clear. And if there's any confusion, we have no formal alliance with any Great House. I bow to no emperor, nor duke nor baron nor noble."__     "Of course, Sir," you mutter. The feud between the Atreides and Harkonnen goes back to the time of the Butlerian Jihad. What sort of lunatic would insert himself between them? You add, "I would never forget that."__     "No, but the Great Houses of the Landsraad may have the wrong impression."__     As if on cue, Sumadi is suddenly replaced on-screen by none other than the Harkonnen high commander. "Ah, there are more of you," he remarks with blatantly feigned warmth. "You little smugglers are everywhere. It's fortunate that we Harkonnen have such pervasive allies."__     You clear your throat, recovering from your surprise. "Jaxon Burke, field commander for Sumadi's smugglers," you introduce yourself. "We don't have an alliance. Your incidental agreement with Summers' crew is nothing more."__     "You don't have a choice in this matter," Krillys insists. "If you will not bend your knee to the rightful rulers of Arrakis, I will make you." The viewscreen blacks out as its hijacker departs.__     Already, the results of Summers' decision are impacting her associates. The fool! Sumadi's smugglers and Durant's mercenaries have been through much together. The stealthy sand mouse of Dune shelters in the shadow of the mighty rock dragon, an intimate companionship wherein you retain your independence. A factor of paramount importance to Sumadi, with good reason. The Great Houses of the Landsraad would trample you in the pursuit of their own goals.__     The Harkonnen are readying forces nearby according to data from your Outpost. You may only have minutes before their scouts arrive. Letting them wander around your base would give you more time to prepare for retaliation from the Atreides. If you repel those scouts, the Atreides will have to aid you against the Harkonnen. You're sure you'll have at least some form of much-needed help; it would be strategically advantageous to preserve meat-shields however prudent.__     What's about to happen is obvious. What matters now is that you ready your militia and decide if you should fire the first shots.
MissionNumber=3

