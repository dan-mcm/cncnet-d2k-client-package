Briefing=After the previous battle, Richese forces have taken a pretty severe blow and have started to regroup. Meanwhile, other Ordos Executors have attacked several artificial spice facilities, of course investing minimal effort and resources into the operation, as the Executrix has ordered previously. At the same time, multiple heavy Harkonnen, Atreides and Corrino attacks on artificial spice research sectors have proved efficient. House Vernius has been weakening the Tleilaxu forces, creating a clear path for an assault towards the main Tleilaxu artificial spice production stronghold. The Tleilaxu capital, as it can be considered.__EXECUTRIX: Executor, we have discussed with Irulan Corrino and Dominic Vernius, and they have asked for our support close to the Ixian flank. That is unfortunate. We cannot ignore this request, otherwise we'd look suspect. The region is controlled by both Richese and Tleilaxu forces. We will, once again, have to fight them both. That is unfortunate. There is an Atreides base in the sector, which is also trying to push through the Tleilaxu ranks and reach the Ixian flank to reinforce it. That is good. You must avoid getting close to the Atreides and risk any possible conflict. One missed target of a tank shell can mean a dead Atreides soldier, and they will not hesitate to retaliate. That is advice. Otherwise, they should prove very effective at keeping some of the Tleilaxu forces occupied while you deal with House Richese. That is wise. We are allocating a considerable budget for this mission. Destroy all the enemy forces in the sector and move towards the Ixian front to reinforce. That is the mission.__Transmission ended...__LORA: Considerable budget they said... but it's much less than the previous mission._TYLE: Kinda got used to it already. With all the raises and bonuses we got, we could pay for some of the mercenaries ourselves, haha!_LORA: So, I've heared you and Sabre have finally managed to get along._TYLE: I won't lie, he's a good commander, and has proven very useful in our last encounter. He helped me while deploying my forces._LORA: Good, because I have him on the line.__Transmission started...__DURANT: If it ain't my favourite Ordos friends!_LORA: Sabre, we have another mission for you. _DURANT: Good pay?_LORA: Less than the previous. But there is no need for so many men on your side either. You bring the numbers based on the payment._DURANT: Great. So, Executor Tyle, let's kick their ass once more?_TYLE: Let's do it, commander Durant._LORA: Sabre, you will deploy to the north, close to Norman's position. You must send help whenever needed._DURANT: It shall be done._LORA: Oh, and try to stay away from the Atreides base. They are fighting the Tleilaxu, so let them have it. Focus on the Richesians, get rid of them, and then finish what's left of the Tleilaxu, if the Atreides don't beat you to it.__==========_Objective: The Landsraad coalition is making significant gains. With Harkonnen, Atreides and Corrino attacks on certain artificial spice research facilities, there is one role we must clearly fulfill as well, in order to not upset our new allies: we must bust through Richese and Tleilaxu ranks and reinforce the Ixian flanks towards the Tleilaxu capital. You must take control of the small base already deployed in the sector and finish off all enemies. Sabre freakin' Durant will, once again, help you get the job done. At the same time, there is an Atreides base to the east, fighting the Tleilaxu. Try to stay away from them as to not provoke any hostilities. Focus on the Richesians first. Once done, finish off whatever is left of the Tleilaxu, unless the Atreides beat you to it.
