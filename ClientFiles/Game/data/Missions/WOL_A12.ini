Briefing=It seems the issues between the Harkonnen/Moritani and Mutelli forces, combined with the arrival of the Corrino Sardaukar on Caladan on the Atreides side, were the final nail in the coffin. House Harkonnen was forced to retreat and abandon Caladan, along with their Moritani allies. House Mutelli agreed to surrender to the Atreides and Ginaz. __Meanwhile, in Cala City, the Duke is in contact with his allies, House Ginaz and House Vernius of Ix. It seems Dominic Vernius is still under heavy fire by the Ordos and Richese forces. Besides, there are several reports about Tleilaxu gholas attacking Ixian encampments.__DOMINIC VERNIUS: Leto, I am telling you, the Tleilaxu are involved as well. Both Richese and Tleilaxu hate us because of our technological advantage. _DUKE LETO: What is the actual Ordos interest on Ix? Is it regarding your technology?_DOMINIC VERNIUS: We have no idea. It is too hard to tell what the Ordos are up to. It could be certain interests with the Richese and especially the Tleilaxu. It seems this alliance is serving them well._LETO: Might be the fact that their forces are no longer as numerous as they used to be. I've seen the reports on Arrakis, House Ordos is not able to continue this war alone._DOMINIC: Unless they get allies to help them._LETO: Exactly._COUNT GINAZ: By the looks of it, I am not sure if the Ordos is your true enemy here, Count Vernius. _DOMINIC: You might be right. Nonetheless, the enemies are numerous. We are giving our best, but we've been outnumbered for a long time. Other houses refused to intervene. House of Ix has many who would rather see it fall than succeed. Especially the Houses which have interests in the cheaper Richesian technology._LETO: I have already dispatched troops for Ix, my friend. They are preparing to take off as we speak. House Atreides will assist you._DOMINIC: I am extremely grateful, old friend._GINAZ: House Ginaz will have to recover after the battles on Caladan. We were not prepared for a war, and had to gather up some military quickly to help House Atreides._DOMINIC: I understand, Count Ginaz. I am positive that with the help of Duke Leto, we should be able to break the enemy. While we were severely outnumbered, the harshness of my planet, combined with our terrain-based tricks managed to destroy a considerable amount of their attack force._LETO: Of course... the renowned underground Ixian research cities. Did they find them?_DOMINIC: No. And they won't find them in a million years. Unless they take the entire planet. Which is exactly why we are fighting on the ground. They must be driven off of our planet._LETO: It will happen, my friend._DOMINIC: My men will be awaiting your forces. __Transmission with planet Ix has ended..._Transmission with planet Ginaz has ended...__LETO: Princess Irulan... I want to thank you for the assistance on Caladan. Gurney told me your Sardaukar played a vital role in battle of Horizon, on the southern part of the main continent._IRULAN: You don't need to thank me, Leto. As I said in the Landsraad meeting, my objective is to have peace in the Imperium. It was only natural I dispatch some troops here to stop the aggression of the Harkonnen._LETO: I am also sure this caused certain... gossiping between the Houses._IRULAN: It certainly had. This is the reason I cannot intervene directly on Ix this time. I have some men there, secretly aiding the Ixians, but another full-on assault of the Sardaukar would not be a good idea. I am sure you understand the political implications of such a move on House Corrino's part._LETO: I do. I will help Dominic stop the Ordos and Richesians. What I am worried about, though, are the Tleilaxu. They are not part of the Landsraad. They do not answer for their actions the same way House Ordos or House Richese will. This makes them... dangerous._IRULAN: My Sardaukar are investigating what Bene Tleilax's motives might be as we speak._LETO: I thought you could not get involved too much._IRULAN: I cannot get involved directly, by dispatching the Sardaukar on Ix to fight. But I can assure you, I am at least as interested as you are on what the Tleilaxu motives are. They are, after all, despised by the entire Imperium._LETO: They have always been despised by everyone... just like House Ordos... except when they need them. Just like now: House Richese has no problem forming an alliance with both the Ordos and the Tleilaxu._IRULAN: I am suspecting that the Ordos and Tleilaxu have a secret plan. I will let you know as soon as I have some sort of evidence about this. Before that, I have arranged another Landsraad meeting with the CHOAM representatives and the Spacing Guild. As soon as the hostilities on Ix are finished, the meeting should take place. I am counting on you to end them as soon as possible, Leto._LETO: I will, your highness.__Transmission with planet Kaitain has ended...__LETO: Gurney, my man. _GURNEY: Yes, my lord._LETO: You heared everything._GURNEY: Yes, I did._LETO: Then you already know what to do. The Heighliner awaits you. It will set course to Ix immediately. You must work in tandem with House Vernius forces on Ix and remove the invaders._GURNEY: Do we really trust the Guild after what they did? I mean, besides them aiding Shaddam on Arrakis, they seem to have had a deal with the Harkonnen as well, for the invasion of Caladan._LETO: They did. But they are no longer involved into it. Hawat made sure of it. They are a bunch of scumbags, I agree, Gurney, but we cannot ask House Vernius for their Ixian Heighliners now. They cannot send them out of Ix._GURNEY: I understand. I will proceed on Ix, my lord. _LETO: Be very careful with the Tleilaxu. They will hate us for a long time for the intervention we are about to make.__==========_Objective: Caladan's invasion is over, but not the one on Ix. House Vernius is a close friend and ally of House Atreides. Therefore, we must move in and aid them. You are to deploy near one of Ix's most important regions. The Ixian forces in the region are numerous and well fortified, but will be overrun by the enemy soon. Your task is to ensure this will not happen. The Ixians have two Research Centers there. At least one of the two must remain operational. All enemy forces hostile to the Ixians must be removed. A message from Dominic Vernius of Ix is suggesting a relatively quick production of Carryalls, due to the position we are in: far from the main sources of harvestable Ixian Gems. Be very careful to further instructions and messages while you are performing this task: there might be vital information which is not currently available.

