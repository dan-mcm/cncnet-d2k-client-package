[Text]
10=HAWAT: Gurney, I don't know what happened there, but use their hostilities for your advantage!
9=What the... the Tleilaxu and Richese have turned on the Ordos! What is going on?
5=House Richese has been defeated.
4=The Tleilaxu have been defeated.
3=House Ordos has been defeated.
2=So the rumours are true. The Tleilaxu are involved as well.
1=Gurney, both Ixian Research centers must remain operational.
0=Hold on, friends of Ix! Atreides MCV is on the way to help you. You shall not fall.
6=This is strange. Ordos, fighting with Deviators against the House who designed the Deviator for them!
7=Tleilaxu master: Atreides, hear me out. Retreat and do not get involved, while you still can.
8=Tleilaxu master: You've been warned Atreides. Now you'll die.
11=This is Count Dominic Vernius to all Atreides troops. We accepted a cease fire with the Ordos!
12=Dominic Vernius: Focus on the Tleilaxu and the Richesians. Destroy them all, the Ordos can be ignored.
13=DUKE: Gurney, do as Count Vernius told you. The Ordos are no longer a priority target.
14=NEW OBJECTIVE: Destroy the Tleilaxu and House Richese. The Ordos can be ignored.
15=General Halleck, the Ordos are now neutral. There is no need to provoke them anymore.

