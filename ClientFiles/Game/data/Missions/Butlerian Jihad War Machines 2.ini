Briefing=HARKONNEN_===========_Thanks to our strategy the Emperor has been defeated, Atreides and Ordos have been annihilated and the Machines are too uncoordinated to be a threat. Now is our best time to conquer Dune.__I have divided the army to be able to attack several territories at once and thus expand quickly. The next area that you will be responsible for contains a base of the Machines that you must destroy. I would have liked to offer you missile tanks, but in return you have a large number of troops prepared for the fight and we will send you more, but in the meantime you should complete the defenses with infantry units.__We have detected a group of Mercenaries in the area. They have no affiliation with anyone, but have been involved in battles against the Machines. Although it is unlikely that the Mercenaries can defeat them, they will distract our enemies enough so that you can attack without any problem.__Try to stay out of the battles of the Mercenaries to avoid unnecessary struggles, but if they get in your way, kill them.__Objective: Destroy the base of the Machines.__Tips: Avoid confrontation with Mercenaries unless they get in your way. Build the Barracks to have units that can fight better against the enemy Ciborgs. Keep an eye on the surroundings while waiting for possible enemy attacks.
