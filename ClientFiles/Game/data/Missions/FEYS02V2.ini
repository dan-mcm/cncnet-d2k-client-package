Briefing=SUMMERS' SOLSTICE 02: Scavenging the Wastes__MISSION OBJECTIVES:_1. Personally investigate the occupied smuggler base._2. You must survive.__TACTICAL OBJECTIVES:_1. Investigate the local Fremen Sietch._2. Scout for potential expansion locations._3. Sacrifice any unit to keep yourself alive.__BRIEFING:_     The monitor flickers to life. Though its display is choked by static, you can make out threads of black where Sumadi's hair should be and a mug of Spice coffee in his hairy hand. His collared wrist is steady as he raises the mug. The static clears, revealing his tanned skin. When he sighs and sets the mug down in front of him, his eyes open. They're an awe-inspiring deep blue that sear color into your sand- and rock-stained mind. He stares at you through the viewscreen.__     It's a familiar image, but one with a much different context now that he's officially your boss.__     "Commander Summers," he greets you. "Well done on your first operation. The Imperials had no idea what they were up against. Unfortunately, there's no shortage of action of late. My base in the El-Sayal Plains, where you're being flown now, was recently taken by the Imperials..."__     You're more accustomed to commanding a military, not miners. While you'd never go back to mercenary work, you miss working with such capable underlings. If only it didn't always end in death... if only you could get the money without the bloodshed. It's easy to be sick of those around you dying constantly in your position, or rather, it was in your former position. You ask, "Is this all we do? Hit-and-run, and lose territory?"__     Sumadi chuckles briefly but doesn't seem amused. He continues, "Rest assured, if you didn't understand the Imperials' strength after your last assignment, you will during this one. We need damage control and security. This will afford us both: I want you to reclaim the Spice we lost in El-Sayal. If the Imperials haven't stolen it all, there should be five-thousand Solaris in the Silos and the Refinery."__     You consider the task a moment and ask, "And the security part?"__     "That's what the money's for. Durant's protection is expensive."__     Sabre Durant, the only capable merc commander now that you're gone. The only noteworthy one, anyway. You figure, "We need all the Spice we can get, and you can't afford to lose this base."__     Sumadi nods at you. "That's the idea."__     "Consider it done." You nod in return.__     "One more thing," Sumadi adds, placing a finger on the link severance. "Giraud's looking for you. Get this over with quickly - I can't afford to lose my secret weapon to that man. Expect Imperial reinforcements to arrive shortly after you clear out their occupation. Build up your defenses, ensure you send me at least five-thousand Solaris, and then scuttle everything and get out of there. Got it?"__     You narrow your eyes at him. "Got it," you affirm.__     Your Carryalls set down west of the base. As your men scatter and prepare to move out, you fit your helmet on and hoist up your minigun. With a breath, you step into the sun.
MissionNumber=2

