Briefing=BARON: General, time has come to go after the big prize: the Emperor himself! Ordos spies have located the Imperial Palace where the Emperor takes shelter here on Arrakis. He seems to have come on Dune with one of the recent Guild transports, possibly to oversee his troops. Now he probably starts to feel that he's losing it. He might be escorted out of Arrakis soon. We must not allow this to happen. Set up a base and rush the Imperial Palace. Destroy it, kill the Emperor in my name! You will have House Ordos on your side too, but the Atreides declared they are unable to launch an offensive against the Imperial Palace now. No surprise, the pathetic Atreides have always been weak! We will once again share our nuclear capabilities, and the Ordos will allow us to hire their saboteurs. Go now, General, destroy the Imperial Palace.__Objective: Destroy all our enemies. Leave no enemy building standing.

