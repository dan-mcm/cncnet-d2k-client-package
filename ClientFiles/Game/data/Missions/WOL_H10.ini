Briefing=The defeat on Caladan was something hard to handle for the Baron. Leto's outstanding diplomatic skills have aquired a set of powerful allies for him. House Ginaz, House Vernius and now, even House Corrino of princess Irulan. What started out as a great plan, with a blitzkrieg execution, ended up as a failure. Nonetheless, the Baron did not even have time to feel sorry for it. It seems there was a real reason why he had to return to Giedi Prime. Somebody was building up heat for a civil war. It is time for both Radnor and Feyd to find out who and what really happened, only that they already know who and why. Feyd knew even before attacking the Mutelli on Caladan, and Radnor learned it as well from Feyd. But the Baron has no idea about this.__A video transmission has been established from Feyd's camp near Barony, to the south, to the Harkonnen Palace in Harko City, the capital, where the Baron is defending himself.__BARON: Welcome back, gentlemen. I hope your journey was alright.__I can see he's all messed up_, thinks Radnor. "Even his voice... this is not the Baron we are used to. The humiliation of retreating from the Atreides, combined with whatever civil war has erupted here... You had it coming, old man."__FEYD: It was ok, father. What is happening here? I saw the reports. There is war everywhere. _BARON: Yes, son, there is war everywhere. That is a Harkonnen speciality. After all, this is our essence. And a Harkonnen created all these. It's your brother, Feyd.__Feyd is trying to play surprised.__FEYD: My... brother? But how? How could he rally so many people on his side?]_BARON: What people? They are mercenaries. Mercenaries and people who want to see me dead for years. Who believe I am a tyrant. Can you believe that? Some people think I am a tyrant. Isn't it funny? Eh? Radnor, what do you think?\_RADNOR(faking it): It's outright hilarious, my lord._BARON: Nonetheless, the point is: your brother wants me dead. Before I can make it officially that you are my rightful heir. He wants my spot. And he'll probably kill you as well after that. Or before, who knows._FEYD: Or... he can try. It's not like my imbecile brother has any idea what he got himself into._BARON: Well, let me tell you that I am almost besieged here in Harko City. He has a considerable force outside the city and is getting ready to close in on my position. General Radnor, I am counting on you._RADNOR: We'll stop this civil war, my lord._BARON: You must reach Harko City immediately. I'll be waiting you. Be careful.__Transmission ended...__RADNOR: You're smiling._FEYD: Why aren't you smiling as well?_RADNOR: Because there is no throne for me to take. As always, I am fighting other people's wars._FEYD: I see where that is going... the Tleilaxu._RADNOR: You are lucky to have a family, my prince. _FEYD: FAMILY? Is this family, general Radnor? Can you call this a family? I'd rather call it a business. Or that's what both my father and my brother made out of it. You don't know a lot of things, but those two always cared about power, about bloodshed. We were never a family. A royal family ain't family, it's business. It has always been business. My own brother is trying to kill both me and my father. Amazing family._RADNOR: Let's not forget you're the one who encouraged this. I know why you're smiling: you know he will lose this civil war. And then, you'll be the heir, and he'll be dead._FEYD: I would have been seriously concerned about your intelligence if you hadn't figured this out by yourself, general. I want that throne, but not just because I am greedy. Although that is a Harkonnen trait, I want this "family" to have a future. A bright one. Led by a smart leader, not by an imbecile obsessed of torture and bloodshed. And maybe, one day, I will be able to get this business to become at least a quarter of a real family._RADNOR: And your father? Would you hurry to jump in his aid? After all, if Rabban kills him, and then you kill Rabban... guess what?_FEYD: Oh, I like you, Radnor. You aren't afraid to call things directly. You see, that would not be a terrible idea, but... then who's gonna get all the heat for the stupid invasion of Caladan in the Landsraad? The new baron. Me. I don't want to have to deal with the Landsraad for my father. I would have to go there and explain to Irulan, to Leto and to everyone why I did it. You don't think there will be no repercussions, right? Besides, maybe it's too early. I don't have enough relations and tricks built up yet to feel confortable on that chair. Even without a direct family competitor, I do have cousins... and other relatives. You just never know who waits to backstab you. When you get to that chair, you must be fully prepared. This is one thing my father taught me, and has served me well._RADNOR: Very well. Then, let's proceed. I analyzed the field, just as you asked. Right here, close to Barony, there are two rebel bases. We must break through these in order to clear our way to Harko City. _FEYD: We don't have enough forces to attack them directly. I need to gather my men from the north._RADNOR: We will do it commando style. Sneak a bunch of capable men through and capture their first base. It is very lightly defended, as most of the rebel arsenal has moved north to prepare for the siege of Harko City._FEYD: How lightly defended is it?_RADNOR: Enough for a bunch of men to get it. _FEYD: I see. Then you want to activate those turrets._RADNOR: They will be more than enough to keep us safe from whatever worthless attacks the rebel might make. Once again, their main force is north, not here._FEYD: I see that construction yard on your plans. To the north. That must be..._RADNOR: The key piece, yes. It contains vital information about Rabban's tactics._FEYD: HAH! tactics? My brother has no idea what that word means. He's probably going all in._RADNOR: My lord, a smart general does not underestimate his enemy. We must get his plans, study them and prepare a counter-offensive._FEYD: Very well, my friend. You're the general, the experienced man. I'll go with your plan._RADNOR: The second base, where the ConYard is, looks much better defended. A few men might not make it._FEYD: I'll load your war account with some spare solaris that I have. Use that to manufacture some tanks from that first base you capture. I see it clearly here on your plans: it does have a Heavy Factory._RADNOR: Do you have solaris for this?_FEYD: Man, I am the son of the Baron. I am very wealthy, but for now I can't access my full account, I need to reach Harko City to authorize that. Will transfer just that small fraction that I have access to._RADNOR: Then this should be enough to get the second base as well._FEYD: I'll have some of my best people help you out reach the first base. There seem to be many rebel patrols around, and your men might use some help.__=========_Objective: Back on Giedi Prime. Civil war. Sounds like the true Harkonnen homeworld. Your task is to work in tandem with Feyd and reach Harko City, where the baron will soon be sieged by his imbecile son, Rabban. Reaching Harko City won't be easy, though. You must take some men and reach two rebel bases. First is very lightly defended. Your target is the Outpost. Capture that, and their defenses will be ours. Then, get the Heavy Factory and use Feyd's funds to build some tanks or siege tanks. Up to you. Remember, your main target is the Construction Yard to the north. Capture it. Make sure you don't lose any engineers: there are no replacements. Tactical map available, press the button to view it.
