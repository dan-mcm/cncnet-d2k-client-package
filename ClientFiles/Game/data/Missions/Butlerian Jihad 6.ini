Briefing=ATREIDES_=========_First Harkonnen and Ordos fighting against their own units, then an alliance between Atreides and Harkonnen that we did not approve, and now the base we had as reinforcement began to act on its own before we could defeat the Harkonnen.__We had sent a VCM with an escort to meet with a small base of Ordos to address the issue with them since they are having the same problems than us, but the VCM reports that he have been found with an unidentified base that blocks his way.__The Ordos don't know that we are in the territory. Locate and capture any outpost and at least one windtrap to contact with the Ordos and receive further instructions. __Objective: Capture an Outpost and a Windtrap. Await further instructions.

