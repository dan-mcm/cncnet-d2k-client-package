Briefing=Commander, the Emperor has sent us a message. It says that values all our achievements but that we are not prepared to govern a planet like Arrakis. He asks to give to him all our territories and to abandon Dune immediately.__The Emperor had invested large amounts of money in all houses except ours. If we win the war he run out of his share of the profits. That's why he want us off the planet, but we've come too far to go now.__We will send a group of our best men the most important territory of the Emperor and give a lesson in the very heart of the Empire. It will not be an easy task because it has a strong defense, in addition to its elite soldiers: The Sardaukar.__The group has already arrived and awaits your orders, take control units and travels to the southeast. Destroy the flak turrets so we can send cargo with a MCV and the bulk of our army.__Objective: Destroy the base of the Emperor.

[Text]
1=Anti air turrets spotted  to the east.
