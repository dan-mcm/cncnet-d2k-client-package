Briefing=LOCATION: Agamemnon plains, near Agamemnon Canyon_=========__After the success he had on Serena's Necklace islands, Gurney is moving his attention towards the main continent. He has received instructions to transport his troops to the forward Air base near Agamemnon Canyon. The Duke is contacting him for more intel:__DUKE: Gurney, our naval fleet is striking the enemy with force on the eastern coast. So far, the Harkonnen advance towards Cala City from the east of the main continent has been halted, but there is one problem. Thufir will give you the intel._HAWAT: The Harkonnen and Moritani forces managed to destroy one of our main Air bases on the continent. This is a severe blow for House Atreides. While our Navy is strong and being reinforced from the newly recaptured Serena's Necklace, our air power is diminishing. We asked you to move to the second main Air base near Agamemnon Canyon because we feared an attack there. And we were correct. As we speak, Harkonnen and Moritani are deploying their troops and preparing a huge frontal assault on the Air base. Gurney, you must reinforce it and defend it at all costs. If we lose this base, we might lose Caladan on the ground. Our Navy alone is not enough to deal with 3 enemy Houses._GURNEY: Don't worry, Thufir. They ain't getting shit. No air base for the Harkonnen rats._HAWAT: The air base ornithopters will be available for use. This means our air superiority will be felt on the battlefield. The Ornithopters should do considerable damage to their forces. Gurney, your base is solid and well prepared for this assault, and your air fleet is very powerful. But be advised, both House Harkonnen and House Moritani have invested a significant part of their invasion on this target. It won't be easy._DUKE: Meanwhile, I want to show you this, Gurney.__Recording started...__COUNT GINAZ: Duke Leto, my forces are ready. We are loading up and setting course to Caladan. We shall reach planet's orbit soon. _DUKE: Excellent, my friend. You may deploy safely a part of your troops in Atreides Landing, on the southern continent. The rest can be deployed right in Cala City, and you can move down to meet other Atreides forces fighting to the south._COUNT GINAZ: Will keep you updated, Leto.__Recording ended...__DUKE: As you can see, House Ginaz is deploying their troops on Caladan as we speak. However, they are not yet ready to assist you, Gurney. I insisted they only move out once they are prepared. It is important to keep their arrival a secret, until they are at full efficiency._GURNEY: Understood, my lord._DUKE: We also received this recorded message this morning. Play it for Gurney, Thufir.__Recording started...__IRULAN: This is princess Irulan of House Corrino. This is a message to all Landsraad Houses who have opened hostilities on foreign homeworld. It is a message for peace. I am asking Houses Harkonnen, Mutelli, Moritani, Ordos and Richese to cease their hostile actions against Houses Atreides and Vernius immediately. House Corrino is extremely displeased by the violence. The Landsraad council meeting was supposed to put an end to the wars, not move them to other planets and get even more Houses involved.__Recording ended...__GURNEY: Tough lady, that's for sure!_DUKE: The message was sent to all Houses of the Landsraad and to the CHOAM neutral representatives. Although it looks like someone might intervene, I am telling you Gurney: don't count of anyone. We must defend Caladan without having hopes of Corrino or CHOAM interventions. _GURNEY: Of course, my Duke. _HAWAT: This is a relatively smart political move. The population will see Irulan as the only leader of a great House asking for peace. Sounds like the perfect empress, doesn't it?_DUKE: That is not important right now. Gurney, you have your mission. Before that, though, I want to let you know House Vernius is also under heavy fire by Ordos and Richese forces. Dominic sent me word that he is suspecting some possible Tleilaxu interferences as well._GURNEY: Is the entire galaxy teaming up on our ass, my lord?_DUKE: It is possibly. However, the Ixians have an old rivalry with House Richese and the Tleilaxu. We believe the Ordos have formed a secret alliance with House Harkonnen against us. The rest of the Houses have joined based on different personal reasons. Like Richese, wanting House Vernius destroyed to take supremacy on machine production. The Ordos attack on Ix, however, is definitely a way to stop my good friend Dominic Vernius from helping us here, on Caladan. _GURNEY: So that's why you believe the Harkonnen are allied with the Ordos... It does make sense, now that you mentioned it._HAWAT: My analysis always makes sense, Gurney. __==========_Objective: House Atreides is all about air superiority. But this is now in danger thanks to combined Harkonnen-Moritani forces. With one of the two powerful Air bases destroyed, you must make sure the last does not fall. Take control of the Air base and remove the enemy forces from the region. The Air base will provide heavy Ornithopter Airstrikes on the enemy. Keep those High Tech Factories intact at all costs. Lose them, and Atreides air superiority is gone, and so might be Caladan. Tactical map available, press the button to view it.
