Briefing=While the Lassoki were busy fighting the Tleilaxu invasion on their own planet, the Bromeli have been busy expanding their domain by capturing areas previously controlled by the Lassoki.__The Lassoki cannot send any kind of attack force without setting off alarms, so they have thought of attacking using Deviators, since their projectiles do not carry any explosive weaponry that can be detected.__Through the Silicon gas that the Deviators use, the Lassoki have full confidence to use the Bromeli units against themselves, and use them to weaken them considerably.__Luckily the territories they've been deployed contain a few stashed supply crates, enough to repair any damage the Deviators might take or even make new vehicles, as long as the Lassoki find and collect them.__The main objective of the operation is to focus on the destruction of the most dangerous building of the Bromeli: The Bromeli Barracks. The High Tech Factory, the Missile Launch Pad and the Starport. Without the more dangerous structures of the Bromeli they will be forced to retreat and will stop any attempts by them to advance.__The Lassoki know that the best strategy is to enter the base, converting the enemy vehicles even if only temporary, use them to destroy the structure, and try to leave the base with the Deviators through the area least protected from the enemy, on their way to the next objective.__Upon completion of the job, the surviving Deviators will approach the designated Extraction Zone to leave the territory.__Objectives: Destroy the Bromeli's Barracks, the High Tech Factory, the Missile Launch Pad and the Starport. Then reach the extraction zone.__Note: Bromeli Barracks is the building that produces Saboteurs. The Missile Launch Pad is the building that can launch Death Hand's missile.

