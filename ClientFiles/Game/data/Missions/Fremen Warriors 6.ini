Briefing=Good job brother, with our help the Atreides could be self sufficient and able to defeat themselves the Harkonnen forces in the region. Now we must concentrate, because war will intensify in the next territory.__Both Harkonnen and Atreides are sending a lot of reinforcements to seize that territory. The battle is fierce and there seems no clear winner.__Use the camouflage to avoid conflict zones, stealth through enemy forces and destroy the high-tech factory to give the victory to our allies. Get ready, the Atreides carryall are ahead.__Objective: Destroy the Harkonnen high-tech factory.__Note: Attacking the enemy or stand next to soldiers (no tanks) will discover your Fremen.

