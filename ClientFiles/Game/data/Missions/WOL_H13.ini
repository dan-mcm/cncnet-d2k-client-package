Briefing=The recent wars and conflicts within the Landsraad have created a situation which is asking for another meeting between the great leaders of the council. The hostilities are getting dangerous, and are causing high unrest in the Empire. CHOAM, along with the Spacing Guild and princess Irulan of House Corrino, have formed another meeting to discuss the current situation of the Imperium. The Landsraad council has accepted the meeting, more to preserve its image with the population than their pure will for peace. This time, however, the meeting is not taking place on Kaitain: it is a remote transmission with most of the Landsraad Houses.__The Baron asked for both Feyd and Radnor to be present and listen to the whole thing. But before that, obviously, he has some questions:__BARON: Get ready for this crap meeting. And listen carefully, cuz nobody is gonna repeat a damn word. Now... where is Rabban?__A moment of silence.__FEYD: He..._BARON: He what, Feyd? He what?_FEYD: He blew up the Palace, father. Right when we were surrounding the building to take him hostage._BARON: So he just blew himself up like good ol' times on Earth, where people were blowing up in the name of different things?_FEYD: I don't know. I guess his pride..._BARON: WHAT PRIDE? Feyd, look into my eyes._FEYD: He BLEW HIMSELF UP, father. You don't believe me, go ahead and undergo an investigation._BARON: General Radnor, where is Rabban?_RADNOR: 2 or 3 meters under debris. Or more, who knows. That Palace was very tall, kinda._BARON(slowly laughing): You know what, you two are funny. Very fishy death. _FEYD: Again, if you don't believe us, you are free to investigate, father. You'll end with the same conclusion._BARON: For now I have more important shit to care about. That stupid meeting is about to begin, and I'm getting ready for the entire Landsraad to jump on my ass for what I did on Caladan._DE VRIES: It is starting, my lord.__Transmission started...__HASIMIR (CHOAM representative): Welcome, great leaders of the Landsraad, Spacing Guild and CHOAM. Due to recent events, we see the need of a new meeting. The previous had a certain objective, which does not seem like it was achieved. Even worse, the conflicts within members of the Landsraad have increased considerably. Not only did they spread out of Arrakis, to other planets, but also have involved Houses which were neutral before. _IRULAN: We see this whole issue exploding further. It is a dangerous situation, which must be stopped immediately. Peace must be restored in the Imperium._BARON HARKONNEN: Princess Irulan, last time I was called as being disrespectful just because I called things the way they were. This time, I am going to do the same thing. Let me remind you that this kind of peace talk doesn't stand, your highness. Your Sardaukar were present on Caladan, killing my men. Count Moritani can also confirm this. _IRULAN: What was your business on Caladan in the first place, dear Baron? My Sardaukar..._BARON (raging): What was my business there? IT IS KANLY! Vendetta! And it has been for generations between Houses Harkonnen and Atreides. You're asking me what was my business on Caladan: then I am telling you I was there because there is kanly between Atreides and Harkonnen._IRULAN: Then my Sardaukars' business on Caladan was to stop your stupid kanly, to stop your invasion on another Houses' planet._BARON: YOU HAD NO BUSINESS GETTING INVOLVED IN THAT!_DUKE LETO ATREIDES: May we ask our dear baron to use ... whatever questionable royal honor he has left and watch the way he addresses not only to another monarch of a Great House, but also to a lady?_BARON: Of course you're defending her, Atreides. She basically saved your ass from being destroyed by the might of House Harkonnen._MUTELLI: House Harkonnen is more of a joke rather than a respectable member of the Landsraad. The kind of House who cannot wait to backstab you for someone else._BARON: Ah, of course, the butthurt "great" House Mutelli, invoking attacks on their troops that never happened. I would have thought you were smarter than that in finding a decent excuse for turning against us, dear Baron Mutelli. I guess that the task of fighting against Houses Atreides and Ginaz was too much for you._HASIMIR: Gentlemen, please! Even now, you cannot stop from your quarrel! We are meeting here to make peace._COUNT DOMINIC VERNIUS: Peace? With all due respect,representative Hasimir from the CHOAM, but have a look around your holo faces from each transmission and tell us if you see them willing to make peace. My planet, Ix, was invaded by Houses Ordos and Richese. For absolutely no reason. This was completely uncalled for. Then, we found out the Tleilaxu were also involved. All because none of these 3 factions could stand the fact we offer superior machines to anyone else's._COUNT RICHESE: This should be considered blasphemy._IRULAN: Can we act like monarchs of a great House? This means to stop calling other people out right now. It is clear that this was a political game. A game where houses which were not involved in my father's contest on Arrakis found a way to get involved now and fulfill their specific needs on the backs of other houses, like the Atreides and Harkonnen rivalry. If you have a look, the Houses which joined the Harkonnen on the invasion of Caladan are the houses which supported Baron Vladimir Harkonnen for the golden lion throne. _COUNT MORITANI: And what are you trying to say, princess Irulan? House Moritani has always supported House Harkonnen. They have been a close partner through the years, and we are still with Baron Vladimir Harkonnen. _IRULAN: No doubt you were hoping that if the Atreides fall, then the Harkonnen will have most chances to get the throne. And maybe that way your house would get out of obscurity thanks to the Baron, or rather, the new emperor._COUNT MORITANI: HOW DARE you insult me in the meeting you requested? _IRULAN: It was not an insult, my Count. It was the truth. I am telling everyone who gathered here the real reason why House Moritani attacked the Atreides on Caladan._BARON: When you do tell everyone the reason people did things, try to at least look a little bit impartial and objective, your highness, and not the number one Duke Leto Atreides fan._GUILD AMBASSADOR LAKAR: Monarchs of the Landsraad, the Spacing Guild considers the hostilities a threat to the Imperium. The spice production has been affected for a long time by the conflicts between the three great Houses. _DUKE LETO ATREIDES: Does the Spacing Guild have the insolence to speak after everything they have done?_HASIMIR: Duke Leto, please. They are part of the power pylons in the known universe. They have every right to speak._DUKE LETO: Do they? The Spacing Guild was supposed to be a neutral side in the war on Arrakis. They joined former emperor Shaddam IV and caused us many casualties. Not only that, but the Guild actively helped Houses Harkonnen, Moritani and Mutelli in the invasion on Caladan._COUNT DOMINIC VERNIUS: And Houses Ordos and Richese, in the invasion of Ix._HASIMIR: Gentlemen, please. We are not getting anywhere if we continue like this._IRULAN: I am curious about something. One of the main protagonists of these hostilities has not said a word since the beginning of this meeting. Does the Executrix of House Ordos have absolutely nothing to say?_EXECUTRIX: House Ordos considers the subjects approached in this meeting irelevant. That is inefficient. House Ordos will not explain their reasons for the Ixian invasion. We have a different concern. That is certain._COUNT VERNIUS: You should explain yourselves, Executrix of House Ordos. You are a member of the Landsraad, you are not on your own in the empire. You attacked another members of the same Landrsaad unprovoked. Give us the reason._EXECUTRIX: Useless conversation. That is inefficient. House Ordos has real concerning information to share with the Landsraad. That is a threat._IRULAN: Then by all means, why don't you share this information with the Landsraad, Executrix of House Ordos?_COUNT RICHESE: Does the Executrix believe we are stupid enough to just ignore what happened on Ix because of some distraction disguised as a threat?_IRULAN: Count Richese, please, let the Executrix speak._COUNT RICHESE: It is outrageous. House Richese has given its motives for the Ixian invasion. We are in open competition with the ixians. It is kanly._EXECUTRIX: House Richese is trying to stop us from letting the Landsraad know what they are involved into. That is futile. House Richese has a secret alliance with the Bene Tleilax._COUNT RICHESE: A secret alliance? There is nothing secret about it. It is the same alliance you had with the Tleilaxu._EXECUTRIX: House Richese and the Tleilaxu have turned against the Ordos on planet Ix. That is a fact. _COUNT RICHESE: We turned on you? Ordos troops attacked us before anything else. This is ridiculous!_EXECUTRIX: The reason for their allegiance change is something House Ordos managed to find out. That is important. They are conspiring for creation of an artificial spice melange substance to replace the spice found on Arrakis. That is a threat.__This came like a bomb, to everyone involved in the meeting. Radnor started to get angry. Even the simple hearing of the word Tleilaxu makes the man lose his mind.__COUNT RICHESE: Does the great Executrix of House Ordos have any proof to sustain their accusations?_EXECUTRIX: House Ordos can provide images with Tleilaxu ships on Arrakis. Harvesting parts of dead worms. That is a threat. House Ordos also has a small part of the artificial melange formula. That is precious._COUNT RICHESE: Great, images of Tleilaxu ships. But can the Executrix of House Ordos offer proof that House Richese is involved as well?_EXECUTRIX: House Ordos does not have recordings or images of Richesian ships, but their alliance with the Tleilaxu and their change of allegiance with the Ordos are questionable. That is certain._COUNT RICHESE: No, not certain, that is ridiculous. Princess Irulan, I am not going to tolerate any more accusations without proof._IRULAN: Calm down, Count. Nobody is accusing you of anything right now._EXECUTRIX: There is one more concern for House Ordos. Tleilaxu have been developing a Shaddam IV ghola. That is a fact.__Again, this came like a bomb to the gathered people. The CHOAM representative fell on his chair in shock. Irulan could be seen pale on her transmission holo-image. __RADNOR: THOSE SHITBAGS. A Shaddam ghola?!_FEYD: Gross, but smart. Think about it: there would be no need for an election. Shaddam is the emperor. If they can "prove" that he survived on Arrakis, then they'd get a puppet ghola emperor. To cover for their artificial melange. Their plan was amazing._RADNOR: Well they're about to feel my wrath. I can see where this whole thing is going. We will fight the Tleilaxu. There is no way the Baron will give up the spice on Arrakis._FEYD: Of course, man. You'll get what you want, don't worry. __DUKE LETO: This is outrageous. Your highness, House Atreides will not tolerate this insult for your family. _COUNT GINAZ: May we know, dear Executrix, how did you gather all this information? And how do we know you were not involved as well? You did have an alliance with the Tleilaxu and the Richesians until very recently._EXECUTRIX: House Ordos found it all after their change of allegiance. Ordos spies were dispatched. That is wise. Ordos spies gathered a lot of important data. That is efficient._COUNT HAGAL: This story is very fishy, if you ask me. Your highness, House Hagal will also stand against this abomination and insult for House Corrino._EXECUTRIX: Time is of the essence. Bene Tleilax are operating on Arrakis as we speak. That is a fact. They are creating their artificial spice melange with possibly special Richesian refining machines. That is a threat._COUNT RICHESE: Another accusation without any proof. Then you create meetings to ask for peace, but you allow creatures like this to insult me and my House? House Richese will not tolerate this anymore. House Ordos should be prepared to fight against us. We will move to Arrakis and openly declare war on House Ordos._HASIMIR: GENTLEMEN! PLEASE! _BARON: Oh come on, representative. It is clear this is no time for peace. If what that thing called the leader of the Ordos says is true, then this is very bad. Your... highness... princess Irulan, House Harkonnen will also fight to stop that ghola abomination._DUKE LETO: I am sure the Baron is offering his support just for you, your highness, and that there are absolutely no hidden motives or plans involved._BARON: Your amazing irony makes me smile, dear Duke Leto. It is as good as your army: which is pretty terrible._DUKE LETO: Then it's a good idea that we will all have the might of the Harkonnen armies fighting against the Tleilaxu... the mighty Harkonnen army which was sent back home to Giedi Prime from Caladan to lick their wounds._IRULAN: Duke Leto, please. At this moment, any help is appreciated. Not only did they create a clone of my father, but they are also trying to replace the spice with their own creation. They must be stopped. _COUNT VERNIUS: House Vernius will join their allies, the Atreides, against the Tleilaxu._COUNT RICHESE: House Ordos should be prepared for war. Their insults will not be tolerated anymore. House Richese has no issue with the Tleilaxu. That is all we had to say. __The transmission from Richese was closed.__EXECUTRIX: House Ordos will also get involved in this. That is a fact. We all have a common enemy. Logic dictates we focus on it. That is wise._IRULAN: My Sardaukar will once again march on the sands of Arrakis. This time, they will be killing the Tleilaxu. And anyone siding with the Tleilaxu. No exceptions. For the insult they brought to my family._HASIMIR: I see the purpose of this meeting has failed. Once again._IRULAN: I am sorry, representative Hasimir, but things have changed now!__--- Transmission ended ---__DE VRIES: So, that's what they were..._BARON: YES, PITER. It is what you were supposed to find out. Tell me, why the hell do I pay you? Do I pay incompetence lately?_DE VRIES: No, my lord. I was very close to..._BARON: You were very close to suck my ass. Get out. OUT!__De Vries leaves the room.__BARON: We did not know about the ghola. We barely knew about the artificial spice. But somehow, the Ordos knew about everything. DOES THE ORDOS HAVE BETTER SPIES THAN ME?_FEYD: Father, is that really so important at the moment? _BARON: No. What is important is that I save my spice. If those weirdos succeed, then the spice on Arrakis will be worthless. That cannot happen. And also, I want that DAMN GHOLA KILLED. There will be only one emperor, named Vladimir Harkonnen! General Radnor..._RADNOR: My lord, you don't even have to ask me. It will be my pleasure to KILL THEM ALL._BARON: Hah, that's the spirit! But the idea of working with the Atreides again makes me puke._FEYD: It's all about priorities, father. As you've taught me._BARON: Yes, yes. Better get ready to move to Arrakis.__------ Few days later, in Carthag, Harkonnen capital on Arrakis ------__DE VRIES: I have analyzed the maps. Tleilaxu forces are pretty numerous, and we don't know yet on what side the Richesians are. What we know for sure is that they are fighting the Ordos._BARON: Then it sounds like the Tleilaxu side to me. WHAT IS THERE NOT TO BE KNOWN YET, PITER?_DE VRIES: Not really, my lord. They have yet to attack any other House. It's just the Ordos._FEYD: Then they're playing it safe. Avoiding the rest of the Landsraad and, at the same time, telling the Tleilaxu that they're on their side by killing Ordos._BARON: Yea, whatever. If they don't attack me, I couldn't care less about them. Ignore them._DE VRIES: Might not be that easy. They're fighting the Ordos._BARON: AND WHY SHOULD I CARE ABOUT THAT?_DE VRIES: Because we might use the Ordos help._BARON: Piter, tell me... Do I look like some sort of second hand baron who needs the help of some shit house to kill some damn Tleilaxu?_DE VRIES: If you have a look at the map... They are numerous, and not only that, but they have smuggled vehicles... Sonic Tanks, Devastators, everything. And gholas of all sorts: former Sardaukars, Fremen..._BARON: They have my ass. _FEYD: Father, please. Let's think._BARON: What, Feyd? You want to kiss some Ordos ass too now?_FEYD: I want to take the Tleilaxu out before they complete that artificial spice. Time is of the essence. Working with the Ordos would speed things up. We don't know how much time we have, father. Could be much, could be few days, who knows. I'd say we shouldn't risk anything._BARON: And what do you propose?_FEYD: To ally with the Ordos. We help them against the Richese, they..._BARON: I don't want to get involved in that. Not for now. We'll go there and kill the Tleilaxu attacking the Ordos. But when it comes to the Richese and Ordos conflict, it's their problem. They should be happy we will take care of the Tleilaxu for them._FEYD: And what if the Richese decide to jump in for the Tleilaxu?_BARON: Then we kill them as well. But they won't. If I, the mighty Vladimir Harkonnen, avoid to enter conflicts with them due to the nature of the current situation, they will avoid it even more._FEYD: But..._BARON: NO BUTS. If the Ordos consider this help, then fine. If not, I don't care. We go and kill Tleilaxu._RADNOR: Just tell me the coordinates already! I can't wait anymore._BARON: Fine, general. I like your impatience. I'll send them to you soon. Get your troops ready.__==========_Objective: The Tleilaxu are trying to do bad things on Arrakis. Bad things that the Baron doesn't like. You must stop them. You will deploy in a sector where the Richese and Tleilaxu are ganging up on the Ordos. Your target are the Tleilaxu. Ignore the Ordos-Richese conflict if possible, and only fight any of them if provoked. Any issue with the Ordos can probably be resolved by just talking to their commander, as we have absolutely no reason to fight each others. But negociations with the Richese will fail, so avoid them as much as possible. Destroy the Tleilaxu bases. Once destroyed, you can leave the sector: it is of no interest for House Harkonnen. The Ordos can have it. Our target is to weaken the Tleilaxu forces. Feyd will periodically coordinate attacks on the enemy, to help you out, if you can build and maintain a High-Tech Factory. It is essential for the Carryall infrastructure needed to transport his troops.
