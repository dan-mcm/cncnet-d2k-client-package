Briefing=I am the Baron Harkonnen. I hired you because I urgently need someone competent to conduct our campaign on Arrakis.__Five of our harvesters are at this moment being transported to an area rich in spice, but the Fremen and are waiting to destroy them. We can not contact our carryalls and therefore we can not avoid that our harvesters to land in the territory Fremen.__I need you to take care of the situation. We can not afford to lose those harvesters. There aren't any reinforcementes available, but I'm sure you'll find a way to destroy these Fremen with what you have.__You can expect more Fremen willing to destroy our harvesters. Don't stay away from the area of spice, as you'll have enough vision to deal with more Fremen approaching.__Objective: Eliminate all Fremen. At least one harvester must survive.

