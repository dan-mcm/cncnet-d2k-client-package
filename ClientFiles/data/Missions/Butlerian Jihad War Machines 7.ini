Briefing=HARKONNEN_============_I just discovered that the Ordos have allied with the Atreides. It is seen that the vermin tend to come together to survive. You know what? We're going to finish off kill two birds with one stone.__A base of Atreides and Ordos is fighting against the Machines in these instants. Take control of the core of our army and use it to wipe out the Atreides, the Ordos and all the Machines that you find in the next territory.__Although our army is clearly superior to all of them, do not underestimate the Ordos Deviators, they can cause problems against our Devastators; not to mention the many Carryalls of the Machines that fly over the territory waiting to land anywhere.__I can send you some reinforcements occasionally. Build the Starport and I will send you units more efficiently. I give you all the Harkonnen army to crush all our enemies, do not disappoint me.__Objective: Destroy the bases of the Machines, Atreides and Ordos.__Secondary objective: Build the Starport to receive better reinforcements.__Tip: Do not lose sight of the sky looking for air attacks from your enemies around your base. Attracting the army from one side against the other will make things much easier.

