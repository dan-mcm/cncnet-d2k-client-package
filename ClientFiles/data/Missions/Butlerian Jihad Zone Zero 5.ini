Name=Butlerian Jihad: Zone Zero - Mission 5
Author=Cm_Blast
Music=FREMEN.AUD
SideId=1
Briefing=ORDOS_=======_We are lucky; The Atreides and Harkonnen have met the Mercenaries to whom we sold those unmanned vehicles without any Artificial Intelligence, but thanks to the presence of the House of IX both believe that they have been those who have provided them with those vehicles.__This has given us enough time to experience our new Artificial Intelligence without further intervention of any House. Unfortunately, I have just been informed of Fremen's presence through various bases around ours.__The Fremen are much more numerous than us. Our base will be destroyed unless we activate Artificial Intelligence. It is not yet fully developed and suffers from some small problems in the code, but we cannot abandon all our work now and it is destroyed by the Fremen.__To activate Artificial Intelligence you have to build the High Technology Factory. This will start the automatic production of combat Cyborgs that you will find very useful in your fight against the Fremen.__Be very careful. There is an error in the programming that will put the Ciborgs against us if your credits are below 1000 or above 7000 after the activation. Try to keep our coffers between those two values.__To reinforce the defenses we have stationed Unmanned Missile Launcher Tanks in the highlands of the surrounding hills. Do not worry about them; they will only fire automatically at our enemies taking advantage of their long range and do not use the code.__The most important of all is that none of the buildings where we have our Artificial Intelligence is destroyed. We risk all our assets in it and we need it fully operational.__Go ahead, defend yourself successfully against any enemy offensive and counterattack by destroying each and every Fremen base that surrounds our own base.__Objective: Destroy all the Fremen bases.__Secondary objective: Build the High Technology Factory to activate the Artificial Intelligence. Once active, keep the credits between 1000 and 7000 to avoid that the Ciborgs fight against you (Once activated the Artificial Intelligence cannot be deactivated, the absence of the High Technology Factory will put the AI against you regardless of the amount of available credits).__Tip: The walls around you will help you easily extend your buildings and deploy defensive turrets anywhere you need it. Fremen will not be able to rebuild buildings that you are capable of destroying, eliminating key buildings will give you the advantage.

