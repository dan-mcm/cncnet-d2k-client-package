Briefing=EXECUTRIX: Executor, the recent desertion of the Mercenaries cannot be left unpaid. They have taken money for their services, yet they did not complete their part of the contract. That is intolerable. Profit is our only purpose, and the Mercenaries hindered our profit. You must take it back Executor. Destroy the Mercenaries. Burn their bases, take all their resources for the Ordos Cartel. That is the directive.__The Spacing Guild appears to have cancelled all transports for any Landsraad House with the destination Arrakis. Ordos spies located Guild forces working in tandem with the Imperial Sardaukars. The Guild might be allied with the Emperor. That is a threat. Our orbital radars have detected the Emperor himself in a Guild Imperial frigate, landing on Arrakis. Heavy Guild shipments are floating over the high orbit of Arrakis. That is a even bigger threat. We must attack the Guild and destroy the main Starport to delay their full deployment on Arrakis. Destroy the Sardaukar bases protecting the Guild, too!__Closing link...__FEMALE MENTAT: Executor, the Harkonnen are attacking the Sardaukar-Guild forces as well. They do not seem interested in fighting us, so consider staying away from them. That is advice.__Objective: Destroy the Mercenaries, once and for all. Destroy all Sardaukar and Guild structures. That is the mission.__HINT: Do not engage the Harkonnen, they are not a threat.

[Vars]
DeathHandAccuracy=1

