Briefing=SUMMERS' SOLSTICE 07: The Traitor__MISSION OBJECTIVES:_1. Fortify your base in southeast Hole-in-the-Rock._2. Capture or destroy Sumadi's Command Center._3. Defeat all loyalist forces._4. You must survive.__TACTICAL OBJECTIVES:_1. Sample the power of your new command unit._2. Use LRA or turrets at chokes near your base._3. Spare loyalist leaders so their forces give up.__BRIEFING:_     You turn into the main room of Durant's Command Center and point your weapon directly at him. He's unguarded, and at ease. After stepping close with unwavering aim, you discard the minigun, and your helmet. They clamor to the floor as you sweep a hand along Durant's desk, tumbling everything off it. When you grasp his collar and pull him up to look you in the eyes, he laughs weakly. He mutters, "I was beaten when I chose the lesser evil."__     "What the hell are you talking about?! Who put you up to this??" you demand, your gaze ice cold and your grip firm. "Answer me!!"__     "You're going to hate this," he warns you. He coughs as you violently shake him, then finally admits: "Sumadi. It was Sumadi."__     You can scarely believe what he's told you. "Sumadi??" you repeat, staring Durant down. He nods.__     "He intentionally stranded you in Gara Kulon and paid me to do what the Harkonnen couldn't. You're too ambitious for your own good, Rowe. ...That's what he said."__     You furiously throw him back hard enough to topple his seat. He grunts as he slams the far wall. As your men pick him up by his arms, he calls to you again: "Rowe..."__     You look over your shoulder at him.__     "...I've got a small base on the southeast end of Hole-in-the-Rock. You're going to need it. He knows you're coming."__     Word spreads about Sumadi's betrayal as you set course for his main base. Many demand his head for the friends lost at Gara Kulon, and on board the Heighliner.__     Ambitious? How very untrue. Sumadi refuses to accept the necessity of your actions. The necessity you realized at the El-Sayal Plains and Mushtamal Ridge. Sumadi could never see it without being in the thick of it himself. Only under your command do the smugglers of Arrakis have a future.__     Any and all loyalists will be called back to Hole-in-the-Rock for the impending clash. You see fit to call for all dissidents to arrive on your side.__     Durant's units on site are prepared to join you for the battle. There also seems to be a unique vehicle at the local merc factory. Perhaps it was something he was working on for Sumadi, but it will be indemnity to you once you touch down at the base.
MissionNumber=7

