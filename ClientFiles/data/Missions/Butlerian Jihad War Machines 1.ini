Briefing=ATREIDES_=========_Damn those Harkonnen! As soon as we won the battle they turned on us and almost annihilated us. They do not realize that even without being under Imperial control, the Artificial Intelligence of our old vehicles continues to carry out the directive that the Emperor himself implemented: Eliminate the three Houses.__I suppose the arrogance of the Harkonnen makes them believe that they alone can take care of the problem, but I am afraid that the number of bases controlled by the machines is greater than the one the Harkonnen imagine.__We are too short of resources; Our only way out is to ensure a territory rich in spices, enough to recover part of our forces. That territory is not far from here, protected by a base of the Machines.__Without anyone to control the machines they lack any strategy or coordination, which makes them easier to defeat but also more unpredictable. Watch your surroundings well; They can attack through the most unexpected places.__Do not forget to recruit numerous Infantry units and our fast Trikes to counteract their fearsome Ciborgs. Ahead; destroys the base of the machines with the exception of the Refineries and Silos inside; we will steal the spice from their stores for our cause.__Objective: Destroy the base of the Machines with the exception of the Refineries and Silos.__Tip: Watch the surroundings well in anticipation of possible enemy attacks. The infantry will be very useful to counteract the Ciborgs.

