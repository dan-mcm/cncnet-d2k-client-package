Name=Butlerian Jihad - Mission 8
Author=Cm_Blast
SideId=1
Briefing=ATREIDES_=========_We have detected a great activity of the machines in a region previously occupied by the Ordos. These have given us a full report of their old base and the data does not fit.__According to the report, the base, now in possession of the machines, is larger than it was. Artificial intelligence was designed to build vehicles and control them efficiently in battle, but not to expand. It is necessary to investigate what is happening.__The Ordos are trying to regain their strength and economy after their hard battle against the machines and the Harkonnen are too busy raising funds from the base that the Ordos defended successfully. That is why we are the only ones available to carry out the raid.__Your job will be to investigate the terrain and look for some type of anomaly that is affecting our enemy. I do not recommend attacking the base directly, since we alone can not compete with the great pace of production that machines have in this territory.__Objective: Explore the land in search of anomalies. Avoid the direct fight against the base of the machines until you have more information.

