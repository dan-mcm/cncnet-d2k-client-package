Briefing=The Harkonnen accepted their defeat and agreed to harvest enough spice until settle the debt. You're ready to leave Arrakis.__Wait, just got a message from the Ordos. They have a large arsenal of combat vehicles that want to transport from one territory to another, and want us to do transport in one of our frigates. They will pay us well, so we have taken the job.__The Ordos have warned us that the Atreides try to prevent the shipment is made. You can use all the military forces it deems appropriate to fulfill its mission, but remember that we are forbidden to deploy a VCM in the territory.__The large transport ship is on its way, will arrive in 25 minutes. Protect Ordos unmanned vehicles until it reaches the ship.__Objective: More than 30% of the Ordos vehicles must survive. No deploy an MCV.__Notes for the Commander: The number of stocks in the starport increments faster.

