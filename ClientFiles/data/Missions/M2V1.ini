Briefing=Your attack on the Ordos proved effective, they were overwhelmed by your tactics and were forced to regroup. Unfortunately, we have attracted unwanted attention from the other major houses, who are now assaulting our headquarters on Arrakis. Defend the headquarters at all costs! Should our defence fail, we face extinction. For now the Atredies seem to be the only House approaching, but numerous other Houses are sure to join them. Our Heavy Factory houses our spies, without it we will be blind to enemy troop movements. Ensure it remains secure to guarantee victory.__==========_Objective: Protect headquarters until we can regroup. Defend the Heavy Factory to maintain information about enemy movements.
