Name=War of the Landsraad - Ordos Mission 13
Author=Feda
Music=WAITGAME.AUD
SideId=2
Briefing=The recent wars and conflicts within the Landsraad have created a situation which is asking for another meeting between the great leaders of the council. The hostilities are getting dangerous, and are causing high unrest in the Empire. CHOAM, along with the Spacing Guild and princess Irulan of House Corrino, have formed another meeting to discuss the current situation of the Imperium. The Landsraad council has accepted the meeting, more to preserve its image with the population than their pure will for peace. This time, however, the meeting is not taking place on Kaitain: it is a remote transmission with most of the Landsraad Houses.

Both Tyle and Lora have moved back to the Capital. Whatever is left of the Tleilaxu forces all over Draconis IV are being slaughtered by Ordos forces at this very moment. With the retreat of the Tleilaxu, the planet is once again secure. Lora and Tyle will, again, take part in the meeting.

HASIMIR (CHOAM representative): Welcome, great leaders of the Landsraad, Spacing Guild and CHOAM. Due to recent events, we see the need of a new meeting. The previous had a certain objective, which does not seem like it was achieved. Even worse, the conflicts within members of the Landsraad have increased considerably. Not only did they spread out of Arrakis, to other planets, but also have involved Houses which were neutral before. 
IRULAN: We see this whole issue exploding further. It is a dangerous situation, which must be stopped immediately. Peace must be restored in the Imperium.
BARON HARKONNEN: Princess Irulan, last time I was called as being disrespectful just because I called things the way they were. This time, I am going to do the same thing. Let me remind you that this kind of peace talk doesn't stand, your highness. Your Sardaukar were present on Caladan, killing my men. Count Moritani can also confirm this. 
IRULAN: What was your business on Caladan in the first place, dear Baron? My Sardaukar...
BARON (raging): What was my business there? IT IS KANLY! Vendetta! And it has been for generations between Houses Harkonnen and Atreides. You're asking me what was my business on Caladan: then I am telling you I was there because there is kanly between Atreides and Harkonnen.
IRULAN: Then my Sardaukars' business on Caladan was to stop your stupid kanly, to stop your invasion on another Houses' planet.
BARON: YOU HAD NO BUSINESS GETTING INVOLVED IN THAT!
DUKE LETO ATREIDES: May we ask our dear baron to use ... whatever questionable royal honor he has left and watch the way he addresses not only to another monarch of a Great House, but also to a lady?
BARON: Of course you're defending her, Atreides. She basically saved your ass from being destroyed by the might of House Harkonnen.
MUTELLI: House Harkonnen is more of a joke rather than a respectable member of the Landsraad. The kind of House who cannot wait to backstab you for someone else.
BARON: Ah, of course, the butthurt "great" House Mutelli, invoking attacks on their troops that never happened. I would have thought you were smarted than that in finding a decent excuse for turning against us, dear Baron Mutelli. I guess that the task of fighting against Houses Atreides and Ginaz was too much for you.

Gurney looks at Hawat with a smile on his face, after this harsh exchange between Harkonnen and Mutelli.
HAWAT: Yes, my idea, Gurney.
GURNEY: I'll give you a spice beer when we return on Arrakis for this, man. It was wonderful. And they have no idea what happened, still!

HASIMIR: Gentlemen, please! Even now, you cannot stop from your quarrel! We are meeting here to make peace.
COUNT DOMINIC VERNIUS: Peace? With all due respect,representative Hasimir from the CHOAM, but have a look around your holo faces from each transmission and tell us if you see them willing to make peace. My planet, Ix, was invaded by Houses Ordos and Richese. For absolutely no reason. This was completely uncalled for. Then, we found out the Tleilaxu were also involved. All because none of these 3 factions could stand the fact we offer superior machines to anyone else's.
COUNT RICHESE: This should be considered blasphemy.
IRULAN: Can we act like monarchs of a great House? This means to stop calling other people out right now. It is clear that this was a political game. A game where houses which were not involved in my father's contest on Arrakis found a way to get involved now and fulfill their specific needs on the backs of other houses, like the Atreides and Harkonnen rivalry. If you have a look, the Houses which joined the Harkonnen on the invasion of Caladan are the houses which supported Baron Vladimir Harkonnen for the golden lion throne. 
COUNT MORITANI: And what are you trying to say, princess Irulan? House Moritani has always supported House Harkonnen. They have been a close partner through the years, and we are still with Baron Vladimir Harkonnen. 
IRULAN: No doubt you were hoping that if the Atreides fall, then the Harkonnen will have most chances to get the throne. And maybe that way your house would get out of obscurity thanks to the Baron, or rather, the new emperor.
COUNT MORITANI: HOW DARE you insult me in the meeting you requested? 
IRULAN: It was not an insult, my Count. It was the truth. I am telling everyone who gathered here the real reason why House Moritani attacked the Atreides on Caladan.__TYLE: Irulan has a clearly different approach and tone compared to the last time._LORA: Because Irulan is now the most popular of them all. She's being viewed as the one who saved the Imperium by enforcing the retreat of invading Harkonnen forces on Caladan, she influenced the Ix campaign after she was done on Caladan and she's claiming to be the protector of the Imperium against any Tleilaxu or Guild plots, if any. No matter what anyone says, she played the game better than them all. By simply staying behind, taking advantage of a huge Landsraad war and playing peace-maker... At first, through diplomatic ways, as we've seen in the first meeting. Now, after everything that happened, she can actually enforce it, as she had done on Caladan, with the march of the Sardaukar legions. Of course her tone is different, she can afford to speak like this to anyone at this point. Strong iron hand, that's what she's trying to show._TYLE: Well that's a pretty accurate description of the current situation. Crazy mentat analysis._
BARON: When you do tell everyone the reason people did things, try to at least look a little bit impartial and objective, your highness, and not the number one Duke Leto Atreides fan.
GUILD AMBASSADOR LAKAR: Monarchs of the Landsraad, the Spacing Guild considers the hostilities a threat to the Imperium. The spice production has been affected for a long time by the conflicts between the three great Houses. 
DUKE LETO ATREIDES: Does the Spacing Guild have the insolence to speak after everything they have done?
HASIMIR: Duke Leto, please. They are part of the power pylons in the known universe. They have every right to speak.
DUKE LETO: Do they? The Spacing Guild was supposed to be a neutral side in the war on Arrakis. They joined former emperor Shaddam IV and caused us many casualties. Not only that, but the Guild actively helped Houses Harkonnen, Moritani and Mutelli in the invasion on Caladan.
COUNT DOMINIC VERNIUS: And Houses Ordos and Richese, in the invasion of Ix.
HASIMIR: Gentlemen, please. We are not getting anywhere if we continue like this.
IRULAN: I am curious about something. One of the main protagonists of these hostilities has not said a word since the beginning of this meeting. Does the Executrix of House Ordos have absolutely nothing to say?__LORA: Now they're about to drop the bombshell... Irulan certainly did not expect what's about to follow..._TYLE: Can't wait. This meeting is about to spice up even more._
EXECUTRIX: House Ordos considers the subjects approached in this meeting irelevant. That is inefficient. House Ordos will not explain their reasons for the Ixian invasion. We have a different concern. That is certain.
COUNT VERNIUS: You should explain yourselves, Executrix of House Ordos. You are a member of the Landsraad, you are not on your own in the empire. You attacked another member of the same Landrsaad unprovoked. Give us the reason.
EXECUTRIX: Useless conversation. That is inefficient. House Ordos has real concerning information to share with the Landsraad. That is a threat.
IRULAN: Then by all means, why don't you share this information with the Landsraad, Executrix of House Ordos?
COUNT RICHESE: Does the Executrix believe we are stupid enough to just ignore what happened on Ix because of some distraction discuised as a threat?
IRULAN: Count Richese, please, let the Executrix speak.
COUNT RICHESE: It is outrageous. House Richese has given its motives for the Ixian invasion. We are in open competition with the ixians. It is kanly.
EXECUTRIX: House Richese is trying to stop us from letting the Landsraad know what they are involved into. That is futile. House Richese has a secret alliance with the Bene Tleilax.
COUNT RICHESE: A secret alliance? There is nothing secret about it. It is the same alliance you had with the Tleilaxu.
EXECUTRIX: House Richese and the Tleilaxu have turned against the Ordos on planet Ix. That is a fact. 
COUNT RICHESE: We turned on you? Ordos troops attacked us before anything else. This is ridiculous!
EXECUTRIX: The reason for their allegiance change is something House Ordos managed to find out. That is important. They are conspiring for creation of an artificial spice melange substance to replace the spice found on Arrakis. That is a threat.

This came like a bomb, to everyone involved in the meeting. 
_TYLE: You think the Richesians know, or at least suspect anything regarding the Shaddam ghola?_LORA: Most likely not. That was kept so secret that only the Ordos and the Tleilaxu know about it. They'd have no reason to share that information with the Richesians. That would be stupid. A Shaddam ghola is an information more important than anything else. The moment the Tleilaxu failed their siege and assault of our capital, and failed to kill us and the Executrix, they pretty much signed their doom. We know about their plot, so this threat is looming above them constantly._TYLE: And since the Tleilaxu cannot be part of this meeting, not being a part of the Landsraad, AND their only proof of our request of purchase of the ghola being blown up..._LORA: I told you months ago, the Executrix will find a way to twist this one around in our favor. Now you're also very well paid, so I hope we won't have to talk about switching sides anymore._TYLE: Yea, whatever. Since when have you turned into the biggest Executrix fan anyway?_LORA: My mentat training tells me to work with them because they are cunning and efficient. And wealthy.

COUNT RICHESE: Does the great Executrix of House Ordos have any proof to sustain their accusations?
EXECUTRIX: House Ordos can provide images with Tleilaxu ships on Arrakis. Harvesting parts of dead worms. That is a threat. House Ordos also has a small part of the artificial melange formula. That is precious.
COUNT RICHESE: Great, images of Tleilaxu ships. But can the Executrix of House Ordos offer proof that House Richese is involved as well?
EXECUTRIX: House Ordos does not have recordings or images of Richesian ships, but their alliance with the Tleilaxu and their change of allegiance with the Ordos are questionable. That is certain.
COUNT RICHESE: No, not certain, that is ridiculous. Princess Irulan, I am not going to tolerate any more accusations without proof.
IRULAN: Calm down, Count. Nobody is accusing you of anything right now.
EXECUTRIX: There is one more concern for House Ordos. Tleilaxu have been developing a Shaddam IV ghola. That is a fact.

Again, this came like a bomb to the gathered people. The CHOAM representative fell on his chair in shock. Irulan could be seen pale on her transmission holo-image. 

DUKE LETO: This is outrageous. Your highness, House Atreides will not tolerate this insult for your family. 
COUNT GINAZ: May we know, dear Executrix, how did you gather all this information? And how do we know you were not involved as well? You did have an alliance with the Tleilaxu and the Richesians until very recently.
EXECUTRIX: House Ordos found it all after their change of allegiance. Ordos spies were dispatched. That is wise. Ordos spies gathered a lot of important data. That is efficient.
COUNT HAGAL: This story is very fishy, if you ask me. Your highness, House Hagal will also stand against this abomination and insult for House Corrino.
EXECUTRIX: Time is of the essence. Bene Tleilax are operating on Arrakis as we speak. That is a fact. They are creating their artificial spice melange with possibly special Richesian refining machines. That is a threat.
COUNT RICHESE: Another accusation without any proof. Then you create meetings to ask for peace, but you allow creatures like this to insult me and my House? House Richese will not tolerate this anymore. House Ordos should be prepared to fight against us. We will move to Arrakis and openly declare war on House Ordos.
HASIMIR: GENTLEMEN! PLEASE! 
BARON: Oh come on, representative. It is clear this is no time for peace. If what that thing called the leader of the Ordos says is true, then this is very bad. Your... highness... princess Irulan, House Harkonnen will also fight to stop that ghola abomination.
DUKE LETO: I am sure the Baron is offering his support just for you, your highness, and that there are absolutely no hidden motives or plans involved.
BARON: Your amazing irony makes me smile, dear Duke Leto. It is as good as your army: which is pretty terrible.
DUKE LETO: Then it's a good idea that we will all have the might of the Harkonnen armies fighting against the Tleilaxu... the mighty Harkonnen army which was sent back home to Giedi Prime from Caladan to lick their wounds.
IRULAN: Duke Leto, please. At this moment, any help is appreciated. Not only did they create a clone of my father, but they are also trying to replace the spice with their own creation. They must be stopped. 
COUNT VERNIUS: House Vernius will join their allies, the Atreides, against the Tleilaxu.
COUNT RICHESE: House Ordos should be prepared for war. Their insults will not be tolerated anymore. House Richese has no issue with the Tleilaxu. That is all we had to say. 

The transmission from Richese was closed.

EXECUTRIX: House Ordos will also get involved in this. That is a fact. We all have a common enemy. Logic dictates we focus on it. That is wise.
IRULAN: My Sardaukar will once again march on the sands of Arrakis. This time, they will be killing the Tleilaxu. And anyone siding with the Tleilaxu. No exceptions. For the insult they brought to my family.
HASIMIR: I see the purpose of this meeting has failed. Once again.
IRULAN: I am sorry, representative Hasimir, but things have changed now!

--- Transmission ended ---

------ Few days later, in Jaculan, Ordos capital on Arrakis ------

Incoming transmission from Draconis IV__EXECUTRIX: Executor, your orders have changed. You must move your focus from the Tleilaxu artificial spice to House Richese. That is the directive._TYLE: But I thought we need to hurry and stop the Tleilaxu._EXECUTRIX: The Tleilaxu are under heavy pressure by Harkonnen, Atreides, Vernius and Corrino forces all over Arrakis. However, House Ordos must also handle House Richese, who have declared an open war. That is a threat. House Richese has avoided any conflict with the other Houses, so we shall not receive Landsraad help in dealing with the Richese forces. That is bad. We must focus our military assets in stopping the Richesian threat for now. If the Richese forces take enough damage, they might be forced to retreat. We shall work on getting the Landsraad to put more pressure on House Richese to withdraw their forces from Arrakis until the Tleilaxu are dealt with. That is the plan._TYLE: However, don't they still have that alliance with the Tleilaxu?_EXECUTRIX: Their alliance with the Tleilaxu is volatile at the moment. There is a high chance House Richese will try to stay on good terms with the Landsraad, as the Tleilaxu do not have high odds of succeeding here. That is wise. They will avoid fighting or angering Irulan or the other Houses. We will use that to strike a few decisive blows to the Richesians, then ask the Landsraad or Irulan to interfere on our side. We shall claim that the Richesians are indirectly helping the Tleilaxu by fighting us, and they should be forced to withdraw._TYLE: As you wish, your excellency._EXECUTRIX: Mentat Itami will brief you on your mission.__Transmission ended...__LORA: Ok, so while you were talking, I had a look over the instruction they sent me. It seems they want to push back the attacking Richese and Tleilaxu forces gathered around one of our most important territories. _TYLE: How strong is their offensive?_LORA: Pretty strong... Let's say it's more than we anticipated. We have a fully operational base there, but by the looks of it, it won't last long._TYLE: Then I'd better move._LORA: No. Wait. The Executrix allows a pretty high budget for this mission. I think the best way to spend it is..._TYLE: Giving it to me so I can take good care of it._LORA: What I was trying to say before I was interrupted..._TYLE: I know who you wanna bring in... The badass merc Durant. I don't think I need him, you know?_LORA: Have a look over this map... With the enemy positions. I actually believe you do.__Tyle is visibly surprised. The enemy is extremely numerous.__TYLE: How the hell did they gather all this shit here?_LORA: You seem to forget the fact that House Richese is pretty fresh in this whole conflict. They haven't spent the last few years in constant warfare. While the Tleilaxu might be feeling some war attrition after their failed attempt at taking Draconis IV, where they invested a lot of forces, the Richesians have only fought on Ix, and it wasn't for a long time. They are numerous and dangerous._TYLE: Fine. Get in touch with your dear friend.__Transmission started...__DURANT: Lora! Haven't heared from you in a while. Is everything ok? My boys told me that the entire Imperium exploded into war._LORA: Pretty much. I'm fine, Sabre. It's been a rough period, but so far I''m still in one piece._DURANT: Now that's really all that matters!_LORA: I have a new mission for you, Sabre. And this time, your purse will like it as well._DURANT: Well, you definitely know how to motivate a man. What's it about?_LORA: You will get involved in the war against the Richesians and Tleilaxu._DURANT: What the hell? Have they landed on Arrakis? What for?_LORA: Yes. It's a long story: we've basically been betrayed. Just one piece of advice, for a dear friend, because I wouldn't like to see you dead in a hole somewhere: do not take any contracts from the Richesians or the Tleilaxu._DURANT: I also would like to avoid fighting you, but... my boys must be paid. I must be paid._LORA: We'll pay you. I have the approval to invest a consistent budget in mercenaries. Besides, the reason I am telling you this is that there is a huge coalition of Landsraad forces attacking the Tleilaxu. You don't want to get on the wrong side of this war: they will be utterly defeated in the end. Odds are heavily against them._DURANT: If you got the payment, I'm yours. I really appreciate you trying to warn me, though._LORA: We will give you access to our base close to Jacarutu. That is what we have to defend. You will be heavily paid for this, so I'm expecting you to bring a considerable group of men to aid the Executor._DURANT: Sure. We're ready for anything. It's been a pretty silent period, with all the conflics on the other planets. No contracts no nothing... Executor Tyle, I am glad to see you again, and fight alongside you again._TYLE: Likewise..._DURANT: See you there. I'll wait for the coordinates and the rest of the details, then me and my men will start moving.__Transmission ended.__TYLE: So... we're giving a merc a fully developed base, and letting the highest ranked Ordos Executor start a base from scratch?_LORA: Wipe your ego off your mouth. You done?_TYLE: Hey I get it, go have that dinner together already. But seriously, this is war._LORA: Which is exactly why he is getting the developed base. Sabre is not the seasoned Executor who commanded huge armies on different planets and who killed a Sardaukar personally, on their freaking home world of Salusa Secundus. He is a merc. If we give him the base, he will be more efficient. You are already experienced, and will easily deploy another force there. I am a mentat, my analysis is on point, don't even try to find another stupid reason._TYLE: Well... I can't really deny this. It makes sense._LORA: Get your stupid gelousy out of here. Get to know the man and you'll realize he's not a bad person at all. And he can be trusted, which is exactly why he is getting that fully developed base. It's because I know he won't jump you with the first opportunity, nor will he desert is the situation looks bleak._TYLE: Alright, Lora. I'll fight alongside the man and I'll give him a chance to prove he is a nice guy. With the crazy amount of forces they have, if he doesn't desert, it means he's a good dude.
LORA: There's also a local Sardaukar Bashar with a small base, fighting the Tleilaxu. I don't know the exact location yet. I will try to find him and negociate a deal. There should be no reason for him to refuse a small alliance against the Tleilaxu. But remember, the scummy Richesians are only in war against us, so the Sards won't join you against the Richesians._TYLE: Well maybe they would... if the Richesians would happen to... you know... kill one of their men or something._LORA: That's up to you, but remember: the Sardaukars are the strongest troops in the Imperium. They can handle the Tleilaxu forces pretty well, and then you could focus on the Richesians. I doubt you and Sabre really need the Imperials to attack the Richesians as well. That is, of course, if the Bashar will even accept my offer.__
========_Objective: The plan of the Ordos Executrix has went pretty well. After the recent Landsraad meeting, the entire known universe hates the Tleilaxu as much as Harkonnen hates Atreides. Thanks to the cunning plots of the Executrix, the Landsraad has formed a rather informal, but effective, coalition against the Tleilaxu forces trying to produce the artificial spice. Combine that with the knowledge of the Shaddam Ghola which was revealed by the Executrix, and you got the perfect recipy to unite a rather fractured Landsraad against a common foe. But the Ordos will, once again, play this smart, as we always have. Since the Richesians hate our guts, we must handle them first. They have deployed on Arrakis and are attacking our fortifications close to Jacarutu. Let the other Landsraad families involved in this coalition soak up the big fights with the Tleilaxu. We're taking the smaller ones, but the Richese forces are numerous and dangerous. You must deploy a base and remove the enemy from the region. That is the mission. The most badass merc in the known universe, Sabre Durant, will assist you again, so there's that. Lora will try to contact the local Sardaukar Bashar fighting the Tleilaxu and offer a temporary alliance offer. Remember though, the Richesians have only declared war to House Ordos, so the Sardaukar will not get involved against the Richesians... unless provoked.
Both Tyle and Lora have moved back to the Capital. Whatever is left of the Tleilaxu forces all over Draconis IV are being slaughtered by Ordos forces at this very moment. With the retreat of the Tleilaxu, the planet is once again secure. Lora and Tyle will, again, take part in the meeting.
