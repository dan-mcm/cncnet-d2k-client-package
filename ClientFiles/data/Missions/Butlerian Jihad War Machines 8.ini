SideId=1
Briefing=ORDOS_=======_I must admit that the offensive power of the Harkonnen is worthy of mention. They have defeated multiple opponents in a single battle alone. However, brute force alone is not enough to stop the Machines.__Based on the information obtained from the infected vehicles, our engineers have designed a new firewall capable of blocking the data traffic of the Artificial Intelligence to our units and buildings. The Atreides and ourselves are already immune to the virus, so we're going to offer it to the Harkonnens, even if it's our own convenience.__I think we have arrived too late. The main base of the Harkonnen, where the Baron resides, has been infected and is already controlled by the Machines. No, wait, my scouts report having observed some Harkonnen buildings that are intact. It seems that only the defensive turrets and the Devastators are under the direct control of the machines. Maybe there's still time to save the Baron.__According to the data of our advance team, there is no available area in which you can deploy a base with all our technology. There are only a multitude of small plots of land on which you could expand little by little.__In addition, most of the spice is found in areas that harvesters can not reach. You will need Carryalls to collect all the possible spice. If you build the High-Tech Factory we will send you the location of several possible points from where to harvest more spice.__Use the Light Factory that you have at your disposal to cleanse new areas of expansion from enemies. As you secure the land, I will send you VCMs that you can use to expand. You will need our Deviators to counteract the power of the enemy Devastators, without forgetting the fearsome Cyborgs that are with them.__Once you're ready, destroy all the buildings and vehicles of the Machines but keep the Harkonnen buildings intact. The Baron is hidden in some of them and we need him alive.__Objective: Destroy the base of the Machines. No Harkonnen building should be destroyed or captured.__Secondary objective: Clear each of the lands to receive additional VCMs with which to expand the base. Build the High-Tech Factory to receive additional information on new spice fields.__Tips: The Deviator is the best weapon to fight enemy Devastators. You can sell the Construction Yards that you have duplicated to leave more space to place other buildings. The best spice zones are innacesible by land; build several Carryalls to collect all the possible spice. The Harvesters could get stuck trying to access some unreachable areas, you must watch them constantly.

