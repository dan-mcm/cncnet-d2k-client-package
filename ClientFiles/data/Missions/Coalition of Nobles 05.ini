Briefing=The Bromeli were able to board the first of the two Frigates en route to Arrakis. The Atreides followed the location of the Starport in which they will land and rushed to build a large base to capture or destroy the Bromeli.__The second Frigate, loaded with the small Lassoki army, runs the risk of not arriving in time before the Atreides destroy the Starport. The Lassoki need to regroup with their Bromeli allies and build a base before the Atreides attack them.__The Bromeli, although they possess highly destructive bombs, their army is completely non-existent; they are at the mercy of the Atreides. The Lassoki will be forced to provide protection for their allies, as they will be needed for future battles.__The Iasi are traveling to the territory to aid their comrades in battle. They are far from their position, but they hope to catch up with them before it is too late. They will reach a safe zone and, with their MCV and their specialized Infantry, they will help with the offensives against the Atreides.__The Qaii have discovered that the Atreides, in their haste to deploy an armed contingent, have left the eastern part of the Atreides Base heavily protected by some Cannon Turrets and Missile Turrets but with hardly any army to protect the area.__The Bromeli will focus primarily on attacking the weak Atreides emplacement to the East first destroying all the Turrets and the few buildings inside in order to clear the area for the Qaii to land with a MCV and vehicles to aid the battle, something that they can achieve faster together with the collaboration of the Lassoki.__Because the Atreides had to build their base so quickly, they still haven't brought their most advanced technology with them, but it's only a matter of time before they attack with better and better weaponry. The Lassoki will need to efficiently combat the enemy, which includes the powerful Atreides Sonic Tanks.__Objective: Regroup with the Bromeli and build a base before the Atreides attack. Destroy the bases of the Atreides.__Secondary objective: Destroy the Atreides emplacement to the East so the Qaii can land. Wait until the time reaches zero for the reinforcements Iasi to arrive.__Tips: The Atreides will improve their weaponry with each offensive. Build properly designed units to counter enemy attacks.

