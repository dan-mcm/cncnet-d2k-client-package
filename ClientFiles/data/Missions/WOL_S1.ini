Briefing=LOCATION: Guild staging base, near Carthang, in the Imperial Basin_===============_Zed Varlaz is desperately trying to get his communication device back online. The Sardaukar burseg managed to escape, with a few soldiers, from the Imperial Palace siege in the Imperial Basin, and is now trying to contact other Sardaukar forces on Arrakis for assistance.__The device starts working again, and a comm-link can be established with the Supreme Bashar Cando Garron.__ZED: This is Burseg Zed Varlaz from legion 501, do you copy?_CANDO GARRON (Supreme Bashar): General Varlaz, report in. What is happening there? We've heared the panic through the still-functioning radio comms._ZED: Sir, the situation is critical. The Landsraad coalition managed to succeed in the Imperial Palace siege... They blew it up._GARRON: That cannot be! Where is the emperor? _ZED: He is... in the best scenario... trapped beneath the palace ruins. But... I don't think he's still with us, General.__A moment of silence... __GARRON: Burseg, what is your status right now?_ZED: I have managed to retreat with a few men after the destruction of the Imperial Palace. Although I ordered a cease-fire once the Palace was destroyed, so that we can go check for his heighness, the Landsraad houses would not stop. I tried, through the chaos, to get a team to the ruins and look for the Emperor, but they were killed by Harkonnen forces. The Guild has fallen in the region, they are being overrun as we speak._GARRON: You must get out of there, Burseg. Save yourself and your men._ZED: But, sir... the emperor... We cannot leave this place without him. He might be alive..._GARRON: That is a direct order, Burseg. _ZED: But..._GARRON: Even if he is still alive, there is no way you can reach the palace ruins, let alone undergo an investigation through the ruins. Being loyal is one thing, being stupid is another... You must retreat from the Imperial Basin. Get to Tsimpo, there are no enemy forces nearby so far. Meet me here, and we'll decide the next move._The question is: do you have any vehicles to be able to pass the desert towards Tsimpo?_ZED: No, I have around a dozen men, but we're on foot. We managed to capture a Harkonnen Devastator, but that won't be enough... However, the intel we have on this region shows a small Fremen High tech factory close to a nearby Sietch. If we can capture that, we could be able to communicate with a Sardaukar air rescue team from the nearby staging air base in the Imperial Basin. It is still standing. The problem is..._GARRON: What is the problem?_ZED: Since it's close to a Sietch, the Fremen are quite numerous and quite stealthy. Also, the Guild encampments in this sector are being attacked by the Landsraad, and will fall shortly._GARRON: Then you'd better start moving, Burseg... You are commanding the mighty Sardaukar, I'm expecting you to crush those natives in the sand... Move now, Burseg, will see you in Tsimpo.__OBJECTIVES: Fight your way to the Fremen High tech factory to the north-east. Capture it, before the Guild forces are overrun by the Landsraad, as they will then come for you. The captured Devastator has Commanding Burseg Varlaz inside, do not allow it to be destroyed. Tactical map available, press the button to view it.
