Briefing=The Coalition's victory over the Harkonnen has elevated their status on Arrakis far more than they ever imagined it would. To this must be added the conquest of a territory rich in spice that has notably increased the economic and military power of the four Houses.__The Ordos and the Atreides are not at their best due to the defeats suffered by the Coalition itself and the Harkonnen, so they had a meeting in which, in spite of both, they considered that in the current situation separately they would not they have an army big enough to stop the entire Coalition, stronger than ever.__Due to the desperation of the moment, the Atreides and the Ordos have signed a temporary alliance with a single motive: to defeat the Coalition. For this, both groups have brought their entire army available and have deployed bases everywhere.__The Lassoki, Iasi and Qaii will fight directly against the Atreides and Ordos, while the Bromeli will serve as support by offering sporadic attacks from vehicles that they can buy around the Starport as well as all the bombs they can make.__Both sides risk everything in this last battle. If the Coalition wins this confrontation, Arrakis will belong to them.__Objective: Destroy all the Atreides and Ordos bases.__Tips: Cannon Turrets are a good defensive system to deploy early on. Remember that you are not alone, you have multiple allies on your side. Let them help you if you have problems but do not abuse if you do not want them to be destroyed. Protect them if they are in danger and attack alongside them for further damage.

