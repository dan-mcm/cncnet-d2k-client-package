Briefing=SUMMERS' SOLSTICE 12: False Pretenses__MISSION OBJECTIVES:_1. Rescue the OSO Devastators._2. Clear the region of enemy forces._3. The OSO Devastators must survive._4. You must survive.__TACTICAL OBJECTIVES:_1. Prepare for intense aggression by the unknowns._2. Establish a forward base to secure more Spice fields._3. Unleash the imprisoned Devastators on their captors.__BRIEFING:_     Moriaen appears displeased as you relay your report to her. Rather, the report Durant's envoy brought to you. Unable to reach you himself, they tracked you down to give you the heads-up in person. He'd left to defend Shield Wall and assist the Ix against the Tleilaxu. "That's all I heard from his messengers."__     "Troubling," Moriaen replies. "Not overwhelmingly so. It would be utterly pointless for the Tleilaxu to challenge House Ordos or its allies. Do not fear for Commander Durant. He is capable and it is unlikely he will require aid."__     "I still want to know what they're doing at the Golden Lion Throne. If he doesn't report back soon, I'm going out there to see what's wrong." you insist. Moriaen turns her attention to the side. There's an uncomfortable pause. You eventually ask, "...What is it?"__     Moriaen looks back at you, frowning. A low alarm can be heard under her voice. "It appears that something more has transpired. Your base in neighboring False Wall has fallen under attack."__     You gasp. "By who?!"__     "Unknown." She glances to the side again, then repeats the SOS for you.__     "Under attack by ------- -------- ---- ----------- -- urgent message --- --------- Summers. Wait... oh, no! -- --- assist. ------ do not ------ --- - ---- Leave us to die!"__     You grit your teeth. "Whoever they are, they're going to regret attacking my men. Summers out," you tell the Ordos commander. The link is severed. In its place, your command interface appears. The small base remaining in False Wall is somewhat fortified with Cannon Turrets and Sonic Tanks, but the main base there had Devastator tanks stockpiled. Whoever attacked it came in force.__     You recall reserves from neighboring Tuono Basin and Alazor Steppe as you set out. Moriaen will surely confirm and coordinate the reinforcements you requested. An Outpost would be helpful in guiding the Carryalls to the territory... and deciphering that distorted message.
MissionNumber=12

