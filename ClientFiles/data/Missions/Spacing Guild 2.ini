Briefing=Damn those Harkonnen! They prefer destroying their own buildings rather than let us conquer their stupid silos. We will settle scores with them later, it is better for now to focus on the debt of the Atreides.__The Atreides are willing to pay us the agreed amount, but they seem to have problems that may affect us directly. A General Atreides was sent off for his dubious way to act on the battlefield. Now he rebelled with his army and seeks revenge against the Atreides.__The Atreides silos were full of spice for payment, but the rebellion has forced them to spend large amounts to not be destroyed. They have asked us to help them overcome the defector.__Usually we do not get into internal discussions, but the exiled General is not a supporter of the spacing guild; he will never pay the debt that the Atreides generated. Use our small base with the starport to bring heavy vehicles to help you in the mission.__Send to the Atreides much help as required and, once they have endured enough, prepares a counterattack to destroy the whole base of the General renegade.__Warning: Do not order a VCM, we have forbidden to deploy our own construction yard in Arrakis. Going against the rules will mean significant monetary losses in fines.__Objective: Protect the Atreides Base and defeat the general renegade. Not deploy a VCM.__Notes for the Commander: The frigate arrives faster when placing an order.
Name=Spacing Guild - Mission 2
Author=Cm_Blast
Music=ATREGAIN.AUD

