[Basic]
Name=Coalition of Nobles - Mission 2
Author=Cm_Blast
SideId=2
Briefing=The Frigates that the Lassoki, Iasi and Qaii stole from the Ordos are approaching the orbit of Arrakis. In order not to arouse suspicion, they have decided that the best option is to land on the coordinates that were marked on these frigates.__Luckily for them, the Frigate's destination are in three Ordos Starports located in the same territory. This will allow the three of them to meet together and help each other if necessary.__The Frigate with the Lossaki will enter the territory first as it heads for the area less controlled by the Ordos. As soon as they land, they will eliminate any waiting enemies and quickly flee to the East before the Ordos bring in reinforcements.__To the east, across sand, are the other two Starports that must be liberated before their allies can land safely. Both the Iasi and the Qaii carry several MCVs that they will share with the Lassoki in order to deploy a base.__The Ordos' technology is clearly superior to that of the three, but they are hopeful that if the three fight together they can destroy the Ordos base and control the territory.__Objective 1: Escape to the East and eliminate the Ordo custodians guarding the Starports to receive units and a MCV from your fellow Iasi or Qaii.__Objective 2: Deploy a base with your allies and destroy the Ordos.
Music=AMBUSH.AUD

