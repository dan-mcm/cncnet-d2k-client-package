Briefing=ORDOS_=======_We had considered the possibility of a betrayal by the Atreides or the Harkonnen, so we had prepared an escape route in case something went wrong. Although we are still alive, we don't have any base in which to take refuge since we use the vast majority of our resources in the battle against the Emperor, his Machines and the Harkonnen._ _Now the Machines, with no one to guide them, have become unpredictable and a threat to us; but maybe we can take advantage of the situation. We will capture one of its bases and take advantage of its resources to our benefit.__That base has been several hours under heavy Harkonnen attacks; You must hurry to capture as many buildings as you can before the base is reduced to ashes. Once the base is in your power you can use your resources to expel the Harkonnen._ _In addition, the Harkonnen use a Modified Outpost to attract more armies to battle. Capture it and we can indicate the position to our surviving men so that they come to help us.__Objective: Capture all possible buildings from the base of the Machines, then destroy the Harkonnen.__Secondary Objective: Capture the Modified Outpost to receive additional units.__Tip: You will need at least the Heavy Factory and the Repair Center if you want to expand the base.

