Name=Butlerian Jihad: Zone Zero - Mission 7
Author=Cm_Blast
Music=ARAKATAK.AUD
SideId=1
Briefing=ATREIDES_=========_According to the Harkonnen, the Ixians have reached the next level: transferring human minds to Machines. This is a very serious threat. If the vehicles were once infected by an Artificial Intelligence, I don't want to imagine what could happen if they start to develop that technology to the crowds. We must stop them immediately, but first we have to finish a pending job.__Mercenaries no longer only use unmanned vehicles, but now they have begun to use combat vehicles controlled by an Artificial Intelligence. We cannot run the risk of history repeating itself, we must defeat the Mercenaries, for their own good.__I need you to find and destroy all the buildings of the Machines that have been erected in the vicinity of the Mercenary bases. We do not want to kill the Mercenaries unnecessarily, so it is very important that you do not destroy any Barracks, Light or Heavy Factories or even the Starport. You should be able to destroy the Machines without going through the base of the Mercenaries.__I must also indicate a second objective. The Fremen are refugees in some Sietchs near your position. It seems that they have recently been in clashes and have suffered numerous casualties. Now they try to protect their lives and mobilize through their Sietchs.__The Mercenaries and the Fremen have no reason to confront each other, but I doubt that these Machines controlled by Artificial Intelligence are capable of distinguishing an enemy from someone neutral. If the Machines begin to fight against the Fremen you must protect them. The Fremen may have information about the Ixians and their Machines.__Objective: Destroy all the buildings of the Machines. The Barracks, Light Factories, Heavy Factories and the Mercenary Starport must remain intact. At least one Sietch Fremen must survive.__Tips: The buildings of the Machines are located around the bases of the Mercenaries, explore the terrain well before attacking. Air Attacks can easily destroy the Factories of the Machines. That the Fremen lose some Sietch is not important as long as at least one of them remains intact.

