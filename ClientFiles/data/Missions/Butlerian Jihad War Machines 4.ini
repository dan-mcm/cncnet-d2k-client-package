Briefing=HARKONNEN_============_Damn those Ordos! Not only are they still alive, they also have the impertinence to take away one of our territories. They have taken advantage of us using our resources against the Machines to take action and capture the enemy base themselves. It will be the last time they do it.__I have discovered what is the next goal that the Ordos have planned. There is another base of the Machines and the Ordos have been established not far away. I'm sure they plan to capture that other base too._ _Both sides have already initiated hostilities, so we are going to lift a blockade on the direct route between the two. You will build your base in the central zone of the conflict. I will send some troops to reinforce your position.__The base of the Machines is more extensive and has a higher production rate, but they are not as efficient protecting their base as their harvesters are a very easy target. The base of the Ordos is more compact with a lower rate of production, but they are more efficient in protecting their base and their harvesters are more protected.__I do not care if you first take care of the Ordos or the Machines; At the end of the day both enemies must be annihilated under our great power.__Objective: Destroy the base of the Ordos and the Machines.

