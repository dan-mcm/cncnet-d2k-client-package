Briefing=The Emperor's maneuvering has been masterful. Rather than openly clash with the combined Coalition army, he lured them in with the promise of official dominance over the planet Arrakis, a major change from the status quo that would recognize the four Houses as Major Houses and all the prestige that represent.__But the Emperor never showed up, instead the Sardaukar opened fire to apprehend the four leaders of the Coalition, with the goal of leaving the armies of Dune with no one to lead them and crumble alone, easy prey for anyone who tries to conquer Arrakis. Leader Lassoki is the only one who was able to escape the trap.__Before the Landsraad retaliates, they will first carefully investigate all the facts, as it is the Emperor. While the Landsraad is pronouncing the Emperor has begun to build a great city in Arrakis with a very clear intention to fight the current lords of Dune and regain control of the spice.__Furthermore, the three captured Leaders have been handed over to the three Houses with which they have entered the war. Noble Leader Iasi's whereabouts are on Draconis IV, the planet of the Ordos.__Now a group of elite Iasi soldiers, led by the Leader of the Lassoki, has just landed on Draconis IV. They will attack one of the Ordos settlements, capture their facilities, produce an army of infantry with the resources the planet offers them, and rescue their Leader.__The Ordos have multiple bases scattered throughout the area, but due to limited resources they cannot maintain a large army. If the Refineries or Harvesters are destroyed the Ordos will have no other means of raising money and their production of military units will stop.__The presence of an Ixian Research Center has been detected in the territory, although the reason is unknown. The Outpost can find your exact location. If captured, Automatic Cannon Turrets can be used against the Ordos themselves, as well as accessing Grenadier technology.__Hopefully the largest number of Ordos will be near the prison, so cutting back on resource gathering or destroying factories on their smaller bases first seems like the most ideal strategy. Locating the Iasi Leader later shouldn't be hard.__Draconis IV is a difficult planet to navigate. Infantry units have an advantage in being able to walk through the rockier areas that vehicles cannot advance. The only resource available to use is Silicon, much less efficient than Melange Spice but can be used for a short term battle (Read intel for detailed information).__Objective: Capture the Ordos Construction Yard to be able to construct other buildings. Then find and free the Iasi Leader.__Secondary objective: Build the Outpost to know the exact location of the Ixian Research Center. Capture it to build Grenadiers and to make nearby Cannon Turrets allied.__Tips: Destroy the Refineries or Harvesters of the Ordos to run out of money to continue building units. Factories can also be destroyed and refineries captured instead. If you need more Harvesters you can sell a Refinery and build another in its place.__Notes: Only the Iasi Infantry has come to this planet. Capturing enemy Factories will not provide new vehicles (except for Harvesters).

