Briefing=SUMMERS' SOLSTICE 09: All-Out at Alazor Steppe__MISSION OBJECTIVES:_1. Establish a proper base once your MCV arrives._2. Defend House Ordos' primary base._3. Destroy Giraud's Command Center._4. Defeat all enemy forces._5. You must survive.__TACTICAL OBJECTIVES:_1. Hold the line at your initial position._2. Examine the terrain Summers scouts._3. Use your limited reinforcements wisely._4. Support the Ordos when they attack.__BRIEFING:_     The Harkonnen are one klick north of your defensive line, and you're kicked back in the seat of your Tyrant Tank. Comfy.__     You sit between the Ordos and the three Great Houses that want them eradicated. No pressure. Especially with Summers headed to Shield Wall for a sneak attack on the Emperor. You're practically alone until the Ordos build up.__     Moriaen is on the viewscreen on the side, ready to talk strategy. She reiterates, "The Imperial Command Center in Alazor Steppe is where our enemies are hunkered down. Now that they have formally entered a cease-fire with one another, they have become a dire threat to our mission. We must crush their commanders and bring a swift end to this war."__     "Swift's out of the question, Commander. With the Atreides and Harkonnen defending the Imperial base, and the reinforcements they're getting from Shield Wall, you're going to need time to build up an army."__     "I shall amass an army," says Moriaen. "You will buy me the time I need."__     And hopefully Summers will buy you the time you need as well. If her strategy works, the enemy will be distracted by her forces in Shield Wall. Maybe they'll have to pull out of Alazor Steppe enough that they won't be able to stomp you completely into the dust.__     Her forces in the region that can't make it to Shield Wall are yours to command. Munitions are stockpiled at your forward base. Her last Stealth Raiders are about to leave, and on their way out they'll give you a better idea of what you're up against. It would probably be a good idea to scroll around the battlefield a bit before you really have to pay attention to defending yourself.__     With a grunt, you return your feet to the floor and lean forward in your seat. "Yep," you mutter in response.
