Briefing=BARON: General, I must apologize (and I never do this) for the last mission. It appears that you've been sent to another location that I've asked for. Who's to be blamed? The mentat. I found out that he kinda... wanted you to die. Which is why he sent you deep in the middle of our enemies to test out a nuke... Which is not what I've asked. Anyway, don't worry, he is getting punished for it as we speak. I'm wondering why did he betray you, General. I'll brief you personally from now on, for you deserve my very own attention for your outstanding operations here on Arrakis!__We have discovered Spacing Guild forces working in tandem with the Emperor. All our placed orders to the Guild have been cancelled with no reason, and I heared the Atreides happened to lose them too. This can only mean that the Guild is getting involved too, and it is on the Imperial side. That is not good, General, as they are strong and numerous. We must destroy the Imperial bases that are housing the Guild Starports. The Starports appear to be receiving reinforcements from outer space. Take some men, build up a base and destroy every single Sardaukar who stands in your way. Then burn those Starports! Be advised General, there seem to be Ordos forces fighting against some Mercenaries. I do not know why, as they used to be hiring them, but it doesn't really matter. Ignore them as much as possible and focus on your real target: the Emperor.__Objective: Build a base and remove the Imperial presence. Destroy all Guild Starports and buildings__HINT: Try not to get involved in the Ordos-Mercenary conflict. It is not your business

