Briefing=SUMMERS' SOLSTICE 14: Coup de Grâce__MISSION OBJECTIVES:_1. Secure the first Sietch entrance and establish a base._2. Defeat the Autogun Tanks at each Sietch entrance._3. Collapse all caves so the Ordos learn nothing more._4. Annihilate all Ordos forces in Galbana Depression.__TACTICAL OBJECTIVES:_1. Provide support for the Mahai's elite Devastators._2. Mass RPG Quads to siege enemy fortifications._3. Follow up on airstrikes with your ground forces.__BRIEFING:_     The Ordos have caught on to the true threat. In another futile act of defiance, they have retaken Galbana Depression and the Fremen Gholas therein. The gholas are vital assets. You must retrieve them.__     They have gathered here thinking they can hold you off while your best soldiers are held hostage. Perhaps they are under the impression they will be able to strike out against you from such a solid position. They do not realize the extent of the threat you represent. They are like lambs gathered for slaughter.__     The Ordos have regained some of their factories' functions. They have deployed armor to the field. It's time you dedicate some armor of your own to even the odds and ensure they are crushed completely. You have yet more surprises in store for when next you are resisted.__     The Mahai has graciously provided you with two Devastators. The Devastators, piloted by His best, will lead the way until an LZ is cleared. Infantry, LAVs, armor, and airstrike reinforcements are en route from Bidriyah Sink.
MissionNumber=14

