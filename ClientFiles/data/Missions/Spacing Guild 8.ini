Briefing=We have discovered the real reason for the large fine that the Emperor has imposed. How Edric failed when trying to get our super sandworm he ran to tell everything to the Emperor.__Although they know, it's too late; the worm is already in our planet and it has an area prepared for him. We, however, are still stuck on this planet.__Both the Emperor and Edric have our escape blocked. The member of the spacing guild has reduced the maximum cost of shipments of the frigates to bring his own army.__Their combined forces are too numerous to do a frontal attack, but we have a solution. We bought from the Harkonnen a batch of powerful missiles, capable of destroying buildings in a single impact. Once you have built the missile shuttle (called "Harkonnen Palace") we will use the radar to provide you a clear view of the Edric starports.__Once you know precisely the exact situation of starports shoot some missiles to destroy them all; only in this way the mission will be a success.__Objetive: Destroy the three Edric starports.__Notes to the commander: Prices on the Starport will range up to 75% off.

