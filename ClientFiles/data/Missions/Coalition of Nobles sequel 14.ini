Briefing=As the Lassoki advanced across Arrakis, they encountered territory disputed by both the Iasi and the Qaii. Although they are fighting each other, they are sure to fight together against the strongest member of the ex-Coalition right now.__The Lassoki realize that they can't take on both groups at once, at least not without being prepared, so they have a plan ready: have the Isai and Qaii destroy each other, or at least weaken each other. giving themselves time to strengthen their position.__The only way to break a potential truce between the two is by having the army of one of the two groups engage the other, which can happen through collateral damage when they are shooting at the Lassoki while being close to the other group. This will start hostilities between the two.__Even if that breaks the truce, the Lassoki would need more time to unleash their full potential, so they will continue to force clashes between the two former Coalition members constantly as a distraction to buy as much time as they need.__Objective: Destroy the Iasi and the Qaii.__Secondary Objective: Force the Iasi and the Qaii to fight each other.__Tip: It is advised to force combat between them quickly and continuously to weaken them and distract them from attacking you. The easiest way is to attack the Harvesters with fast units, which will draw enemy units against you and place them close to the other side.__Note: They will fight each other as soon as the shot of any of the units on one side hits those of the other as collateral damage (such as, for example, placing a unit in a position close to that of the other side)._

