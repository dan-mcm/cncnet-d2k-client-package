Briefing=SUMMERS' SOLSTICE 14: Baklawa Brawl__MISSION OBJECTIVES:_1. Secure the LZ and establish a base._2. Defeat all enemy forces in the territory._3. Your allies must not be defeated._4. You must survive.__TACTICAL OBJECTIVES:_1. Navigate the entirely flat terrain to circumvent enemy defenses._2. Destroy Tleilaxu High Tech Factories to limit their ghola count._3. Use your reinforcements from nearby Almiraz Graben wisely.__BRIEFING:_     The Ordos base comes into view over the dunes of Baklawa Flats. It's another of their proxy bases, a weak position to trash and salvage before you eventually take the fight to their main compound in Galbana Depression. Your Raiders roll to a stop behind Durant's Combat Tanks.__     "Target sighted, Commander."__     Durant commands, "Hold position," before he speaks directly to you. "Rowe, I'm deploying my MCV on the island we just passed. I'll support the attack from behind you. Deploy yours here and arm infantry to push through the base."__     "Sounds good," you agree. "This island isn't big enough for us both. Think you can clear them out quickly? We've got to start mining this territory ASAP."__     Durant chuckles at your doubt. "Don't you trust me?"__     "You did try to kill me," you recall as more of a playful jab than with any venom. It's in the past. He must detect this; he continues to smile slightly at you.__     He explains, "To be honest with you, I had no intention of killing you."__     That admission gets a chuckle out of you too. You smile back at him. You do trust him. "Kidnapping wouldn't have been much better," you quip in reply.__     Some small arms fire and cannon shots can be heard to the west. You get a bad feeling quite suddenly, but there isn't time to think on it. Durant has also returned his attention to the task at hand. He commands his forces forward as he takes the lead, himself. "Engage!"
MissionNumber=14

