Briefing=BARON: General Radnor, welcome back. Great job killing the Tleilaxu scum._RADNOR: It was my pleasure, my lord. Can't wait for the next one._BARON: BUT WHAT ABOUT YOUR SMALL ALLIANCE WITH THE ORDOS? You can't wait for that as well, I assume._FEYD: That was my fault, father._BARON: What did you say?_FEYD: I am the one who ordered the general to form that temporary alliance._BARON: General Radnor, who's the baron? EH? WHO IS THE DAMN BARON? WHO ARE YOU TAKING ORDERS FROM?_FEYD: Father, come on! It was just a temporary partnership. Time if of the essence. If we waste too much time destroying Tleilaxu random bases, we're not efficient. All 3 of us know that, soon, we'll launch a joint operation with the other Landsraad members. Why does it matter that we had a small alliance with the Ordos commander? It's about to come anyway. You know it. Even with the Atreides, we'll fight side by side again._BARON: You're not stupid, Feyd. But I AM THE BARON. General Radnor, you've done a lot of things for me, and people say i'm a leader without mercy. I am not! I will forgive you for this, as a reward for everything you've done. But don't forget: don't you ever dare to take somebody else's orders instead of mine!_RADNOR(almost ironic): Of course, sire.__Incoming transmission...__IRULAN: Greetings, baron._BARON(ironic): Princess Irulan. What is the reason that we have the ... pleasure to speak with you?_IRULAN: We don't have to like each other, baron. However, we have to work together._BARON: That is annoyingly true._IRULAN: My Sardaukar have detected one of the sectors where the artificial spice is being tested. They're hiding it on inaccesible hills, surrounded by cliffs. I have a base in the region, but no means to attack their refineries._BARON: And you thought that baron Vladimir Harkonnen has grown some wings over night, and he can fly over there and blow their shit up, didn't you?_IRULAN: I happen to know that you're the closest military asset in that part of Arrakis. It is close to core Harkonnen territories._BARON: I think you should call your dear Duke Leto. He has wings. A lot of them, we saw it on Caladan. He has more thopters than brain cells, to be quite honest with you._IRULAN: That is not practical. We'd waste a lot of time until Atreides Ornithopters will reach the region. And besides, they have a decent anti-air defense. Their thopters would be taken out._BARON: Then my unarmed Carryalls will surely be able to bombard both their bases and their defenses. Sure, I'll do it._IRULAN: Baron Vladimir, I like your irony, but this really isn't the right time. If you want to mock me, I'll give you some other opportunities, I promise._BARON: Listen, princess. I can do it, but you must get rid of their defences._IRULAN: I have that covered. The Ordos will destroy their Wind Trap network. That will allow Carryals in the sector. But the spice mining camps on the mountains have their own defences too, not powered by the main defence network, so you'll have to deal with those yourself. They are not numerous, though._BARON: Fine, send me the map and coordinates and I'll fix your problems. _IRULAN: I appreciate it, baron.__Transmission ended...__FEYD: Why are you helping her?_BARON: Because at some point I will have to deal with their "why did you attack Caladan" bullshit. Improving relations with the Corrinos is a good idea, for now. Even more since I see the girl is not a joke. She knows what she's doing. I underestimated her back then._RADNOR: She sent us the plans._BARON: I see. So, 3 hills right? Each one has a Repair Pad relatively isolated from the main base._FEYD: Looks like they tried to repair Harvesters on the field without having to transport them back to the base. I don't see any other reason why they would setup like that._RADNOR: Probably. The Rep Pads are a secure point to deploy our troops. If we..._BARON: You mean, to deploy our 3 Devastators. Cause that's all you're getting for this mission, general._RADNOR: Just 3?_BARON: I am not going to spend more than that for Irulan. Screw her shit. I don't care. You take those 3, and do it. Don't care how. Gotta go, good luck.__Baron leaves.__FEYD(laughing): 3 Devastators, right? Well... you always liked a challenge._RADNOR: I need 3 engineers from you._FEYD: What for?_RADNOR: To capture their Rep Pads. And a bunch of Carryalls. I'll use them to transport the Devastators between hills. That way I can have 3 on each hill, and won't need to "play on hard mode"._FEYD: I can do that, but even that is hard mode, if you ask me._RADNOR: I have my ways. But first, we'll have to wait for the Ordos to destroy their defence network, before we can fly in any Carryalls.__==========_Objective: Irulan is asking for help from the mighty House Harkonnen. The Baron has decided to offer it, for his own motives. The target is the Tleilaxu artificial melange Refineries. They are testing the new spice on some inaccessible hills. The only way to get there is by air. That is what you'll do. First, wait for the Ordos to destroy their Windtraps to the south-west. That will shut down their defence network and allow us to fly Carryalls around the sector. Once done, Feyd will send in 3 engineers, one on each hill. Use them to capture the Repair Pads. Once done, you can use the Repair Pads to fly in your Devastators on each hill. Careful, their turrets are powered from Windtraps within the hill bases, so they are operational. Be smart, avoid as many of them as possible, since your target is simple: their Refineries and Harvesters. That's it. How you destroy them is up to you. Make sure you don't lose all your Devastators. Good luck.
