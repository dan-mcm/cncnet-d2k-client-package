Briefing=I'm Glad to have you back with us, the Harkonnen. We have our most important mission and we need your superior tactics to make the first part of our plan.__We are facing the last vestiges of Atreides and Fremen found in Dune. The number of troops and defenses they have is so high that we can not beat ourselves. We need the Emperor.__There is an area occupied by an Atreides outpost, much less protected than the main base. Once we cleaned that area of Atreides the Emperor will have leeway to bring his MCV to deploy his own base.__Be very careful. The Atreides use Carryall to deploy Fremen without being detected and use the element of surprise to attack. Build the Outpost and the Fremen will lose much of its effectiveness.__Objective: Destroy the Atreides Base.__Hint: Build the Outpost to reduce the effectiveness of the Fremen.

[Text]
1=Now you have an Outpost the Fremen may not surprise us.
2=Open area, Emperor MCV arriving.

