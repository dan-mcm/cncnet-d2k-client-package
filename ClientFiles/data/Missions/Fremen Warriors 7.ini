Briefing=I have Bad news. The Padishah Emperor Shaddam is here to help the Harkonnen to recover from our victories. The resources he has allowed him settle in Arrakis very quickly and capture many different Sietchs Fremen.__Locate and destroy the barracks of the Emperor to rescue all the men captured. You have permission to take one of our harvesters. They don't have weapons but can crush enemy soldiers with ease or distract their tanks, but do not sacrifice it in vain.__Once you've rescued all our brothers we will attack the base of the Emperor together. That will send a very clear message.__Objective: Destroy all the barracks and the base of the Emperor.

