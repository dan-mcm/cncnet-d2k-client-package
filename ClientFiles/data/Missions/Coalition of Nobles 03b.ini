Briefing=OPTION 2 (Qaii equipment)_======================_The Coalition's victory came as a surprise to the Ordos. These now seek to regain lost territory and have brought in a larger and more prepared army in order to eliminate what they consider to be a new threat to themselves.__Due to the hasty situation, the Qaii have had to share some of their equipment with the Lassoki to face the battle that lies ahead. The Iasi have more resources available but unfortunately they are in the rear, so the Qaii and the Lassoki are going to be the two main focuses of attention.__Collaborating, the three must repel the Ordos attacks and destroy all their buildings except for the Starport. They need him to bring the Bromeli, the fourth House of the Coalition, to Arrakis.__Objective: Destroy the entire Ordos base except for the Starport.__Tips: The superior technology of the Ordos, like the Siege Tank, should not be underestimated. Join your allies when they attack to maximize the damage you can deal to the Ordos, or attack from the flanks to divide their attention.

