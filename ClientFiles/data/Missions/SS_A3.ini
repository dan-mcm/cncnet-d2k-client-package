Briefing=Commander, the even though we got the Starports, the shipments seem to have been halted. We do not receive any more news from the Guild heighliner, and the Spacing Guild ignores any messages we send to them. It is time that we take the matter in our own hands. Our spies reported strange Guild activity in a remote sector of the Erg Pass. You must investigate this, Commander. Take a small squad and reactivate the Atreides base that has been under siege by the Sardaukars. Be advised: there might be Fremen in the region. If you can contact them, they will gladly assist you.__Objective: Investigate the region and reactivate the Atreides base (capture). Destroy our enemies.__HINT: Protect the Sietch to get Fremen assistance.

